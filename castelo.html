    cmx.strokeStyle = 'rgba(20,12,8,.55)'; cmx.lineWidth = 1.4;
    for(let r=1; r<4; r++){
      cmx.beginPath();
      cmx.moveTo(cx - lar/2, topo + alt2*.35 + r*T*.34);
      cmx.lineTo(cx + lar/2, topo + alt2*.35 + r*T*.34);
      cmx.stroke();
    }
    // a boca em arco, negra, com brasa no fundo
    const bl = lar*.52, bt = topo + alt2*.42;
    cmx.fillStyle = '#0b0603';

  /* ---- janelas: a arte de cantaria com gelosia e vidro frio, pelo cenário ---- */

    cmx.beginPath(); cmx.arc(cx2 - r2*.35, cy2 - r2*.35, r2*.2, 0, TAU); cmx.fill();
  };
  pBarrilFrente(4.6*T, 46.35*T, T*.34); pBarrilFrente(5.35*T, 46.35*T, T*.34);
  pBarrilFrente(4.97*T, 45.72*T, T*.34);
  /* o tonel de cobre, junto ao alçapão da despensa */
  (() => {
    const cx2 = 31.7*T, cy2 = 45.6*T, l2 = T*.62, a2 = T*.85;
    cmx.fillStyle = 'rgba(0,0,0,.35)';
    cmx.beginPath(); cmx.ellipse(cx2, cy2 + a2*.52, l2*.62, T*.12, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#a86a2e';
    cmx.beginPath();
    cmx.moveTo(cx2 - l2/2, cy2 - a2*.4);
    cmx.quadraticCurveTo(cx2 - l2*.68, cy2, cx2 - l2/2, cy2 + a2*.44);
    cmx.lineTo(cx2 + l2/2, cy2 + a2*.44);
    cmx.quadraticCurveTo(cx2 + l2*.68, cy2, cx2 + l2/2, cy2 - a2*.4);
    cmx.closePath(); cmx.fill();
    cmx.fillStyle = '#7a4a1e';
    [-.28, .02, .3].forEach(f => cmx.fillRect(cx2 - l2*.62, cy2 + a2*f, l2*1.24, T*.05));
    cmx.fillStyle = '#c98a3e';
    cmx.beginPath(); cmx.ellipse(cx2, cy2 - a2*.42, l2*.5, T*.09, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = 'rgba(255,235,200,.3)';
    cmx.fillRect(cx2 - l2*.34, cy2 - a2*.3, l2*.12, a2*.6);
  })();
  /* velas acesas na câmara da Faxineira */
  [[16.6,51.35],[17.1,51.25],[18.3,51.4]].forEach(([vx,vy]) => {
    const cx2 = vx*T, cy2 = vy*T;
    const gV2 = cmx.createRadialGradient(cx2, cy2 - T*.2, 0, cx2, cy2 - T*.2, T*.5);
    gV2.addColorStop(0, 'rgba(255,200,110,.35)'); gV2.addColorStop(1, 'rgba(255,200,110,0)');
    cmx.fillStyle = gV2; cmx.fillRect(cx2 - T*.5, cy2 - T*.7, T, T);
    cmx.fillStyle = '#e8e2d2';
    cmx.fillRect(cx2 - T*.035, cy2 - T*.18, T*.07, T*.18);
    cmx.fillStyle = '#ffd27a';
    cmx.beginPath(); cmx.ellipse(cx2, cy2 - T*.22, T*.03, T*.06, 0, 0, TAU); cmx.fill();
  });

  /* remendo de chão por baixo do tanque: nenhum canto de "muro" aparece */
  for(let y=33; y<=40; y++) for(let x=20; x<=27; x++){
    if(!naBacia(x,y)) continue;
    const px2 = x*T, py2 = y*T, h = rndDe(x+7, y+3);
    cmx.fillStyle = 'rgb(122,106,84)'; cmx.fillRect(px2, py2, T, T);
    if(h > .55){
      cmx.fillStyle = h > .8 ? 'rgba(240,235,225,.06)' : 'rgba(8,6,10,.10)';
      cmx.fillRect(px2 + 2, py2 + 2, T - 4, T - 4);
    }
  }
  /* ---- A GRANDE CISTERNA do salão: o tanque octogonal monumental da imagem
     de inspiração, em alto-relevo — parapeito de pedra com face frontal,
     água funda e a roda ornamental submersa ---- */
  const octo = (cx2, cy2, R) => {
    cmx.beginPath();
    for(let i=0; i<8; i++){
      const a = i*TAU/8 + TAU/16;
      const X = cx2 + Math.cos(a)*R, Y = cy2 + Math.sin(a)*R;
      i ? cmx.lineTo(X, Y) : cmx.moveTo(X, Y);
    }
    cmx.closePath();
  };
  const bcx = 23.5*T, bcy = 36.5*T, R1 = 2.5*T, R2 = 1.72*T;
  // sombra no chão, para o sul
  cmx.fillStyle = 'rgba(0,0,0,.35)';
  octo(bcx + T*.08, bcy + T*.42, R1*1.02); cmx.fill();
  // face frontal do parapeito (a altura aparece embaixo)
  cmx.fillStyle = '#5f554b';
  octo(bcx, bcy + T*.32, R1); cmx.fill();
  cmx.fillStyle = 'rgba(0,0,0,.28)';
  octo(bcx, bcy + T*.32, R1); cmx.fill();
  cmx.fillStyle = '#655b50';
  octo(bcx, bcy + T*.24, R1); cmx.fill();
  // topo do parapeito, iluminado
  cmx.fillStyle = '#a2978a';
  octo(bcx, bcy - T*.10, R1); cmx.fill();
  cmx.strokeStyle = 'rgba(20,14,10,.6)'; cmx.lineWidth = 2.6;
  octo(bcx, bcy - T*.10, R1); cmx.stroke();
  cmx.strokeStyle = 'rgba(255,248,235,.35)'; cmx.lineWidth = 1.6;
  octo(bcx, bcy - T*.12, R1*.985); cmx.stroke();
  // juntas radiais dos blocos do parapeito
  cmx.strokeStyle = 'rgba(20,14,10,.5)'; cmx.lineWidth = 1.8;
  for(let i=0; i<8; i++){
    const a = i*TAU/8 + TAU/16;
    cmx.beginPath();
    cmx.moveTo(bcx + Math.cos(a)*R2, bcy - T*.10 + Math.sin(a)*R2);
    cmx.lineTo(bcx + Math.cos(a)*R1, bcy - T*.10 + Math.sin(a)*R1);
    cmx.stroke();
  }
  // bisel interno caindo para a água
  cmx.fillStyle = 'rgba(12,22,28,.55)';
  octo(bcx, bcy - T*.10, R2*1.1); cmx.fill();
  // a água
  const gGC = cmx.createRadialGradient(bcx, bcy - T*.05, 0, bcx, bcy - T*.05, R2);
  gGC.addColorStop(0, '#3f97ac'); gGC.addColorStop(.65, '#27687a'); gGC.addColorStop(1, '#153a46');
  cmx.fillStyle = gGC;
  octo(bcx, bcy - T*.05, R2); cmx.fill();
  // a roda ornamental, submersa
  cmx.strokeStyle = 'rgba(215,238,244,.14)'; cmx.lineWidth = 2;
  [.92, .6, .3].forEach(k => {
    cmx.beginPath(); cmx.arc(bcx, bcy - T*.05, R2*k, 0, TAU); cmx.stroke();
  });
  for(let i=0; i<8; i++){
    const a = i*TAU/8;
    cmx.beginPath();
    cmx.moveTo(bcx + Math.cos(a)*R2*.3, bcy - T*.05 + Math.sin(a)*R2*.3);
    cmx.lineTo(bcx + Math.cos(a)*R2*.92, bcy - T*.05 + Math.sin(a)*R2*.92);
    cmx.stroke();
  }
  // redemoinho e brilhos de superfície
  cmx.strokeStyle = 'rgba(175,235,248,.4)'; cmx.lineWidth = 2.2;
  for(let k=0; k<3; k++){
    cmx.beginPath();
    cmx.arc(bcx, bcy - T*.05, R2*(.18 + k*.22), k*1.7, k*1.7 + 3.8);
    cmx.stroke();
  }
  // sombra interna: o parapeito norte paira sobre a água
  cmx.save();
  octo(bcx, bcy - T*.05, R2); cmx.clip();
  const gGS = cmx.createLinearGradient(0, bcy - T*.05 - R2, 0, bcy - T*.05 - R2 + T*.8);
  gGS.addColorStop(0, 'rgba(0,0,0,.55)'); gGS.addColorStop(1, 'rgba(0,0,0,0)');
  cmx.fillStyle = gGS;
  cmx.fillRect(bcx - R2, bcy - T*.05 - R2, R2*2, T*.8);
  cmx.restore();

}

/* --- carcaças penduradas na câmara, balançando de leve --- */
function desenharCarcacas(ox, oy){
  [[33.9,4.15],[38.9,4.15]].forEach(([cx,cy],i) => {
    const px = ox + cx*tam, py = oy + cy*tam;
    if(foraDaVista(px, py + tam, tam*2.2)) return;
    const bal = Math.sin(tempo*.9 + i*2.1)*.05;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(bal);
    // gancho e corrente curta
    ctx.strokeStyle = '#3a3442'; ctx.lineWidth = Math.max(1.5, tam*.06);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, tam*.35); ctx.stroke();
    // a peça de carne: massa escura com gordura marmorizada
    const alt = tam*1.15, lar = tam*.62;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(0, tam*.4 + alt + tam*.35, lar*.7, tam*.12, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5e2020';
    ctx.beginPath();
    ctx.moveTo(0, tam*.35);
    ctx.quadraticCurveTo(-lar*.75, tam*.6 + alt*.3, -lar*.42, tam*.35 + alt);
    ctx.quadraticCurveTo(0, tam*.5 + alt*1.08, lar*.42, tam*.35 + alt);
    ctx.quadraticCurveTo(lar*.75, tam*.6 + alt*.3, 0, tam*.35);
    ctx.fill();
    ctx.strokeStyle = 'rgba(230,200,190,.30)'; ctx.lineWidth = Math.max(1, tam*.035);
    ctx.beginPath(); ctx.moveTo(-lar*.2, tam*.55); ctx.quadraticCurveTo(-lar*.4, tam*.5 + alt*.5, -lar*.15, tam*.3 + alt*.9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lar*.16, tam*.6); ctx.quadraticCurveTo(lar*.38, tam*.5 + alt*.45, lar*.1, tam*.3 + alt*.8); ctx.stroke();
    ctx.restore();
  });
}

/* --- rosácea do salão central, desenhada por cima do cache --- */
function desenharRosacea(ox, oy){
  /* a água da GRANDE cisterna do salão: brilho frio pulsando e ondulações */
  const R = COZ.ROSACEA;
  const px = ox + R.x*tam, py = oy + (R.y - .05)*tam;
  if(foraDaVista(px, py, tam*3.8)) return;
  const pulso = .6 + Math.sin(tempo*1.3)*.4;
  const gL = ctx.createRadialGradient(px, py, 0, px, py, tam*3.6);
  gL.addColorStop(0, 'rgba(90,210,230,' + (.14 + pulso*.08) + ')');
  gL.addColorStop(1, 'rgba(90,210,230,0)');
  ctx.fillStyle = gL;
  ctx.beginPath(); ctx.arc(px, py, tam*3.6, 0, TAU); ctx.fill();
  for(let i=0; i<3; i++){
    const t2 = (tempo*.3 + i/3) % 1;
    ctx.strokeStyle = 'rgba(160,225,240,' + (.22*(1 - t2)) + ')';
    ctx.lineWidth = Math.max(1, tam*.05);
    ctx.beginPath();
    ctx.ellipse(px, py, tam*(.2 + t2*1.4), tam*(.12 + t2*.9), 0, 0, TAU);
    ctx.stroke();
  }
  // fiapos de luz correndo na superfície
  const lx = Math.sin(tempo*.6)*tam*.6;
  ctx.strokeStyle = 'rgba(220,245,250,.16)';
  ctx.lineWidth = Math.max(1, tam*.05);
  ctx.beginPath();
  ctx.moveTo(px - tam*.9 + lx, py - tam*.5);
  ctx.quadraticCurveTo(px + lx, py - tam*.25, px + tam*.85 + lx, py - tam*.55);
  ctx.stroke();
}

    ].map(p => livre2(p.x, p.y)).filter(Boolean)
     .map(p => ({...p, vx:0, vy:0, raio:.22, hp:18, ang:Math.random()*TAU,
                 fase:Math.random()*TAU, morde:0, flash:0, guincho:0}));
    /* a arma vem da bolsa: o machado do Gladiador se você o tiver, senão o facão */
    const temMachado = inventario.some(i => i.id === 'machado-gladiador');
    const temFacao = inventario.some(i => i.id === 'facao-catacumbas');
    jog.arma = temMachado ? 'machado-gladiador' : (temFacao ? 'facao-catacumbas' : null);
    jog.dano = jog.arma === 'machado-gladiador' ? 13 : 10;
    etapa = 'livre';
    avisar('As cozinhas', 'siga o cheiro de fumaça');
  },
  atualizar(dt){
    if(porta2.quebra > 0) porta2.quebra = Math.max(0, porta2.quebra - dt/.9);
    atualizarPortasInternas(dt);
    atualizarAjudantes(dt);
    labaredas.forEach(e => {
      const h = alturaLabareda(e);
      if(h >= 1 && !e.acesa){ e.acesa = true; if(Math.hypot(e.x-jog.x, e.y-jog.y) < 8) sFerro(); }
      if(h <= 0) e.acesa = false;
      if(h > .6 && Math.hypot(e.x-jog.x, e.y-jog.y) < .6) machucar(11);
    });
    paes.forEach(pa => {
      if(pa.pego || Math.hypot(pa.x-jog.x, pa.y-jog.y) > .6) return;
      pa.pego = true; jog.pocoes++;
      const cura = Math.round(jog.hpMax*.15);
      if(jog.hp < jog.hpMax){
        jog.hp = Math.min(jog.hpMax, jog.hp + cura);
        flutuar(pa.x, pa.y-.6, '+' + cura, '#8fc48a');
      }
      sTrapo();
      flutuar(pa.x, pa.y-.3, '+1 ração', '#8fc48a');
      for(let k=0;k<10;k++) faisca(pa.x, pa.y, '#8fc48a', .09);
      atualizarHUD();
    });
    /* caldo quente: só vale na luta, e só some se houver vida para repor */
    if(etapa === 'chefe'){
      caldos.forEach(cd => {
        if(cd.pego || jog.hp >= jog.hpMax) return;
        if(Math.hypot(cd.x-jog.x, cd.y-jog.y) > .65) return;
        cd.pego = true;
        const cura = Math.round(jog.hpMax*.25);
        jog.hp = Math.min(jog.hpMax, jog.hp + cura);
        sTrapo();
        flutuar(cd.x, cd.y-.5, '+' + cura, '#8fc48a');
        for(let k=0;k<16;k++) faisca(cd.x, cd.y, '#8fc48a', .11);
        atualizarHUD();
      });
    }
    atualizarRatazanas(dt);
    /* atravessou a porta arrombada: a luta sela — e a música dela toca TODA vez,
       inclusive ao voltar da morte (o retomar devolve à trilha do piso) */
    if(etapa === 'livre' && porta2.aberta && jog.x > COZ.PORTA.x + .9
       && jog.y > COZ.PORTA.y - 1 && jog.y < COZ.PORTA.y + COZ.PORTA.alt + 1){
      criarChefe();
      criarCaldos();     // duas tigelas de caldo nos cantos da câmara
      tocarBgm('audio/fase2/portao-acougueiro.mp3', .16);   // mais baixa: as vozes ficam na frente
      etapa = 'chefe';
    }
    const bg = el('btnGolpe');
    bg.classList.add('on');
    bg.classList.toggle('off', jog.recarga > 0);
    uiEstilo('cargaGolpe', 'transform', 'scaleY(' + Math.min(1, jog.recarga/.36).toFixed(2) + ')');
    if(jog.y < 18.5 && jog.x < 29) marcarTarefa('t-fogo');
    if(jog.y > 44.2 && jog.x < 34) marcarTarefa('t-adega');
    if(!vistoAdega && jog.y > 44.2 && jog.x < 34){
      vistoAdega = true;
      avisar('A adega', 'a Faxineira limpa o fundo — siga a luz dourada');
    }
    /* a emboscada da cisterna: as baratas ficam escondidas atrás da grade
       e só saem quando o jogador chega perto */
    if(!vistoCisterna && Math.hypot(22.5-jog.x, 43-jog.y) < 2.8){
      vistoCisterna = true;
      sRato(); setTimeout(sRato, 140); setTimeout(sRato, 320);
      tremor = 7;
      avisar('A cisterna ferve', 'baratas do tamanho de gatos');
      for(let k=0;k<4;k++){
        const bx = 22.1 + Math.random()*1.8;
        for(let j=0;j<6;j++) faisca(bx, 43.6, '#3a2c1e', .13);
        ratazanas.push({x:bx, y:43.4 - Math.random()*.8, vx:(Math.random()-.5)*2, vy:-2.2,
          raio:.3, hp:34, dano:9, ang:-Math.PI/2, fase:Math.random()*TAU,
          morde:0, flash:0, guincho:0, barata:true});
      }
    }
  },
  /* atalho de teste (?piso=2&chefe=1): segredos ouvidos, porta aberta,
     jogador na soleira da câmara — a luta começa no primeiro passo */
  irAoChefe(){
    informantes.forEach(p => { p.feito = true; intel[p.chave] = true; });
    const tid = piso.missao.tarefaInformantes, cont = el(tid + '-cont');
    if(cont) cont.textContent = informantes.length + '/' + informantes.length;
    marcarTarefa(tid); marcarTarefa('t-fogo'); marcarTarefa('t-adega');
    porta2.aberta = true; porta2.quebra = 0;
    for(let y = COZ.PORTA.y; y < COZ.PORTA.y + COZ.PORTA.alt; y++) mapa[idx(COZ.PORTA.x, y)] = CHAO;
    desenharCache();
    jog.x = COZ.PORTA.x + .6; jog.y = COZ.PORTA.y + 1.5;
    jog.vx = jog.vy = 0; camX = jog.x; camY = jog.y;
    atualizarHUD();
    avisar('Atalho de teste', 'a câmara de carnes está aberta');
  },
  falarLiberado(){ return etapa === 'livre'; },
  interacao(){
    if(etapa === 'livre' && !porta2.aberta
       && Math.hypot(COZ.PORTA.x + .5 - jog.x, COZ.PORTA.y + 1.5 - jog.y) < 2.4)
      return {tipo:'porta', rotulo:'ARROMBAR', icone:'⚒'};
    return null;
  },
  agir(i){
    if(i.tipo === 'porta') arrombarPorta();
  },
  acaoGolpe: golpeDeArma,
  pegarItem(item){
    if(!ARMAS[item.id]) return;
    jog.arma = item.id;
    jog.dano = item.id === 'machado-gladiador' ? 13 : 10;
    avisar('Na mão', item.nome);
  },
  desenharCenario(ox, oy){
    desenharRosacea(ox, oy);
    desenharCisterna(ox, oy);
    desenharAjudantes(ox, oy);
    desenharPortasInternas(ox, oy);
    desenharCarcacas(ox, oy);
    desenharLabaredas(ox, oy);
    desenharPaes(ox, oy);
    if(etapa === 'chefe') desenharCaldos(ox, oy);
    desenharRatazanas(ox, oy);
    desenharPorta2(ox, oy);
  },
  desenharNoJogador(px, py, r, bal){
    if(jog.arma) desenharArmaNaMao(px, py, r);
  }
};

/* ========== mecânicas da fase 3 (conteúdo compartilhado) ==========
   Mãos que agarram, zonas de luz cíclica e vultos — dirigidas por listas do
   piso, no padrão de atualizarRatazanas: o piso 3 chama criarMaos/criarZonasLuz/
   criarVultos no aoIniciar, atualizarMaos/atualizarZonasLuz/atualizarVultos no
   atualizar, desenharZonasLuz/desenharMaos/desenharVultos no desenharCenario e
   aponta acaoGolpe para golpeFase3. Nada disso roda nos pisos 1-2. */
let maos = [], zonasLuz = [], vultos = [];
let agarrao = null, avisoAgarrao = false;

/* --- mãos dos mortos: perseguem devagar e AGARRAM (F3-RF-12) --- */
function criarMaos(pontos){
  agarrao = null; avisoAgarrao = false;
  maos = pontos.map(p => ({x:p.x, y:p.y, hx:p.x, hy:p.y, vx:0, vy:0, raio:.34,
    hp:p.hp != null ? p.hp : 25, dreno:p.dreno != null ? p.dreno : 5,
    vel:p.vel != null ? p.vel : 1.4, fase:Math.random()*TAU, flash:0,
    passo:Math.random()*15, olhar:-1}));
}
/* o Avental de Aço protege no peito, não na bolsa: a pazada cai de 34 para 14
   e o agarrão encurta só enquanto ele estiver vestido (F3-RF-13). Vale sempre
   o estado do momento — tirar a peça devolve o dano cheio na hora. */
function aventalNoPeito(){ return vestido === 'avental-acougueiro'; }
function ajustarPazada(){
  const pazada = aventalNoPeito() ? 14 : 34;
  PISO_FUNERAL.chefe.cfg.comboDano =
    PISO_FUNERAL.chefe.cfg.comboAlcance.map(() => pazada);
}
function agarrar(m){
  agarrao = {mao:m, x:jog.x, y:jog.y, apertos:0, tique:0,
    precisa: aventalNoPeito() ? 2 : 3,
    dashOffAntes: jog.dashOff};
  jog.dashOff = true;                 // nem anda nem rola enquanto preso
  jog.vx = jog.vy = 0;
  tremor = 8; sFerro();
  tocarSfx('audio/fase3/sons/mao-raspando-1.mp3', .9);
  if(!avisoAgarrao){ avisoAgarrao = true; avisar('Ela te agarrou!', 'esmague GOLPE para se soltar'); }
}
function soltarAgarrao(){
  if(!agarrao) return;
  jog.dashOff = agarrao.dashOffAntes;
  agarrao = null;
}
function debaterAgarrao(){            // cada aperto de GOLPE debate contra a mão
  const g = agarrao;
  if(!g) return;
  g.apertos++;
  jog.golpe = .12; sGolpe(); tremor = 6;
  for(let k=0;k<6;k++) faisca(jog.x, jog.y + .3, '#cfc4a6', .13);
  flutuar(jog.x, jog.y - .7, g.apertos + '/' + g.precisa, '#f4e2b4');
  if(g.apertos >= g.precisa){         // soltou: a mão se desfaz em ossos
    g.mao.hp = 0;
    sEspadaAcerta();
    for(let k=0;k<16;k++) faisca(g.mao.x, g.mao.y + .2, '#cfc4a6', .16);
    for(let k=0;k<8;k++) terraRevolvida(g.mao.x, g.mao.y + .3);
    soltarAgarrao();
    jog.invul = Math.max(jog.invul, .6);
    flutuar(jog.x, jog.y - .5, 'livre!', '#8fc48a');
  }
}
function atualizarMaos(dt){
  maos.forEach(m => {
    if(m.hp <= 0) return;
    m.fase += dt;
    m.flash = Math.max(0, m.flash - dt*4);
    if(agarrao && agarrao.mao === m){
      /* preso: imobiliza no lugar do agarrão e drena vida por segundo */
      jog.x = agarrao.x; jog.y = agarrao.y; jog.vx = jog.vy = 0;
      m.x = jog.x; m.y = jog.y + .22;
      jog.hp -= m.dreno*dt;
      agarrao.tique += dt;
      if(agarrao.tique >= 1){
        agarrao.tique -= 1;
        flutuar(jog.x, jog.y - .4, -m.dreno, '#ff8a96');
        jog.flash = 1; sDorJog();
        if(Math.random() < .5) mancharSangue(jog.x, jog.y + .3);
      }
      atualizarHUD();
      if(jog.hp <= 0){ soltarAgarrao(); morrer(); }
      return;
    }
    const dx = jog.x-m.x, dy = jog.y-m.y, d = Math.max(.01, Math.hypot(dx,dy));
    if(d < 6.5){                      // persegue devagar, arranhando a pedra
      m.vx += (dx/d*m.vel - m.vx)*Math.min(1, dt*4);
      m.vy += (dy/d*m.vel - m.vy)*Math.min(1, dt*4);
    } else {
      m.vx -= m.vx*3*dt; m.vy -= m.vy*3*dt;
    }
    mover(m, m.vx*dt, m.vy*dt);
    /* o quadro do engatinhar corre com o caminho percorrido: ela ANDA */
    const vel2 = Math.hypot(m.vx, m.vy);
    m.passo += (vel2 > .12 ? vel2*7 : 1.6)*dt;
    if(Math.abs(m.vx) > .05) m.olhar = m.vx > 0 ? 1 : -1;
    /* alcançou: agarra (o rolamento em curso ainda escapa) */
    if(!agarrao && d < m.raio + jog.raio + .05 && jog.dash <= 0 && jog.invul <= 0 && vivo) agarrar(m);
  });
}
function golpearMao(m, cortante){
  const dano = Math.round((jog.dano + irand(5)) * (cortante ? 2 : 1));
  m.hp -= dano; m.flash = 1;
  if(cortante) sCorte(); else sEspadaAcerta();
  flutuar(m.x, m.y - .4, dano, cortante ? '#ffd88a' : '#f4e2b4');
  for(let k=0;k<8;k++) faisca(m.x, m.y, '#cfc4a6', .12);
  if(m.hp <= 0){
    if(agarrao && agarrao.mao === m) soltarAgarrao();
    sEspadaAcerta();
    for(let k=0;k<14;k++) faisca(m.x, m.y, '#cfc4a6', .15);
    for(let k=0;k<6;k++) terraRevolvida(m.x, m.y + .2);
  }
}
function desenharMaos(ox, oy){
  maos.forEach(m => {
    if(m.hp <= 0) return;
    const px = ox + m.x*tam, py = oy + m.y*tam, r = tam*.34;
    const presa = agarrao && agarrao.mao === m;

    /* o buraco de onde ela saiu fica para trás, na terra revolvida */
    const bx = ox + m.hx*tam, by = oy + m.hy*tam;
    ctx.fillStyle = 'rgba(0,0,0,.42)';
    ctx.beginPath(); ctx.ellipse(bx, by + r*.5, r*1.05, r*.42, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2e2418';
    ctx.beginPath(); ctx.ellipse(bx, by + r*.45, r*.8, r*.3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4a3a26';
    ctx.beginPath(); ctx.ellipse(bx - r*.45, by + r*.38, r*.26, r*.12, .4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx + r*.5, by + r*.46, r*.22, r*.1, -.3, 0, TAU); ctx.fill();

    if(imgMaoAnda.complete && imgMaoAnda.naturalWidth > 0){
      /* a mão engatinhando: quadros do vídeo, corridos conforme ela anda */
      const q = presa ? (Math.floor(tempo*14) % MAO_Q) : (Math.floor(m.passo) % MAO_Q);
      const alt = tam*.92, lar = MAO_QL*(alt/MAO_QA);
      const pulo = Math.abs(Math.sin(m.passo*.42))*r*.1;      // o corpo sobe a cada passada
      ctx.fillStyle = 'rgba(0,0,0,.35)';                       // a sombra dela no chão
      ctx.beginPath(); ctx.ellipse(px, py + r*.42, lar*.3, r*.2, 0, 0, TAU); ctx.fill();
      ctx.save();
      ctx.translate(px, py - pulo);
      if(m.olhar > 0) ctx.scale(-1, 1);                        // a arte anda para a esquerda
      ctx.rotate(Math.sin(m.passo*.3)*.04);
      if(m.flash > 0) ctx.filter = 'brightness(2.4)';
      ctx.drawImage(imgMaoAnda, q*MAO_QL, 0, MAO_QL, MAO_QA,
                    -lar*.52, -alt*.72, lar, alt);
      ctx.filter = 'none';
      ctx.restore();
      return;
    }

    const osso = m.flash > 0 ? '#ffffff' : '#cfc4a6';
    const bob = presa ? 0 : Math.sin(m.fase*3)*r*.08;
    ctx.save();
    ctx.translate(px, py - r*.1 + bob);
    ctx.rotate(presa ? Math.sin(tempo*16)*.07 : Math.sin(m.fase*1.6)*.14);
    /* punho saindo do chão */
    ctx.strokeStyle = osso; ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(2, r*.3);
    ctx.beginPath(); ctx.moveTo(0, r*.6); ctx.lineTo(0, r*.1); ctx.stroke();
    /* palma */
    ctx.fillStyle = osso;
    ctx.beginPath(); ctx.ellipse(0, 0, r*.42, r*.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(0, r*.1, r*.24, r*.2, 0, 0, TAU); ctx.fill();
    /* cinco dedos articulados em linhas, abrindo e fechando */
    for(let i=0;i<5;i++){
      const a0 = -Math.PI/2 + (i-2)*.42;
      const curva = presa ? 1.05 + Math.sin(tempo*15 + i)*.12
                          : .5 + Math.sin(m.fase*4 + i*1.7)*.4;
      const c1 = r*(i === 0 ? .34 : .5 - Math.abs(i-2)*.055);   // o polegar é curto
      const c2 = c1*.72;
      const x0 = Math.cos(a0)*r*.36, y0 = Math.sin(a0)*r*.42;
      const a1 = a0 + curva*.55, a2 = a1 + curva*.75;
      const x1 = x0 + Math.cos(a1)*c1, y1 = y0 + Math.sin(a1)*c1;
      const x2 = x1 + Math.cos(a2)*c2, y2 = y1 + Math.sin(a2)*c2;
      ctx.strokeStyle = osso;
      ctx.lineWidth = Math.max(1.5, r*.14);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.lineWidth = Math.max(1, r*.11);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.fillStyle = '#a89a7c';                               // as juntas
      ctx.beginPath(); ctx.arc(x1, y1, Math.max(1, r*.07), 0, TAU); ctx.fill();
    }
    ctx.restore();
  });
}

/* --- zonas de luz cíclica: as velas apagam e o escuro desce (F3-RF-03) --- */
function criarZonasLuz(lista){
  zonasLuz = lista.map(z => ({claroT:4, escuroT:4, fase:0, ...z, escura:false, veu:0}));
}
function atualizarZonasLuz(dt){
  zonasLuz.forEach(z => {
    const ciclo = z.claroT + z.escuroT;
    const c = (tempo + z.fase) % ciclo;
    const escura = c >= z.claroT;
    /* o sopro só é ouvido por quem está perto da zona */
    if(escura && !z.escura){
      const px = Math.max(z.x, Math.min(jog.x, z.x + z.larg));
      const py = Math.max(z.y, Math.min(jog.y, z.y + z.alt));
      if(Math.hypot(jog.x - px, jog.y - py) < 9) tocarSfx('audio/fase3/sons/sopro-vela-1.mp3', .7);
    }
    z.escura = escura;
    z.veu += ((escura ? 1 : 0) - z.veu)*Math.min(1, dt*2.2);
  });
}
function zonaDe(v){ return zonasLuz[v.zona]; }
function desenharZonasLuz(ox, oy){
  zonasLuz.forEach(z => {
    if(z.veu <= .015) return;
    const x = ox + z.x*tam, y = oy + z.y*tam, w = z.larg*tam, h = z.alt*tam;
    /* escuro que nasce no miolo e se dissolve nas bordas — retângulo chapado
       parecia um bloco preto colado por cima do cenário */
    const cx = x + w/2, cy = y + h/2, raio = Math.max(w, h)*.62;
    const g = ctx.createRadialGradient(cx, cy, raio*.18, cx, cy, raio);
    g.addColorStop(0, 'rgba(3,2,8,' + (z.veu*.82) + ')');
    g.addColorStop(.62, 'rgba(5,3,12,' + (z.veu*.55) + ')');
    g.addColorStop(1, 'rgba(5,3,12,0)');
    ctx.save();
    ctx.beginPath(); ctx.ellipse(cx, cy, w*.72, h*.78, 0, 0, TAU); ctx.clip();
    ctx.fillStyle = g;
    ctx.fillRect(x - w*.2, y - h*.2, w*1.4, h*1.4);
    ctx.restore();
  });
}

/* --- vultos: sombras que só se erguem no escuro (F3-RF-12/26) --- */
function criarVultos(lista){
  vultos = lista.map(v => ({x:v.x, y:v.y, hx:v.x, hy:v.y, zona:v.zona || 0,
    vx:0, vy:0, raio:.4, hp:v.hp != null ? v.hp : 45, dano:v.dano != null ? v.dano : 9,
    vel:v.vel != null ? v.vel : 2.1, estado:'submerso', p:0, atraso:0,
    fase:Math.random()*TAU, flash:0, morde:0}));
}
function vultoVulneravel(v){ return v.hp > 0 && (v.estado === 'ativo' || v.estado === 'ergue'); }
function atualizarVultos(dt){
  vultos.forEach(v => {
    if(v.hp <= 0) return;
    v.fase += dt;
    v.flash = Math.max(0, v.flash - dt*4);
    v.morde = Math.max(0, v.morde - dt);
    const z = zonaDe(v), escuro = z && z.escura;
    switch(v.estado){
      case 'submerso':               // afundado e invulnerável, deriva de volta pra casa
        v.x += (v.hx - v.x)*Math.min(1, dt*.8);
        v.y += (v.hy - v.y)*Math.min(1, dt*.8);
        if(escuro && Math.hypot(jog.x - v.x, jog.y - v.y) < 7){
          /* só se ergue (e grita) quando o jogador passa perto — o susto é pessoal */
          v.atraso -= dt;
          if(v.atraso <= 0){
            v.estado = 'ergue'; v.p = 0;
            if(z.grito) tocarSfx(z.grito, 1);     // o grito do susto (F3-RF-26)
          }
        } else v.atraso = Math.random()*.6;       // sobe desencontrado do vizinho
        break;
      case 'ergue':
        v.p = Math.min(1, v.p + dt/.7);
        if(v.p >= 1) v.estado = 'ativo';
        break;
      case 'ativo': {
        if(!escuro){ v.estado = 'afunda'; break; }
        const dx = jog.x-v.x, dy = jog.y-v.y, d = Math.max(.01, Math.hypot(dx,dy));
        /* a coleira: sombra é do columbário, não persegue o piso inteiro */
        const longe = Math.hypot(v.x-v.hx, v.y-v.hy) > 13;
        if(d < 8 && !longe){
          v.vx += (dx/d*v.vel - v.vx)*Math.min(1, dt*3);
          v.vy += (dy/d*v.vel - v.vy)*Math.min(1, dt*3);
        } else if(longe){                          // volta flutuando para o nicho
          const hx = v.hx-v.x, hy = v.hy-v.y, dh = Math.max(.01, Math.hypot(hx,hy));
          v.vx += (hx/dh*v.vel - v.vx)*Math.min(1, dt*3);
          v.vy += (hy/dh*v.vel - v.vy)*Math.min(1, dt*3);
        } else { v.vx -= v.vx*2*dt; v.vy -= v.vy*2*dt; }
        /* vulto é sombra: atravessa nicho e parede. `mover` é a colisão dos
           vivos e prendia o bando atrás da fileira de nichos, sem nunca chegar
           no jogador do outro lado (F3-RF-12) */
        v.x = Math.max(.5, Math.min(LARG-.5, v.x + v.vx*dt));
        v.y = Math.max(.5, Math.min(ALT-.5,  v.y + v.vy*dt));
        if(d < v.raio + jog.raio + .1 && v.morde <= 0){
          v.morde = .9;
          tocarSfx('audio/fase3/sons/sussurro-vulto-1.mp3', .8);
          machucar(v.dano, Math.atan2(dy, dx));
        }
        break;
      }
      case 'afunda':
        v.p = Math.max(0, v.p - dt/.6);
        v.vx = v.vy = 0;
        if(v.p <= 0){ v.estado = 'submerso'; v.atraso = Math.random()*.6; }
        break;
    }
  });
}
function golpearVulto(v, cortante){
  if(!vultoVulneravel(v)) return;
  const dano = Math.round((jog.dano + irand(5)) * (cortante ? 2 : 1));
  v.hp -= dano; v.flash = 1;
  v.vx += (v.x-jog.x)*3; v.vy += (v.y-jog.y)*3;
  if(cortante) sCorte(); else sEspadaAcerta();
  flutuar(v.x, v.y - .6, dano, cortante ? '#ffd88a' : '#f4e2b4');
  for(let k=0;k<10;k++) faisca(v.x, v.y, '#3a3350', .13);
  if(v.hp <= 0){
    tocarSfx('audio/fase3/sons/sussurro-vulto-2.mp3', .9);
    for(let k=0;k<18;k++) faisca(v.x, v.y, '#5a5470', .16);
  }
}
function desenharVultos(ox, oy){
  vultos.forEach(v => {
    if(v.hp <= 0 || v.estado === 'submerso') return;
    const sobe = v.estado === 'ativo' ? 1 : v.p;
    const px = ox + v.x*tam, py = oy + v.y*tam, r = tam*.46;
    const flut = Math.sin(v.fase*2.3)*r*.1;
    ctx.save();
    ctx.globalAlpha = .25 + .65*sobe;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(px, py + r*.75, r*.8*sobe, r*.26*sobe, 0, 0, TAU); ctx.fill();
    ctx.translate(px, py + flut - r*.3*sobe);
    ctx.scale(1, sobe);
    if(imgVulto.complete && imgVulto.naturalWidth > 0){
      /* o sprite aprovado: capuz de olhos acesos e garras-foice */
      const altV = tam*1.7, larV = imgVulto.naturalWidth*(altV/imgVulto.naturalHeight);
      ctx.rotate(Math.sin(v.fase*2.1)*.06);
      if(v.flash > 0) ctx.filter = 'brightness(2.3) saturate(.3)';
      ctx.globalAlpha *= .94;
      ctx.drawImage(imgVulto, -larV/2, -altV*.62, larV, altV*.999);
      ctx.filter = 'none';
      const og2 = ctx.createRadialGradient(0, -r*.35, 0, 0, -r*.35, r*.6);
      og2.addColorStop(0, 'rgba(190,220,190,.22)'); og2.addColorStop(1, 'rgba(190,220,190,0)');
      ctx.fillStyle = og2;
      ctx.beginPath(); ctx.arc(0, -r*.35, r*.6, 0, TAU); ctx.fill();
      ctx.restore();
      return;
    }
    /* massa escura ondulante: cúpula com barra de ondas embaixo */
    ctx.fillStyle = v.flash > 0 ? '#5a5470' : '#161122';
    ctx.beginPath();
    ctx.moveTo(-r*.85, r*.6);
    ctx.quadraticCurveTo(-r*1.05 + Math.sin(v.fase*3)*r*.1, -r*.2, 0, -r*.95);
    ctx.quadraticCurveTo(r*1.05 + Math.sin(v.fase*3.4)*r*.1, -r*.2, r*.85, r*.6);
    for(let i=0;i<5;i++){                       // a bainha ondula feito pano rasgado
      const wx = r*.85 - (i+1)*r*.34;
      const wy = r*.6 + Math.sin(v.fase*5 + i*1.9)*r*.16;
      ctx.quadraticCurveTo(wx + r*.17, wy + r*.3, wx, wy);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(90,84,120,.25)';       // um respiro de volume
    ctx.beginPath(); ctx.ellipse(-r*.2, -r*.35, r*.4, r*.5, .3, 0, TAU); ctx.fill();
    /* olhos claros */
    const og = ctx.createRadialGradient(0, -r*.35, 0, 0, -r*.35, r*.55);
    og.addColorStop(0, 'rgba(207,214,255,.35)'); og.addColorStop(1, 'rgba(207,214,255,0)');
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.arc(0, -r*.35, r*.55, 0, TAU); ctx.fill();
    ctx.fillStyle = '#cfd6ff';
    const pisc = Math.sin(v.fase*1.3) > -.92 ? 1 : .15;   // piscada rara
    [-1,1].forEach(k => {
      ctx.beginPath();
      ctx.ellipse(k*r*.22, -r*.38, r*.09, r*.13*pisc, k*.2, 0, TAU);
      ctx.fill();
    });
    ctx.restore();
  });
}

/* --- GOLPE da fase 3: primeiro se debate, depois corta mãos e vultos --- */
function golpeFase3(){
  if(agarrao){ debaterAgarrao(); return; }    // preso: o aperto vale pelo golpe
  if(jog.recarga > 0) return;
  golpeDeArma();                              // chefe e ratazanas do jeito de sempre
  const cortante = !!ARMAS[jog.arma];
  maos.forEach(m => {
    if(m.hp > 0 && Math.hypot(m.x-jog.x, m.y-jog.y) < 1.3) golpearMao(m, cortante);
  });
  vultos.forEach(v => {
    if(Math.hypot(v.x-jog.x, v.y-jog.y) < 1.4) golpearVulto(v, cortante);
  });
}

  /* ---- capela de velório, no noroeste: sala grande com o mosaico circular ---- */

    if(Math.hypot(x + .5 - FUN.MOSAICO.x, y + .5 - FUN.MOSAICO.y) < FUN.MOSAICO.raio) t[ix(x,y)] = CHAO2;
  }

  /* ---- colombário em LABIRINTO, no sul: celas 2x2 numa grade 10x3 ---- */

    const c = lab[ly*10+lx], gx = 4+lx*3, gy = 45+ly*3;

  }
  /* as duas entradas do colombário */

  [[9.5,5.6],[4,15.6],[15,15.6],                    // capela
   [23,5.6],[26.5,12.5],                            // preparação

  dec.push({tipo:'rachadura', x:25, y:22.6});

  dec.push({tipo:'palha', x:10.5, y:31.6}); dec.push({tipo:'barril', x:3.8, y:35.2});
  // e o fundo do mesmo salão, onde o material espera: tábuas e pregos

  dec.push({tipo:'caixote', x:9.5, y:40.5}); dec.push({tipo:'caixote', x:3.8, y:40.6});
  dec.push({tipo:'teia', x:3.4, y:37.4, flip:false});
  // cripta alagada: caixões boiando na água parada

  dec.push({tipo:'poca', x:17.5, y:41.5}); dec.push({tipo:'osso', x:15.5, y:42.3});
  // colombário: os nichos guardam o que sobrou
  dec.push({tipo:'teia', x:4.4, y:45.4, flip:false}); dec.push({tipo:'teia', x:32.5, y:45.4, flip:true});
  dec.push({tipo:'caveira', x:13.5, y:48.5}); dec.push({tipo:'caveira', x:27.5, y:51.5});

  // escada de chegada

  dec.push({tipo:'barril', x:42.5, y:53.5});

  return {larg:FUN.LARG, alt:FUN.ALT, tiles:t, braseiros:bra, decor:dec};

/* --- as portas do piso: a arte recortada (porta.png) enfim espalhada nos vãos.
   O arco de pedra fica de pé para sempre; a folha de tábuas abre sozinha quando
   o jogador chega e fecha quando ele se afasta, no padrão do piso 2 --- */
const imgPorta3 = new Image(); imgPorta3.src = 'img/fase3/porta.png';
const P3_FOLHA = {x1:.175, x2:.825, y:.12};   // onde a folha de madeira vive dentro do PNG
function criarPortasFun(){
  portasInternas = [
    {x:17.5, y:8,  vert:true},   // capela <-> sala de preparação
    {x:8,  y:19, vert:false},    // capela -> salão dos enterros
    {x:22, y:19, vert:false},    // preparação -> salão

    /* a soleira sul da oficina: a mesma descida a oeste que leva ao colombário.
       O arco fica na boca de cima — duas folhas no mesmo corredor de três
       tiles ficavam uma colada na outra */
    {x:5,  y:42, vert:false},    // oficina -> a descida do colombário
    {x:40, y:25, vert:false}     // o quarto do Coveiro
  ].map(p => ({...p, ab:0, rangeu:false}));
}
function desenharPortasFun(ox, oy){
  const pronta = imgPorta3.complete && imgPorta3.naturalWidth > 0;
  portasInternas.forEach(p => {
    if(foraDaVista(ox + (p.x + .5)*tam, oy + (p.y + .5)*tam, tam*4)) return;
    if(p.vert){
      /* parede vertical: uma folha de tábuas na palheta da arte, girando na dobradiça norte */
      if(p.ab > .98) return;
      const esp = tam*.2, folha = tam*2.0, giro = p.ab*1.8;
      ctx.save();
      ctx.translate(ox + (p.x + .5)*tam, oy + p.y*tam);
      ctx.rotate(Math.PI/2 + giro);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, esp*.25, folha, esp);
      ctx.fillStyle = '#6f6152'; ctx.fillRect(0, -esp/2, folha, esp);      // tábuas cinzentas gastas
      ctx.fillStyle = '#26231f';                                           // ferragens
      ctx.fillRect(0, -esp/2, folha*.1, esp); ctx.fillRect(folha*.9, -esp/2, folha*.1, esp);
      ctx.fillRect(folha*.44, -esp/2, folha*.07, esp);
      ctx.fillStyle = 'rgba(20,14,8,.5)'; ctx.fillRect(folha*.1, -esp/2 + esp*.46, folha*.8, 1.5);
      ctx.fillStyle = 'rgba(235,228,214,.14)'; ctx.fillRect(folha*.1, -esp/2, folha*.8, 1.6);
      ctx.fillStyle = '#55534e';
      ctx.beginPath(); ctx.arc(0, 0, esp*.32, 0, TAU); ctx.fill();
      ctx.restore();
      return;
    }
    if(!pronta) return;
    /* vão de frente: o arco de pedra inteiro, a folha girando para dentro */
    const iw = imgPorta3.naturalWidth, ih = imgPorta3.naturalHeight;
    const w = tam*2.7, h = w*1.32;
    const x0 = ox + (p.x + 1)*tam - w/2, yTopo = oy + (p.y + .95)*tam - h;
    const fx = P3_FOLHA.x1*w, fw = (P3_FOLHA.x2 - P3_FOLHA.x1)*w;
    const fy = P3_FOLHA.y*h, fh = h - fy;
    /* o vão escuro atrás da folha */
    ctx.fillStyle = 'rgba(8,6,12,.6)';
    ctx.fillRect(x0 + fx, yTopo + fy, fw, fh);
    /* a folha, encolhendo rumo à ombreira esquerda e escurecendo */
    if(p.ab < .98){
      const esc = Math.max(.05, 1 - p.ab*1.02);
      ctx.fillStyle = 'rgba(0,0,0,' + (.28*(1 - p.ab)) + ')';
      ctx.beginPath();
      ctx.ellipse(x0 + fx + fw*esc*.5, yTopo + h + tam*.04, fw*esc*.5, tam*.13, 0, 0, TAU);
      ctx.fill();
      ctx.save();
      ctx.translate(x0 + fx, yTopo + fy);
      ctx.scale(esc, 1);
      ctx.drawImage(imgPorta3,
        iw*P3_FOLHA.x1, ih*P3_FOLHA.y, iw*(P3_FOLHA.x2 - P3_FOLHA.x1), ih*(1 - P3_FOLHA.y),
        0, 0, fw, fh);
      ctx.fillStyle = 'rgba(0,0,0,' + (p.ab*.6) + ')'; ctx.fillRect(0, 0, fw, fh);
      ctx.restore();
    }
    /* o arco de pedra por cima, inteiro mesmo de porta escancarada */
    ctx.drawImage(imgPorta3, 0, 0, iw*P3_FOLHA.x1, ih, x0, yTopo, fx, h);
    ctx.drawImage(imgPorta3, iw*P3_FOLHA.x2, 0, iw*(1 - P3_FOLHA.x2), ih,
      x0 + P3_FOLHA.x2*w, yTopo, (1 - P3_FOLHA.x2)*w, h);
    ctx.drawImage(imgPorta3, iw*P3_FOLHA.x1, 0, iw*(P3_FOLHA.x2 - P3_FOLHA.x1), ih*P3_FOLHA.y,
      x0 + fx, yTopo, fw, fy);
  });
}

/* --- o portão do Coveiro: o vão da cova não é um vão, é um portão selado.
   A arte fica de pé enquanto a terra está fechada e se desfaz quando ela abre —
   depois disso nada pode tapar a arena, e o monumento tem 6 tiles de altura. --- */
const imgPortaCoveiro = new Image(); imgPortaCoveiro.src = 'img/fase3/porta-coveiro.png';
function desenharPortaoCova(ox, oy){
  if(!porta3 || porta3.quebra >= 1) return;
  if(!(imgPortaCoveiro.complete && imgPortaCoveiro.naturalWidth > 0)) return;
  const cx = ox + (FUN.PORTA.x + FUN.PORTA.larg/2)*tam;
  const base = oy + (FUN.PORTA.y + 1)*tam;             // os degraus pousam no chão da soleira
  const larg = tam*4.2, alt = larg*(imgPortaCoveiro.naturalHeight/imgPortaCoveiro.naturalWidth);
  if(foraDaVista(cx, base - alt/2, alt)) return;
  ctx.save();
  ctx.globalAlpha = 1 - porta3.quebra;
  ctx.drawImage(imgPortaCoveiro, cx - larg/2, base - alt, larg, alt);
  ctx.restore();
}

/* --- as velas do caminho (t-velas): apagadas até o jogador ACENDER com E --- */

function criarVelasCaminho(){

/* o castiçal apagado, pintado uma única vez: aplicar ctx.filter por quadro
   tira o desenho do caminho rápido e derrubava o piso inteiro a ~44 fps */
let casticalMorto = null;
function casticalApagado(){
  if(casticalMorto) return casticalMorto;
  if(!(imgCastical.complete && imgCastical.naturalWidth > 0)) return null;
  const c = document.createElement('canvas');
  c.width = imgCastical.naturalWidth; c.height = imgCastical.naturalHeight;
  const g = c.getContext('2d');
  g.filter = 'grayscale(.7) brightness(.6)';
  g.drawImage(imgCastical, 0, 0);
  casticalMorto = c;
  return c;
}
function desenharVelasCaminho(ox, oy){
  velasCaminho.forEach(v => {
    const px = ox + v.x*tam, py = oy + v.y*tam;
    if(foraDaVista(px, py, tam*2)) return;
    // castiçal
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(px, py + tam*.14, tam*.16, tam*.06, 0, 0, TAU); ctx.fill();
    const spr = imgCastical.complete && imgCastical.naturalWidth > 0;
    if(spr){
      const altC = tam*1.05, larC = imgCastical.naturalWidth*(altC/imgCastical.naturalHeight);
      const arte = v.acesa ? imgCastical : (casticalApagado() || imgCastical);
      ctx.drawImage(arte, px - larC/2, py + tam*.14 - altC, larC, altC);
    } else {
      ctx.fillStyle = '#5a5264';
      ctx.fillRect(px - tam*.05, py - tam*.1, tam*.1, tam*.22);
      ctx.fillStyle = v.acesa ? '#e8e2d2' : '#8a8494';
      ctx.fillRect(px - tam*.04, py - tam*.34, tam*.08, tam*.26);
    }
    if(v.acesa){
      const tr = .8 + Math.sin(tempo*9 + v.x)*.2;
      const topoV = spr ? py + tam*.14 - tam*1.02 : py - tam*.4;
      ctx.fillStyle = '#ffd27a';
      ctx.beginPath(); ctx.ellipse(px, topoV, tam*.045, tam*.09*tr, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,230,.85)';
      ctx.beginPath(); ctx.ellipse(px, topoV - tam*.02, tam*.02, tam*.045, 0, 0, TAU); ctx.fill();
    } else {
      // fio de fumaça da vela morta
      ctx.strokeStyle = 'rgba(180,180,200,.25)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(px, spr ? py + tam*.14 - tam*.98 : py - tam*.36);
      ctx.quadraticCurveTo(px + tam*.06, py - tam*.5, px - tam*.03, py - tam*.62);
      ctx.stroke();
    }
  });
}
function acenderVela(v){
  v.acesa = true;
  braseiros.push({x:v.x, y:v.y - .3, fase:Math.random()*TAU});   // a luz passa a existir

  if(n === velasCaminho.length){ marcarTarefa('t-velas'); avisar('O caminho está aceso', 'a cova espera por você'); }
}

/* --- círios da cova: a cura da arena (25%), repostos a cada tentativa --- */
/* a cura da cova: uma água benta no canto, grande e sem nada em volta que
   atrapalhe a vista (pedido do dono) */
const CANTOS_AGUA = [[43.0, 14.8]];
function criarCirios(){
  cirios = CANTOS_AGUA.map(([x, y]) => ({x, y, pego:false}));
}
function desenharCirios(ox, oy){
  cirios.forEach(c2 => {
    if(c2.pego) return;
    const px = ox + c2.x*tam, py = oy + c2.y*tam;
    if(foraDaVista(px, py, tam*4)) return;
    const pulso = .5 + Math.sin(tempo*2.4 + c2.x)*.5;
    /* farol: um halo largo que respira, para achar a cura no meio da luta */
    const g = ctx.createRadialGradient(px, py, 0, px, py, Math.max(1, tam*(1.7 + pulso*.5)));
    g.addColorStop(0, 'rgba(150,215,235,' + (.30 + pulso*.16) + ')');
    g.addColorStop(.5, 'rgba(120,190,225,' + (.12 + pulso*.08) + ')');
    g.addColorStop(1, 'rgba(120,190,225,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, tam*(1.7 + pulso*.5), 0, TAU); ctx.fill();
    /* o anel que sobe do chão, marcando o ponto de longe */
    const sobe = (tempo*.6) % 1;
    ctx.strokeStyle = 'rgba(190,235,250,' + ((1 - sobe)*.4) + ')';
    ctx.lineWidth = Math.max(1.5, tam*.05);
    ctx.beginPath(); ctx.ellipse(px, py + tam*.2, tam*(.5 + sobe*.9), tam*(.18 + sobe*.34), 0, 0, TAU); ctx.stroke();

    ctx.fillStyle = 'rgba(0,0,0,.42)';
    ctx.beginPath(); ctx.ellipse(px, py + tam*.3, tam*.5, tam*.19, 0, 0, TAU); ctx.fill();
    /* a pia: pé de pedra, bacia lavrada e a água benta brilhando dentro */
    ctx.fillStyle = '#5a6070';
    ctx.beginPath();
    ctx.moveTo(px - tam*.16, py + tam*.24);
    ctx.lineTo(px + tam*.16, py + tam*.24);
    ctx.lineTo(px + tam*.1, py - tam*.24);
    ctx.lineTo(px - tam*.1, py - tam*.24);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(226,234,250,.18)';
    ctx.fillRect(px - tam*.15, py - tam*.2, tam*.07, tam*.42);
    ctx.fillStyle = '#7c8496';                                   // a bacia
    ctx.beginPath(); ctx.ellipse(px, py - tam*.3, tam*.42, tam*.19, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(236,244,255,.28)';
    ctx.beginPath(); ctx.ellipse(px, py - tam*.34, tam*.42, tam*.16, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2c6f8c';                                   // a água
    ctx.beginPath(); ctx.ellipse(px, py - tam*.32, tam*.32, tam*.13, 0, 0, TAU); ctx.fill();
    const br = .5 + Math.sin(tempo*3.6 + c2.y)*.5;
    ctx.fillStyle = 'rgba(180,238,255,' + (.35 + br*.35) + ')';  // o brilho da bênção
    ctx.beginPath(); ctx.ellipse(px - tam*.07, py - tam*.35, tam*.14, tam*.055, -.3, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(240,250,255,.5)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.ellipse(px, py - tam*.32, tam*.32, tam*.13, 0, 0, TAU); ctx.stroke();
    /* a cruz de ferro fincada na borda: não se confunde com pedra do cenário */
    ctx.strokeStyle = '#c9d4e4'; ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(2, tam*.06);
    ctx.beginPath(); ctx.moveTo(px, py - tam*.46); ctx.lineTo(px, py - tam*.84); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px - tam*.13, py - tam*.72); ctx.lineTo(px + tam*.13, py - tam*.72); ctx.stroke();
    ctx.fillStyle = 'rgba(210,245,255,' + (.3 + br*.4) + ')';
    ctx.beginPath(); ctx.arc(px, py - tam*.84, tam*.05, 0, TAU); ctx.fill();
  });
}

/* --- o Coveiro em pessoa: sprite com pernas que pisam, pá e lanterna --- */
function desenharCoveiro(c, ox, oy){
  const px = ox + c.x*tam, py = oy + c.y*tam, r = c.raio*tam;
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.beginPath(); ctx.ellipse(px, py + r*.92, r*1.05, r*.36, 0, 0, TAU); ctx.fill();

  const exausto = c.estado === 'exausto', tonto = c.estado === 'atordoado', cavando = c.estado === 'cava';
  const golpe = c.golpeAnim > 0 ? c.golpeAnim/.22 : 0;
  const flip = Math.cos(c.angulo) > 0;                  // a arte olha para a esquerda

  let ajoelha = 0;
  if(c.flash > 0) ajoelha = Math.max(ajoelha, Math.min(1, c.flash*1.1));
  if(tonto) ajoelha = Math.max(ajoelha, .8 + Math.sin(tempo*9)*.1);
  if(exausto) ajoelha = Math.max(ajoelha, .6);

  const andando = c.estado === 'aproxima';
  const gingado = andando ? Math.sin(c.pisada*5.5)*.08 : 0;
  const wind = c.estado === 'combo' && golpe === 0 ? Math.max(0, 1 - Math.max(0, c.t)/.32) : 0;

  let incl = 0;
  if(andando) incl = .14 + Math.sin(c.pisada*5.5)*.06;
  if(cavando) incl = .38 + Math.sin(tempo*13)*.14;      // dobrado sobre a pá, terra voando
  incl += golpe ? Math.sin((1-golpe)*Math.PI)*.5 : -wind*.30;

  const lunge = golpe ? Math.sin((1-golpe)*Math.PI)*r*.5 : 0;
  const passo = andando ? Math.abs(Math.sin(c.pisada*5.5))*r*.13 : 0;
  const lx = Math.cos(c.angulo)*lunge, ly = Math.sin(c.angulo)*lunge*.4 - passo;

  if(cavando && Math.random() < .5){
    particulas.push({x:c.x + (Math.random()-.5)*.8, y:c.y + .5,
      vx:(Math.random()-.5)*1.6, vy:-1.2 - Math.random()*1.2,
      vida:.5, cor:'rgba(90,74,52,.7)', tam:.1});
  }
  if(andando && Math.random() < .3){
    const lado = Math.sin(c.pisada*5.5) > 0 ? 1 : -1;
    particulas.push({x:c.x + lado*.4, y:c.y + .8,
      vx:(Math.random()-.5)*.7 - lado*.3, vy:-.25 - Math.random()*.3,
      vida:.4, cor:'rgba(120,104,84,.4)', tam:.09});
  }

  /* pernas magras de calça surrada, botas plantadas no chão: nada de flutuar */
  const base = py + r*.95, alt = r*3.8;
  const pernaAlt = r*(.92 - ajoelha*.35);
  const balanco = andando ? Math.sin(c.pisada*5.5)*.5 : 0;
  const hipY = base + ly - pernaAlt + ajoelha*r*.36;
  const perna = (lado, ang) => {
    ctx.save();
    ctx.translate(px + lx*.55 + lado*r*.32, hipY);
    ctx.rotate(ang);
    ctx.fillStyle = c.flash > .5 ? '#8d8698' : '#221d24';
    ctx.beginPath();
    ctx.moveTo(-r*.17, 0); ctx.lineTo(r*.17, 0);
    ctx.lineTo(r*.13, pernaAlt*.96); ctx.lineTo(-r*.13, pernaAlt*.96);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3a333c';                           // remendo no joelho
    ctx.beginPath(); ctx.ellipse(0, pernaAlt*.46, r*.14, r*.1, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#0e0b12';                           // bota
    ctx.beginPath(); ctx.ellipse(Math.sin(ang)*r*.06, pernaAlt*.98, r*.25, r*.14, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(200,190,215,.12)';
    ctx.beginPath(); ctx.ellipse(0, pernaAlt*.90, r*.18, r*.05, 0, 0, TAU); ctx.fill();
    ctx.restore();
  };
  perna(-1, balanco);
  perna(1, -balanco);

  const iw = imgCoveiro.naturalWidth, ih = imgCoveiro.naturalHeight;
  if(imgCoveiro.complete && iw > 0){
    const lar = alt*iw/ih;
    const resp = exausto ? Math.sin(tempo*7)*.06 : Math.sin(tempo*1.8)*.015;
    const soco = andando ? Math.abs(Math.cos(c.pisada*5.5))*.03 : 0;
    ctx.save();
    ctx.translate(px + lx, hipY + r*.14);
    if(flip) ctx.scale(-1, 1);
    ctx.rotate(-incl + gingado + (tonto ? Math.sin(tempo*11)*.08 : 0));
    ctx.scale(1 + ajoelha*.07 + soco, (1 - ajoelha*.24 - soco)*(1 + resp));
    if(c.flash > .5) ctx.filter = 'brightness(2.1) saturate(.4)';
    ctx.drawImage(imgCoveiro, -lar/2, -alt, lar, alt);
    ctx.filter = 'none';
    ctx.restore();
    /* o bafo âmbar da lanterna dele — a fraqueza que a Lavadeira ensina */
    const lgx = px + lx + (flip ? 1 : -1)*r*.72, lgy = hipY + r*.14 - alt*.42;
    const lg = ctx.createRadialGradient(lgx, lgy, 0, lgx, lgy, Math.max(1, r*1.1));
    lg.addColorStop(0, 'rgba(255,190,90,.20)'); lg.addColorStop(1, 'rgba(255,190,90,0)');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lgx, lgy, r*1.1, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = '#2c2a33';
    ctx.beginPath(); ctx.ellipse(px, py - r*.1, r*.78, r*.95, 0, 0, TAU); ctx.fill();
  }

  /* a pá erguida no windup e o arco da pazada */
  const topoC = hipY + r*.14 - alt;
  if(wind > .25){
    const ga = c.angulo + Math.PI*.82;
    ctx.strokeStyle = 'rgba(205,198,188,' + (wind*.75) + ')';
    ctx.lineWidth = Math.max(1.5, r*.11*wind);
    ctx.beginPath();
    ctx.moveTo(px + Math.cos(ga)*r*.5, topoC + alt*.28);
    ctx.lineTo(px + Math.cos(ga)*r*1.3, topoC + alt*.02);
    ctx.stroke();
  }
  if(golpe){
    ctx.strokeStyle = 'rgba(214,206,190,' + (golpe*.9) + ')';
    ctx.lineWidth = Math.max(1, r*.3*golpe);
    ctx.beginPath();
    ctx.arc(px, py, r*2.2, c.angulo - 1.2 + (1-golpe)*1.7, c.angulo + .4 + (1-golpe)*1.7);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + (golpe*.45) + ')';
    ctx.lineWidth = Math.max(1, r*.1*golpe);
    ctx.beginPath();
    ctx.arc(px, py, r*2.2, c.angulo - .9 + (1-golpe)*1.7, c.angulo + .1 + (1-golpe)*1.7);
    ctx.stroke();
  }
}

/* --- a cripta alagada viva: brilho que corre na lâmina e goteiras pingando.
   O cache dá a cor; isto dá o movimento que faz o olho ler ÁGUA. --- */
const CRIPTA = {x1:15, y1:32, x2:28, y2:42};
const GOTEIRAS = [[18.5,38.2],[24.5,36.6],[20.8,41.6],[26.3,40.1],[17.2,34.8]];
/* o que a cripta carrega na superfície — posição de âncora, inclinação e escala */
const BOIAM = [
  {tipo:'caixao',  x:17.7, y:36.2, ang:-.32, esc:1},
  {tipo:'caixao',  x:23.3, y:35.2, ang:.5,   esc:1},
  {tipo:'caixao',  x:25.7, y:39.5, ang:-.12, esc:.92},
  {tipo:'caixote', x:20,   y:35.5, ang:.25,  esc:1},
  {tipo:'caixote', x:24,   y:38.5, ang:-.4,  esc:.85},
  {tipo:'caixote', x:19.5, y:41.3, ang:.6,   esc:.9}
];
function desenharAguaCripta(ox, oy){
  const x0 = ox + CRIPTA.x1*tam, y0 = oy + CRIPTA.y1*tam;
  const larg = (CRIPTA.x2 - CRIPTA.x1 + 1)*tam, alt = (CRIPTA.y2 - CRIPTA.y1 + 1)*tam;
  if(foraDaVista(x0 + larg/2, y0 + alt/2, Math.max(larg, alt))) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, y0, larg, alt); ctx.clip();   // nada escapa para a margem

  /* o que a água carrega: caixões e caixotes boiando, cada um no seu bailado
     lento — sobe, desce, gira e deriva um palmo para cada lado */
  BOIAM.forEach((o, i) => {
    const f = tempo*.7 + i*1.7;                          // o bailado, no dobro da velocidade
    const dx = Math.sin(f*.7)*.16, dy = Math.cos(f*.53 + 1.2)*.12;
    const px = ox + (o.x + dx)*tam, py = oy + (o.y + dy)*tam;
    if(foraDaVista(px, py, tam*2)) return;
    const ang = o.ang + Math.sin(f*.6 + i)*.07;
    const afunda = .5 + Math.sin(f*.9 + i*2.1)*.5;        // quanto está submerso agora
    ctx.save();
    ctx.translate(px, py);
    /* o rastro que ele abre na água, respirando junto */
    ctx.strokeStyle = 'rgba(160,206,200,' + (.14 + afunda*.18) + ')';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(0, 0, tam*(.74 + afunda*.1)*o.esc, tam*(.4 + afunda*.06)*o.esc, ang, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(160,206,200,' + (.05 + afunda*.07) + ')';
    ctx.beginPath(); ctx.ellipse(0, 0, tam*(.98 + afunda*.14)*o.esc, tam*(.55 + afunda*.08)*o.esc, ang, 0, TAU); ctx.stroke();
    ctx.rotate(ang);
    ctx.scale(o.esc, o.esc);
    if(o.tipo === 'caixao'){
      const w1 = tam*.26, w2 = tam*.34, w3 = tam*.18, L = tam*.62;
      ctx.fillStyle = '#312417';
      ctx.beginPath();
      ctx.moveTo(-L, -w1); ctx.lineTo(-L*.25, -w2); ctx.lineTo(L, -w3);
      ctx.lineTo(L, w3); ctx.lineTo(-L*.25, w2); ctx.lineTo(-L, w1);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(200,180,140,' + (.16 + afunda*.14) + ')';   // a luz na parte que emerge
      ctx.beginPath();
      ctx.moveTo(-L, -w1); ctx.lineTo(-L*.25, -w2); ctx.lineTo(L, -w3);
      ctx.lineTo(L, -w3*.4); ctx.lineTo(-L*.25, -w2*.55); ctx.lineTo(-L, -w1*.5);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(8,5,3,.55)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-L*.25, -w2); ctx.lineTo(-L*.25, w2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(L*.4, -w3*1.15); ctx.lineTo(L*.4, w3*1.15); ctx.stroke();
      ctx.fillStyle = 'rgba(14,22,24,' + (.55 + afunda*.25) + ')';      // a ponta que a água come
      ctx.beginPath();
      ctx.moveTo(L*.55, -w3*1.2); ctx.lineTo(L + 1.5, -w3); ctx.lineTo(L + 1.5, w3); ctx.lineTo(L*.55, w3*1.2);
      ctx.closePath(); ctx.fill();
    } else {
      const l = tam*.34;
      ctx.fillStyle = '#4a3925';
      ctx.fillRect(-l, -l*.62, l*2, l*1.24);
      ctx.fillStyle = 'rgba(206,186,142,' + (.14 + afunda*.12) + ')';
      ctx.fillRect(-l, -l*.62, l*2, l*.34);
      ctx.strokeStyle = 'rgba(10,7,4,.5)'; ctx.lineWidth = 1.1;
      ctx.strokeRect(-l, -l*.62, l*2, l*1.24);
      ctx.beginPath(); ctx.moveTo(-l, 0); ctx.lineTo(l, 0); ctx.stroke();
      ctx.fillStyle = 'rgba(14,22,24,' + (.4 + afunda*.25) + ')';
      ctx.fillRect(-l, l*.28, l*2, l*.34);
    }
    ctx.restore();
  });

  /* as goteiras: anel que nasce, cresce e some — o pulso da cripta */
  GOTEIRAS.forEach(([gx, gy], i) => {
    const px = ox + gx*tam, py = oy + gy*tam;
    for(let k=0; k<3; k++){
      const p = ((tempo*.5 + i*.6 + k*.33) % 1);
      const raio = tam*(.1 + p*.55), op = (1 - p)*.35;
      if(op <= .01) continue;
      ctx.strokeStyle = 'rgba(198,232,226,' + op + ')';
      ctx.lineWidth = Math.max(.8, 1.8*(1-p));
      ctx.beginPath(); ctx.ellipse(px, py, raio, raio*.42, 0, 0, TAU); ctx.stroke();
    }
    // a gota caindo, que fecha o ciclo
    const q = (tempo*.5 + i*.6) % 1;
    if(q > .72){
      const t2 = (q - .72)/.28;
      ctx.fillStyle = 'rgba(210,238,232,' + (.5*(1-t2)) + ')';
      ctx.beginPath();
      ctx.ellipse(px, py - tam*(1.1 - t2*1.1), tam*.035, tam*.075, 0, 0, TAU);
      ctx.fill();
    }
  });
  /* o brilho do que está aceso perto: a água devolve a luz das velas */
  braseiros.forEach(b => {
    if(b.x < CRIPTA.x1 - 2 || b.x > CRIPTA.x2 + 2 || b.y < CRIPTA.y1 - 2 || b.y > CRIPTA.y2 + 2) return;
    const px = ox + b.x*tam, py = oy + (b.y + .8)*tam;
    const tremula = .6 + Math.sin(tempo*6 + b.fase)*.4;
    const g = ctx.createLinearGradient(px, py, px, py + tam*2.4);
    g.addColorStop(0, 'rgba(255,196,120,' + (.16*tremula) + ')');
    g.addColorStop(1, 'rgba(255,196,120,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(px, py + tam*1.1, tam*.42, tam*1.2, 0, 0, TAU);
    ctx.fill();
  });
  ctx.restore();
}

/* --- coadjuvantes: o velório na capela, com os rezadores recortados --- */
/* o velório cheio: cada figura com sua roupa (matiz), seu tamanho e seu
   jeito — sentada nos bancos ou de pé junto ao esquife (pedido do dono).
   `tom` gira a cor da veste; `sentado` encolhe as pernas contra o banco. */
const COADJ_FUN = [
  /* de pé, velando o corpo — em roda POR FORA da pegada do caixão (x 7.95 a
     11.05, y 8.27 a 11.42), senão o desenhado por cima passa na frente dele */
  {img:'rezador-4', x:6.8,  y:10.9, esc:1.14, tom:0},
  {img:'rezador-4', x:12.2, y:11.15, esc:1.02, tom:-38, flip:true},
  {img:'rezador-2', x:9.5,  y:7.9,  esc:.95,  tom:26},
  {img:'rezador-3', x:8.3,  y:13.3, esc:1.06, tom:52},
  {img:'rezador-1', x:10.9, y:13.5, esc:.9,   tom:-18, flip:true},
  // sentados no flanco oeste (bancos em x 3.85 e 5.35, filas y 6.8 / 9.2 / 11.9)
  {img:'rezador-2', x:4.15, y:6.95, esc:.82, tom:14,  sentado:true},
  {img:'rezador-1', x:5.62, y:7.05, esc:.78, tom:-52, sentado:true},
  {img:'rezador-3', x:4.15, y:9.35, esc:.86, tom:70,  sentado:true},
  {img:'rezador-4', x:5.62, y:12.05, esc:.8, tom:-8,  sentado:true},
  // sentados no flanco leste (bancos em x 14.05 e 15.5), virados para o esquife
  {img:'rezador-1', x:14.35, y:6.95, esc:.84, tom:38,  sentado:true, flip:true},
  {img:'rezador-3', x:15.8,  y:9.35, esc:.79, tom:-30, sentado:true, flip:true},
  {img:'rezador-2', x:14.35, y:12.05, esc:.88, tom:88, sentado:true, flip:true},
  {img:'rezador-4', x:15.8,  y:6.95, esc:.76, tom:110, sentado:true, flip:true},
  // pelos cantos, de pé, esperando a vez
  {img:'rezador-3', x:3.9,  y:15.2, esc:.92, tom:-64},
  {img:'rezador-1', x:15.4, y:15.1, esc:.97, tom:20, flip:true}
];
function desenharCoadjuvantesFun(ox, oy){
  COADJ_FUN.forEach((c2, i) => {
    const im = funImg(c2.img);
    if(!im.complete || !im.naturalWidth) return;
    const px = ox + c2.x*tam, py = oy + c2.y*tam;
    if(foraDaVista(px, py, tam*2.5)) return;
    const q = Math.floor((tempo + i*.7)*8)/8;               // 8 quadros/s, como os informantes
    const sentado = !!c2.sentado;
    const alt = tam*1.35*(c2.esc || 1)*(sentado ? .78 : 1);  // sentado, o corpo encolhe
    const lar = im.naturalWidth*(tam*1.35*(c2.esc || 1)/im.naturalHeight);
    const gira = Math.sin(q*1.8 + i)*(sentado ? .015 : .03); // quem senta balança menos
    const sopro = 1 + Math.sin(q*2.6 + i*2)*.018;
    ctx.fillStyle = 'rgba(0,0,0,' + (sentado ? .22 : .3) + ')';
    ctx.beginPath(); ctx.ellipse(px, py + tam*.06, lar*.38, tam*.09, 0, 0, TAU); ctx.fill();
    ctx.save();
    ctx.translate(px, py + tam*.08);
    ctx.rotate(gira);
    ctx.scale((c2.flip ? -1 : 1)*(2 - sopro), sopro);
    if(c2.tom) ctx.filter = 'hue-rotate(' + c2.tom + 'deg) saturate(1.15)';
    ctx.drawImage(im, -lar/2, -alt, lar, alt);
    ctx.filter = 'none';
    ctx.restore();
  });
}

/* --- os dois ajudantes de carpintaria (F3-RF-28) ---------------------------
   A oficina não para: dois rapazes rodam pelas estações do cômodo — serram na
   bancada, martelam o caixão dos cavaletes, aplainam o que já está de pé,
   molham tábua no cocho e voltam à pilha buscar madeira. Nunca dividem a mesma
   estação: quem chega primeiro toma o posto, o outro procura serviço em outro
   canto. São figurantes — não machucam nem barram o caminho de ninguém. */
const imgAjCarp = new Image(); imgAjCarp.src = 'img/fase3/ajudante-carpinteiro.png';
/* os postos de trabalho, espalhados pelo retângulo todo da carpintaria
   (x3..11, y31..41): o ponto é onde o corpo do ajudante para, um passo à
   frente do móvel, para o gesto cair em cima da peça */
const POSTOS_CARP = [
  {x:3.9,  y:32.3, gesto:'serrar',   olha:1},   // a ponta oeste da bancada, longe do vulto do Carpinteiro
  {x:8.3,  y:33.9, gesto:'martelar', olha:-1},  // o caixão meio montado nos cavaletes
  {x:10.1, y:33.2, gesto:'aplainar', olha:-1},  // o caixão pronto, de pé no canto
  {x:4.9,  y:35.3, gesto:'molhar',   olha:1},   // o cocho de molhar tábuas, a leste do barril
  {x:7.9,  y:39.4, gesto:'carregar', olha:1}    // um passo à frente da pilha de tábuas
];
let carpinteiros = [];
function criarCarpinteiros(){
  /* um começa na bancada, outro lá embaixo na pilha: já nascem separados */
  carpinteiros = [{p:0, tom:0, esc:1.02}, {p:4, tom:-34, esc:.94}].map((c, i) => {
    const e = POSTOS_CARP[c.p];
    return {x:e.x, y:e.y, vx:0, vy:0, raio:.28, alvo:c.p, fase:'trabalhando',
            tempo:1.4 + i*1.1, tom:c.tom, esc:c.esc, flip:e.olha < 0,
            bal:Math.random()*TAU, teima:0, dist:0};
  });
}
/* escolhe outro posto — nunca o que o companheiro já tomou ou está tomando */
function outroPostoCarp(a){
  const livres = POSTOS_CARP.map((_, k) => k)
    .filter(k => k !== a.alvo && !carpinteiros.some(o => o !== a && o.alvo === k));
  return livres.length ? livres[irand(livres.length)] : a.alvo;
}
function atualizarCarpinteiros(dt){
  carpinteiros.forEach(a => {
    a.bal += dt;
    const e = POSTOS_CARP[a.alvo];
    if(a.fase === 'trabalhando'){
      a.tempo -= dt;
      if(a.tempo <= 0){ a.alvo = outroPostoCarp(a); a.fase = 'indo'; a.teima = 0; a.dist = 99; }
      return;
    }
    const dx = e.x - a.x, dy = e.y - a.y, d = Math.hypot(dx, dy);
    if(d < .14){                       // chegou: larga o passo e pega no serviço
      a.fase = 'trabalhando';
      a.tempo = 3.5 + Math.random()*3.5;
      a.flip = e.olha < 0;
      a.vx = a.vy = 0;
      return;
    }
    const vel = .85;                   // passo de quem trabalha, bem mais lento que o jogador
    a.vx = dx/d*vel; a.vy = dy/d*vel;
    mover(a, a.vx*dt, a.vy*dt);        // parede é parede: nem eles atravessam
    if(Math.abs(dx) > .05) a.flip = dx < 0;
    /* se a madeira empacar num canto e ele não encurtar caminho, desiste do
       posto e vai procurar serviço em outro lugar */
    if(d < a.dist - .05){ a.dist = d; a.teima = 0; }
    else { a.teima += dt; if(a.teima > 2.5){ a.alvo = outroPostoCarp(a); a.teima = 0; a.dist = 99; } }
  });
}
function desenharCarpinteiros(ox, oy){
  if(!(imgAjCarp.complete && imgAjCarp.naturalWidth > 0)) return;
  carpinteiros.forEach((a, i) => {
    const px = ox + a.x*tam, py = oy + a.y*tam;
    if(foraDaVista(px, py, tam*2.2)) return;
    const q = Math.floor((a.bal + i*.6)*8)/8;            // 8 quadros/s, como os rezadores
    const alt = tam*1.3*a.esc;
    const lar = imgAjCarp.naturalWidth*(alt/imgAjCarp.naturalHeight);
    let gira = Math.sin(q*2.2 + i)*.035, sopro = 1 + Math.sin(q*3.2 + i*2)*.02;
    let quica = Math.abs(Math.sin(q*2.4 + i))*tam*.05, arrasta = 0;
    if(a.fase === 'trabalhando'){
      /* o esforço do gesto: a serra vai e vem no braço, o martelo desce em
         batida seca, a plaina corre o comprimento da tábua */
      const g = POSTOS_CARP[a.alvo].gesto;
      if(g === 'serrar'){       arrasta = Math.sin(q*9)*tam*.09;  gira = Math.sin(q*9)*.05;  quica = 0; }
      else if(g === 'martelar'){ quica = Math.max(0, Math.sin(q*7))*tam*.13; gira = Math.sin(q*7)*.07; }
      else if(g === 'aplainar'){ arrasta = Math.sin(q*4.4)*tam*.13; gira = Math.sin(q*4.4)*.04; quica = 0; }
      else if(g === 'molhar'){   gira = Math.sin(q*2.6)*.1; quica = Math.abs(Math.sin(q*2.6))*tam*.03; }
      else {                     quica = Math.abs(Math.sin(q*3.4))*tam*.06; gira = Math.sin(q*1.8)*.05; }
      sopro = 1 + Math.sin(q*5 + i)*.03;
    }
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(px + arrasta, py + tam*.08, lar*.36, tam*.085, 0, 0, TAU); ctx.fill();
    ctx.save();
    ctx.translate(px + arrasta, py + tam*.1 - quica);
    ctx.rotate(gira);
    ctx.scale((a.flip ? -1 : 1)*(2 - sopro), sopro);
    if(a.tom) ctx.filter = 'hue-rotate(' + a.tom + 'deg) saturate(1.12)';
    ctx.drawImage(imgAjCarp, -lar/2, -alt, lar, alt);
    ctx.filter = 'none';
    ctx.restore();
  });
}

/* === PINTURA DO CENÁRIO DO PISO 3 (gancho pintarCache) ==================
   Mesma receita da fase 2: perspectiva 3/4 (paredes com FACE de tijolo onde
   olham para o sul, TOPO de pedra bruta no resto), sombra em degradê no chão
   sob cada face, e todo móvel com superfície iluminada + face sombreada.
   Dividida em quatro passes; a ordem importa (estruturas por cima do chão). */

/* -- passe 1: paredes 3/4, sombras e lajes do chão (o esqueleto do relevo) -- */
function pintarFunParedes(cmx, T){
  const rndDe = (x,y) => hash(x*3.7, y*9.1);
  const dentro3 = (x,y) => x>=0 && y>=0 && x<FUN.LARG && y<FUN.ALT;
  const aberto = v => v === CHAO || v === CHAO2 || v === FOSSO || v === PONTE;
  const ehParede = (x,y) => dentro3(x,y) && mapa[y*FUN.LARG + x] === PAREDE;
  const ehAberto = (x,y) => dentro3(x,y) && aberto(mapa[y*FUN.LARG + x]);
  const ehFosso  = (x,y) => dentro3(x,y) && mapa[y*FUN.LARG + x] === FOSSO;

  /* ---- paredes em perspectiva 3/4, na pedra fria do funeral: onde a parede
     olha para o sul (chão, ponte ou a água parada abaixo) desenha a FACE
     frontal de tijolos úmidos; o resto é o TOPO do muro, pedra bruta ---- */
  for(let y=0; y<FUN.ALT; y++) for(let x=0; x<FUN.LARG; x++){
    if(!ehParede(x,y)) continue;
    if(!(ehAberto(x,y+1) || ehAberto(x,y-1) || ehAberto(x+1,y) || ehAberto(x-1,y)
      || ehAberto(x+1,y+1) || ehAberto(x-1,y+1) || ehAberto(x+1,y-1) || ehAberto(x-1,y-1))) continue;
    const px2 = x*T, py2 = y*T, h = rndDe(x, y);

    if(ehAberto(x, y+1)){
      /* FACE frontal: três fiadas de tijolo cinza-azulado, úmidas */
      cmx.fillStyle = '#4a4f63';
      cmx.fillRect(px2, py2, T, T);
      cmx.fillStyle = 'rgba(200,215,255,.12)';                 // luz fria pegando o alto da face
      cmx.fillRect(px2, py2, T, T*.34);
      cmx.fillStyle = 'rgba(6,8,16,.24)';                      // sombra na base
      cmx.fillRect(px2, py2 + T*.66, T, T*.34);
      // fiadas com juntas desencontradas
      cmx.strokeStyle = 'rgba(10,12,22,.65)'; cmx.lineWidth = 1.8;
      for(let f=1; f<3; f++){
        cmx.beginPath(); cmx.moveTo(px2, py2 + f*T/3); cmx.lineTo(px2+T, py2 + f*T/3); cmx.stroke();
      }
      for(let f=0; f<3; f++){
        const off = ((x + f) % 2)*T/4;
        for(let j=0; j<3; j++){
          const jx = px2 + off + j*T/2;
          if(jx > px2 + 1 && jx < px2 + T - 1){
            cmx.beginPath(); cmx.moveTo(jx, py2 + f*T/3); cmx.lineTo(jx, py2 + (f+1)*T/3); cmx.stroke();
          }
        }
      }
      // tijolo trocado aqui e ali (um mais pálido, um mais fundo)
      if(h > .55){
        cmx.fillStyle = h > .8 ? 'rgba(175,195,235,.14)' : 'rgba(4,6,12,.26)';
        cmx.fillRect(px2 + ((h*4)|0)%2 * T/2, py2 + (((h*7)|0)%3)*T/3 + 1, T/2, T/3 - 2);
      }
      // escorrido de umidade descendo a face, aqui e ali
      if(h > .62 && h < .78){
        cmx.fillStyle = 'rgba(120,150,190,.10)';
        cmx.fillRect(px2 + T*(.2 + h*.5), py2, T*.07, T*.86);
      }
      // rodapé de cantaria clara encostando no chão
      cmx.fillStyle = '#7e8496';
      cmx.fillRect(px2, py2 + T - T*.14, T, T*.14);
      cmx.strokeStyle = 'rgba(12,14,24,.55)'; cmx.lineWidth = 1.3;
      cmx.strokeRect(px2 + 1, py2 + T - T*.14, T*.5 - 1, T*.14);
      cmx.strokeRect(px2 + T*.5, py2 + T - T*.14, T*.5 - 1, T*.14);
      cmx.fillStyle = 'rgba(225,235,255,.22)';
      cmx.fillRect(px2, py2 + T - T*.14, T, 1.6);
    } else {
      /* TOPO do muro: pedra bruta escura com pedregulhos arredondados */
      cmx.fillStyle = '#23262f';
      cmx.fillRect(px2, py2, T, T);
      cmx.strokeStyle = 'rgba(6,8,14,.6)'; cmx.lineWidth = 1.5;
      for(let k=0; k<3; k++){
        const bx = px2 + T*(.2 + rndDe(x*3+k, y)*.6), by = py2 + T*(.2 + rndDe(x, y*3+k)*.6);
        const br = T*(.14 + rndDe(x+k, y+k)*.12);
        cmx.fillStyle = 'rgba(74,82,104,' + (.25 + rndDe(x-k, y)*.3) + ')';
        cmx.beginPath(); cmx.ellipse(bx, by, br, br*.8, rndDe(x,y+k)*2, 0, TAU); cmx.fill();
        cmx.stroke();
      }
      // beirada de cantaria quando o topo encosta em espaço aberto
      cmx.fillStyle = '#7e8496';
      if(ehAberto(x, y-1)) cmx.fillRect(px2, py2, T, T*.12);
      if(ehAberto(x-1, y)) cmx.fillRect(px2, py2, T*.12, T);
      if(ehAberto(x+1, y)) cmx.fillRect(px2 + T - T*.12, py2, T*.12, T);
    }
  }

  /* sombra que a face projeta no chão (ou na água parada) logo abaixo — o relevo */
  for(let y=0; y<FUN.ALT; y++) for(let x=0; x<FUN.LARG; x++){
    if(!ehAberto(x,y) || !ehParede(x, y-1)) continue;
    const g2 = cmx.createLinearGradient(0, y*T, 0, y*T + T*.5);
    g2.addColorStop(0, 'rgba(0,0,0,.38)'); g2.addColorStop(1, 'rgba(0,0,0,0)');
    cmx.fillStyle = g2;
    cmx.fillRect(x*T, y*T, T, T*.5);
  }

  /* ---- lajões do CHAO: manchas de tom frio, lascas de canto e rachaduras ---- */
  for(let y=0; y<FUN.ALT; y++) for(let x=0; x<FUN.LARG; x++){
    if(mapa[y*FUN.LARG + x] !== CHAO) continue;
    const px2 = x*T, py2 = y*T, h = rndDe(x+7, y+3);
    // manchas de tom (lajes que não são irmãs)
    if(h > .55){
      cmx.fillStyle = h > .8 ? 'rgba(225,232,250,.06)' : 'rgba(6,8,16,.10)';
      cmx.fillRect(px2+2, py2+2, T-4, T-4);
    }
    // lasca no canto
    if(h > .72){
      cmx.fillStyle = 'rgba(6,8,16,.35)';
      const c1 = [[px2,py2],[px2+T,py2],[px2,py2+T],[px2+T,py2+T]][(h*4)|0 % 4] || [px2,py2];
      cmx.beginPath();
      cmx.moveTo(c1[0], c1[1]);
      cmx.lineTo(c1[0] + (c1[0]===px2? T*.22 : -T*.22), c1[1]);
      cmx.lineTo(c1[0], c1[1] + (c1[1]===py2? T*.22 : -T*.22));
      cmx.closePath(); cmx.fill();
    }
    // rachadura atravessando a laje
    if(h > .9){
      cmx.strokeStyle = 'rgba(6,8,16,.45)'; cmx.lineWidth = 1.6;
      cmx.beginPath();
      cmx.moveTo(px2 + T*.15, py2 + T*(.2 + h*.3));
      cmx.lineTo(px2 + T*.5, py2 + T*.55);
      cmx.lineTo(px2 + T*.62, py2 + T*.9);
      cmx.stroke();
    }
  }

  /* ---- CHAO2 = pedra molhada (mosaico da capela, terra da cova, escada de
     chegada): juntas mais finas e um brilho úmido que anda de laje em laje ---- */
  for(let y=0; y<FUN.ALT; y++) for(let x=0; x<FUN.LARG; x++){
    if(mapa[y*FUN.LARG + x] !== CHAO2) continue;
    const px2 = x*T, py2 = y*T, h = rndDe(x+11, y+5);
    // juntas finas
    cmx.strokeStyle = 'rgba(10,12,22,.35)'; cmx.lineWidth = .9;
    cmx.strokeRect(px2 + .5, py2 + .5, T - 1, T - 1);
    // brilho úmido em manchas irregulares
    if(h > .35){
      cmx.fillStyle = 'rgba(160,190,230,.05)';
      cmx.beginPath();
      cmx.ellipse(px2 + T*(.25 + h*.5), py2 + T*(.3 + rndDe(x+3,y+9)*.4),
                  T*(.22 + h*.2), T*(.14 + h*.14), h*2, 0, TAU);
      cmx.fill();
    }
    // um reflexo fino onde a água escorreu
    if(h > .82){
      cmx.fillStyle = 'rgba(190,215,250,.08)';
      cmx.fillRect(px2 + T*.18, py2 + T*(.5 + h*.3), T*.55, 1.4);
    }
  }

  /* ---- musgo/limo à beira d'água: chão e ponte encostados no FOSSO ---- */
  for(let y=0; y<FUN.ALT; y++) for(let x=0; x<FUN.LARG; x++){
    const t2 = mapa[y*FUN.LARG + x];
    if(t2 !== CHAO && t2 !== PONTE) continue;
    if(!(ehFosso(x,y+1) || ehFosso(x,y-1) || ehFosso(x+1,y) || ehFosso(x-1,y))) continue;
    const px2 = x*T, py2 = y*T, b = T*.16;
    cmx.fillStyle = 'rgba(90,120,80,.18)';
    if(ehFosso(x, y+1)) cmx.fillRect(px2, py2 + T - b, T, b);
    if(ehFosso(x, y-1)) cmx.fillRect(px2, py2, T, b);
    if(ehFosso(x-1, y)) cmx.fillRect(px2, py2, b, T);
    if(ehFosso(x+1, y)) cmx.fillRect(px2 + T - b, py2, b, T);
    // tufos de limo salpicados na beirada
    const h = rndDe(x+5, y+13);
    if(h > .5){
      cmx.fillStyle = 'rgba(90,120,80,.22)';
      cmx.beginPath();
      cmx.arc(px2 + T*(.2 + h*.6), py2 + T*(ehFosso(x,y+1) ? .82 : .18), T*.07, 0, TAU);
      cmx.fill();
    }
  }
}

/* -- passe 2: capela do velório + sala de preparação -- */
function pintarFunCapelaPrep(cmx, T){
  const rnd = (x,y) => hash(x*5.3, y*11.7);

  /* ================= CAPELA DE VELÓRIO =================
     o mosaico circular: rosácea fúnebre em anéis de pedra fria, gasta */
  const MX = FUN.MOSAICO.x*T, MY = FUN.MOSAICO.y*T, MR = FUN.MOSAICO.raio*T;
  /* o círculo é um ESTRADO: sobe do chão com dois degraus de cantaria, face
     frontal sombreada e sombra projetada — alto-relevo, não desenho no piso */
  const FACE = T*.42;
  cmx.fillStyle = 'rgba(0,0,0,.42)';                       // a sombra que o estrado joga no chão
  cmx.beginPath(); cmx.ellipse(MX + T*.08, MY + FACE*.9, MR*1.1, MR*.34, 0, 0, TAU); cmx.fill();
  for(let d=1; d>=0; d--){                                  // dois degraus, o de baixo mais largo
    const rr = MR*(1 + .13*(d+1)), hh = FACE*(d ? .55 : 1);
    cmx.fillStyle = d ? '#3d4354' : '#454b5e';              // a face do degrau, na sombra
    cmx.beginPath();
    cmx.ellipse(MX, MY + hh*.5, rr, rr*.42 + hh*.5, 0, 0, Math.PI);
    cmx.lineTo(MX - rr, MY);
    cmx.closePath(); cmx.fill();
    cmx.fillStyle = d ? '#6d7488' : '#7a8298';              // o topo do degrau, iluminado
    cmx.beginPath(); cmx.ellipse(MX, MY, rr, rr*.42, 0, 0, TAU); cmx.fill();
    cmx.strokeStyle = 'rgba(215,224,244,.16)'; cmx.lineWidth = 2;   // a quina que pega luz
    cmx.beginPath(); cmx.ellipse(MX, MY, rr, rr*.42, 0, Math.PI, TAU); cmx.stroke();
    cmx.strokeStyle = 'rgba(20,24,34,.55)'; cmx.lineWidth = 1.4;    // as juntas da cantaria
    for(let k=0; k<18; k++){
      const a = k/18*TAU;
      cmx.beginPath();
      cmx.moveTo(MX + Math.cos(a)*rr*.88, MY + Math.sin(a)*rr*.42*.88);
      cmx.lineTo(MX + Math.cos(a)*rr, MY + Math.sin(a)*rr*.42);
      cmx.stroke();
    }
  }
  cmx.save();
  cmx.beginPath(); cmx.arc(MX, MY, MR, 0, TAU); cmx.clip();
  // anéis concêntricos alternados
  const aros = [1, .82, .64, .46, .30];
  for(let i=0; i<aros.length; i++){
    cmx.fillStyle = (i%2 === 0) ? '#565c72' : '#6a7188';
    cmx.beginPath(); cmx.arc(MX, MY, MR*aros[i], 0, TAU); cmx.fill();
  }
  cmx.fillStyle = '#4e5468';
  cmx.beginPath(); cmx.arc(MX, MY, MR*.30, 0, TAU); cmx.fill();
  // juntas circulares entre os anéis
  cmx.strokeStyle = 'rgba(28,32,44,.6)'; cmx.lineWidth = 1.6;
  aros.forEach(a => { cmx.beginPath(); cmx.arc(MX, MY, MR*a, 0, TAU); cmx.stroke(); });
  // juntas radiais finas, desencontradas por anel
  cmx.strokeStyle = 'rgba(28,32,44,.45)'; cmx.lineWidth = 1.2;
  const raias = [24, 18, 12, 8];
  for(let b=0; b<4; b++){
    const r0 = MR*aros[b+1], r1 = MR*aros[b], n = raias[b], off = b*.35;
    for(let k=0; k<n; k++){
      const a = off + k*TAU/n;
      cmx.beginPath();
      cmx.moveTo(MX + Math.cos(a)*r0, MY + Math.sin(a)*r0);
      cmx.lineTo(MX + Math.cos(a)*r1, MY + Math.sin(a)*r1);
      cmx.stroke();
    }
  }
  // a estrela de 8 pontas no círculo central
  cmx.fillStyle = '#8a92aa';
  cmx.beginPath();
  for(let k=0; k<16; k++){
    const a = -Math.PI/2 + k*TAU/16, r = (k%2 === 0) ? MR*.26 : MR*.105;
    const sx = MX + Math.cos(a)*r, sy = MY + Math.sin(a)*r;
    k === 0 ? cmx.moveTo(sx, sy) : cmx.lineTo(sx, sy);
  }
  cmx.closePath(); cmx.fill();
  cmx.strokeStyle = 'rgba(30,34,48,.55)'; cmx.lineWidth = 1.2; cmx.stroke();
  cmx.fillStyle = '#565c72';
  cmx.beginPath(); cmx.arc(MX, MY, MR*.045, 0, TAU); cmx.fill();
  // desgaste: manchas, lascas e duas rachaduras velhas
  for(let ty=7; ty<=14; ty++) for(let tx=6; tx<=13; tx++){
    const h = rnd(tx, ty);
    if(h > .58){
      cmx.fillStyle = 'rgba(12,14,22,' + (.07 + h*.09) + ')';
      cmx.beginPath();
      cmx.ellipse((tx + .2 + h*.6)*T, (ty + .2 + rnd(ty,tx)*.6)*T, T*(.16 + h*.14), T*(.10 + h*.08), h*3, 0, TAU);
      cmx.fill();
    }
    if(h > .87){
      cmx.fillStyle = 'rgba(205,210,225,.10)';
      cmx.beginPath();
      cmx.moveTo((tx+.3)*T, (ty+.5)*T); cmx.lineTo((tx+.55)*T, (ty+.35)*T); cmx.lineTo((tx+.6)*T, (ty+.6)*T);
      cmx.closePath(); cmx.fill();
    }
  }
  cmx.strokeStyle = 'rgba(16,18,28,.5)'; cmx.lineWidth = 1.6;
  cmx.beginPath();
  cmx.moveTo(MX - MR*.9, MY + MR*.25);
  cmx.lineTo(MX - MR*.45, MY + MR*.42); cmx.lineTo(MX - MR*.28, MY + MR*.74);
  cmx.stroke();
  cmx.beginPath();
  cmx.moveTo(MX + MR*.55, MY - MR*.78);
  cmx.lineTo(MX + MR*.7, MY - MR*.4); cmx.lineTo(MX + MR*.94, MY - MR*.22);
  cmx.stroke();
  cmx.restore();
  // aro externo de cantaria fechando o círculo
  cmx.strokeStyle = 'rgba(120,128,152,.5)'; cmx.lineWidth = 2.2;
  cmx.beginPath(); cmx.arc(MX, MY, MR, 0, TAU); cmx.stroke();

  /* ---- o velório, no centro do mosaico: o caixão em si é a aquarela recortada,
     assentada no passe das imagens; aqui ficam só as coroas e as pétalas, todas
     por fora da pegada dele para não sumirem debaixo do desenho ---- */
  {
    const ex = MX, ey = MY;

    /* coroas de flores grandes, de pé em volta do caixão */
    const coroa = (cx3, cy3, raio, girada, cores) => {
      cmx.save(); cmx.translate(cx3, cy3); cmx.rotate(girada);
      cmx.fillStyle = 'rgba(0,0,0,.3)';                         // a sombra do arranjo
      cmx.beginPath(); cmx.ellipse(raio*.1, raio*.5, raio*1.05, raio*.3, 0, 0, TAU); cmx.fill();
      cmx.strokeStyle = '#3f5236';                              // a trança de folhagem
      cmx.lineWidth = Math.max(2.4, raio*.42);
      cmx.beginPath(); cmx.ellipse(0, 0, raio, raio*.72, 0, 0, TAU); cmx.stroke();
      cmx.strokeStyle = 'rgba(120,150,104,.5)';
      cmx.lineWidth = Math.max(1, raio*.14);
      cmx.beginPath(); cmx.ellipse(0, -raio*.08, raio*.98, raio*.66, 0, 0, TAU); cmx.stroke();
      for(let k=0; k<11; k++){                                  // as flores presas na coroa
        const a = k/11*TAU + girada*2;
        const fx = Math.cos(a)*raio, fy = Math.sin(a)*raio*.72;
        const c = cores[k % cores.length];
        cmx.fillStyle = c;
        cmx.beginPath(); cmx.ellipse(fx, fy, raio*.2, raio*.16, a, 0, TAU); cmx.fill();
        cmx.fillStyle = 'rgba(255,250,225,.5)';                 // o miolo claro
        cmx.beginPath(); cmx.arc(fx, fy, Math.max(.8, raio*.06), 0, TAU); cmx.fill();
      }
      cmx.restore();
    };
    const BRANCAS = ['#e6e2d4','#d8d2c2','#cfd8d0'];
    const ROXAS   = ['#8f7fa8','#b09ec0','#e6e2d4'];
    const SECAS   = ['#b8a075','#cbb489','#9c8a6a'];
    coroa(ex - T*2.15, ey + T*.55, T*.42, -.12, ROXAS);          // de pé, à cabeceira
    coroa(ex + T*2.15, ey + T*.50, T*.40, .18, BRANCAS);         // de pé, aos pés
    coroa(ex - T*.85, ey + T*1.60, T*.34, .35, SECAS);           // encostadas na frente do caixão
    coroa(ex + T*.90, ey + T*1.65, T*.32, -.28, ROXAS);
    /* pétalas caídas no mosaico, à frente do caixão */
    for(let k=0; k<26; k++){
      const h = rnd(k*3.7, k*8.1), a = h*TAU, d = T*(1.2 + rnd(k, k*2)*1.6);
      cmx.fillStyle = ['rgba(230,226,212,.5)','rgba(176,158,192,.45)','rgba(203,180,137,.4)'][k % 3];
      cmx.beginPath();
      cmx.ellipse(ex + Math.cos(a)*d, ey + Math.sin(a)*d*.5 + T*1.05, T*.055, T*.03, a, 0, TAU);
      cmx.fill();
    }
  }

  /* ---- fileiras de bancos de madeira, de frente para o esquife ---- */
  const banco = (bx, by, virado) => {         // virado: +1 encara o leste, -1 o oeste
    const px = bx*T, py = by*T, w = T*.56, alt = T*1.5, fh = T*.24, enc = T*.15;
    cmx.fillStyle = 'rgba(0,0,0,.30)';
    cmx.beginPath(); cmx.ellipse(px + T*.05, py + alt + T*.03, w*.64, T*.11, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#2a231b';                                  // os pés
    cmx.fillRect(px - w/2 + 1, py + alt - T*.1, T*.1, T*.12);
    cmx.fillRect(px + w/2 - T*.1 - 1, py + alt - T*.1, T*.1, T*.12);
    cmx.fillStyle = '#584a3a';                                  // o tampo, iluminado
    cmx.fillRect(px - w/2, py, w, alt - fh);
    cmx.fillStyle = 'rgba(205,212,230,.10)';
    cmx.fillRect(px - w/2, py, w, 3);
    cmx.strokeStyle = 'rgba(24,18,12,.4)'; cmx.lineWidth = 1.2; // os veios
    cmx.beginPath(); cmx.moveTo(px - w*.16, py + 2); cmx.lineTo(px - w*.16, py + alt - fh - 2); cmx.stroke();
    cmx.beginPath(); cmx.moveTo(px + w*.2, py + 2); cmx.lineTo(px + w*.2, py + alt - fh - 2); cmx.stroke();
    cmx.fillStyle = '#332b21';                                  // a face frontal (o topo do encosto ao sul)
    cmx.fillRect(px - w/2, py + alt - fh, w, fh);
    cmx.fillStyle = 'rgba(0,0,0,.35)';
    cmx.fillRect(px - w/2, py + alt - fh, w, 2);
    const ex2 = (virado > 0) ? px - w/2 : px + w/2 - enc;       // o encosto, de costas para a parede
    cmx.fillStyle = '#4e4234';
    cmx.fillRect(ex2, py - T*.05, enc, alt - fh + T*.05);
    cmx.fillStyle = 'rgba(210,216,232,.13)';
    cmx.fillRect(ex2, py - T*.05, enc, 2.5);
    cmx.fillStyle = 'rgba(0,0,0,.2)';                           // a sombra do encosto no assento
    cmx.fillRect((virado > 0) ? ex2 + enc : ex2 - T*.07, py, T*.07, alt - fh);
  };
  [6.8, 9.2, 11.9].forEach(fy => {
    banco(3.85, fy, 1);  banco(5.35, fy, 1);                    // flanco oeste encara o leste
    banco(14.05, fy, -1); banco(15.5, fy, -1);                  // flanco leste encara o oeste
  });

  /* ---- castiçais altos nos cantos do mosaico (sem chama: as velas esperam) ---- */
  const castical = (cx2, cy2) => {
    const px = cx2*T, py = cy2*T;
    cmx.fillStyle = 'rgba(0,0,0,.32)';
    cmx.beginPath(); cmx.ellipse(px + 2, py + T*.05, T*.16, T*.055, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#3c3850';                                  // a base
    cmx.beginPath(); cmx.ellipse(px, py, T*.13, T*.05, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#434060';                                  // a haste
    cmx.fillRect(px - T*.03, py - T*.62, T*.06, T*.62);
    cmx.fillStyle = 'rgba(190,200,225,.28)';
    cmx.fillRect(px - T*.03, py - T*.62, 1.6, T*.62);
    cmx.fillStyle = '#4a4660';                                  // o prato
    cmx.beginPath(); cmx.ellipse(px, py - T*.62, T*.10, T*.038, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = 'rgba(255,190,110,.30)';                    // o reflexo âmbar no metal
    cmx.beginPath(); cmx.ellipse(px - T*.04, py - T*.63, T*.025, T*.012, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#d8d2c0';                                  // a vela apagada
    cmx.fillRect(px - T*.035, py - T*.86, T*.07, T*.24);
    cmx.beginPath(); cmx.ellipse(px + T*.045, py - T*.72, T*.02, T*.05, .3, 0, TAU); cmx.fill();   // pingos de cera
    cmx.beginPath(); cmx.ellipse(px - T*.05, py - T*.78, T*.016, T*.04, -.3, 0, TAU); cmx.fill();
    cmx.fillStyle = '#2a2530';                                  // o pavio morto
    cmx.fillRect(px - 1, py - T*.9, 2, 4);
  };
  castical(7.7, 8.35); castical(11.3, 8.35);
  castical(7.7, 12.75); castical(11.3, 12.75);

  /* ---- pias de água benta junto às entradas da capela ---- */
  const pia = (cx2, cy2) => {
    const px = cx2*T, py = cy2*T;
    cmx.fillStyle = 'rgba(0,0,0,.30)';
    cmx.beginPath(); cmx.ellipse(px + 2, py + T*.04, T*.2, T*.07, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#565c72';                                  // a coluna
    cmx.fillRect(px - T*.07, py - T*.34, T*.14, T*.36);
    cmx.fillStyle = 'rgba(0,0,0,.25)';
    cmx.fillRect(px + T*.02, py - T*.34, T*.05, T*.36);
    cmx.fillStyle = '#6a7188';                                  // a bacia
