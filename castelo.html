    cmx.beginPath(); cmx.ellipse(px, py - T*.38, T*.19, T*.08, 0, 0, TAU); cmx.fill();
    cmx.strokeStyle = 'rgba(24,28,40,.6)'; cmx.lineWidth = 1.3;
    cmx.beginPath(); cmx.ellipse(px, py - T*.38, T*.19, T*.08, 0, 0, TAU); cmx.stroke();
    cmx.fillStyle = '#232a3c';                                  // a água parada
    cmx.beginPath(); cmx.ellipse(px, py - T*.38, T*.14, T*.055, 0, 0, TAU); cmx.fill();
    cmx.strokeStyle = 'rgba(150,190,230,.30)'; cmx.lineWidth = 1;
    cmx.beginPath(); cmx.ellipse(px - T*.03, py - T*.39, T*.06, T*.02, 0, 0, TAU); cmx.stroke();
  };
  pia(16.3, 8.1);                                               // junto à porta da preparação
  pia(7.1, 15.7);                                               // junto à descida do salão

  /* ================= SALA DE PREPARAÇÃO ================= */
  /* ---- as duas mesas de pedra mortuárias ---- */
  const mesaMort = (cx2, cy2, corpo) => {
    const px = cx2*T, py = cy2*T, w = T*2.2, d = T*.78, fh = T*.4;
    cmx.fillStyle = 'rgba(0,0,0,.35)';
    cmx.beginPath(); cmx.ellipse(px + T*.05, py + d/2 + fh + T*.04, w*.55, T*.13, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#3f4454';                                  // a face frontal
    cmx.fillRect(px - w/2, py + d/2, w, fh);
    cmx.fillStyle = 'rgba(0,0,0,.3)';
    cmx.fillRect(px - w/2, py + d/2 + fh - 3, w, 3);
    cmx.strokeStyle = 'rgba(16,18,28,.55)'; cmx.lineWidth = 1.4; // juntas da cantaria
    cmx.beginPath(); cmx.moveTo(px - w*.17, py + d/2); cmx.lineTo(px - w*.17, py + d/2 + fh); cmx.stroke();
    cmx.beginPath(); cmx.moveTo(px + w*.17, py + d/2); cmx.lineTo(px + w*.17, py + d/2 + fh); cmx.stroke();
    cmx.fillStyle = '#7a8098';                                  // o tampo, laje fria iluminada
    cmx.fillRect(px - w/2, py - d/2, w, d);
    cmx.fillStyle = 'rgba(220,228,245,.16)';
    cmx.fillRect(px - w/2, py - d/2, w, 3);
    cmx.strokeStyle = 'rgba(18,22,32,.6)'; cmx.lineWidth = 1.6;
    cmx.strokeRect(px - w/2 + 1, py - d/2 + 1, w - 2, d - 2);
    cmx.strokeStyle = 'rgba(18,22,32,.75)'; cmx.lineWidth = 2.2; // a canaleta de escoamento
    cmx.strokeRect(px - w/2 + T*.13, py - d/2 + T*.11, w - T*.26, d - T*.22);
    cmx.fillStyle = '#12161f';                                  // o furo do escoamento
    cmx.beginPath(); cmx.arc(px + w/2 - T*.2, py + d/2 - T*.13, T*.05, 0, TAU); cmx.fill();
    cmx.fillStyle = 'rgba(18,22,30,.5)';                        // e o escorrido na face
    cmx.fillRect(px + w/2 - T*.23, py + d/2, T*.06, fh*.8);
    if(corpo){
      cmx.fillStyle = '#c9c4b8';                                // a mortalha sobre alguém
      cmx.beginPath(); cmx.ellipse(px - w*.31, py, T*.12, T*.13, 0, 0, TAU); cmx.fill();
      cmx.beginPath(); cmx.ellipse(px + T*.06, py, w*.33, T*.14, 0, 0, TAU); cmx.fill();
      cmx.beginPath(); cmx.ellipse(px + w*.36, py, T*.11, T*.09, 0, 0, TAU); cmx.fill();
      cmx.strokeStyle = 'rgba(120,116,104,.55)'; cmx.lineWidth = 1.2;
      for(let k=0; k<3; k++){
        const dx = px - T*.25 + k*T*.33;
        cmx.beginPath(); cmx.moveTo(dx, py - T*.1); cmx.quadraticCurveTo(dx + T*.05, py, dx - T*.02, py + T*.1); cmx.stroke();
      }
      cmx.fillStyle = 'rgba(60,64,88,.2)';
      cmx.beginPath(); cmx.ellipse(px + T*.06, py + T*.06, w*.33, T*.07, 0, 0, TAU); cmx.fill();
    } else {
      for(let k=0; k<4; k++){                                   // as manchas de quem já passou por ela
        const h = rnd(cx2*7 + k, cy2*3);
        cmx.fillStyle = (k === 1) ? 'rgba(52,16,22,.45)' : 'rgba(14,13,24,' + (.32 + h*.2) + ')';
        cmx.beginPath();
        cmx.ellipse(px - w*.3 + h*w*.6, py - d*.2 + rnd(k,cy2)*d*.4, T*(.09 + h*.11), T*(.04 + h*.04), h*3, 0, TAU);
        cmx.fill();
      }
    }
  };
  mesaMort(21.4, 8.4, false);   // o corpo em preparo é pintado no passe 5, com a cabeça recortada
  mesaMort(24.9, 10.6, false);

  /* ---- prateleiras na parede norte: o enxoval do ofício ---- */
  const pratY = [4.34, 4.74];
  pratY.forEach(sy => {
    cmx.fillStyle = '#4a4030';
    cmx.fillRect(19.15*T, sy*T, 7.7*T, T*.09);
    cmx.fillStyle = 'rgba(210,216,232,.14)';
    cmx.fillRect(19.15*T, sy*T, 7.7*T, 1.6);
    cmx.fillStyle = 'rgba(0,0,0,.3)';
    cmx.fillRect(19.15*T, (sy + .09)*T, 7.7*T, 2);
  });
  for(let n=0; n<2; n++){
    const sy = pratY[n];
    for(let k=0; k<14; k++){
      const ix2 = 19.5 + k*.53;
      if(Math.abs(ix2 - 21) < .38 || Math.abs(ix2 - 24) < .38) continue;   // as correntes penduradas passam aqui
      const h = rnd(k*3 + n, 17 + n), px = ix2*T, base = sy*T;
      const tipo = (((k/2)|0)%2)*2 + ((h*2)|0);                 // vizinhos nunca repetem o padrão
      if(tipo === 0){                                           // frasco de vidro
        cmx.fillStyle = ['#7f95a8','#6d8898','#8aa0b2'][(h*3)|0];
        cmx.fillRect(px - T*.05, base - T*.2, T*.1, T*.2);
        cmx.fillStyle = '#55606c';
        cmx.fillRect(px - T*.025, base - T*.26, T*.05, T*.06);
        cmx.fillStyle = 'rgba(230,240,250,.4)';
        cmx.fillRect(px - T*.04, base - T*.18, T*.025, T*.14);
      } else if(tipo === 1){                                    // bacia de cobre emborcada
        cmx.fillStyle = '#8a5f3c';
        cmx.beginPath(); cmx.ellipse(px, base - T*.07, T*.12, T*.07, 0, 0, TAU); cmx.fill();
        cmx.fillStyle = 'rgba(255,200,130,.3)';
        cmx.beginPath(); cmx.ellipse(px - T*.04, base - T*.1, T*.04, T*.02, 0, 0, TAU); cmx.fill();
      } else if(tipo === 2){                                    // panos dobrados
        cmx.fillStyle = '#9a95a5'; cmx.fillRect(px - T*.11, base - T*.08, T*.22, T*.08);
        cmx.fillStyle = '#7d7888'; cmx.fillRect(px - T*.09, base - T*.14, T*.18, T*.06);
        cmx.strokeStyle = 'rgba(40,38,52,.5)'; cmx.lineWidth = 1;
        cmx.beginPath(); cmx.moveTo(px - T*.11, base - T*.08); cmx.lineTo(px + T*.11, base - T*.08); cmx.stroke();
      } else {                                                  // a tesoura do amortalhador
        cmx.strokeStyle = '#a8b0bc'; cmx.lineWidth = 1.4;
        cmx.beginPath(); cmx.moveTo(px - T*.07, base - T*.03); cmx.lineTo(px + T*.06, base - T*.16); cmx.stroke();
        cmx.beginPath(); cmx.moveTo(px + T*.06, base - T*.03); cmx.lineTo(px - T*.07, base - T*.16); cmx.stroke();
        cmx.beginPath(); cmx.arc(px - T*.075, base - T*.025, T*.02, 0, TAU); cmx.stroke();
        cmx.beginPath(); cmx.arc(px + T*.065, base - T*.025, T*.02, 0, TAU); cmx.stroke();
      }
    }
  }
  /* trapos pendurados na beira da prateleira de baixo */
  [[20.3, .9], [25.7, 1.1]].forEach(([tx, esc]) => {
    const px = tx*T, ty = 4.83*T, ca = T*.34*esc;
    cmx.fillStyle = '#8d8896';
    cmx.beginPath();
    cmx.moveTo(px - T*.09, ty);
    cmx.lineTo(px + T*.09, ty);
    cmx.lineTo(px + T*.11, ty + ca*.7);
    cmx.lineTo(px + T*.04, ty + ca*.55);
    cmx.lineTo(px + T*.01, ty + ca);
    cmx.lineTo(px - T*.06, ty + ca*.65);
    cmx.lineTo(px - T*.11, ty + ca*.85);
    cmx.closePath(); cmx.fill();
    cmx.strokeStyle = 'rgba(60,56,74,.6)'; cmx.lineWidth = 1;
    cmx.beginPath(); cmx.moveTo(px - T*.02, ty); cmx.lineTo(px - T*.03, ty + ca*.8); cmx.stroke();
  });

  /* ---- baldes e a bacia grande, largados no chão ---- */
  const balde = (cx2, cy2) => {
    const px = cx2*T, py = cy2*T;
    cmx.fillStyle = 'rgba(0,0,0,.3)';
    cmx.beginPath(); cmx.ellipse(px + 2, py + T*.14, T*.18, T*.06, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#4c5262';
    cmx.beginPath();
    cmx.moveTo(px - T*.15, py - T*.16); cmx.lineTo(px + T*.15, py - T*.16);
    cmx.lineTo(px + T*.11, py + T*.13); cmx.lineTo(px - T*.11, py + T*.13);
    cmx.closePath(); cmx.fill();
    cmx.fillStyle = 'rgba(18,22,30,.5)';                        // os arcos de ferro
    cmx.fillRect(px - T*.145, py - T*.1, T*.29, 2);
    cmx.fillRect(px - T*.12, py + T*.04, T*.24, 2);
    cmx.fillStyle = 'rgba(205,212,230,.14)';
    cmx.fillRect(px - T*.13, py - T*.15, T*.05, T*.26);
    cmx.strokeStyle = '#6a7188'; cmx.lineWidth = 1.4;           // a alça
    cmx.beginPath(); cmx.arc(px, py - T*.15, T*.13, Math.PI, TAU); cmx.stroke();
    cmx.fillStyle = '#232a3c';                                  // a boca
    cmx.beginPath(); cmx.ellipse(px, py - T*.16, T*.15, T*.05, 0, 0, TAU); cmx.fill();
  };
  balde(19.8, 12.3); balde(26.4, 12.5);
  {                                                             // a bacia grande de lavar os mortos
    const px = 22.7*T, py = 12.4*T;
    cmx.fillStyle = 'rgba(0,0,0,.32)';
    cmx.beginPath(); cmx.ellipse(px + 2, py + T*.08, T*.52, T*.18, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#8a5f3c';                                  // o cobre
    cmx.beginPath(); cmx.ellipse(px, py, T*.5, T*.2, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = 'rgba(255,200,130,.22)';
    cmx.beginPath(); cmx.ellipse(px - T*.18, py - T*.06, T*.13, T*.04, .2, 0, TAU); cmx.fill();
    cmx.fillStyle = '#262e3e';                                  // a água já usada
    cmx.beginPath(); cmx.ellipse(px, py, T*.4, T*.145, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = 'rgba(90,40,40,.28)';
    cmx.beginPath(); cmx.ellipse(px + T*.1, py + T*.02, T*.18, T*.06, .4, 0, TAU); cmx.fill();
    cmx.strokeStyle = 'rgba(150,190,230,.25)'; cmx.lineWidth = 1;
    cmx.beginPath(); cmx.ellipse(px - T*.08, py - T*.03, T*.1, T*.03, 0, 0, TAU); cmx.stroke();
  }
}

/* -- passe 3: oficina de caixões + depósito + colombário -- */
function pintarFunOficinaColombario(cmx, T){
  const W = FUN.LARG, H = FUN.ALT;
  const rnd = (x,y) => hash(x*5.31 + 17.3, y*7.77 + 5.1);
  const anda3 = v => v === CHAO || v === CHAO2 || v === PONTE;
  const chaoEm = (x,y) => x>=0 && y>=0 && x<W && y<H && anda3(mapa[y*W+x]);
  const paredeEm = (x,y) => x>=0 && y>=0 && x<W && y<H && mapa[y*W+x] === PAREDE;
  const sombraCh = (cx, cy, rx, ry, a) => {            // sombra elíptica no chão
    cmx.fillStyle = 'rgba(0,0,0,' + a + ')';
    cmx.beginPath(); cmx.ellipse(cx*T, cy*T, rx*T, ry*T, 0, 0, TAU); cmx.fill();
  };

  /* ============ OFICINA DE CAIXÕES (x3..11, y31..41), a metade da obra ============
     A leitura do cômodo: bancada junto à parede, caixões em três estados de
     obra (fundo em ripas, meio montado sobre cavaletes, pronto de pé) e
     serragem clara espalhada — a marca de trabalho recente. */

  /* serragem no chão, por baixo dos móveis */
  [[4.3,32.7],[5.9,33.2],[7.5,32.5],[6.4,34.9],[9.1,33.5],[10.3,35.1],[4.7,34.2],[8.2,33.9]]
  .forEach(([sx,sy]) => {
    const h = rnd(sx*3.1, sy*2.7);
    cmx.fillStyle = 'rgba(198,184,150,' + (.14 + h*.1) + ')';
    cmx.beginPath();
    cmx.ellipse(sx*T, sy*T, T*(.28 + h*.3), T*(.13 + h*.12), h*3.1, 0, TAU); cmx.fill();
    cmx.fillStyle = 'rgba(216,200,162,.5)';
    for(let k=0; k<6; k++){
      const g1 = rnd(sx*7 + k, sy*9 - k), g2 = rnd(sy*5 + k, sx*4 + k);
      cmx.fillRect(sx*T + (g1 - .5)*T*.8, sy*T + (g2 - .5)*T*.34, 1.5, 1.5);
    }
  });

  /* bancada de carpinteiro encostada na parede norte (a oeste da porta) */
  {
    const x0 = 3.15*T, x1 = 5.9*T, yT0 = 30.95*T, tampoH = T*.58, faceH = T*.44;
    sombraCh(4.53, 32.05, 1.42, .12, .3);
    // face frontal sombreada, em tábuas
    cmx.fillStyle = '#3f3629'; cmx.fillRect(x0, yT0 + tampoH, x1 - x0, faceH);
    cmx.fillStyle = 'rgba(0,0,0,.3)'; cmx.fillRect(x0, yT0 + tampoH, x1 - x0, T*.06);
    cmx.strokeStyle = 'rgba(14,10,6,.6)'; cmx.lineWidth = 1.4;
    for(let k=1; k<4; k++){
      const jx = x0 + k*(x1 - x0)/4;
      cmx.beginPath(); cmx.moveTo(jx, yT0 + tampoH); cmx.lineTo(jx, yT0 + tampoH + faceH); cmx.stroke();
    }
    cmx.fillStyle = '#332b20';                          // pés
    cmx.fillRect(x0 + T*.08, yT0 + tampoH + faceH - T*.06, T*.16, T*.1);
    cmx.fillRect(x1 - T*.24, yT0 + tampoH + faceH - T*.06, T*.16, T*.1);
    // tampo de madeira clara, iluminado
    cmx.fillStyle = '#7d6f52'; cmx.fillRect(x0, yT0, x1 - x0, tampoH);
    cmx.fillStyle = 'rgba(235,240,250,.14)'; cmx.fillRect(x0, yT0, x1 - x0, 2.2);
    // veios da madeira
    cmx.strokeStyle = 'rgba(58,46,30,.4)'; cmx.lineWidth = 1.1;
    for(let k=0; k<3; k++){
      const vy = yT0 + tampoH*(.28 + k*.24);
      cmx.beginPath(); cmx.moveTo(x0 + 2, vy);
      cmx.quadraticCurveTo((x0 + x1)/2, vy + (k%2 ? 2.4 : -2.4), x1 - 2, vy);
      cmx.stroke();
    }
    [[.22,.4],[.62,.62],[.85,.3]].forEach(([fx,fy]) => { // nós
      cmx.strokeStyle = 'rgba(58,46,30,.5)';
      cmx.beginPath(); cmx.ellipse(x0 + (x1-x0)*fx, yT0 + tampoH*fy, T*.05, T*.028, .4, 0, TAU); cmx.stroke();
    });
    // marcas de serra: feixes de riscos paralelos no tampo
    [[.3,.34],[.52,.7],[.76,.45]].forEach(([fx,fy]) => {
      cmx.strokeStyle = 'rgba(40,30,18,.45)'; cmx.lineWidth = 1;
      for(let k=0; k<4; k++){
        const mx = x0 + (x1-x0)*fx + k*2.6;
        cmx.beginPath(); cmx.moveTo(mx, yT0 + tampoH*fy - T*.07);
        cmx.lineTo(mx - T*.05, yT0 + tampoH*fy + T*.07); cmx.stroke();
      }
    });
    // a morsa de ferro na ponta oeste
    cmx.fillStyle = '#39404c'; cmx.fillRect(x0 + T*.12, yT0 - T*.1, T*.3, T*.16);
    cmx.fillStyle = '#262b34'; cmx.fillRect(x0 + T*.2, yT0 - T*.2, T*.14, T*.12);
    cmx.fillStyle = 'rgba(214,222,238,.2)'; cmx.fillRect(x0 + T*.12, yT0 - T*.1, T*.3, 1.4);
    // uma ripa clara atravessada sobre o tampo, recém-serrada
    cmx.save();
    cmx.translate(x0 + (x1-x0)*.6, yT0 + tampoH*.42); cmx.rotate(-.12);
    cmx.fillStyle = '#8a7a58'; cmx.fillRect(-T*.8, -T*.07, T*1.6, T*.14);
    cmx.fillStyle = 'rgba(0,0,0,.22)'; cmx.fillRect(-T*.8, T*.03, T*1.6, T*.04);
    cmx.restore();
  }

  /* ferramentas penduradas na face da parede norte, a leste da porta */
  const pPino = (px, py) => {
    cmx.fillStyle = '#20242e'; cmx.beginPath(); cmx.arc(px, py, T*.03, 0, TAU); cmx.fill();
  };
  { // serrote
    const px = 8.25*T, py = 30.18*T;
    pPino(px, py);
    cmx.fillStyle = '#1f1b14'; cmx.fillRect(px - T*.05, py + T*.02, T*.1, T*.15);
    cmx.fillStyle = '#59606e';
    cmx.beginPath();
    cmx.moveTo(px - T*.09, py + T*.17); cmx.lineTo(px + T*.09, py + T*.17);
    cmx.lineTo(px + T*.03, py + T*.68); cmx.lineTo(px - T*.05, py + T*.68);
    cmx.closePath(); cmx.fill();
    cmx.strokeStyle = 'rgba(10,8,6,.6)'; cmx.lineWidth = 1;   // os dentes
    cmx.beginPath();
    for(let k=0; k<6; k++){
      cmx.moveTo(px + T*.09 - k*T*.012, py + T*(.21 + k*.08));
      cmx.lineTo(px + T*.115 - k*T*.012, py + T*(.25 + k*.08));
    }
    cmx.stroke();
  }
  { // martelo
    const px = 8.9*T, py = 30.18*T;
    pPino(px, py);
    cmx.fillStyle = '#2a241a'; cmx.fillRect(px - T*.035, py + T*.06, T*.07, T*.5);
    cmx.fillStyle = '#454c58'; cmx.fillRect(px - T*.16, py + T*.1, T*.32, T*.13);
    cmx.fillStyle = 'rgba(210,220,235,.2)'; cmx.fillRect(px - T*.16, py + T*.1, T*.32, T*.035);
  }
  { // formão
    const px = 9.45*T, py = 30.2*T;
    pPino(px, py);
    cmx.fillStyle = '#2a241a'; cmx.fillRect(px - T*.045, py + T*.05, T*.09, T*.22);
    cmx.fillStyle = '#59606e';
    cmx.beginPath();
    cmx.moveTo(px - T*.035, py + T*.27); cmx.lineTo(px + T*.035, py + T*.27);
    cmx.lineTo(px + T*.02, py + T*.55); cmx.lineTo(px - T*.02, py + T*.55);
    cmx.closePath(); cmx.fill();
  }
  { // compasso de carpinteiro
    const px = 9.85*T, py = 30.18*T;
    pPino(px, py);
    cmx.strokeStyle = '#454c58'; cmx.lineWidth = Math.max(1.6, T*.05);
    cmx.beginPath(); cmx.moveTo(px, py + T*.08); cmx.lineTo(px - T*.13, py + T*.6); cmx.stroke();
    cmx.beginPath(); cmx.moveTo(px, py + T*.08); cmx.lineTo(px + T*.13, py + T*.6); cmx.stroke();
    cmx.fillStyle = '#20242e'; cmx.beginPath(); cmx.arc(px, py + T*.1, T*.045, 0, TAU); cmx.fill();
  }

  /* caixão PRONTO, de pé, encostado na parede (canto nordeste) */
  {
    sombraCh(10.5, 32.32, .42, .11, .35);
    cmx.save(); cmx.translate(10.45*T, 32.28*T); cmx.rotate(-.05);
    const casco = [[-.17,-2.06],[.17,-2.06],[.4,-1.44],[.25,0],[-.25,0],[-.4,-1.44]];
    const gC = cmx.createLinearGradient(-T*.4, 0, T*.4, 0);
    gC.addColorStop(0, '#5e5240'); gC.addColorStop(.55, '#4e4234'); gC.addColorStop(1, '#352c21');
    cmx.fillStyle = gC;
    cmx.beginPath();
    casco.forEach(([fx,fy],i) => i ? cmx.lineTo(fx*T, fy*T) : cmx.moveTo(fx*T, fy*T));
    cmx.closePath(); cmx.fill();
    cmx.strokeStyle = '#191510'; cmx.lineWidth = 1.6; cmx.stroke();
    // o friso da tampa
    cmx.strokeStyle = 'rgba(20,14,8,.55)'; cmx.lineWidth = 1.2;
    cmx.beginPath();
    [[-.11,-1.94],[.11,-1.94],[.3,-1.44],[.18,-.1],[-.18,-.1],[-.3,-1.44]].forEach(([fx,fy],i) =>
      i ? cmx.lineTo(fx*T, fy*T) : cmx.moveTo(fx*T, fy*T));
    cmx.closePath(); cmx.stroke();
    // a cruz entalhada, num brilho frio
    cmx.fillStyle = 'rgba(214,222,238,.14)';
    cmx.fillRect(-T*.025, -T*1.7, T*.05, T*.9);
    cmx.fillRect(-T*.14, -T*1.5, T*.28, T*.05);
    cmx.restore();
  }

  /* caixão MEIO MONTADO, deitado sobre dois cavaletes */
  const pCavalete = (tx, ty) => {
    const px = tx*T, py = ty*T;
    sombraCh(tx, ty + .04, .28, .07, .3);
    cmx.strokeStyle = '#3a3226'; cmx.lineWidth = Math.max(2, T*.08); cmx.lineCap = 'round';
    cmx.beginPath(); cmx.moveTo(px - T*.2, py); cmx.lineTo(px, py - T*.5); cmx.stroke();
    cmx.beginPath(); cmx.moveTo(px + T*.2, py); cmx.lineTo(px, py - T*.5); cmx.stroke();
    cmx.lineCap = 'butt';
    cmx.strokeStyle = 'rgba(10,8,6,.5)'; cmx.lineWidth = Math.max(1.2, T*.04);
    cmx.beginPath(); cmx.moveTo(px - T*.11, py - T*.22); cmx.lineTo(px + T*.11, py - T*.22); cmx.stroke();
    cmx.fillStyle = '#4e4234'; cmx.fillRect(px - T*.15, py - T*.56, T*.3, T*.09);
  };
  pCavalete(7.6, 35.0); pCavalete(9.0, 35.0);
  {
    const cy = 34.35;
    sombraCh(8.3, 35.08, .95, .1, .25);
    // casco por fora (afunilado no pé, ombro largo)
    cmx.fillStyle = '#5a4a3a';
    cmx.beginPath();
    [[7.2,-.18],[8.55,-.3],[9.35,-.2],[9.35,.2],[8.55,.3],[7.2,.18]].forEach(([fx,fy],i) =>
      i ? cmx.lineTo(fx*T, (cy+fy)*T) : cmx.moveTo(fx*T, (cy+fy)*T));
    cmx.closePath(); cmx.fill();
    cmx.strokeStyle = '#171310'; cmx.lineWidth = 1.6; cmx.stroke();
    // o vão aberto, ainda sem tampa
    cmx.fillStyle = '#211b14';
    cmx.beginPath();
    [[7.32,-.1],[8.55,-.2],[9.23,-.12],[9.23,.12],[8.55,.2],[7.32,.1]].forEach(([fx,fy],i) =>
      i ? cmx.lineTo(fx*T, (cy+fy)*T) : cmx.moveTo(fx*T, (cy+fy)*T));
    cmx.closePath(); cmx.fill();
    // costelas da estrutura à vista
    cmx.strokeStyle = 'rgba(138,122,88,.5)'; cmx.lineWidth = 1.2;
    [7.65,8.1,8.55,8.95].forEach(rx => {
      cmx.beginPath(); cmx.moveTo(rx*T, (cy - .16)*T); cmx.lineTo(rx*T, (cy + .16)*T); cmx.stroke();
    });
    // luz fria na borda norte
    cmx.strokeStyle = 'rgba(228,233,246,.16)'; cmx.lineWidth = 1.4;
    cmx.beginPath();
    cmx.moveTo(7.22*T, (cy - .17)*T); cmx.lineTo(8.55*T, (cy - .29)*T); cmx.lineTo(9.33*T, (cy - .19)*T);
    cmx.stroke();
  }

  /* só o FUNDO EM RIPAS, deitado no chão — o começo de um caixão */
  {
    cmx.save(); cmx.translate(4.7*T, 34.9*T); cmx.rotate(.16);
    cmx.fillStyle = '#26211a';
    cmx.beginPath();
    [[-.2,-.72],[.2,-.72],[.3,-.4],[.19,.7],[-.19,.7],[-.3,-.4]].forEach(([fx,fy],i) =>
      i ? cmx.lineTo(fx*T, fy*T) : cmx.moveTo(fx*T, fy*T));
    cmx.closePath(); cmx.fill();
    cmx.strokeStyle = '#141110'; cmx.lineWidth = 1.4; cmx.stroke();
    // as ripas atravessadas, com os vãos escuros entre elas
    [[-.58,.4],[-.3,.56],[-.02,.5],[.26,.44],[.54,.36]].forEach(([ry,lar]) => {
      cmx.fillStyle = '#5a4a3a';
      cmx.fillRect(-lar*T/2, (ry - .09)*T, lar*T, T*.18);
      cmx.fillStyle = 'rgba(228,233,246,.1)';
      cmx.fillRect(-lar*T/2, (ry - .09)*T, lar*T, 1.2);
    });
    cmx.restore();
  }

  /* ============ O FUNDO DO MESMO SALÃO (y37..41), a metade do material ============
     Sem divisória: a obra vira estoque sem porta no meio — pilhas de tábuas,
     caixas de pregos e cordas esperando a vez. */

  const pPilha = (x0, x1, yBase, nCam) => {
    const faceH = nCam*.15, topoH = .26, yF = (yBase - faceH)*T;
    sombraCh((x0 + x1)/2, yBase + .05, (x1 - x0)*.52, .11, .32);
    for(let k=0; k<nCam; k++){          // a face: tábuas empilhadas
      const ty = yF + k*.15*T;
      cmx.fillStyle = k%2 ? '#463b2c' : '#4e4234';
      cmx.fillRect(x0*T, ty, (x1 - x0)*T, .15*T);
      cmx.fillStyle = 'rgba(233,238,248,.07)'; cmx.fillRect(x0*T, ty, (x1 - x0)*T, 1.4);
      cmx.fillStyle = 'rgba(0,0,0,.3)'; cmx.fillRect(x0*T, ty + .15*T - 1.4, (x1 - x0)*T, 1.4);
      cmx.fillStyle = '#8a7a58';        // o topo serrado das tábuas, na cabeceira
      cmx.fillRect(x1*T - T*.07, ty + 1, T*.07, .15*T - 2);
    }
    // superfície de cima, iluminada, tábuas ao comprido
    cmx.fillStyle = '#6c5d43'; cmx.fillRect(x0*T, yF - topoH*T, (x1 - x0)*T, topoH*T);
    cmx.fillStyle = 'rgba(235,240,250,.12)'; cmx.fillRect(x0*T, yF - topoH*T, (x1 - x0)*T, 2);
    cmx.strokeStyle = 'rgba(40,30,18,.5)'; cmx.lineWidth = 1.1;
    for(let k=1; k<3; k++){
      cmx.beginPath(); cmx.moveTo(x0*T, yF - topoH*T + k*topoH*T/3);
      cmx.lineTo(x1*T, yF - topoH*T + k*topoH*T/3); cmx.stroke();
    }
    // uma tábua solta, torta, por cima da pilha
    const hx = rnd(x0, yBase);
    cmx.save();
    cmx.translate((x0 + (x1 - x0)*(.3 + hx*.4))*T, (yBase - faceH - topoH - .02)*T);
    cmx.rotate((hx - .5)*.16);
    cmx.fillStyle = '#7a6a4c'; cmx.fillRect(-(x1 - x0)*.4*T, -T*.06, (x1 - x0)*.8*T, T*.12);
    cmx.fillStyle = 'rgba(0,0,0,.25)'; cmx.fillRect(-(x1 - x0)*.4*T, T*.02, (x1 - x0)*.8*T, T*.04);
    cmx.restore();
  };
  pPilha(6.3, 9.6, 38.6, 4);
  pPilha(4.6, 7.0, 40.8, 3);

  /* caixas de pregos abertas */
  const pCaixaPregos = (tx, ty) => {
    const px = tx*T, py = ty*T, l = T*.46, a = T*.34;
    sombraCh(tx, ty + .1, .28, .07, .3);
    cmx.fillStyle = '#4e4234'; cmx.fillRect(px - l/2, py - a/2, l, a);
    cmx.fillStyle = '#1d1812'; cmx.fillRect(px - l/2 + 2.2, py - a/2 + 2.2, l - 4.4, a - 4.4);
    cmx.strokeStyle = 'rgba(233,238,248,.14)'; cmx.lineWidth = 1.2;
    cmx.strokeRect(px - l/2, py - a/2, l, a);
    cmx.strokeStyle = '#8b93a4'; cmx.lineWidth = 1.1;   // os pregos, espalhados
    for(let k=0; k<7; k++){
      const g1 = rnd(tx*9 + k, ty*7), g2 = rnd(ty*8 + k, tx*6);
      const nx = px - l/2 + 3 + g1*(l - 6), ny = py - a/2 + 3 + g2*(a - 6);
      cmx.beginPath(); cmx.moveTo(nx, ny); cmx.lineTo(nx + T*.07, ny + (g1 - .5)*T*.05); cmx.stroke();
    }
  };
  pCaixaPregos(10.2, 39.1); pCaixaPregos(9.55, 39.6);

  /* rolos de corda largados no chão: um encostado na parede oeste, outro ao pé das pilhas */
  [[3.55,39.3],[8.75,40.95]].forEach(([tx,ty]) => {
    const px = tx*T, py = ty*T;
    sombraCh(tx, ty + .18, .24, .07, .3);
    cmx.strokeStyle = '#66573c'; cmx.lineWidth = Math.max(2.4, T*.1);
    cmx.beginPath(); cmx.arc(px, py, T*.16, 0, TAU); cmx.stroke();
    cmx.strokeStyle = 'rgba(20,14,8,.5)'; cmx.lineWidth = 1;
    for(let k=0; k<5; k++){
      cmx.beginPath(); cmx.arc(px, py, T*(.1 + k*.032), -.6, .9); cmx.stroke();
    }
    cmx.strokeStyle = '#66573c'; cmx.lineWidth = Math.max(1.4, T*.045);
    cmx.beginPath(); cmx.moveTo(px + T*.1, py + T*.1);   // a ponta solta
    cmx.quadraticCurveTo(px + T*.16, py + T*.3, px + T*.08, py + T*.42); cmx.stroke();
  });

  /* poeira e fiapos de teia: os cantos do fundo e as faces laterais do meio,
     onde nem a bancada nem os caixões em obra deixaram canto livre */
  [[3.3,33.3,1],[11.7,36.6,-1],[3.3,40.75,1],[11.7,40.8,-1]].forEach(([tx,ty,dir]) => {
    const px = tx*T, py = ty*T;
    cmx.strokeStyle = 'rgba(205,210,226,.13)'; cmx.lineWidth = 1;
    for(let k=0; k<3; k++){
      cmx.beginPath();
      cmx.moveTo(px - dir*T*.3, py - T*.28 + k*T*.05);
      cmx.quadraticCurveTo(px + dir*T*.05, py - T*.1 + k*T*.08, px + dir*T*.28, py + T*.16 + k*T*.05);
      cmx.stroke();
    }
    cmx.fillStyle = 'rgba(160,166,186,.07)';
    cmx.beginPath(); cmx.ellipse(px, py + T*.1, T*.3, T*.12, 0, 0, TAU); cmx.fill();
  });

  /* ========== A PAREDE DE NICHOS: 5x5 empilhados, o monumento do colombário
     Erguida na face norte, entre as duas entradas: cinco colunas por cinco
     fiadas, com pilastras nas pontas e cornija em cima. Como a face tem só
     um tile de altura, o monumento cresce para cima, por sobre o topo do
     muro — é o que dá a leitura de parede alta em perspectiva 3/4. */
  /* pegada do monumento, em tiles (x1 = x0 + COL*.92, e as pilastras somam .34
     de cada lado). O labirinto pinta arcadas em toda face de parede, e nesta
     face elas vinham por cima: dava uma fileira de nichos atravessando o
     monumento inteiro, na frente dele */
  const MON = {x0:19.5, x1:24.1, y:44, borda:.34};
  {
    const PX = MON.x0*T, BASE = (MON.y + 1)*T;       // canto inferior esquerdo da parede
    const COL = 5, FIA = 5, LN = T*.92, AN = T*.62;  // largura e altura de cada nicho
    const larg = COL*LN, alt = FIA*AN;
    const topo = BASE - alt;
    // o paredão de fundo, mais claro que o muro comum: pedra lavrada
    cmx.fillStyle = '#4a5064';
    cmx.fillRect(PX - T*.34, topo - T*.30, larg + T*.68, alt + T*.34);
    cmx.fillStyle = 'rgba(214,224,246,.10)';
    cmx.fillRect(PX - T*.34, topo - T*.30, larg + T*.68, 3);
    // pilastras das pontas, em alto-relevo
    [PX - T*.34, PX + larg - T*.02].forEach((qx, i) => {
      cmx.fillStyle = '#5d6478';
      cmx.fillRect(qx, topo - T*.30, T*.36, alt + T*.34);
      cmx.fillStyle = 'rgba(226,234,252,.16)';       // a quina iluminada
      cmx.fillRect(qx + (i ? T*.28 : 0), topo - T*.30, T*.08, alt + T*.34);
      cmx.fillStyle = 'rgba(10,12,20,.4)';           // e a que fica na sombra
      cmx.fillRect(qx + (i ? 0 : T*.28), topo - T*.30, T*.08, alt + T*.34);
    });
    // cornija: a laje que fecha o monumento em cima
    cmx.fillStyle = '#79809a';
    cmx.fillRect(PX - T*.52, topo - T*.46, larg + T*1.04, T*.20);
    cmx.fillStyle = 'rgba(236,242,255,.22)';
    cmx.fillRect(PX - T*.52, topo - T*.46, larg + T*1.04, 2.6);
    cmx.fillStyle = 'rgba(0,0,0,.42)';
    cmx.fillRect(PX - T*.52, topo - T*.26, larg + T*1.04, T*.07);
    // os 25 nichos
    for(let f=0; f<FIA; f++) for(let c=0; c<COL; c++){
      const nx = PX + c*LN + LN/2, ny = topo + f*AN;
      const r = LN*.30, altV = AN*.62, omb = ny + T*.14 + r;
      const arco = () => {
        cmx.beginPath();
        cmx.moveTo(nx - r, ny + T*.14 + altV);
        cmx.lineTo(nx - r, omb);
        cmx.arc(nx, omb, r, Math.PI, 0);
        cmx.lineTo(nx + r, ny + T*.14 + altV);
        cmx.closePath();
      };
      // moldura do vão e prateleira
      cmx.fillStyle = '#666d82';
      cmx.fillRect(nx - r - T*.07, ny + T*.10, r*2 + T*.14, altV + T*.13);
      cmx.fillStyle = '#141721';
      arco(); cmx.fill();
      // conteúdo, sem repetir o vizinho de lado nem o de cima
      const v = (c*3 + f*2 + ((hash(c*4.1, f*7.3)*3)|0)) % 5;
      cmx.save(); arco(); cmx.clip();
      const g = cmx.createLinearGradient(0, ny, 0, ny + altV);
      g.addColorStop(0, 'rgba(0,0,0,.6)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      cmx.fillStyle = g; cmx.fillRect(nx - r, ny, r*2, altV);
      const chaoN = ny + T*.14 + altV;
      if(v === 0){                                   // urna de cerâmica
        cmx.fillStyle = '#a8a0b6';
        cmx.beginPath();
        cmx.ellipse(nx, chaoN - AN*.20, r*.52, AN*.22, 0, 0, TAU); cmx.fill();
        cmx.fillRect(nx - r*.2, chaoN - AN*.40, r*.4, AN*.16);
        cmx.fillStyle = 'rgba(240,244,255,.2)';
        cmx.beginPath(); cmx.ellipse(nx - r*.18, chaoN - AN*.24, r*.16, AN*.09, -.4, 0, TAU); cmx.fill();
      } else if(v === 1){                            // crânio olhando para fora
        cmx.fillStyle = '#cfc7ae';
        cmx.beginPath(); cmx.ellipse(nx, chaoN - AN*.22, r*.44, AN*.2, 0, 0, TAU); cmx.fill();
        cmx.fillStyle = '#15161d';
        cmx.beginPath(); cmx.ellipse(nx - r*.17, chaoN - AN*.25, r*.11, AN*.07, 0, 0, TAU); cmx.fill();
        cmx.beginPath(); cmx.ellipse(nx + r*.17, chaoN - AN*.25, r*.11, AN*.07, 0, 0, TAU); cmx.fill();
        cmx.fillRect(nx - r*.06, chaoN - AN*.14, r*.12, AN*.05);
      } else if(v === 2){                            // ossos cruzados
        cmx.strokeStyle = '#c3bba4'; cmx.lineCap = 'round';
        cmx.lineWidth = Math.max(1.6, r*.2);
        cmx.beginPath();
        cmx.moveTo(nx - r*.5, chaoN - AN*.28); cmx.lineTo(nx + r*.5, chaoN - AN*.1); cmx.stroke();
        cmx.beginPath();
        cmx.moveTo(nx - r*.5, chaoN - AN*.1); cmx.lineTo(nx + r*.5, chaoN - AN*.28); cmx.stroke();
      } else if(v === 3){                            // vazio, à espera — só teia
        cmx.strokeStyle = 'rgba(190,196,214,.2)'; cmx.lineWidth = 1;
        for(let k=0; k<3; k++){
          cmx.beginPath();
          cmx.moveTo(nx - r, ny + T*.16);
          cmx.lineTo(nx - r + r*(k+1)*.7, ny + T*.16 + altV*.5);
          cmx.stroke();
        }
      } else {                                       // lacrado com placa de pedra
        cmx.fillStyle = '#6f7488';
        cmx.fillRect(nx - r*.86, chaoN - altV*.86, r*1.72, altV*.8);
        cmx.fillStyle = 'rgba(228,234,250,.16)';
        cmx.fillRect(nx - r*.86, chaoN - altV*.86, r*1.72, 2);
        cmx.strokeStyle = 'rgba(30,34,46,.5)'; cmx.lineWidth = 1;
        for(let k=0; k<3; k++){                      // o nome gasto, ilegível
          const ly = chaoN - altV*.7 + k*altV*.2;
          cmx.beginPath();
          cmx.moveTo(nx - r*.6, ly); cmx.lineTo(nx + r*(.2 + hash(c+k, f)*.4), ly); cmx.stroke();
        }
      }
      cmx.restore();
      // plaquinha de nome sob cada nicho
      cmx.fillStyle = '#828798';
      cmx.fillRect(nx - r*.7, ny + T*.14 + altV + T*.02, r*1.4, T*.07);
      cmx.strokeStyle = 'rgba(30,34,46,.45)'; cmx.lineWidth = .9;
      cmx.beginPath();
      cmx.moveTo(nx - r*.5, ny + T*.14 + altV + T*.055);
      cmx.lineTo(nx + r*.5, ny + T*.14 + altV + T*.055);
      cmx.stroke();
      cmx.fillStyle = 'rgba(0,0,0,.35)';             // a sombra da prateleira na fiada de baixo
      cmx.fillRect(nx - r - T*.07, ny + T*.14 + altV + T*.09, r*2 + T*.14, T*.04);
    }
    // velas pingadas no pé do monumento e a sombra que ele joga no chão
    cmx.fillStyle = 'rgba(0,0,0,.45)';
    cmx.fillRect(PX - T*.52, BASE, larg + T*1.04, T*.22);
    for(let k=0; k<6; k++){
      const vx = PX + T*.4 + k*(larg - T*.8)/5;
      cmx.fillStyle = '#d8d2c0';
      cmx.fillRect(vx - T*.05, BASE - T*.26, T*.1, T*.26);
      cmx.fillStyle = 'rgba(255,206,130,.5)';
      cmx.beginPath(); cmx.ellipse(vx, BASE - T*.3, T*.05, T*.08, 0, 0, TAU); cmx.fill();
      cmx.fillStyle = 'rgba(255,190,110,.10)';
      cmx.beginPath(); cmx.ellipse(vx, BASE - T*.05, T*.34, T*.14, 0, 0, TAU); cmx.fill();
    }
  }

  /* ========== COLOMBÁRIO-LABIRINTO: os nichos funerários (y>=44) ==========
     Em cada face de parede visível dentro do colombário, duas arcadas
     escavadas com prateleira de pedra; dentro, urna, crânio, ossos ou o
     vazio — variando por hash, sem repetir vizinhos. */
  for(let y=44; y<=53; y++) for(let x=3; x<=33; x++){
    if(!paredeEm(x,y) || !chaoEm(x,y+1)) continue;
    // a face do monumento já tem os seus 25 nichos: não leva a arcada comum
    if(y === MON.y && x + 1 > MON.x0 - MON.borda && x < MON.x1 + MON.borda) continue;
    const px = x*T, py = y*T;
    const offLinha = (hash(2.13, y*1.71)*4)|0;          // baralha os conteúdos por linha
    for(let k=0; k<2; k++){
      const nx = px + T*(.27 + k*.46);
      const topo = py + T*.16, altN = T*.5, r = T*.16, omb = topo + r;
      const tracarArco = () => {
        cmx.beginPath();
        cmx.moveTo(nx - r, topo + altN);
        cmx.lineTo(nx - r, omb);
        cmx.arc(nx, omb, r, Math.PI, 0);
        cmx.lineTo(nx + r, topo + altN);
        cmx.closePath();
      };
      // prateleira de pedra sob o arco
      cmx.fillStyle = '#797e93';
      cmx.fillRect(nx - r - T*.05, topo + altN, r*2 + T*.1, T*.085);
      cmx.fillStyle = 'rgba(236,240,250,.25)';
      cmx.fillRect(nx - r - T*.05, topo + altN, r*2 + T*.1, 1.4);
      cmx.fillStyle = 'rgba(0,0,0,.4)';
      cmx.fillRect(nx - r - T*.05, topo + altN + T*.085, r*2 + T*.1, T*.05);
      // o vão escavado
      cmx.fillStyle = '#141721';
      tracarArco(); cmx.fill();
      // conteúdo, guardado dentro do arco
      const v = (x*2 + k + offLinha) % 4;
      cmx.save(); tracarArco(); cmx.clip();
      const chaoN = topo + altN;
      // a sombra funda que desce do alto do vão (antes do conteúdo, para não apagá-lo)
      const gN = cmx.createLinearGradient(0, topo, 0, topo + altN*.7);
      gN.addColorStop(0, 'rgba(0,0,0,.55)'); gN.addColorStop(1, 'rgba(0,0,0,0)');
      cmx.fillStyle = gN; cmx.fillRect(nx - r, topo, r*2, altN*.7);
      if(v === 0){          // a urna
        cmx.fillStyle = '#a29ab2';
        cmx.beginPath();
        cmx.moveTo(nx - T*.055, chaoN - T*.29);
        cmx.quadraticCurveTo(nx - T*.13, chaoN - T*.16, nx - T*.08, chaoN);
        cmx.lineTo(nx + T*.08, chaoN);
        cmx.quadraticCurveTo(nx + T*.13, chaoN - T*.16, nx + T*.055, chaoN - T*.29);
        cmx.closePath(); cmx.fill();
        cmx.fillStyle = '#847c98'; cmx.fillRect(nx - T*.065, chaoN - T*.33, T*.13, T*.045);
        cmx.fillStyle = 'rgba(238,242,252,.45)'; cmx.fillRect(nx - T*.065, chaoN - T*.33, T*.13, 1.2);
        cmx.fillStyle = 'rgba(238,242,252,.28)'; cmx.fillRect(nx - T*.07, chaoN - T*.24, T*.035, T*.2);
        cmx.strokeStyle = 'rgba(30,28,44,.5)'; cmx.lineWidth = .9;   // o friso do bojo
        cmx.beginPath(); cmx.moveTo(nx - T*.1, chaoN - T*.14); cmx.lineTo(nx + T*.1, chaoN - T*.14); cmx.stroke();
      } else if(v === 1){   // o crânio
        cmx.fillStyle = '#b3ac9c';
        cmx.beginPath(); cmx.arc(nx, chaoN - T*.14, T*.085, 0, TAU); cmx.fill();
        cmx.fillRect(nx - T*.055, chaoN - T*.1, T*.11, T*.08);
        cmx.fillStyle = '#141721';
        cmx.beginPath(); cmx.arc(nx - T*.035, chaoN - T*.15, T*.024, 0, TAU); cmx.fill();
        cmx.beginPath(); cmx.arc(nx + T*.035, chaoN - T*.15, T*.024, 0, TAU); cmx.fill();
        cmx.fillRect(nx - T*.008, chaoN - T*.1, T*.016, T*.03);
        cmx.strokeStyle = 'rgba(20,16,12,.5)'; cmx.lineWidth = .9;
        cmx.beginPath(); cmx.moveTo(nx - T*.05, chaoN - T*.04); cmx.lineTo(nx + T*.05, chaoN - T*.04); cmx.stroke();
      } else if(v === 2){   // os ossos cruzados
        cmx.strokeStyle = '#a49d8c'; cmx.lineWidth = Math.max(1.6, T*.045); cmx.lineCap = 'round';
        cmx.beginPath(); cmx.moveTo(nx - T*.1, chaoN - T*.05); cmx.lineTo(nx + T*.1, chaoN - T*.11); cmx.stroke();
        cmx.beginPath(); cmx.moveTo(nx - T*.09, chaoN - T*.13); cmx.lineTo(nx + T*.09, chaoN - T*.05); cmx.stroke();
        cmx.lineCap = 'butt';
        cmx.fillStyle = '#a49d8c';
        cmx.beginPath(); cmx.arc(nx - T*.1, chaoN - T*.05, T*.026, 0, TAU); cmx.fill();
        cmx.beginPath(); cmx.arc(nx + T*.1, chaoN - T*.11, T*.026, 0, TAU); cmx.fill();
      }                     // v === 3: vazio — resta a sombra
      cmx.restore();
      // aduela do arco e pedra angular
      cmx.strokeStyle = 'rgba(160,166,190,.4)'; cmx.lineWidth = 1.5;
      cmx.beginPath(); cmx.arc(nx, omb, r + .8, Math.PI, 0); cmx.stroke();
      cmx.fillStyle = 'rgba(170,176,198,.35)';
      cmx.fillRect(nx - T*.035, topo - T*.035, T*.07, T*.075);
    }
  }

  /* placas de pedra caídas (nomes gastos, ilegíveis) e flores secas */
  for(let y=45; y<=53; y++) for(let x=3; x<=33; x++){
    if(!chaoEm(x,y)) continue;
    const h = rnd(x*1.7, y*2.3);
    const px = (x + .18 + rnd(x,y)*.62)*T, py = (y + .3 + rnd(y,x)*.5)*T;
    if(h > .9){             // a placa que caiu de algum nicho
      cmx.save(); cmx.translate(px, py); cmx.rotate((rnd(x*3, y)*2 - 1)*.5);
      cmx.fillStyle = 'rgba(0,0,0,.28)';
      cmx.beginPath(); cmx.ellipse(T*.02, T*.06, T*.3, T*.14, 0, 0, TAU); cmx.fill();
      cmx.fillStyle = '#767d93'; cmx.fillRect(-T*.26, -T*.17, T*.52, T*.34);
      cmx.fillStyle = 'rgba(238,242,252,.2)'; cmx.fillRect(-T*.26, -T*.17, T*.52, 1.6);
      cmx.strokeStyle = 'rgba(16,18,26,.6)'; cmx.lineWidth = 1.2;
      cmx.strokeRect(-T*.26, -T*.17, T*.52, T*.34);
      cmx.strokeStyle = 'rgba(24,27,38,.55)'; cmx.lineWidth = 1;   // o nome que o tempo comeu
      for(let k=0; k<3; k++){
        const c1 = rnd(x*5 + k, y*4), c2 = rnd(y*6 + k, x*3);
        cmx.beginPath();
        cmx.moveTo(-T*.18, -T*.08 + k*T*.09);
        cmx.lineTo(-T*.18 + T*(.14 + c1*.2), -T*.08 + k*T*.09 + (c2 - .5)*2);
        cmx.stroke();
      }
      cmx.fillStyle = 'rgba(16,18,26,.4)';                          // canto lascado
      cmx.beginPath(); cmx.moveTo(T*.26, -T*.17); cmx.lineTo(T*.17, -T*.17);
      cmx.lineTo(T*.26, -T*.08); cmx.closePath(); cmx.fill();
      cmx.restore();
    } else if(h < .09){     // flores secas caídas
      cmx.save(); cmx.translate(px, py); cmx.rotate(rnd(y*7, x*2)*TAU);
      for(let k=0; k<3; k++){
        const a = (k - 1)*.55 + rnd(x + k, y)*.3;
        cmx.strokeStyle = '#5f5138'; cmx.lineWidth = 1.1;
        cmx.beginPath(); cmx.moveTo(0, 0);
        cmx.quadraticCurveTo(Math.cos(a)*T*.1, Math.sin(a)*T*.1 - T*.06,
                             Math.cos(a)*T*.2, Math.sin(a)*T*.2 - T*.04);
        cmx.stroke();
        cmx.fillStyle = k%2 ? '#7c4a3e' : '#8a6a46';
        cmx.beginPath(); cmx.arc(Math.cos(a)*T*.2, Math.sin(a)*T*.2 - T*.04, T*.035, 0, TAU); cmx.fill();
      }
      cmx.fillStyle = 'rgba(124,88,70,.6)';                         // pétalas soltas
      cmx.fillRect(T*.1, T*.06, 2, 2); cmx.fillRect(-T*.14, T*.02, 2, 2);
      cmx.restore();
    }
  }
}

/* -- passe 4: cripta alagada + salão + cova grande + quarto do Coveiro -- */
function pintarFunCriptaSalao(cmx, T){
  const rnd = (x,y) => hash(x*5.3, y*7.7);
  const tf = (x,y) => (x>=0 && y>=0 && x<FUN.LARG && y<FUN.ALT) ? mapa[y*FUN.LARG + x] : PAREDE;

  /* ================= 1. CRIPTA ALAGADA (x15..28, y32..42) =================
     água parada pútrida por cima do tile de FOSSO, caixões meio afundados,
     bisel na pedra das margens e as passarelas de tábua em alto-relevo */
  const CR = {x1:15, y1:32, x2:28, y2:42};
  const naAgua = (x,y) => x>=CR.x1 && x<=CR.x2 && y>=CR.y1 && y<=CR.y2 && tf(x,y) === FOSSO;

  // um só gradiente radial para a lâmina d'água toda: verde-petróleo, sem azul
  const cxA = (CR.x1 + CR.x2 + 1)*.5*T, cyA = (CR.y1 + CR.y2 + 1)*.5*T;
  const gAgua = cmx.createRadialGradient(cxA, cyA, T*.6, cxA, cyA, (CR.x2 - CR.x1 + 1)*T*.62);
  gAgua.addColorStop(0, '#2e4c4a'); gAgua.addColorStop(.55, '#22393b'); gAgua.addColorStop(1, '#16272b');
  for(let y=CR.y1; y<=CR.y2; y++) for(let x=CR.x1; x<=CR.x2; x++){
    if(!naAgua(x,y)) continue;
    const px = x*T, py = y*T, h = rnd(x,y);
    cmx.fillStyle = gAgua; cmx.fillRect(px, py, T, T);
    // limo boiando em manchas
    if(h > .58){
      cmx.fillStyle = 'rgba(46,72,58,' + (.05 + h*.08) + ')';
      cmx.beginPath();
      cmx.ellipse(px + T*h, py + T*(1 - h*.7), T*(.3 + h*.25), T*(.15 + h*.12), h*3, 0, TAU);
      cmx.fill();
    }
    // o céu de pedra refletido: manchas frias e largas
    if(h > .42){
      cmx.fillStyle = 'rgba(126,164,168,' + (.05 + h*.07) + ')';
      cmx.beginPath();
      cmx.ellipse(px + T*(1-h), py + T*h, T*(.35 + h*.2), T*.1, 0, 0, TAU);
      cmx.fill();
    }
    // onde a pedra mergulha: a quina clara e o paredão molhado descendo
    const ac = tf(x, y-1);
    if(ac !== FOSSO && ac !== PONTE){
      cmx.fillStyle = 'rgba(150,165,175,.35)'; cmx.fillRect(px, py, T, 2.2);
      const gQ = cmx.createLinearGradient(0, py, 0, py + T*.5);
      gQ.addColorStop(0, 'rgba(52,66,72,.6)'); gQ.addColorStop(1, 'rgba(52,66,72,0)');
      cmx.fillStyle = gQ; cmx.fillRect(px, py + 2.2, T, T*.5);
      if(h > .5){                                        // escorrido de limo na pedra
        cmx.fillStyle = 'rgba(46,72,58,.28)';
        cmx.fillRect(px + T*(.15 + h*.5), py + 2, T*.1, T*(.2 + h*.22));
      }
    }
  }

  // bisel escuro na aresta da pedra que cai para a água (a receita da cisterna)
  for(let y=CR.y1-1; y<=CR.y2+1; y++) for(let x=CR.x1-1; x<=CR.x2+1; x++){
    const v = tf(x,y);
    if(v !== CHAO && v !== CHAO2) continue;
    const px = x*T, py = y*T, bz = T*.18;
    if(naAgua(x, y+1)){
      cmx.fillStyle = 'rgba(205,220,225,.12)';
      cmx.fillRect(px, py + T - bz - 1.6, T, 1.6);       // a quina pega luz antes de cair
      cmx.fillStyle = 'rgba(9,16,19,.6)';
      cmx.fillRect(px, py + T - bz, T, bz);
      /* a orla: espuma suja e limo acumulado onde a água bate na pedra */
      cmx.fillStyle = 'rgba(196,214,196,.22)';
      cmx.fillRect(px, py + T, T, 2.4);
      for(let k=0; k<3; k++){
        const hk = rnd(x*11 + k, y*13);
        cmx.fillStyle = 'rgba(150,178,150,' + (.10 + hk*.16) + ')';
        cmx.beginPath();
        cmx.ellipse(px + T*(.15 + k*.34 + hk*.1), py + T + 2 + hk*2, T*(.09 + hk*.07), 1.8 + hk*1.4, 0, 0, TAU);
        cmx.fill();
      }
    }
    cmx.fillStyle = 'rgba(9,16,19,.55)';
    if(naAgua(x+1, y)) cmx.fillRect(px + T - bz*.7, py, bz*.7, T);
    if(naAgua(x-1, y)) cmx.fillRect(px, py, bz*.7, T);
  }

  // goteiras: círculos concêntricos discretos onde o teto pinga
  [[18.5,38.2],[24.5,36.6],[20.8,41.6]].forEach(([x,y]) => {
    const px = x*T, py = y*T;
    cmx.strokeStyle = 'rgba(150,195,185,.15)'; cmx.lineWidth = 1.4;
    for(let k=0; k<3; k++){
      cmx.beginPath(); cmx.ellipse(px, py, T*(.13 + k*.16), T*(.08 + k*.11), 0, 0, TAU); cmx.stroke();
    }
    cmx.fillStyle = 'rgba(190,220,210,.2)';
    cmx.beginPath(); cmx.arc(px, py, 1.5, 0, TAU); cmx.fill();
  });

  // os caixões que boiam são desenhados vivos em desenharAguaCripta (eles se mexem)

  /* passarelas PONTE em alto-relevo: tábuas no sentido do vão, pregos,
     tábua faltando aqui e ali e a face lateral escura caindo para a água */
  for(let y=CR.y1; y<=CR.y2; y++) for(let x=CR.x1; x<=CR.x2; x++){
    if(tf(x,y) !== PONTE) continue;
    const px = x*T, py = y*T, fB = hash(x*1.7, y*2.9);
    const vert = tf(x, y-1) === PONTE || tf(x, y+1) === PONTE;
    cmx.fillStyle = '#0a1214'; cmx.fillRect(px, py, T, T);   // a água nas frestas
    const nB = 4, wB = T/nB;
    for(let k=0; k<nB; k++){
      const falta = fB > .78 && k === ((fB*13)|0) % nB;
      const v2 = .66 + hash(vert ? x*7 + k : x*3, vert ? y*3 : y*7 + k)*.5;
      const cor = 'rgb(' + Math.round(112*v2) + ',' + Math.round(94*v2) + ',' + Math.round(66*v2) + ')';
      if(vert){
        const bx = px + k*wB;
        if(falta){                                       // a tábua que faltou: buraco escuro
          cmx.fillStyle = cor;
          cmx.fillRect(bx + 1, py, wB - 2, T*.2); cmx.fillRect(bx + 1, py + T*.78, wB - 2, T*.22);
          cmx.fillStyle = 'rgba(5,9,10,.9)'; cmx.fillRect(bx + 1, py + T*.2, wB - 2, T*.58);
          cmx.fillStyle = 'rgba(226,206,170,.18)';       // as pontas lascadas
          cmx.fillRect(bx + 1, py + T*.18, wB - 2, 1.5);
          cmx.fillRect(bx + 1, py + T*.78, wB - 2, 1.5);
          continue;
        }
        cmx.fillStyle = cor; cmx.fillRect(bx + 1, py, wB - 2, T);
        cmx.fillStyle = 'rgba(255,240,210,.07)'; cmx.fillRect(bx + 1, py, 1.6, T);
        cmx.fillStyle = 'rgba(10,6,4,.25)'; cmx.fillRect(bx + wB - 2.4, py, 1.4, T);
        if(hash(x + k, y*11) > .55){                     // veio da madeira
          cmx.strokeStyle = 'rgba(30,20,12,.35)'; cmx.lineWidth = 1;
          cmx.beginPath(); cmx.moveTo(bx + wB*.5, py + T*.12); cmx.lineTo(bx + wB*.4, py + T*.82); cmx.stroke();
        }
        cmx.fillStyle = '#191410';                       // pregos nas travessas
        cmx.beginPath(); cmx.arc(bx + wB*.5, py + T*.14, 1.4, 0, TAU); cmx.fill();
        cmx.beginPath(); cmx.arc(bx + wB*.5, py + T*.86, 1.4, 0, TAU); cmx.fill();
        cmx.fillStyle = 'rgba(230,235,240,.3)';
        cmx.fillRect(bx + wB*.5 - .6, py + T*.14 - .6, 1, 1);
      } else {
        const by = py + k*wB;
        if(falta){
          cmx.fillStyle = cor;
          cmx.fillRect(px, by + 1, T*.2, wB - 2); cmx.fillRect(px + T*.78, by + 1, T*.22, wB - 2);
          cmx.fillStyle = 'rgba(5,9,10,.9)'; cmx.fillRect(px + T*.2, by + 1, T*.58, wB - 2);
          cmx.fillStyle = 'rgba(226,206,170,.18)';
          cmx.fillRect(px + T*.18, by + 1, 1.5, wB - 2);
          cmx.fillRect(px + T*.78, by + 1, 1.5, wB - 2);
          continue;
        }
        cmx.fillStyle = cor; cmx.fillRect(px, by + 1, T, wB - 2);
        cmx.fillStyle = 'rgba(255,240,210,.07)'; cmx.fillRect(px, by + 1, T, 1.6);
        cmx.fillStyle = 'rgba(10,6,4,.25)'; cmx.fillRect(px, by + wB - 2.4, T, 1.4);
        cmx.fillStyle = '#191410';
        cmx.beginPath(); cmx.arc(px + T*.14, by + wB*.5, 1.4, 0, TAU); cmx.fill();
        cmx.beginPath(); cmx.arc(px + T*.86, by + wB*.5, 1.4, 0, TAU); cmx.fill();
        cmx.fillStyle = 'rgba(230,235,240,.3)';
        cmx.fillRect(px + T*.14 - .6, by + wB*.5 - .6, 1, 1);
      }
    }
    // vigas de borda quando a passarela pende sobre a água
    cmx.fillStyle = '#2e2114';
    if(vert){
      if(naAgua(x-1, y)){
        cmx.fillRect(px, py, 3.4, T);
        cmx.fillStyle = 'rgba(216,190,140,.3)'; cmx.fillRect(px + .8, py, 1.2, T);
        cmx.fillStyle = '#2e2114';
      }
      if(naAgua(x+1, y)){
        cmx.fillRect(px + T - 3.4, py, 3.4, T);
        cmx.fillStyle = 'rgba(216,190,140,.3)'; cmx.fillRect(px + T - 2.2, py, 1.2, T);
      }
    } else if(naAgua(x, y-1)){
      cmx.fillRect(px, py, T, 3.4);
      cmx.fillStyle = 'rgba(216,190,140,.3)'; cmx.fillRect(px, py + .8, T, 1.2);
    }
    // face lateral escura na borda sul de cada trecho: o alto-relevo do estrado
    if(naAgua(x, y+1)){
      const fh = T*.22;
      cmx.fillStyle = '#191108'; cmx.fillRect(px, py + T - fh, T, fh);
      cmx.strokeStyle = 'rgba(0,0,0,.5)'; cmx.lineWidth = 1;
      for(let k=1; k<nB; k++){
        cmx.beginPath(); cmx.moveTo(px + k*wB, py + T - fh); cmx.lineTo(px + k*wB, py + T); cmx.stroke();
      }
      cmx.fillStyle = 'rgba(226,206,170,.14)'; cmx.fillRect(px, py + T - fh, T, 1.6);
      cmx.fillStyle = 'rgba(6,10,11,.5)'; cmx.fillRect(px, py + T, T, 3);   // o reflexo na água
    }
  }

  // véu de névoa clara em manchas, por cima de tudo na cripta
  [[17.5,34.5],[25.8,37.5],[20.5,39.6],[23.5,34.1]].forEach(([x,y], i) => {
    const px = x*T, py = y*T, r = T*(1.6 + (i%2)*.7);
    const gN = cmx.createRadialGradient(px, py, 0, px, py, r);
    gN.addColorStop(0, 'rgba(168,188,182,.09)'); gN.addColorStop(1, 'rgba(168,188,182,0)');
    cmx.fillStyle = gN; cmx.beginPath(); cmx.arc(px, py, r, 0, TAU); cmx.fill();
  });

  /* ================= 2. SALÃO CENTRAL (x5..41, y20..23) =================
     o caminho processional: lajes gastas no eixo e os dois sulcos
     paralelos do arrasto de caixão, de ponta a ponta */
  for(let y=21; y<=22; y++) for(let x=5; x<=41; x++){
    if(tf(x,y) !== CHAO) continue;
    const h = rnd(x + 11, y + 5);
    cmx.fillStyle = 'rgba(14,13,20,' + (.12 + h*.10) + ')';
    cmx.fillRect(x*T + 1, y*T + 1, T - 2, T - 2);
    if(h > .7){                                          // laje polida pelo uso
      cmx.fillStyle = 'rgba(205,212,228,.05)';
      cmx.fillRect(x*T + 3, y*T + T*.55, T - 6, T*.3);
    }
  }
  [21.72, 22.28].forEach((yl, si) => {
    cmx.strokeStyle = 'rgba(8,7,12,.5)'; cmx.lineWidth = 2.6;
    cmx.beginPath();
    for(let x=5; x<=41; x++){
      const yy = (yl + (hash(x*2.3, 31 + si*7) - .5)*.1)*T;
      if(x === 5) cmx.moveTo((x + .15)*T, yy); else cmx.lineTo((x + .5)*T, yy);
    }
    cmx.stroke();
    cmx.strokeStyle = 'rgba(205,215,230,.08)'; cmx.lineWidth = 1.4;   // a quina de baixo do sulco
    cmx.beginPath();
    for(let x=5; x<=41; x++){
      const yy = (yl + (hash(x*2.3, 31 + si*7) - .5)*.1)*T + 2.2;
      if(x === 5) cmx.moveTo((x + .15)*T, yy); else cmx.lineTo((x + .5)*T, yy);
    }
    cmx.stroke();
  });
  // goteiras do salão: poças pequenas com o anel da água caindo
  [[9.4,20.6],[17.6,23.35],[27.5,20.5],[33.6,23.4]].forEach(([x,y]) => {
    const px = x*T, py = y*T;
    cmx.fillStyle = 'rgba(10,13,18,.55)';
    cmx.beginPath(); cmx.ellipse(px, py, T*.24, T*.13, .3, 0, TAU); cmx.fill();
    cmx.strokeStyle = 'rgba(170,190,205,.16)'; cmx.lineWidth = 1.3;
    cmx.beginPath(); cmx.ellipse(px, py, T*.24, T*.13, .3, 0, TAU); cmx.stroke();
    cmx.beginPath(); cmx.ellipse(px, py, T*.1, T*.055, .3, 0, TAU); cmx.stroke();
  });

  /* ============ 3. COVA GRANDE: a arena do Coveiro (x29..44, y2..16) ============
     terra revolvida sobre a pedra, covas abertas com o monte de terra ao lado,
     lápides tortas e o sulco circular de quem cava andando em roda */
  const longeDaAgua = (x, y) => CANTOS_AGUA.every(([ax, ay]) => Math.hypot(x - ax, y - ay) > 2.6);
  for(let y=2; y<=16; y++) for(let x=29; x<=44; x++){
    if(tf(x,y) !== CHAO2) continue;
    const px = x*T, py = y*T, h = rnd(x + 3, y + 9);
    /* o chão da cova é TERRA, não pedra: cobre a laje inteira antes de tudo */
    const gT = cmx.createLinearGradient(px, py, px, py + T);
    gT.addColorStop(0, h > .5 ? '#4a4034' : '#443a2f');
    gT.addColorStop(1, h > .5 ? '#3a3129' : '#352d26');
    cmx.fillStyle = gT; cmx.fillRect(px, py, T, T);
    cmx.fillStyle = 'rgba(120,104,80,' + (.05 + h*.07) + ')';   // poeira levantada
    cmx.fillRect(px, py, T, T*.3);
    for(let k=0; k<5; k++){                              // pedrinhas e raízes na terra batida
      const hx = hash(x*3.3 + k, y*8.1), hy = hash(x*6.7, y*2.9 + k);
      cmx.fillStyle = hx > .7 ? 'rgba(150,134,108,.22)' : 'rgba(22,18,14,.30)';
      cmx.beginPath();
      cmx.ellipse(px + T*hx, py + T*hy, 1 + hx*2.2, .8 + hy*1.6, hx*4, 0, TAU);
      cmx.fill();
    }
    if(h > .3){                                          // terra revolvida em manchas miúdas
      for(let k=0; k<3; k++){
        const hx = hash(x*7 + k, y*5), hy = hash(x*5, y*7 + k);
        cmx.fillStyle = 'rgba(58,51,46,' + (.14 + hx*.26) + ')';
        cmx.beginPath();
        cmx.ellipse(px + T*hx, py + T*hy, T*(.12 + hy*.18), T*(.08 + hx*.13), hx*5, 0, TAU);
        cmx.fill();
      }
    }
    if(h > .62){                                         // torrões escuros
      cmx.fillStyle = 'rgba(24,20,16,.45)';
      cmx.beginPath(); cmx.arc(px + T*(1 - h)*.9 + 2, py + T*h*.9, 1.4 + h*2, 0, TAU); cmx.fill();
    }
    if(h > .84){                                         // um risco de pá na terra
      cmx.strokeStyle = 'rgba(20,17,14,.4)'; cmx.lineWidth = 1.6;
      cmx.beginPath();
      cmx.moveTo(px + T*.2, py + T*(h - .3)); cmx.lineTo(px + T*.85, py + T*(h - .22));
      cmx.stroke();
    }
  }
  // o sulco circular no centro da arena, com as pegadas em roda
  const ccx = 37.2*T, ccy = 9.8*T, rC = T*2.45;   // o centro subiu e a roda abriu com a arena
  cmx.strokeStyle = 'rgba(14,12,16,.3)'; cmx.lineWidth = T*.16;
  cmx.beginPath(); cmx.ellipse(ccx, ccy, rC, rC*.72, 0, 0, TAU); cmx.stroke();
  cmx.strokeStyle = 'rgba(190,180,155,.1)'; cmx.lineWidth = 2;
  cmx.beginPath(); cmx.ellipse(ccx, ccy, rC + T*.1, rC*.72 + T*.1, 0, .3, 5.6); cmx.stroke();
  for(let k=0; k<10; k++){
    const a = k*TAU/10 + .25, fx = ccx + Math.cos(a)*rC, fy = ccy + Math.sin(a)*rC*.72;
    cmx.fillStyle = 'rgba(16,13,11,.4)';
    cmx.beginPath(); cmx.ellipse(fx, fy, T*.09, T*.05, a + Math.PI/2, 0, TAU); cmx.fill();
    cmx.beginPath();
    cmx.ellipse(fx + Math.cos(a + .5)*T*.16, fy + Math.sin(a + .5)*T*.12, T*.09, T*.05, a + Math.PI/2, 0, TAU);
    cmx.fill();
  }
  // covas abertas: o buraco fundo e a pá de terra ao lado, com face iluminada
  const pCova = (x, y, ang, lado) => {
    const px = x*T, py = y*T, w = T*1.55, hh = T*.8;
    cmx.save(); cmx.translate(px, py); cmx.rotate(ang);
    cmx.fillStyle = 'rgba(90,80,66,.5)';                 // o rebordo de terra remexida
    cmx.fillRect(-w/2 - 3, -hh/2 - 3, w + 6, hh + 6);
    cmx.fillStyle = 'rgba(198,186,158,.22)';             // a quina norte do buraco pega luz
    cmx.fillRect(-w/2 - 2, -hh/2 - 2.6, w + 4, 2);
    const gC = cmx.createLinearGradient(0, -hh/2, 0, hh/2);
    gC.addColorStop(0, '#0d0e10'); gC.addColorStop(.55, '#1c1712'); gC.addColorStop(1, '#2a2219');
    cmx.fillStyle = gC; cmx.fillRect(-w/2, -hh/2, w, hh);
    /* paredes internas de terra: as laterais aparam o preto chapado */
    cmx.fillStyle = 'rgba(110,94,72,.28)';
    cmx.fillRect(-w/2, -hh/2, 3.2, hh); cmx.fillRect(w/2 - 3.2, -hh/2, 3.2, hh);
    cmx.fillStyle = 'rgba(96,82,62,.2)';                 // veios de raiz e pedra na terra
    for(let k=0; k<4; k++){
      const hk = hash(x*7 + k, y*3 + k);
      cmx.fillRect(-w/2 + 4 + hk*(w - 14), -hh/2 + 3 + hash(x + k, y*9 + k)*(hh - 8), 2 + hk*4, 1.6);
    }
    cmx.fillStyle = 'rgba(138,124,102,.5)';              // a parede interna que pega luz
    cmx.fillRect(-w/2, hh/2 - 4.4, w, 4.4);
    cmx.fillStyle = 'rgba(0,0,0,.35)'; cmx.fillRect(-w/2, -hh/2, w, 3);
    cmx.restore();
    const mx = px + lado*(w/2 + T*.5), my = py + T*.05;  // o monte de terra
    cmx.fillStyle = 'rgba(0,0,0,.35)';
    cmx.beginPath(); cmx.ellipse(mx + T*.06, my + T*.17, T*.46, T*.17, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#544838';
    cmx.beginPath(); cmx.ellipse(mx, my, T*.4, T*.28, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = 'rgba(200,185,150,.28)';             // a face do monte que a luz alcança
    cmx.beginPath(); cmx.ellipse(mx - T*.09, my - T*.1, T*.26, T*.14, -.4, 0, TAU); cmx.fill();
    cmx.fillStyle = 'rgba(16,12,10,.4)';                 // o pé do monte, na sombra
    cmx.beginPath(); cmx.ellipse(mx + T*.06, my + T*.14, T*.3, T*.1, .2, 0, TAU); cmx.fill();
    cmx.fillStyle = 'rgba(20,16,12,.5)';
    for(let k=0; k<5; k++){
      const hk = hash(x*9 + k, y*4 + k);
      cmx.beginPath();
      cmx.arc(mx + (hk - .5)*T*.7, my + (hash(x + k, y*7) - .5)*T*.4, 1.6 + hk*1.8, 0, TAU);
      cmx.fill();
    }
  };
  [[33.5,6.3,-.07,1],[39.8,7.9,.05,-1],[33.8,12.8,.09,1],[38.9,13.6,-.04,1]]
    .filter(([x,y]) => longeDaAgua(x, y)).forEach(([x,y,a,l]) => pCova(x, y, a, l));
  /* as lápides deixaram de ser vetor tosco: agora são arte recortada, e vivem
     no passe 5 (pintarFunImagens), junto dos outros itens assentados pelo pé */

  /* a cova é um cemitério inteiro: cruzes fincadas, caveiras, caixões
     empilhados e as oferendas de quem veio despedir-se — menos em volta das
     duas águas bentas, que precisam ser vistas de longe no meio da luta */
  const pCruz = (x, y, alt2, ang) => {
    const px = x*T, py = y*T;
    cmx.fillStyle = 'rgba(0,0,0,.4)';
    cmx.beginPath(); cmx.ellipse(px + T*.1, py + T*.1, T*.3, T*.1, 0, 0, TAU); cmx.fill();
    cmx.save(); cmx.translate(px, py); cmx.rotate(ang);
    const h2 = T*alt2, e = Math.max(2.4, T*.11);
    cmx.fillStyle = '#4b3d2c';                            // o madeirame
    cmx.fillRect(-e/2, -h2, e, h2);
    cmx.fillRect(-T*.3, -h2*.72, T*.6, e*.86);
    cmx.fillStyle = 'rgba(205,186,150,.2)';               // a face que pega luz
    cmx.fillRect(-e/2, -h2, e*.4, h2);
    cmx.fillRect(-T*.3, -h2*.72, T*.6, 1.6);
    cmx.strokeStyle = 'rgba(18,14,10,.5)'; cmx.lineWidth = 1;
    cmx.strokeRect(-e/2, -h2, e, h2);
    cmx.fillStyle = 'rgba(70,58,44,.5)';                  // o barbante amarrando o travessão
    cmx.fillRect(-e*.9, -h2*.72 - 1, e*1.8, 2);
    cmx.restore();
  };
  [[32.4,7.6,.95,-.10],[36.1,13.4,1.1,.13],[40.2,6.4,.85,-.16],
   [33.8,15.4,1.0,.08],[42.2,12.1,.9,-.05],[30.9,4.9,.8,.18]]
    .filter(([x,y]) => longeDaAgua(x, y)).forEach(([x,y,a,g]) => pCruz(x, y, a, g));

  const pCaveira = (x, y, esc2) => {
    const px = x*T, py = y*T, r2 = T*.16*esc2;
    cmx.fillStyle = 'rgba(0,0,0,.4)';
    cmx.beginPath(); cmx.ellipse(px + r2*.2, py + r2*.5, r2*1.1, r2*.4, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#cfc7ae';                            // a caixa craniana
    cmx.beginPath(); cmx.ellipse(px, py, r2, r2*.86, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#bdb49a';                            // o maxilar
    cmx.beginPath(); cmx.ellipse(px, py + r2*.72, r2*.62, r2*.34, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#15161d';                            // as órbitas e o nariz
    cmx.beginPath(); cmx.ellipse(px - r2*.36, py - r2*.1, r2*.26, r2*.24, 0, 0, TAU); cmx.fill();
    cmx.beginPath(); cmx.ellipse(px + r2*.36, py - r2*.1, r2*.26, r2*.24, 0, 0, TAU); cmx.fill();
    cmx.beginPath();
    cmx.moveTo(px, py + r2*.1); cmx.lineTo(px - r2*.14, py + r2*.42); cmx.lineTo(px + r2*.14, py + r2*.42);
    cmx.closePath(); cmx.fill();
    cmx.fillStyle = 'rgba(255,252,240,.3)';               // o brilho no alto do crânio
    cmx.beginPath(); cmx.ellipse(px - r2*.2, py - r2*.42, r2*.4, r2*.2, -.3, 0, TAU); cmx.fill();
    cmx.strokeStyle = 'rgba(40,34,26,.4)'; cmx.lineWidth = 1;   // a sutura
    cmx.beginPath(); cmx.moveTo(px - r2*.5, py - r2*.5); cmx.lineTo(px + r2*.2, py - r2*.72); cmx.stroke();
  };
  [[31.7,9.3,1],[34.6,10.8,.85],[39.4,15.6,1.1],[43.0,8.2,.9],
   [37.2,5.9,.8],[30.6,14.2,1.05],[41.1,4.6,.85]]
    .filter(([x,y]) => longeDaAgua(x, y)).forEach(([x,y,e]) => pCaveira(x, y, e));

  const pCaixaoPilha = (x, y, n) => {          // caixões empilhados à espera de cova
    const px = x*T, py = y*T, w2 = T*1.5, h2 = T*.5;
    cmx.fillStyle = 'rgba(0,0,0,.42)';
    cmx.beginPath(); cmx.ellipse(px + T*.08, py + T*.16, w2*.6, T*.16, 0, 0, TAU); cmx.fill();
    for(let k=n-1; k>=0; k--){
      const ky = py - k*T*.22, incl = (hash(x + k, y)*2 - 1)*.05;
      cmx.save(); cmx.translate(px, ky); cmx.rotate(incl);
      cmx.fillStyle = k % 2 ? '#3c2f22' : '#4a3b2b';       // a tampa
      cmx.beginPath();
      cmx.moveTo(-w2/2, -h2*.28); cmx.lineTo(-w2*.16, -h2*.44); cmx.lineTo(w2/2, -h2*.2);
      cmx.lineTo(w2/2, h2*.2);  cmx.lineTo(-w2*.16, h2*.44); cmx.lineTo(-w2/2, h2*.28);
      cmx.closePath(); cmx.fill();
      cmx.fillStyle = 'rgba(206,186,146,.16)';             // a luz na quina de cima
      cmx.beginPath();
      cmx.moveTo(-w2/2, -h2*.28); cmx.lineTo(-w2*.16, -h2*.44); cmx.lineTo(w2/2, -h2*.2);
      cmx.lineTo(w2/2, -h2*.1); cmx.lineTo(-w2*.16, -h2*.32); cmx.lineTo(-w2/2, -h2*.18);
      cmx.closePath(); cmx.fill();
      cmx.strokeStyle = 'rgba(14,10,6,.6)'; cmx.lineWidth = 1.4;
      cmx.beginPath(); cmx.moveTo(-w2*.16, -h2*.44); cmx.lineTo(-w2*.16, h2*.44); cmx.stroke();
      cmx.fillStyle = 'rgba(90,74,52,.7)';                 // as cintas de ferro
      cmx.fillRect(-w2*.02, -h2*.4, 2.4, h2*.8);
      cmx.fillRect(w2*.3, -h2*.32, 2.4, h2*.62);
      cmx.restore();
    }
  };
  [[34.6,6.2,3],[39.5,15.0,2],[36.4,4.6,2]]
    .filter(([x,y]) => longeDaAgua(x, y)).forEach(([x,y,n]) => pCaixaoPilha(x, y, n));

  const pOferenda = (x, y, tipo) => {          // o que os vivos deixam para os mortos
    const px = x*T, py = y*T;
    cmx.fillStyle = 'rgba(0,0,0,.34)';
    cmx.beginPath(); cmx.ellipse(px + T*.04, py + T*.08, T*.2, T*.08, 0, 0, TAU); cmx.fill();
    if(tipo === 0){                            // tigela de barro com grão
      cmx.fillStyle = '#7b5a3e';
      cmx.beginPath(); cmx.ellipse(px, py, T*.17, T*.1, 0, 0, TAU); cmx.fill();
      cmx.fillStyle = '#c8ab74';
      cmx.beginPath(); cmx.ellipse(px, py - T*.02, T*.12, T*.06, 0, 0, TAU); cmx.fill();
      cmx.fillStyle = 'rgba(255,246,220,.25)';
      cmx.beginPath(); cmx.ellipse(px - T*.05, py - T*.04, T*.05, T*.025, -.3, 0, TAU); cmx.fill();
    } else if(tipo === 1){                     // ramo de flores secas amarrado
      cmx.strokeStyle = '#6b5a3a'; cmx.lineWidth = Math.max(1.4, T*.05);
      cmx.beginPath(); cmx.moveTo(px - T*.16, py + T*.05); cmx.lineTo(px + T*.14, py - T*.06); cmx.stroke();
      for(let k=0; k<5; k++){
        const a = k/5*TAU, fx = px + T*.14 + Math.cos(a)*T*.07, fy = py - T*.06 + Math.sin(a)*T*.05;
        cmx.fillStyle = ['#b8a075','#cbb489','#9a8fa8'][k % 3];
        cmx.beginPath(); cmx.ellipse(fx, fy, T*.045, T*.032, a, 0, TAU); cmx.fill();
      }
      cmx.fillStyle = 'rgba(180,160,120,.5)';
      cmx.fillRect(px - T*.02, py - T*.01, T*.05, T*.04);
    } else {                                   // moeda e caneca viradas
      cmx.fillStyle = '#8a8a96';
      cmx.beginPath(); cmx.ellipse(px, py, T*.13, T*.09, .3, 0, TAU); cmx.fill();
      cmx.fillStyle = 'rgba(20,18,24,.5)';
      cmx.beginPath(); cmx.ellipse(px, py, T*.07, T*.05, .3, 0, TAU); cmx.fill();
      cmx.fillStyle = '#c9a24a';
      cmx.beginPath(); cmx.arc(px + T*.18, py + T*.05, T*.05, 0, TAU); cmx.fill();
      cmx.fillStyle = 'rgba(255,240,190,.4)';
      cmx.beginPath(); cmx.arc(px + T*.17, py + T*.04, T*.02, 0, TAU); cmx.fill();
    }
  };
  [[33.0,6.0,1],[35.6,11.3,0],[40.6,9.1,2],[32.2,13.0,1],
   [38.0,15.0,0],[43.2,11.4,1],[37.4,7.2,2]]
    .filter(([x,y]) => longeDaAgua(x, y)).forEach(([x,y,t]) => pOferenda(x, y, t));

  /* ============ 4. ESCADA DE CHEGADA (x36..43, y48..54) ============
     degraus largos subindo do piso 2: linha de sombra no alto de cada
     fiada, rodapé claro na quina e o fundo do vão mais escuro */
  for(let y=48; y<=54; y++) for(let x=36; x<=43; x++){
    if(tf(x,y) !== CHAO2) continue;
    const px = x*T, py = y*T;
    cmx.fillStyle = 'rgba(4,5,9,' + ((y - 48)*.035) + ')';   // desce para o escuro
    cmx.fillRect(px, py, T, T);
    const gD = cmx.createLinearGradient(0, py, 0, py + T*.42);
    gD.addColorStop(0, 'rgba(0,0,0,.34)'); gD.addColorStop(1, 'rgba(0,0,0,0)');
    cmx.fillStyle = gD; cmx.fillRect(px, py, T, T*.42);
    cmx.fillStyle = 'rgba(225,230,245,.13)';             // o rodapé claro da quina
    cmx.fillRect(px, py + T - 2.4, T, 2.4);
    if(x >= 38 && x <= 41){                              // o desgaste por onde todos pisam
      cmx.fillStyle = 'rgba(0,0,0,.08)';
      cmx.fillRect(px + 2, py + T*.3, T - 4, T*.45);
    }
  }

  /* ============ 5. QUARTO DO COVEIRO (x38..43, y26..30) ============
     tapete surrado, a pá encostada na parede com seus arranhões
     e a terra que ele traz nas botas */
  const rx = 38.75*T, ry = 27*T, rw = 4.6*T, rh = 2.55*T;
  cmx.fillStyle = 'rgba(58,34,32,.85)'; cmx.fillRect(rx, ry, rw, rh);
  cmx.fillStyle = 'rgba(110,62,50,.25)'; cmx.fillRect(rx + 2, ry + 2, rw - 4, rh - 4);
  cmx.strokeStyle = 'rgba(24,14,14,.5)'; cmx.lineWidth = 1;   // a trama do tecido
  for(let k=1; k<8; k++){
    cmx.beginPath(); cmx.moveTo(rx + k*rw/8, ry + 3); cmx.lineTo(rx + k*rw/8, ry + rh - 3); cmx.stroke();
  }
  cmx.strokeStyle = 'rgba(140,96,70,.5)'; cmx.lineWidth = 2;
  cmx.strokeRect(rx + 3, ry + 3, rw - 6, rh - 6);
  cmx.strokeStyle = 'rgba(30,16,16,.45)'; cmx.lineWidth = 1.4;
  cmx.strokeRect(rx + 7, ry + 7, rw - 14, rh - 14);
  for(let k=0; k<9; k++){                                // puídos e buracos
    const h1 = hash(k*3.1, 11.7), h2 = hash(7.3, k*5.9);
    if(h1 < .35) continue;
    cmx.fillStyle = h1 > .75 ? 'rgba(10,8,10,.5)' : 'rgba(52,58,72,.35)';
    cmx.beginPath();
    cmx.ellipse(rx + h1*rw, ry + h2*rh, T*(.06 + h2*.1), T*(.04 + h1*.06), h1*3, 0, TAU);
    cmx.fill();
  }
  cmx.strokeStyle = 'rgba(120,80,60,.4)'; cmx.lineWidth = 1.2;   // as franjas gastas
  for(let k=0; k<10; k++){
    const fy2 = ry + 4 + k*(rh - 8)/9;
    cmx.beginPath(); cmx.moveTo(rx, fy2); cmx.lineTo(rx - 3.5, fy2 + 1.2); cmx.stroke();
    cmx.beginPath(); cmx.moveTo(rx + rw, fy2); cmx.lineTo(rx + rw + 3.5, fy2 + 1.2); cmx.stroke();
  }
  // os arranhões da pá na parede, de encostar todo dia no mesmo lugar
  cmx.strokeStyle = 'rgba(16,12,10,.4)'; cmx.lineWidth = 2;
  for(let k=0; k<3; k++){
    cmx.beginPath();
    cmx.moveTo(42.15*T + k*4, 25.35*T); cmx.lineTo(42.3*T + k*4, 25.95*T);
    cmx.stroke();
  }
  // a pá, encostada onde sempre esteve
  cmx.fillStyle = 'rgba(0,0,0,.35)';
  cmx.beginPath(); cmx.ellipse(42.55*T, 26.55*T, T*.3, T*.09, 0, 0, TAU); cmx.fill();
  cmx.strokeStyle = '#6d5638'; cmx.lineWidth = Math.max(2.5, T*.07);
  cmx.beginPath(); cmx.moveTo(42.2*T, 25.3*T); cmx.lineTo(42.55*T, 26.45*T); cmx.stroke();
  cmx.strokeStyle = 'rgba(240,220,180,.25)'; cmx.lineWidth = 1.2;
  cmx.beginPath(); cmx.moveTo(42.17*T, 25.32*T); cmx.lineTo(42.5*T, 26.4*T); cmx.stroke();
  cmx.fillStyle = '#3f464f';
  cmx.beginPath();
  cmx.moveTo(42.4*T, 26.35*T); cmx.lineTo(42.75*T, 26.42*T);
  cmx.lineTo(42.68*T, 26.72*T); cmx.lineTo(42.42*T, 26.66*T);
  cmx.closePath(); cmx.fill();
  cmx.fillStyle = 'rgba(200,215,230,.28)';
  cmx.fillRect(42.42*T, 26.38*T, T*.22, 1.8);
  // a terra caída no chão, do quarto até a porta
  [[40.7,25.7],[41.2,26.2],[39.3,28.8],[42.2,29.2],[40.2,27]].forEach(([x,y]) => {
    const h = hash(x*3.3, y*5.1);
    cmx.fillStyle = 'rgba(58,51,46,' + (.35 + h*.3) + ')';
    cmx.beginPath(); cmx.ellipse(x*T, y*T, T*(.16 + h*.14), T*(.09 + h*.08), h*3, 0, TAU); cmx.fill();
    cmx.fillStyle = 'rgba(20,16,12,.5)';
    for(let k=0; k<3; k++){
      cmx.beginPath();
      cmx.arc(x*T + (hash(x + k, y) - .5)*T*.5, y*T + (hash(x, y + k) - .5)*T*.3, 1.3, 0, TAU);
      cmx.fill();
    }
  });
}

/* -- passe 5: os itens recortados da leva aprovada, assentados pelo pé -- */
function pintarFunImagens(cmx, T){
  const pImg = (nome, x, y, larg) => {
    const im = funImg(nome);
    if(!im.complete || !im.naturalWidth) return;
    const w = larg*T, h = im.naturalHeight*(w/im.naturalWidth);
    cmx.fillStyle = 'rgba(0,0,0,.32)';
    cmx.beginPath(); cmx.ellipse(x*T, y*T, w*.42, T*.16, 0, 0, TAU); cmx.fill();
    cmx.drawImage(im, x*T - w/2, y*T - h + T*.12, w, h);
  };
  /* o caixão do velório, no olho do mosaico: dossel, cortinas e o corpo sob a
     mortalha. As coroas e os castiçais já foram pintados em volta da pegada */
  pImg('item-caixao-velorio', 9.5, 11.3, 3.1);
  pImg('item-altar-calices', 9.5, 6.25, 2.5);      // capela: a mesa dos cálices, ao norte
  pImg('item-tumulo-pedra', 12.6, 6.7, 2.2);       // capela: o sepulcro velho da parede
  pImg('item-esquife-dourado', 20.3, 12.3, 2.4);   // preparação: o esquife de brocado, à espera
  pImg('item-esquife-negro', 26.0, 22.4, 2.4);     // salão: mais um coberto, a caminho da cova
  pImg('item-caixao-corrente', 15.3, 8.2, 1.25);   // capela: o caixão que ninguém abre
  pImg('item-caixao-cinza', 25.4, 12.6, 2.1);      // preparação: tampa à espera
  pImg('item-carroca', 35.3, 21.6, 2.1);           // salão: a carroça dos enterros
  pImg('item-caixao-escuro', 13.2, 22.4, 2.0);     // salão: a caminho da cova
  pImg('item-bancada-ferramentas', 10.3, 32.5, 1.5);
  pImg('item-cocho', 4.2, 34.7, 1.4);              // oficina: molhar as tábuas
  pImg('item-barris', 5.0, 40.9, 1.9);             // depósito
  pImg('item-feno', 9.8, 38.5, 1.6);
  pImg('item-potes', 3.9, 38.3, 1.2);
  pImg('item-mesa', 39.6, 28.3, 1.8);              // quarto do Coveiro
  pImg('item-banco', 41.7, 29.7, 1.1);
  pImg('item-lamparina', 42.8, 26.7, .7);

  /* ---- as lápides da cova grande ----
     Uma folha de 16 recortes, células de mesmo tamanho com o pé no rodapé —
     assim a cruz céltica continua mais alta que as pedras, sem cada uma
     precisar da sua medida. Todas encostam nas paredes: o miolo fica livre,
     que é onde o Coveiro cava em roda e a luta acontece. */
  const LAP_QL = 157, LAP_QA = 313;                // uma célula da folha
  const pLapide = (x, y, larg, quadro) => {
    const im = funImg('lapides');
    if(!im.complete || !im.naturalWidth) return;
    const w = larg*T, h = LAP_QA*(w/LAP_QL);
    cmx.fillStyle = 'rgba(0,0,0,.32)';             // a sombra segue o pé, não a célula
    cmx.beginPath(); cmx.ellipse(x*T, y*T, w*.30, T*.13, 0, 0, TAU); cmx.fill();
    cmx.drawImage(im, quadro*LAP_QL, 0, LAP_QL, LAP_QA, x*T - w/2, y*T - h + T*.12, w, h);
  };
  [[29.4, 4.2, .86,  7], [29.4, 7.0, .82, 12], [29.4, 10.2, .88,  4],   // parede oeste
   [29.5, 13.6, .80, 15],
   [34.5, 3.0, .92,  0], [39.8, 3.0, .84,  6], [41.5, 3.2, .78,  3],    // parede norte
   [43.6, 3.8, .86,  9], [43.7, 5.2, .80,  2], [43.6, 9.9, .85, 11],    // parede leste
   [31.4, 15.8, .83, 14], [34.9, 15.9, .86,  5]                          // parede sul
  ].forEach(([x, y, g, q]) => pLapide(x, y, g, q));

  /* vitrais: só a sala de velório os tem, e são os três da foto — cada recorte
     no seu lugar (esquerdo, lanceta alta do meio, direito). Nenhuma outra
     parede do piso leva vitral. */
  const vitral = (nome, x, y, larg, brilho) => {
    const im = funImg(nome);
    if(!im.complete || !im.naturalWidth) return;
    const w = larg*T, h = im.naturalHeight*(w/im.naturalWidth);
    const px = x*T, py = (y + 1)*T;                    // assentado na base da face
    cmx.fillStyle = 'rgba(0,0,0,.35)';                 // o vão fundo atrás do caixilho
    cmx.fillRect(px - w*.42, py - h*.92, w*.84, h*.86);
    cmx.drawImage(im, px - w/2, py - h, w, h);
    /* a luz colorida caindo no chão logo abaixo — é o que vende o vitral */
    const g = cmx.createLinearGradient(0, py, 0, py + T*1.15);
    g.addColorStop(0, 'rgba(120,150,225,' + (.20*brilho) + ')');
    g.addColorStop(.45, 'rgba(150,190,140,' + (.10*brilho) + ')');
    g.addColorStop(1, 'rgba(120,150,225,0)');
    cmx.fillStyle = g;
    cmx.beginPath();
    cmx.moveTo(px - w*.34, py); cmx.lineTo(px + w*.34, py);
    cmx.lineTo(px + w*.62, py + T*1.15); cmx.lineTo(px - w*.62, py + T*1.15);
    cmx.closePath(); cmx.fill();
  };
  vitral('vitral-esq',     6, 4, 1.5, 1);
  vitral('vitral-centro', 9.5, 4, 1.7, 1.15);
  vitral('vitral-dir',    13,  4, 1.5, 1);

  /* o corpo em preparo na mesa da Lavadeira: pintado deitado, nu com o pano
     de pudor, sujo de terra — a cabeça vem do recorte aprovado pelo dono */
  const cad = funImg('cadaver-cabeca');
  {
    const cx = 21.4*T, cy = 8.34*T;
    const meio = T*.09;
    const pele = (x1, w2, h2, dy) => {
      cmx.fillStyle = '#b9b2a6';
      cmx.beginPath(); cmx.ellipse(cx + x1, cy + (dy||0), w2, h2, 0, 0, TAU); cmx.fill();
      cmx.fillStyle = 'rgba(255,255,250,.14)';                 // a luz fria por cima
      cmx.beginPath(); cmx.ellipse(cx + x1, cy - h2*.3 + (dy||0), w2*.85, h2*.45, 0, 0, TAU); cmx.fill();
      cmx.fillStyle = 'rgba(60,58,76,.25)';                    // a sombra que escorre para a canaleta
      cmx.beginPath(); cmx.ellipse(cx + x1, cy + h2*.55 + (dy||0), w2*.9, h2*.35, 0, 0, TAU); cmx.fill();
    };
    /* deitado com a cabeça a oeste: tronco, braços colados, pernas afinando */
    pele(-T*.18, T*.34, T*.21);                                // o peito
    pele(T*.12, T*.30, T*.185);                                // o ventre
    pele(T*.62, T*.34, T*.13);                                 // as coxas
    pele(T*.92, T*.24, T*.10);                                 // as canelas
    cmx.fillStyle = '#a8a196';                                 // os pés
    cmx.beginPath(); cmx.ellipse(cx + T*1.06, cy - T*.055, T*.06, T*.045, .3, 0, TAU); cmx.fill();
    cmx.beginPath(); cmx.ellipse(cx + T*1.06, cy + T*.055, T*.06, T*.045, -.3, 0, TAU); cmx.fill();
    cmx.fillStyle = '#aca69b';                                 // os braços ao longo do corpo
    cmx.beginPath(); cmx.ellipse(cx - T*.02, cy - T*.20, T*.42, T*.05, 0, 0, TAU); cmx.fill();
    cmx.beginPath(); cmx.ellipse(cx - T*.02, cy + T*.20, T*.42, T*.05, 0, 0, TAU); cmx.fill();
    /* o pano de pudor sobre o quadril */
    cmx.fillStyle = '#ded8c8';
    cmx.fillRect(cx + T*.32, cy - T*.20, T*.24, T*.40);
    cmx.strokeStyle = 'rgba(120,114,100,.6)'; cmx.lineWidth = 1.2;
    for(let k=0; k<3; k++){
      const dx = cx + T*.36 + k*T*.07;
      cmx.beginPath(); cmx.moveTo(dx, cy - T*.18); cmx.quadraticCurveTo(dx + T*.03, cy, dx - T*.01, cy + T*.18); cmx.stroke();
    }
    cmx.fillStyle = 'rgba(255,255,250,.2)';
    cmx.fillRect(cx + T*.32, cy - T*.20, T*.24, 2);
    /* terra e livores: o morto chegou sujo do campo */
    for(let k=0; k<7; k++){
      const h = hash(k*3.1, k*7.7);
      cmx.fillStyle = k % 3 === 2 ? 'rgba(98,80,114,.30)' : 'rgba(88,68,48,.38)';
      cmx.beginPath();
      cmx.ellipse(cx - T*.35 + h*T*1.35, cy + (hash(k*9.3, k*1.7) - .5)*T*.32,
        T*(.03 + h*.05), T*(.02 + h*.03), h*3, 0, TAU);
      cmx.fill();
    }
    /* a água suja escorrendo do corpo para o furo da canaleta */
    cmx.strokeStyle = 'rgba(70,86,96,.4)'; cmx.lineWidth = 2;
    cmx.beginPath(); cmx.moveTo(cx + T*.8, cy + T*.28);
    cmx.quadraticCurveTo(cx + T*.95, cy + T*.34, cx + T*1.06, cy + T*.32); cmx.stroke();
    /* a cabeça recortada, deitada a oeste, de barriga para cima */
    if(cad.complete && cad.naturalWidth){
      const ch = T*.5, cw = cad.naturalWidth*(ch/cad.naturalHeight);
      cmx.save();
      cmx.translate(cx - T*.62, cy + meio - T*.06);
      cmx.rotate(-Math.PI/2);                                  // deitado, coroa para oeste
      cmx.drawImage(cad, -cw/2, -ch/2, cw, ch);
      cmx.restore();
    }
  }
}

/* ?piso=N   pula direto a um piso, herdando as recompensas dos anteriores
   &chefe=1  vai direto à luta do chefe, com os segredos já ouvidos
   &transicao=1  cai na vitória do piso, para rever a subida ao piso seguinte */
let atalhoChefe = false, atalhoTransicao = false;
(() => {
  const q = new URLSearchParams(location.search);
  const n = parseInt(q.get('piso') || '1', 10);
  pisoAtual = clamp((isNaN(n) ? 1 : n) - 1, 0, PISOS.length - 1);
  atalhoChefe = q.get('chefe') === '1';
  atalhoTransicao = q.get('transicao') === '1';
  for(let i = 0; i < pisoAtual; i++)
    if(PISOS[i].recompensa) adicionarAoInventario(PISOS[i].recompensa);   // já vestido, se for de vestir
})();
piso = PISOS[pisoAtual];
redimensionar();

/* o áudio só pode nascer de um gesto: destrava tudo no primeiro toque/tecla */
function destravarAudio(){
  iniAudio(); try{ if(ac && ac.state === 'suspended') ac.resume(); }catch(e){}
  if(bgmAudio && bgmAudio.paused){ try{ bgmAudio.play().catch(() => {}); }catch(e){} }
  else if(!bgmAudio && piso && piso.bgm && etapa !== 'menu') tocarBgm(piso.bgm);
}
['pointerdown','touchstart','keydown'].forEach(ev =>
  window.addEventListener(ev, destravarAudio, {capture:true}));

if(atalhoTransicao && pisoAtual + 1 < PISOS.length){
  /* monta o estado de vitória sem a luta: tarefas feitas, prêmio na bolsa,
     véu de vitória com "Subir a escada" — o clique roda a animação do castelo */
  iniciarPiso(piso);
  informantes.forEach(p => { p.feito = true; intel[p.chave] = true; });
  piso.missao.tarefas.forEach(t => marcarTarefa(t.id));
  if(piso.recompensa) adicionarAoInventario(piso.recompensa);
  etapa = 'fim';
  mostrarVeu(piso.textos.vitoria());
} else {
  /* sem tela inicial: a animação do castelo abre o jogo e a fase começa sozinha */
  el('veu').classList.add('oculto');
  animarCastelo(null, pisoAtual, () => {
    iniciarPiso(piso);
    tocarBgm(piso.bgm);
    const tit = piso.intro.titulo.replace(/<em>/, ' · ').replace(/<[^>]+>/g, '');
    const sub = piso.intro.texto.replace(/<[^>]+>/g, '').split(/(?<=\.)\s/)[0];
    avisar(tit, sub);
    if(atalhoChefe && piso.irAoChefe) piso.irAoChefe();
  });
}
requestAnimationFrame(quadro);
</script>
</body>
</html>
