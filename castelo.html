}
/* mesma legenda dos prisioneiros, mas para uma fala avulsa (a abertura do chefe):
   nada de intel/segredos no fim — só o callback, que é quem solta a luta */
function abrirFala(p, aoFim){
  dialogo = {inf:p, i:0, aoFim};
  pausado = true;
  fundirBgm(BGM_VOL_FALA);
  el('dialogo').classList.add('on');
  mostrarFala();
}
function mostrarFala(){
  const p = dialogo.inf;
  el('dNome').textContent = p.nome;
  el('dFala').textContent = p.falas[dialogo.i];
  el('dSeguir').textContent = dialogo.i < p.falas.length-1 ? 'tocar para continuar' : 'tocar para encerrar';
  const box = el('dRetratoBox'), img = el('dRetrato');
  if(p.retrato){ img.src = p.retrato; img.alt = p.nome; box.classList.add('on'); }
  else box.classList.remove('on');
  sFala();
  falarVoz(p.falas[dialogo.i], p.voz, p.voz.audios && p.voz.audios[dialogo.i]);
}
/* pular a conversa inteira: vale o mesmo que ouvir até o fim (segredo, contador, callback) —
   para quem já falou com o personagem algum dia e só quer seguir */
function pularDialogo(){
  if(!dialogo) return;
  dialogo.i = dialogo.inf.falas.length - 1;
  avancarDialogo();
}
function avancarDialogo(){
  if(!dialogo) return;
  dialogo.i++;
  if(dialogo.i < dialogo.inf.falas.length){ mostrarFala(); return; }
  const p = dialogo.inf, aoFim = dialogo.aoFim;
  if(aoFim){
    dialogo = null; pausado = false;
    fundirBgm(bgmVolAtual);
    calarVoz();
    el('dialogo').classList.remove('on');
    aoFim();
    return;
  }
  if(!p.feito){
    p.feito = true;
    intel[p.chave] = true;
    const n = informantes.filter(i => i.feito).length;
    const tid = piso.missao.tarefaInformantes;
    const cont = el(tid + '-cont');
    if(cont) cont.textContent = n + '/' + informantes.length;
    if(n === informantes.length) marcarTarefa(tid); else sTarefa();
    avisar('Você entendeu', p.ganho);
    atualizarHUD();
  }
  dialogo = null; pausado = false;
  fundirBgm(bgmVolAtual);
  calarVoz();
  el('dialogo').classList.remove('on');
}

/* ---------- chefe genérico (máquina de estados dirigida por cfg) ---------- */
/* vozes gravadas do chefe — cada clipe só recomeça depois de terminar */
const vozesChefe = {};
function vozChefe(nome){
  let a = vozesChefe[nome];
  if(!a){
    a = new Audio('audio/' + nome + '.mp3');
    a.volume = 1;
    vozesChefe[nome] = a;
  }
  if(!a.paused && !a.ended) return false;   // clipe ocupado: quem chamou pode usar a síntese
  try{ a.currentTime = 0; a.play().catch(() => {}); }catch(e){}
  return true;
}
function criarChefe(){
  const f = piso.chefe.cfg;
  chefe = {
    cfg:f, x:f.x, y:f.y, vx:0, vy:0, raio:f.raio, hp:f.hp, hpMax:f.hp,
    estado:'espera', t:f.esperaT, golpes:0, angulo:Math.PI, flash:0,
    investindo:false, bateuParede:false, pisada:0, escudoBate:0, bateu:0, golpeAnim:0, fase:0,
    mergulhos:0
  };
  el('chefeNome').textContent = f.nome;
  el('chefeBarra').classList.add('on');
  const entrar = () => { if(f.entrada) avisar(f.entrada[0], f.entrada[1]); };
  if(f.abertura){
    // ele fala primeiro, com legenda; a luta só corre quando o jogador fecha
    abrirFala({nome:f.nome, retrato:f.retrato, falas:f.abertura.falas, voz:f.abertura.voz}, entrar);
  } else {
    setTimeout(entrar, 900);
    if(f.sons && f.sons.entrada) vozChefe(f.sons.entrada);
  }
}
function dirLivre(c, ax, ay){
  const base = Math.atan2(ay, ax);
  for(const off of [0, .45, -.45, .95, -.95, 1.5, -1.5]){
    const a = base + off;
    const nx = c.x + Math.cos(a)*(c.raio + .5), ny = c.y + Math.sin(a)*(c.raio + .5);
    if(!solido(nx, ny)) return [Math.cos(a), Math.sin(a)];
  }
  return [ax, ay];
}
function bateEscudo(c){       // a telegrafia da investida: corrente no chão, faca na mesa...
  c.bateu++; c.escudoBate = .22;
  if(c.cfg.somBatida) tocarSfx(c.cfg.somBatida, 1, sEscudoBate);
  else sEscudoBate();
  sFerro();
  tremor = 8;
  const mira = c.mira != null ? c.mira : c.angulo;
  const bx = c.x + Math.cos(mira)*1.5, by = c.y + Math.sin(mira)*1.5 + .5;
  for(let k=0;k<10;k++) faisca(bx, by, '#cbb98e', .14);
}
function golpeChefe(dano, alcance){
  const dx = jog.x-chefe.x, dy = jog.y-chefe.y, d = Math.hypot(dx,dy);
  const ang = Math.atan2(dy,dx);
  const dif = Math.abs(((ang - chefe.angulo + Math.PI*3) % TAU) - Math.PI);
  chefe.golpeAnim = .22;
  const sons = chefe.cfg.sons;
  if(sons && sons.golpe) vozChefe(sons.golpe);
  /* cada chefe bate com o que tem na mão: o Coveiro não corta, ele bate de pá */
  const pa = chefe.cfg.armaSom === 'pa';
  if(pa) sPaCorta(); else sEspadaCorta();
  for(let k=0;k<6;k++) faisca(chefe.x + Math.cos(chefe.angulo)*1.4, chefe.y + Math.sin(chefe.angulo)*1.4, '#e0d0b0', .12);
  if(d < alcance && dif < 1.25){
    if(pa) sPaAcerta();            // chapa no corpo, com ou sem o golpe do jogador
    else if(jog.golpe > 0) sClash();   // o jogador também estava golpeando: aço contra aço
    else sCorte();                 // o gemido vem do machucar (sDorJog)
    machucar(dano, ang); jog.vx += Math.cos(ang)*10; jog.vy += Math.sin(ang)*10;
  }
}
function atualizarChefe(dt){
  const c = chefe, f = c.cfg;
  /* a cartada final: quando a vida cai abaixo do limiar, uma vez só */
  if(f.desespero){
    if(atualizarDesespero(c, f, dt)){ c.t -= dt; c.fase += dt; atualizarBarraChefe(); return; }
    if(!c.usouDesespero && c.hp <= c.hpMax*f.desespero.abaixoDe &&
       c.estado !== 'atordoado' && Math.hypot(jog.x-c.x, jog.y-c.y) < f.desespero.alcance){
      entrarAbraco(c, f); return;
    }
  }
  c.flash = Math.max(0, c.flash - dt*3);
  c.escudoBate = Math.max(0, c.escudoBate - dt);
  c.golpeAnim = Math.max(0, c.golpeAnim - dt);
  c.fase += dt;
  c.t -= dt;
  const dx = jog.x-c.x, dy = jog.y-c.y, d = Math.max(.01, Math.hypot(dx,dy));

  // só reposiciona a mira quando não está comprometido com um golpe
  if(c.estado === 'espera' || c.estado === 'aproxima' || c.estado === 'preparo') c.angulo = Math.atan2(dy,dx);

  switch(c.estado){
    case 'espera':
      /* quem chega ao alcance não espera a vez: o golpe sai na hora
         (cfg.reageDeImediato) — parado, ele deixava bater à vontade */
      if(f.reageDeImediato && d < f.comboDist){
        c.estado = 'combo'; c.golpes = 0; c.t = .12;
      }
      else if(c.t <= 0){ c.estado = 'aproxima'; c.t = f.aproximaT; }
      break;

    case 'aproxima': {
      const [ax, ay] = dirLivre(c, dx/d, dy/d);
      c.vx += ax*f.velAproxima*9*dt; c.vy += ay*f.velAproxima*9*dt;
      c.vx -= c.vx*7*dt; c.vy -= c.vy*7*dt;
      mover(c, c.vx*dt, c.vy*dt);
      c.pisada += dt;
      if(c.pisada > (c.proxPasso||0)){ sPassoChefe(); tremor = Math.max(tremor, f.tremorPasso || 2); c.proxPasso = c.pisada + .38; }
      if(d < f.comboDist){ c.estado = 'combo'; c.golpes = 0; c.t = f.comboIntervalo + .03; }
      else if(c.t <= 0 && d > f.investidaDist){ c.estado = 'preparo'; c.t = f.preparoT; c.bateu = 0; c.mira = Math.atan2(dy,dx); }
      break;
    }

    case 'combo':
      c.vx *= .86; c.vy *= .86;
      mover(c, c.vx*dt, c.vy*dt);
      if(c.t <= 0){
        c.golpes++;
        const i = Math.min(c.golpes, f.comboGolpes) - 1;
        golpeChefe(f.comboDano[i], f.comboAlcance[i]);
        if(c.golpes >= f.comboGolpes){
          if(f.cavaT) entrarCava(c, f);          // ciclo subterrâneo (só com cfg.cavaT)
          else { c.estado = 'exausto'; c.t = f.exaustoT; }
        }
        else c.t = f.comboIntervalo;
      }
      break;

    case 'exausto':
      c.vx *= .8; c.vy *= .8;
      /* levantou sem fôlego e o jogador ainda está colado? pá primeiro */
      if(c.t <= 0){
        if(f.reageDeImediato && d < f.comboDist){ c.estado = 'combo'; c.golpes = 0; c.t = .12; }
        else { c.estado = 'aproxima'; c.t = f.aproximaT; }
      }
      break;

    case 'preparo':
      c.vx *= .8; c.vy *= .8;
      if(c.bateu < f.batidasEm.length) c.mira = Math.atan2(dy,dx);   // depois da última batida, direção selada
      if(c.bateu < f.batidasEm.length && c.t <= f.batidasEm[c.bateu]) bateEscudo(c);
      if(c.t <= 0){
        c.estado = 'investida'; c.t = f.investidaT; c.investindo = true; c.bateuParede = false;
        c.vx = Math.cos(c.mira)*f.investidaVel; c.vy = Math.sin(c.mira)*f.investidaVel;
        sInvestida();
      }
      break;

    case 'investida': {
      mover(c, c.vx*dt, c.vy*dt);
      c.pisada += dt*2.5;
      if(c.pisada > (c.proxPasso||0)){ sPassoChefe(); tremor = Math.max(tremor, f.tremorPasso || 2); c.proxPasso = c.pisada + .34; }
      if(Math.random() < .6) faisca(c.x, c.y, '#c9a77a', .07);
      if(d < c.raio + jog.raio + .3){ machucar(f.investidaDano); jog.vx += (dx/d)*14; jog.vy += (dy/d)*14; }
      if(c.bateuParede){
        c.estado = 'zonzo'; c.t = f.zonzoT; c.investindo = false; c.vx = c.vy = 0;
        tremor = 16; sBaterParede();
        for(let k=0;k<18;k++) faisca(c.x, c.y, '#d8cdb8', .16);
      } else if(c.t <= 0){ c.estado = 'aproxima'; c.t = f.aproximaT; c.investindo = false; }
      break;
    }

    case 'zonzo':
      if(c.t <= 0){ c.estado = 'aproxima'; c.t = f.aproximaT; }
      break;

    /* ---- ciclo subterrâneo (só entra aqui quando o cfg tem cavaT) ---- */
    case 'cava':                    // mergulho: meio segundo afundando na terra
      c.vx *= .7; c.vy *= .7;
      if(Math.random() < .6) terraRevolvida(c.x + (Math.random()-.5)*c.raio*1.4, c.y + (Math.random()-.5)*c.raio*.7);
      if(c.t <= 0){ c.estado = 'persegue'; c.t = f.persegueT; }
      break;

    case 'persegue': {              // submerso e invulnerável: só o rastro persegue
      const [ax, ay] = dirLivre(c, dx/d, dy/d);
      c.vx += (ax*f.persegueVel - c.vx)*Math.min(1, dt*6);
      c.vy += (ay*f.persegueVel - c.vy)*Math.min(1, dt*6);
      mover(c, c.vx*dt, c.vy*dt);
      if(Math.random() < .8) terraRevolvida(c.x + (Math.random()-.5)*.9, c.y + (Math.random()-.5)*.5);
      tremor = Math.max(tremor, 1.5);
      if(c.t <= 0){ c.estado = 'irrompe'; c.t = f.irromperAvisoT; c.vx = c.vy = 0; }
      break;
    }

    case 'irrompe':                 // o ponto travou: círculo de aviso, então a emersão
      if(c.t <= 0){
        c.mergulhos++;
        const ang = Math.atan2(dy, dx);
        const acertou = d < f.irromperRaio;
        c.angulo = ang; c.golpeAnim = .22;
        tremor = 22;
        if(f.sons && f.sons.irrompe) vozChefe(f.sons.irrompe); else sBaterParede();
        for(let k=0;k<26;k++)
          terraRevolvida(c.x + (Math.random()-.5)*f.irromperRaio*1.5, c.y + (Math.random()-.5)*f.irromperRaio);
        if(acertou){ machucar(f.irromperDano, ang); jog.vx += Math.cos(ang)*13; jog.vy += Math.sin(ang)*13; }
        if(f.mergulhosAteExausto && c.mergulhos >= f.mergulhosAteExausto){
          c.mergulhos = 0; c.estado = 'exausto'; c.t = f.exaustoT;      // sem fôlego: janela longa
        }
        else if(!acertou){ c.estado = 'atordoado'; c.t = f.atordoadoT; } // errou: janela de dano
        else { c.estado = 'aproxima'; c.t = f.aproximaT; }
      }
      break;

    case 'atordoado':               // o par do 'zonzo' para quem cava
      c.vx *= .8; c.vy *= .8;
      if(c.t <= 0){ c.estado = 'aproxima'; c.t = f.aproximaT; }
      break;
  }
  atualizarBarraChefe();
}
/* entra na terra: o começo do ciclo cava -> persegue -> irrompe */
function entrarCava(c, f){
  c.estado = 'cava'; c.t = f.cavaT;
  c.vx = c.vy = 0; c.investindo = false;
  if(f.sons && f.sons.cava) vozChefe(f.sons.cava);
  tremor = Math.max(tremor, 8);
  for(let k=0;k<14;k++) terraRevolvida(c.x + (Math.random()-.5)*c.raio*1.6, c.y + (Math.random()-.5)*c.raio*.8);
}
/* debaixo da terra ele não é visto, não empurra e não leva golpe */
function chefeSubmerso(c){
  return !!(c && c.cfg && c.cfg.cavaT) &&
         (c.estado === 'cava' || c.estado === 'persegue' || c.estado === 'irrompe' ||
          c.estado === 'enterrando');
}
/* ---- o desespero do chefe encurralado (cfg.desespero) ----
   Quase morto, ele agarra o jogador, afunda os dois na terra por alguns
   segundos e sai cuspindo a vítima longe. Escapar não dá: é o preço de
   deixá-lo chegar a esta altura da vida. */
function entrarAbraco(c, f){
  const de = f.desespero;
  c.estado = 'abraca'; c.t = .5;
  c.vx = c.vy = 0;
  c.usouDesespero = true;
  jog.vx = jog.vy = 0;
  tremor = 14;
  if(de.aviso) avisar(de.aviso[0], de.aviso[1]);
  if(f.sons && f.sons.cava) vozChefe(f.sons.cava);
  for(let k=0;k<24;k++) terraRevolvida(c.x + (Math.random()-.5)*2.4, c.y + (Math.random()-.5)*1.2);
}
function atualizarDesespero(c, f, dt){
  const de = f.desespero;
  switch(c.estado){
    case 'abraca':                       // o bote: ele fecha os braços no jogador
      c.x += (jog.x - c.x)*Math.min(1, dt*9);
      c.y += (jog.y - c.y)*Math.min(1, dt*9);
      jog.vx = jog.vy = 0;
      if(c.t <= 0){
        c.estado = 'enterrando'; c.t = de.enterradoT;
        tremor = 16;
        for(let k=0;k<30;k++) terraRevolvida(jog.x + (Math.random()-.5)*2, jog.y + (Math.random()-.5)*1.4);
      }
      return true;
    case 'enterrando': {                 // os dois debaixo da terra: dreno e escuro
      c.x = jog.x; c.y = jog.y;
      jog.vx = jog.vy = 0;
      c.dreno = (c.dreno || 0) + dt;
      if(c.dreno >= 1){                  // uma dentada de dano por segundo lá embaixo
        c.dreno -= 1;
        jog.invul = 0; machucar(de.danoPorSegundo, Math.random()*TAU);
        if(Math.random() < .6) terraRevolvida(jog.x + (Math.random()-.5)*1.2, jog.y);
      }
      if(Math.random() < .35) terraRevolvida(jog.x + (Math.random()-.5)*2, jog.y + .3);
      if(c.t <= 0){
        c.estado = 'cospe'; c.t = .35;
        /* ele emerge no lugar e cospe o jogador do OUTRO LADO da terra: procura
           em volta o ponto livre mais distante e o larga lá, não empurra */
        const alcance = de.distancia || 9;
        let melhor = null, melhorD = -1;
        for(let k=0; k<24; k++){
          const ang2 = k/24*TAU;
          for(let dist = alcance; dist >= 3; dist -= .5){
            const tx = c.x + Math.cos(ang2)*dist, ty = c.y + Math.sin(ang2)*dist;
            const ar = de.area;                      // não cospe para fora da arena
            if(ar && (tx < ar.x1 || tx > ar.x2 || ty < ar.y1 || ty > ar.y2)) continue;
            if(solido(tx, ty) || solido(tx, ty - .4) || solido(tx, ty + .4)) continue;
            if(dist > melhorD){ melhorD = dist; melhor = [tx, ty, ang2]; }
            break;                                   // desta direção, o mais longe que dá
          }
        }
        const a = melhor ? melhor[2] : Math.random()*TAU;
        /* o jogador é ARREMESSADO à vista: voa em arco daqui até lá, girando,
           e só bate no chão no fim (nada de sumir e reaparecer) */
        const dano = de.comoPazada ? Math.round(f.comboDano[0]*(de.pazadas || 1)) : de.danoArremesso;
        for(let k=0;k<20;k++) terraRevolvida(jog.x + (Math.random()-.5)*1.4, jog.y);
        if(melhor){
          jog.voo = {x0:jog.x, y0:jog.y, x1:melhor[0], y1:melhor[1], t:0, dur:.72, ang:a, dano};
        } else {
          jog.vx = Math.cos(a)*de.arremesso*.35;
          jog.vy = Math.sin(a)*de.arremesso*.35;
          jog.invul = 0; machucar(dano, a);
        }
        jog.dash = 0; jog.dashCd = 1;
        tremor = 18;
        if(f.sons && f.sons.irrompe) vozChefe(f.sons.irrompe);
        for(let k=0;k<34;k++) terraRevolvida(c.x + (Math.random()-.5)*2.6, c.y + (Math.random()-.5)*1.6);
      }
      return true;
    }
    case 'cospe':                        // ele sai da terra ofegante: a janela do jogador
      c.vx *= .8; c.vy *= .8;
      if(c.t <= 0){ c.estado = 'exausto'; c.t = f.exaustoT; }
      return true;
  }
  return false;
}
/* torrão de terra revolvida saltando do chão */
const CORES_TERRA = ['#4a3a26','#5c4830','#3a2d1d','#6b5638'];
function terraRevolvida(x, y){
  particulas.push({x, y, vx:(Math.random()-.5)*2.2, vy:-.8 - Math.random()*1.8,
    vida:.4 + Math.random()*.4, cor:CORES_TERRA[irand(CORES_TERRA.length)],
    tam:.06 + Math.random()*.08});
}
/* rastro de terra + aviso de emersão: o motor chama antes do desenhar do conteúdo;
   devolve true enquanto o chefe está debaixo da terra (o corpo não aparece) */
function desenharChefeSubterraneo(c, ox, oy){
  const f = c.cfg;
  if(!chefeSubmerso(c)) return false;
  const px = ox + c.x*tam, py = oy + c.y*tam;
  if(c.estado === 'enterrando'){
    /* os dois estão lá embaixo: a tela escurece e a terra ferve por cima */
    const p = 1 - Math.max(0, c.t)/f.desespero.enterradoT;
    ctx.fillStyle = 'rgba(12,8,4,' + (.55 + Math.sin(tempo*3)*.06) + ')';
    ctx.fillRect(0, 0, tela.width, tela.height);
    const bx = ox + jog.x*tam, by = oy + jog.y*tam;
    for(let i=0;i<4;i++){
      const w = Math.sin(tempo*9 + i*1.7);
      ctx.fillStyle = i === 1 ? '#5c4830' : '#4a3a26';
      ctx.beginPath();
      ctx.ellipse(bx + (i-1.5)*tam*.5 + w*tam*.1, by + tam*.06 - Math.abs(w)*tam*.14,
                  tam*(.5 - i*.06), tam*(.3 - i*.04), w*.25, 0, TAU);
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(226,74,74,' + (.25 + .3*Math.abs(Math.sin(tempo*6))) + ')';
    ctx.lineWidth = Math.max(2, tam*.1);
    ctx.beginPath(); ctx.arc(bx, by, tam*(1.1 + p*.5), 0, TAU); ctx.stroke();
    return true;
  }
  if(c.estado === 'cava') return false;         // ainda afundando: o conteúdo desenha o mergulho
  // lombadas de terra revolvida se deslocando
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(px, py + tam*.16, c.raio*tam*1.05, c.raio*tam*.4, 0, 0, TAU); ctx.fill();
  for(let i=0;i<3;i++){
    const w = Math.sin(tempo*11 + i*2.1);
    ctx.fillStyle = i === 1 ? '#5c4830' : '#4a3a26';
    ctx.beginPath();
    ctx.ellipse(px + (i-1)*c.raio*tam*.5 + w*tam*.06, py + tam*.05 - Math.abs(w)*tam*.1,
                c.raio*tam*(.44 - i*.06), c.raio*tam*(.26 - i*.04), w*.2, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(214,196,160,.14)';
  ctx.beginPath(); ctx.ellipse(px, py - tam*.06, c.raio*tam*.5, c.raio*tam*.14, 0, 0, TAU); ctx.fill();
  /* o segredo do rastro: quem soube ler a terra revolvida vê o ponto de saída
     desde a perseguição, muito antes do aviso vermelho abrir (F3-RF-18) */
  const fqR = piso.chefe && piso.chefe.fraquezas && piso.chefe.fraquezas.costas;
  if(c.estado === 'persegue' && fqR && intel[fqR.chave]){
    const pulso = .5 + Math.sin(tempo*5)*.5;
    ctx.setLineDash([tam*.18, tam*.14]);
    ctx.strokeStyle = 'rgba(226,180,120,' + (.22 + pulso*.26) + ')';
    ctx.lineWidth = Math.max(1.5, tam*.05);
    ctx.beginPath(); ctx.arc(px, py, f.irromperRaio*tam*.9, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  if(c.estado === 'irrompe'){                   // círculo telegrafado piscando no chão
    const p = 1 - Math.max(0, c.t)/f.irromperAvisoT;
    const pisca = Math.abs(Math.sin(tempo*14));
    const r = f.irromperRaio*tam;
    ctx.fillStyle = 'rgba(226,74,74,' + (.07 + .12*pisca + .1*p) + ')';
    ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(226,74,74,' + (.3 + .5*pisca) + ')';
    ctx.lineWidth = Math.max(2, tam*.09);
    ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,190,120,' + (.25 + .45*p) + ')';
    ctx.lineWidth = Math.max(1, tam*.05);
    ctx.beginPath(); ctx.arc(px, py, r*p, 0, TAU); ctx.stroke();   // o tempo fechando
  }
  return true;
}
function atualizarBarraChefe(){
  el('chefeFill').style.transform = 'scaleX(' + Math.max(0, chefe.hp/chefe.hpMax) + ')';
  const fq = piso.chefe.fraquezas, f = chefe.cfg;
  const sabeExausto = fq.porEstado.exausto && intel[fq.porEstado.exausto.chave];
  let txt = '';
  const sv = f.soVulneravelEm;
  const guardado = sv && sv.indexOf(chefe.estado) < 0;
  if(chefe.estado === 'exausto' && sabeExausto) txt = 'sem fôlego';
  else if(chefe.estado === 'zonzo') txt = 'zonzo';
  else if(chefe.estado === 'atordoado') txt = 'atordoado';
  else if(chefe.estado === 'cava' || chefe.estado === 'persegue' || chefe.estado === 'irrompe')
    txt = (sabeExausto && f.mergulhosAteExausto)          // a chave dos mergulhos conta o ciclo
      ? 'mergulho ' + Math.min(f.mergulhosAteExausto, chefe.mergulhos + 1) + ' de ' + f.mergulhosAteExausto
      : 'cavando...';
  else if(chefe.estado === 'combo' && sabeExausto)
    txt = 'golpe ' + Math.min(f.comboGolpes, chefe.golpes+1) + ' de ' + f.comboGolpes;
  /* fora dos estados vulneráveis a lâmina não entra: o HUD avisa, senão o
     jogador acha que o golpe está bugado */
  if(chefe.estado === 'abraca') txt = 'ele te agarrou';
  else if(chefe.estado === 'enterrando') txt = 'debaixo da terra';
  else if(chefe.estado === 'cospe') txt = 'te cuspiu fora';
  if(guardado && !txt) txt = 'guarda fechada';
  el('chefeEstado').textContent = txt;
}

/* ---------- combate do jogador ---------- */
function golpear(alvo){
  if(chefeSubmerso(alvo)) return;      // debaixo da terra não há o que cortar
  jog.golpe = .2; jog.recarga = .36;
  sGolpe();
  /* chefe que só abre a guarda em certos estados (cfg.soVulneravelEm): fora
     deles a lâmina bate na pá e volta — o golpe existe, o dano não */
  const sv = alvo.cfg && alvo.cfg.soVulneravelEm;
  if(sv && sv.indexOf(alvo.estado) < 0){
    sClash(); tremor = 3;
    faisca(alvo.x + (jog.x < alvo.x ? -1 : 1)*alvo.raio*.8, alvo.y - .2, '#cfd6e8', .12);
    flutuar(alvo.x, alvo.y - .5, 'guardado', '#9aa4bd');
    return;
  }
  const dx = alvo.x-jog.x, dy = alvo.y-jog.y, d = Math.hypot(dx,dy);
  jog.angulo = Math.atan2(dy,dx);
  let dano = jog.dano + irand(5);

  const fq = piso.chefe.fraquezas;
  const porTras = Math.abs(((jog.angulo - alvo.angulo + Math.PI*3) % TAU) - Math.PI) < 1.1;
  if(porTras) dano *= intel[fq.costas.chave] ? fq.costas.com : fq.costas.sem;
  const fe = fq.porEstado[alvo.estado];
  if(fe) dano *= intel[fe.chave] ? fe.com : fe.sem;
  dano = Math.round(dano);

  alvo.hp -= dano; alvo.flash = 1;
  if(alvo.golpeAnim > 0){          // os dois golpearam ao mesmo tempo: aço contra aço
    sClash();
  } else {
    sCorte();
    jorrarSangue(alvo.x, alvo.y, jog.angulo, 14);            // o corte abre carne
    if(Math.random() < .6) mancharSangue(alvo.x, alvo.y + .5);
    const sons = alvo.cfg && alvo.cfg.sons;
    setTimeout(() => { if(!(sons && sons.levaGolpe && vozChefe(sons.levaGolpe))) sDorChefe(); }, 60);
  }
  flutuar(alvo.x, alvo.y-.5, dano, dano > jog.dano*1.8 ? '#ffd88a' : '#f4e2b4');
  faisca(alvo.x - dx/d*alvo.raio, alvo.y - dy/d*alvo.raio, '#f0c070', .12);
  tremor = 4;
  if(alvo.hp <= 0) venceu();
}
/* o arremesso em voo: leva o jogador de um ponto ao outro em arco. Enquanto
   voa, ele não obedece ao controle — só cai. */
function atualizarVoo(dt){
  const v = jog.voo;
  if(!v) return false;
  v.t += dt;
  const p = Math.min(1, v.t/v.dur);
  jog.x = v.x0 + (v.x1 - v.x0)*p;
  jog.y = v.y0 + (v.y1 - v.y0)*p;
  jog.vx = jog.vy = 0;
  v.alt = Math.sin(p*Math.PI);                  // a parábola: sobe e desce
  if(Math.random() < .5) terraRevolvida(jog.x + (Math.random()-.5)*.6, jog.y + .2);
  if(p >= 1){
    jog.voo = null;
    tremor = 12;
    for(let k=0;k<24;k++) terraRevolvida(jog.x + (Math.random()-.5)*2, jog.y + (Math.random()-.5)*.7);
    jog.invul = 0; machucar(v.dano, v.ang);      // a conta é paga no impacto
    jog.invul = Math.max(jog.invul, .8);         // e um respiro para se levantar
    sDorJog();
  }
  return true;
}
function machucar(dano, ang){
  if(jog.invul > 0 || !vivo) return;
  if(!(dano > 0)) return;              // dano undefined/NaN tornava o jogador imortal
  jog.hp -= dano; jog.invul = .45; jog.flash = 1; tremor = 11;
  sDorJog();
  jorrarSangue(jog.x, jog.y, ang != null ? ang : -Math.PI/2 + (Math.random()-.5)*.8, 10);
  if(Math.random() < .5) mancharSangue(jog.x, jog.y + .3);
  flutuar(jog.x, jog.y-.4, dano, '#ff8a96');
  atualizarHUD();
  if(jog.hp <= 0) morrer();
}
function venceu(){
  chefe.hp = 0; etapa = 'fim'; vivo = true;
  marcarTarefa(piso.missao.tarefaChefe);
  for(let k=0;k<40;k++) faisca(chefe.x, chefe.y, '#e8a13c', .2);
  sVitoria();
  el('chefeBarra').classList.remove('on');
  const premioNovo = piso.recompensa && adicionarAoInventario(piso.recompensa);
  if(piso.aoVencer) piso.aoVencer();
  pararBgm(); pararAmbientes();
  setTimeout(() => mostrarVeu(piso.textos.vitoria()), 1500);
  if(premioNovo) setTimeout(() => abrirPopupInventario(piso.recompensa, 'Guardar'), 1600);
}
function morrer(){
  jog.hp = 0; vivo = false;
  for(let k=0;k<30;k++) faisca(jog.x, jog.y, '#c0455a', .16);
  sMorrer();
  pararBgm(); pararAmbientes();
  setTimeout(() => mostrarVeu(piso.textos.derrota()), 1100);
}
function usarTrapo(){
  if(!vivo || pausado || jog.pocoes <= 0 || jog.hp >= jog.hpMax) return;
  jog.pocoes--;
  jog.hp = Math.min(jog.hpMax, jog.hp + 40);
  flutuar(jog.x, jog.y, '+40', '#8fc48a');
  for(let k=0;k<12;k++) faisca(jog.x, jog.y, '#8fc48a', .09);
  sTrapo();
  atualizarHUD();
}
function rolar(){
  if(!vivo || pausado || jog.dashOff || jog.dashCd > 0) return;
  const m = Math.hypot(entrada.x, entrada.y);
  const ax = m > .2 ? entrada.x/m : Math.cos(jog.angulo);
  const ay = m > .2 ? entrada.y/m : Math.sin(jog.angulo);
  jog.vx = ax*20; jog.vy = ay*20;
  jog.dash = .18; jog.dashCd = 1.0; jog.invul = Math.max(jog.invul, .30);
  sRolar();
}
function agir(){
  if(!interacao || pausado || !vivo) return;
  if(interacao.tipo === 'falar') abrirDialogo(interacao.alvo);
  else if(piso.agir) piso.agir(interacao);
}

/* ---------- entrada ---------- */
const entrada = {x:0, y:0};
let toqueId = null, jbx = 0, jby = 0, jvx = 0, jvy = 0, joyAtivo = false;
const teclas = {};
tela.addEventListener('touchstart', e => {
  e.preventDefault();
  if(dialogo){ avancarDialogo(); return; }
  for(const t of e.changedTouches){
    if(toqueId === null && t.clientX < window.innerWidth*.6){
      toqueId = t.identifier; jbx = jvx = t.clientX; jby = jvy = t.clientY; joyAtivo = true;
    }
  }
}, {passive:false});
window.addEventListener('contextmenu', e => e.preventDefault());
tela.addEventListener('touchmove', e => {
  for(const t of e.changedTouches) if(t.identifier === toqueId){ jvx = t.clientX; jvy = t.clientY; }
}, {passive:true});
const soltar = e => {
  for(const t of e.changedTouches) if(t.identifier === toqueId){ toqueId = null; joyAtivo = false; entrada.x = entrada.y = 0; }
};
tela.addEventListener('touchend', soltar, {passive:true});
tela.addEventListener('touchcancel', soltar, {passive:true});
el('dialogo').addEventListener('touchstart', e => { e.preventDefault(); avancarDialogo(); }, {passive:false});
el('dialogo').addEventListener('mousedown', avancarDialogo);
el('dPular').addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); pularDialogo(); }, {passive:false});
el('dPular').addEventListener('mousedown', e => { e.stopPropagation(); pularDialogo(); });
tela.addEventListener('mousedown', () => { if(dialogo) avancarDialogo(); });

window.addEventListener('keydown', e => {
  if(e.target && e.target.tagName === 'INPUT') return;   // digitando a senha: o jogo não ouve
  if(e.key.toLowerCase() === 'p' || e.key === 'Escape'){ e.preventDefault(); alternarPausa(); return; }
  if(pausaMenu) return;                 // pausado: o teclado não chega ao jogo
  teclas[e.key.toLowerCase()] = true;
  if(e.key === ' '){ e.preventDefault(); if(dialogo) avancarDialogo(); else rolar(); }
  if(e.key === 'Escape') abrirMenu();
  if(e.key.toLowerCase() === 'e'){ if(dialogo) avancarDialogo(); else agir(); }
  if(e.key.toLowerCase() === 'q') usarTrapo();
  if(e.key.toLowerCase() === 'f' && piso.acaoGolpe) piso.acaoGolpe();
  if(e.key.toLowerCase() === 'i') abrirInventario();
});
window.addEventListener('keyup', e => { teclas[e.key.toLowerCase()] = false; });
function lerEntrada(){
  if(joyAtivo){
    const dx = jvx-jbx, dy = jvy-jby, d = Math.hypot(dx,dy), max = 52;
    if(d > 4){ const f = Math.min(1, d/max); entrada.x = dx/d*f; entrada.y = dy/d*f; }
    else entrada.x = entrada.y = 0;
  } else {
    let x=0, y=0;
    if(teclas['a']||teclas['arrowleft']) x--; if(teclas['d']||teclas['arrowright']) x++;
    if(teclas['w']||teclas['arrowup']) y--; if(teclas['s']||teclas['arrowdown']) y++;
    const m = Math.hypot(x,y);
    entrada.x = m ? x/m : 0; entrada.y = m ? y/m : 0;
  }
}

/* ---------- atualização ---------- */
function atualizar(dt){
  if(pausaMenu) return;                 // pausa do jogador: nem as fagulhas andam
  tempo += dt;
  atualizarParticulas(dt);
  /* os ambientes fundem mesmo com o jogo pausado: é o diálogo (que pausa tudo)
     que mais precisa do ducking — congelar aqui deixava os ajudantes gritando */
  atualizarAmbientes(dt);
  atualizarDuckSfx();                 // o ducking também vale para o que já estava tocando
  if(!jog || etapa === 'menu' || pausado || !vivo) return;
  checarOfertaVestir(dt);
  if(atualizarVoo(dt)){
    camX += (jog.x - camX)*Math.min(1, dt*7);      // a câmera acompanha o voo
    camY += (jog.y - camY)*Math.min(1, dt*7);
    return;
  }

  lerEntrada();
  const acel = jog.dash > 0 ? 0 : (jog.lento ? 46 : 76);
  const atrito = jog.dash > 0 ? 3.4 : 13;
  jog.vx += entrada.x*acel*dt; jog.vy += entrada.y*acel*dt;
  const vmax = jog.dash > 0 ? 24 : (jog.lento ? 3.0 : 6.4);
  const vel = Math.hypot(jog.vx, jog.vy);
  if(vel > vmax){ jog.vx = jog.vx/vel*vmax; jog.vy = jog.vy/vel*vmax; }
  jog.vx -= jog.vx*atrito*dt; jog.vy -= jog.vy*atrito*dt;
  mover(jog, jog.vx*dt, jog.vy*dt);

  if(vel > .6) jog.angulo = Math.atan2(jog.vy, jog.vx);
  jog.passo += vel*dt;
  if(jog.dash > 0){ jog.dash -= dt; if(Math.random() < .6) faisca(jog.x, jog.y, '#8b7ab5', .03); }
  jog.dashCd = Math.max(0, jog.dashCd - dt);
  jog.invul = Math.max(0, jog.invul - dt);
  jog.flash = Math.max(0, jog.flash - dt*3);
  jog.golpe = Math.max(0, jog.golpe - dt);
  jog.recarga = Math.max(0, jog.recarga - dt);

  const chefeAtivo = chefe && chefe.hp > 0;

  // sem ataque automático: quem golpeia é o botão GOLPE / tecla F (golpeDeArma)

  // corpo do chefe empurra, respeitando colisão
  if(chefeAtivo){
    const dx = jog.x-chefe.x, dy = jog.y-chefe.y, d = Math.hypot(dx,dy);
    const min = jog.raio + chefe.raio;
    if(d < min && d > .001 && !chefeSubmerso(chefe)){   // submerso, o corpo não empurra
      mover(jog, dx/d*(min-d), dy/d*(min-d));
      jog.vx *= .6; jog.vy *= .6;
    }
    atualizarChefe(dt);
  }

  if(piso.atualizar) piso.atualizar(dt);
  informantes.forEach(p => p.fase += dt);
  definirInteracao();

  camX += (jog.x - camX)*Math.min(1, dt*7);
  camY += (jog.y - camY)*Math.min(1, dt*7);

  uiEstilo('cargaDash', 'transform', 'scaleY(' + jog.dashCd.toFixed(2) + ')');
  el('btnDash').classList.toggle('off', jog.dashCd > 0 || jog.dashOff);
  el('btnPocao').classList.toggle('off', jog.pocoes <= 0);
  uiEstilo('vidaFill', 'transform', 'scaleX(' + Math.max(0, jog.hp/jog.hpMax).toFixed(3) + ')');
}
function definirInteracao(){
  interacao = null;
  if(!piso.falarLiberado || piso.falarLiberado()){
    let melhor = null, md = 2.9;
    informantes.forEach(p => {
      const d = Math.hypot(p.x-jog.x, p.y-jog.y);
      if(d < md){ md = d; melhor = p; }
    });
    if(melhor) interacao = {tipo:'falar', alvo:melhor, rotulo: melhor.feito ? 'OUVIR' : 'FALAR', icone:'❝'};
  }
  if(!interacao && piso.interacao) interacao = piso.interacao();
  const b = el('btnAcao');
  if(interacao){
    b.classList.add('on');
    uiTexto('acaoRotulo', interacao.rotulo);
    uiTexto('acaoIcone', interacao.icone);
  } else b.classList.remove('on');
}

/* ---------- desenho ---------- */
let dpr = 1, tam = 40, W = 1, H = 1;
function redimensionar(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  tela.width = Math.max(1, Math.floor(W*dpr)); tela.height = Math.max(1, Math.floor(H*dpr));
  luzCv.width = Math.max(1, Math.floor(W*dpr/2)); luzCv.height = Math.max(1, Math.floor(H*dpr/2));
  tam = Math.min(W, H)/VISAO;
}
window.addEventListener('resize', redimensionar);

let vinheta = null, vinhetaW = 0, vinhetaH = 0;
/* fora do enquadramento? (coordenadas de tela, com margem em px) —
   evita pagar gradientes e sprites de tudo que a câmera nem vê */
function foraDaVista(px, py, m){
  return px < -m || px > W + m || py < -m || py > H + m;
}
function desenhar(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#0c0912'; ctx.fillRect(0,0,W,H);
  if(!mapa || !jog) return;

  let ox = W/2 - camX*tam, oy = H/2 - camY*tam;
  if(tremor > 0){ ox += (Math.random()-.5)*tremor; oy += (Math.random()-.5)*tremor; }

  /* só a fatia visível do cache: escalar o mapa inteiro por quadro pesa nos mapas grandes */
  const Tc = cacheMapa.width/LARG;
  const u0 = Math.max(0, -ox/tam), v0 = Math.max(0, -oy/tam);
  const u1 = Math.min(LARG, (W - ox)/tam), v1 = Math.min(ALT, (H - oy)/tam);
  if(u1 > u0 && v1 > v0)
    ctx.drawImage(cacheMapa, u0*Tc, v0*Tc, (u1-u0)*Tc, (v1-v0)*Tc,
                  ox + u0*tam, oy + v0*tam, (u1-u0)*tam, (v1-v0)*tam);

  if(piso.desenharCenario) piso.desenharCenario(ox, oy);
  destrocos.forEach(d => {
    ctx.globalAlpha = Math.min(1, d.vida);
    elo(ox + d.x*tam, oy + d.y*tam, d.ang, d.comp*tam, d.comp*tam*.42, tam*.055, .8);
    ctx.globalAlpha = 1;
  });

  informantes.forEach(p => desenharInformante(p, ox, oy));
  if(chefe && chefe.hp > 0 && !desenharChefeSubterraneo(chefe, ox, oy)) piso.chefe.desenhar(chefe, ox, oy);
  if(vivo && !(chefe && chefe.estado === 'enterrando')) desenharJogador(ox, oy);

  particulas.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.vida);
    ctx.fillStyle = p.cor;
    const s = p.tam*tam*p.vida;
    ctx.fillRect(ox + p.x*tam - s/2, oy + p.y*tam - s/2, s, s);
  });
  ctx.globalAlpha = 1;

  /* luz: ambiente do piso + poças quentes dos braseiros */
  lcx.setTransform(1,0,0,1,0,0);
  lcx.fillStyle = piso.paleta.luzAmbiente;
  lcx.fillRect(0,0,luzCv.width, luzCv.height);
  lcx.globalCompositeOperation = 'lighter';
  const k = dpr/2;
  braseiros.forEach(b => {
    const bx = ox + b.x*tam, by = oy + b.y*tam;
    if(foraDaVista(bx, by, tam*4)) return;
    const tr = .88 + Math.sin(tempo*7 + b.fase)*.07 + Math.sin(tempo*16 + b.fase)*.04;
    luzRadial(bx*k, by*k, tam*3.6*tr*k, 'rgba(226,146,58,.85)');
  });
  informantes.forEach(p => {   // facho dourado sobre quem ainda tem segredo para contar
    if(p.feito || (piso.falarLiberado && !piso.falarLiberado())) return;
    const px = ox + p.x*tam, py = oy + p.y*tam;
    if(foraDaVista(px, py, tam*3.4)) return;
    const tr = .75 + Math.sin(tempo*3 + p.fase)*.25;
    luzRadial(px*k, py*k, tam*3.0*tr*k, 'rgba(240,190,90,.6)');
  });
  luzRadial((ox + jog.x*tam)*k, (oy + jog.y*tam)*k, tam*2.4*k, 'rgba(255,214,160,.45)');
  lcx.globalCompositeOperation = 'source-over';
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(luzCv, 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  ctx.globalCompositeOperation = 'lighter';
  braseiros.forEach(b => {
    const px = ox + b.x*tam, py = oy + b.y*tam;
    if(foraDaVista(px, py, tam*1.3)) return;
    const f = .8 + Math.sin(tempo*9 + b.fase)*.2;
    const g = ctx.createRadialGradient(px, py, 0, px, py, Math.max(1, tam*.85*f));
    g.addColorStop(0, 'rgba(255,224,160,.7)');
    g.addColorStop(1, 'rgba(255,150,50,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, tam*.85*f, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,206,120,.9)';
    ctx.beginPath();
    ctx.ellipse(px, py - tam*.18*f, tam*.11*f, tam*.24*f, 0, 0, TAU); ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';

  ctx.textAlign = 'center';
  ctx.font = '600 ' + Math.round(tam*.36) + 'px ui-monospace, Menlo, monospace';
  riscos.forEach(r => {
    ctx.globalAlpha = Math.min(1, r.vida*1.5);
    ctx.fillStyle = '#000'; ctx.fillText(r.txt, ox + r.x*tam+1, oy + r.y*tam - tam*.5+1);
    ctx.fillStyle = r.cor;  ctx.fillText(r.txt, ox + r.x*tam, oy + r.y*tam - tam*.5);
  });
  ctx.globalAlpha = 1;

  if(!vinheta || vinhetaW !== W || vinhetaH !== H){   // o gradiente só muda com a janela
    vinheta = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*.5, W/2, H/2, Math.max(W,H)*.85);
    vinheta.addColorStop(0, 'rgba(6,4,10,0)'); vinheta.addColorStop(1, 'rgba(6,4,10,.6)');
    vinhetaW = W; vinhetaH = H;
  }
  ctx.fillStyle = vinheta; ctx.fillRect(0,0,W,H);

  if(joyAtivo){
    ctx.strokeStyle = 'rgba(232,161,60,.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(jbx, jby, 52, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(232,161,60,.4)';
    ctx.beginPath(); ctx.arc(jbx + entrada.x*52, jby + entrada.y*52, 20, 0, TAU); ctx.fill();
  }
}
function luzRadial(x,y,r,cor){
  if(!(r > 0)) return;
  const g = lcx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, cor);
  g.addColorStop(.5, cor.replace(/[\d.]+\)$/, '.3)'));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  lcx.fillStyle = g; lcx.beginPath(); lcx.arc(x,y,r,0,TAU); lcx.fill();
}
const imgsRetrato = {};
function imgRetrato(url){
  if(!imgsRetrato[url]){ const im = new Image(); im.src = url; imgsRetrato[url] = im; }
  return imgsRetrato[url];
}
function desenharInformante(p, ox, oy){
  const px = ox + p.x*tam, py = oy + p.y*tam, r = tam*.26;
  if(foraDaVista(px, py, tam*3.5)) return;
  const resp = Math.sin(p.fase*1.6)*tam*.03;
  /* loop de GIF: o tempo anda em quadros discretos (8 por segundo), repetindo o ciclo */
  const q = Math.floor(p.fase*8)/8;
  const gira  = Math.sin(q*2.2)*.05;               // balança de um lado ao outro
  const sopro = 1 + Math.sin(q*3.4)*.022;          // respiração (estica/encolhe)
  const quica = Math.abs(Math.sin(q*2.2))*tam*.05; // quique no ritmo do balanço
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath();
  ctx.ellipse(px, py + r*1.2, r*(.9 + quica/tam*.8), r*.3, 0, 0, TAU); ctx.fill();
  const foto = p.retrato && imgRetrato(p.retrato);
  let topo = py - r*2.0;
  if(foto && foto.complete && foto.naturalWidth > 0){
    /* mesma altura em tela do sprite do jogador (largura tam*.9), vezes a escala do personagem */
    const alt = (imgJogador.naturalWidth > 0
      ? imgJogador.naturalHeight*(tam*.9/imgJogador.naturalWidth) : tam*2.2) * (p.escala || 1);
    const lar = foto.naturalWidth*(alt/foto.naturalHeight);
    const base = py + r*1.2 - quica;
    ctx.save();
    ctx.translate(px, base);         // gira e respira apoiado nos pés
    ctx.rotate(gira);
    ctx.scale(2 - sopro, sopro);
    ctx.drawImage(foto, -lar/2, -alt, lar, alt);
    ctx.restore();
    topo = base - alt*sopro - tam*.18;
  }else{
    ctx.fillStyle = p.cor;
    ctx.beginPath();
    ctx.moveTo(px, py - r*.9 + resp);
    ctx.quadraticCurveTo(px + r*1.1, py + r*.4, px + r*.7, py + r*1.0);
    ctx.lineTo(px - r*.7, py + r*1.0);
    ctx.quadraticCurveTo(px - r*1.1, py + r*.4, px, py - r*.9 + resp);
    ctx.fill();
    ctx.beginPath(); ctx.arc(px, py - r*.75 + resp, r*.45, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(20,14,26,.85)';
    ctx.beginPath(); ctx.arc(px - r*.16, py - r*.8 + resp, Math.max(1, r*.09), 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(px + r*.16, py - r*.8 + resp, Math.max(1, r*.09), 0, TAU); ctx.fill();
  }
  if(!p.feito && (!piso.falarLiberado || piso.falarLiberado())){
    const bob = Math.sin(q*3)*tam*.08;
    const hy = topo + bob - tam*.18;
    const hg = ctx.createRadialGradient(px, hy, 0, px, hy, Math.max(1, tam*.6));
    hg.addColorStop(0, 'rgba(232,161,60,.5)'); hg.addColorStop(1, 'rgba(232,161,60,0)');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(px, hy, tam*.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8a13c';
    ctx.font = '600 ' + Math.round(tam*.5) + 'px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('!', px, topo + bob);
  }
}
/* arremessado pelo Coveiro: a sombra fica no chão e o corpo sobe girando */
function desenharJogador(ox, oy){
  const v = jog.voo;
  if(!v){ desenharCorpoJogador(ox, oy); return; }
  const px = ox + jog.x*tam, py = oy + jog.y*tam, r = tam*.30, alt = v.alt || 0;
  ctx.fillStyle = 'rgba(0,0,0,' + (.4 - alt*.22) + ')';
  ctx.beginPath();
  ctx.ellipse(px, py + r*1.1, r*(1 - alt*.35), r*(.34 - alt*.12), 0, 0, TAU);
  ctx.fill();
  ctx.save();
  ctx.translate(px, py - alt*tam*1.9);
  ctx.rotate((v.t/v.dur)*Math.PI*2.4*(Math.cos(v.ang) < 0 ? -1 : 1));
  ctx.translate(-px, -py);
  desenharCorpoJogador(ox, oy);
  ctx.restore();
}
function desenharCorpoJogador(ox, oy){
  const px = ox + jog.x*tam, py = oy + jog.y*tam, r = tam*.30;
  const piscando = jog.invul > 0 && Math.floor(jog.invul*22)%2 === 0;
  ctx.globalAlpha = piscando ? .45 : 1;
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.ellipse(px, py + r*.95, r*.85, r*.3, 0, 0, TAU); ctx.fill();

  if(jog.golpe > 0){
    const p = jog.golpe/.2;
    ctx.strokeStyle = 'rgba(255,238,196,' + (p*.85) + ')';
    ctx.lineWidth = tam*.13*p;
    ctx.beginPath();
    ctx.arc(px, py, tam*.8, jog.angulo - 1.0 + (1-p)*1.5, jog.angulo + .5 + (1-p)*1.5);
    ctx.stroke();
  }
  const mov = Math.min(1, Math.hypot(jog.vx, jog.vy)/5.5);
  const bal = Math.sin(jog.passo*3.2)*tam*.04*mov;
  if(imgJogador.complete && imgJogador.naturalWidth > 0){
    if(!fatiasJog) montarFatiasJog();
    const f = fatiasJog;
    const iw = imgJogador.naturalWidth, ih = imgJogador.naturalHeight;
    const sW = tam*.9, esc = sW/iw;
    const base = py + r*.95 + bal;                       // pés no chão + quique do passo
    const quadY = base - (ih - f.corte)*esc;             // linha do quadril na tela
    ctx.save();
    const virado = Math.cos(jog.angulo) < 0;
    if(virado){ ctx.translate(px, 0); ctx.scale(-1, 1); ctx.translate(-px, 0); }
    if(jog.flash > .5) ctx.filter = 'brightness(2.4) saturate(0)';
    // pernas: balançam em fases opostas ao caminhar
    const abre = Math.sin(jog.passo*3.2)*.55*mov;
    const perna = (c, x0, a) => {
      const pw = c.width*esc, ph = c.height*esc;
      ctx.save();
      ctx.translate(x0 + pw/2, quadY);
      ctx.rotate(a);
      ctx.drawImage(c, -pw/2, -ph*.08, pw, ph*1.08);
      ctx.restore();
    };
    perna(f.pernaE, px - sW/2, abre);
    perna(f.pernaD, px - sW/2 + f.pernaE.width*esc, -abre);
    // braços: fases opostas às pernas do mesmo lado; o da frente sobe no golpe
    const ombroY = base - (ih - f.ombro)*esc;
    const braco = (c, x0, pivX, a) => {
      const bw = c.width*esc, bh = c.height*esc;
      ctx.save();
      ctx.translate(px - sW/2 + pivX*esc, ombroY);
      ctx.rotate(a);
      ctx.drawImage(c, (x0 - pivX)*esc, -bh*.06, bw, bh*1.06);
      ctx.restore();
    };
    const golpeBr = jog.golpe > 0 ? (jog.golpe/.2)*.9 : 0;
    braco(f.bracoE, 0, f.bracoE.width*.7, -abre*.8);
    braco(f.bracoD, f.x0D, f.x0D + f.bracoD.width*.3, abre*.8 + golpeBr);
    // tronco: respira parado, inclina ao andar, no dash e no golpe
    const respira = (1-mov)*Math.sin(tempo*2.2)*.02;
    const incl = mov*.09 + (jog.dash > 0 ? .30 : 0)
               + (jog.golpe > 0 ? (jog.golpe/.2)*.22 : 0);
    ctx.save();
    ctx.translate(px, quadY);
    ctx.rotate(incl);
    ctx.scale(1, 1 + respira);
    ctx.drawImage(f.tronco, -sW/2, -(f.corte + 2)*esc, sW, (f.corte + 2)*esc);
    /* o que ele veste por cima do tronco. Medidas em pixels da foto do avatar
       (64x159): ombro em y 52, quadril em 99, joelho em 129 — a peça desce do
       colo ao joelho e cobre o corpo inteiro, que é o que se espera de uma
       armadura: encolhida no peito ela sumia dentro do tronco */
    if(vestido === 'avental-acougueiro'){
      const av = aventalVisivel();
      if(av){
        /* a moldura carrega a folga do contorno: o couro em si mede 40 de
           largura por 82 de altura, em pixels da foto */
        const aw = 40*esc, ah = 82*esc, f = av.width/imgAvental.naturalWidth;
        ctx.drawImage(av, 3*esc - aw*f/2, (46 - 101 + 2)*esc - ah*(f-1)/2, aw*f, ah*f);
      }
    }
    ctx.restore();
    ctx.filter = 'none';
    ctx.restore();
  } else {
    ctx.fillStyle = jog.flash > .5 ? '#fff' : '#6c5a48';
    ctx.beginPath();
    ctx.moveTo(px, py - r*1.0);
    ctx.quadraticCurveTo(px + r*1.2, py + r*.4, px + r*.8 + bal, py + r*1.0);
    ctx.lineTo(px - r*.8 + bal, py + r*1.0);
    ctx.quadraticCurveTo(px - r*1.2, py + r*.4, px, py - r*1.0);
    ctx.fill();
    ctx.fillStyle = jog.flash > .5 ? '#fff' : '#caa98a';
    ctx.beginPath(); ctx.arc(px, py - r*.6, r*.46, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2a2028';
    const ex = Math.cos(jog.angulo)*r*.16, ey = Math.sin(jog.angulo)*r*.16;
    ctx.beginPath(); ctx.arc(px + ex - r*.14, py - r*.62 + ey, Math.max(1, r*.08), 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(px + ex + r*.14, py - r*.62 + ey, Math.max(1, r*.08), 0, TAU); ctx.fill();
  }
  if(piso.desenharNoJogador) piso.desenharNoJogador(px, py, r, bal);
  ctx.globalAlpha = 1;
}

function adicionarAoInventario(item){
  if(!item || inventario.some(i => i.id === item.id)) return false;
  if(item.img && !imgsItens[item.id]){
    const im = new Image(); im.src = item.img; imgsItens[item.id] = im;
  }

}
/* peça de vestir só vai ao corpo na hora do chefão — antes disso ela viaja na
   bolsa. Cada piso diz quando a hora chegou (a porta da arena já aberta) */
function horaDeVestir(){
  return etapa === 'chefe' || !!(piso && piso.horaDoChefe && piso.horaDoChefe());
}
/* a bolsa se abre sozinha na soleira da arena, uma vez por piso: é ali que o
   jogador decide se veste a peça (o avental) antes de encarar o chefe. Vale
   para todo piso que diga quando é a hora do chefe — da fase 3 em diante. */
let ofertaVestirFeita = false, ofertaVestirEspera = 0;
function checarOfertaVestir(dt){
  if(ofertaVestirFeita || etapa === 'chefe' || !horaDeVestir()) return;
  const peca = inventario.find(i => i.veste && vestido !== i.id);
  if(!peca) return;
  ofertaVestirEspera += dt;                   // deixa o aviso da porta ser lido antes
  if(ofertaVestirEspera < 1.4) return;
  if(dialogo || !el('popupInv').classList.contains('oculto')) return;
  invSelecionado = peca;                      // a peça já vem escolhida na lista
  abrirInventario();
  ofertaVestirFeita = true;
}
function renderizarBolsa(mostrar){
  const box = el('bolsa'), itens = el('bolsaItens');
  if(!mostrar){ box.classList.remove('on'); itens.innerHTML = ''; return; }
  box.classList.add('on');
  if(inventario.length === 0){
    itens.innerHTML = '<div class="vazio">vazia</div>';
    return;
  }
  itens.innerHTML = inventario.map(it => {
    const img = it.img ? '<img src="' + it.img + '" alt="">' : '';
    const tag = it.novo ? '<span class="tag">NOVO</span>' : '';
    return '<div class="item' + (it.novo ? ' novo' : '') + '">'
      + tag + img
      + '<span class="nm">' + it.nome + '</span></div>';
  }).join('');
  setTimeout(() => inventario.forEach(i => i.novo = false), 3500);
}
/* popup do inventário: modo conquista (um item) e modo bolsa (lista, escolher o que pegar) */
let invSelecionado = null, invModoLista = false;
function mostrarItemPopup(item){
  const img = el('invImg');

function abrirInventario(){
  if(!jog || etapa === 'menu' || dialogo) return;
  if(!el('popupInv').classList.contains('oculto')){ fecharPopupInventario(); return; }
  invModoLista = true;
  pausado = true;
  calarVoz();
  el('invFechar').textContent = 'Fechar';
  renderizarListaInv();
  el('popupInv').classList.remove('oculto');
}
function renderizarListaInv(){
  const lista = el('invLista');
  if(inventario.length === 0){
    el('invImg').style.display = 'none';
    el('invNome').textContent = 'Bolsa vazia';
    el('invDesc').textContent = 'O que você achar pelo caminho aparece aqui.';
    lista.innerHTML = '';
    el('invAcao').style.display = 'none';
    return;
  }
  if(!invSelecionado || !inventario.some(i => i.id === invSelecionado.id))
    invSelecionado = inventario.find(i => i.id === jog.arma) || inventario[0];
  mostrarItemPopup(invSelecionado);
  lista.innerHTML = inventario.map(it =>
    '<div class="invTh' + (invSelecionado.id === it.id ? ' sel' : '') + '" data-id="' + it.id + '">'
    + (it.img ? '<img src="' + it.img + '" alt="">' : '')
    + (jog.arma === it.id ? '<span class="tag">NA MÃO</span>'
       : vestido === it.id ? '<span class="tag">NO PEITO</span>' : '')
    + '</div>').join('');
  lista.querySelectorAll('.invTh').forEach(d => d.addEventListener('click', () => {
    invSelecionado = inventario.find(i => i.id === d.dataset.id);
    renderizarListaInv();
  }));
  /* o botão só aparece quando há mesmo o que fazer: arma que não está na mão
     ou peça de vestir que não está no corpo. Antes ele aparecia para tudo e
     o clique no avental não fazia nada, porque `pegarItem` só empunha arma */
  const a = el('invAcao');
  const it = invSelecionado;
  const porVestir = !!it.veste && vestido !== it.id;      // no corpo é que não está
  const cedo = porVestir && !horaDeVestir();              // mas ainda não é hora
  const empunhavel = !!(piso.pegarItem && ARMAS[it.id] && jog.arma !== it.id);
  a.style.display = (porVestir || empunhavel) ? '' : 'none';
  a.textContent = porVestir ? 'Vestir' : 'Pegar';
  a.disabled = cedo;
  if(cedo) el('invDesc').textContent += ' — só dá para vestir na hora de encarar o chefe.';
}
/* escolher da bolsa fecha a bolsa: o jogador volta ao jogo já usando a peça */
el('invAcao').addEventListener('click', () => {
  if(!invModoLista || !invSelecionado) return;
  const it = invSelecionado;
  /* vestir é de mão única: o que foi ao peito fica lá até o piso acabar, e
     atravessa a morte junto com o resto do progresso */
  if(it.veste && vestido !== it.id && horaDeVestir()){
    vestido = it.id;
    if(piso.aoVestir) piso.aoVestir(it);
    fecharPopupInventario();
    avisar('No peito', it.nome);
    return;
  }
  if(piso.pegarItem && ARMAS[it.id] && jog.arma !== it.id){
    piso.pegarItem(it);
    fecharPopupInventario();
  }
});

el('comecar').addEventListener('click', () => {

    tocarBgm(piso.bgm);
    return;
  }
  /* transição de piso: a vitória sobe a escada. A animação do castelo faz as
     vezes da tela de início — quando ela acaba, o piso novo já começa jogando */
  if(etapa === 'fim' && pisoAtual + 1 < PISOS.length){
    const de = pisoAtual;
    pisoAtual++;
    etapa = 'menu';
    el('veu').classList.add('oculto');
    animarCastelo(de, pisoAtual, () => {
      const p = PISOS[pisoAtual];
      iniciarPiso(p);
      tocarBgm(p.bgm);
      const tit = p.intro.titulo.replace(/<em>/, ' · ').replace(/<[^>]+>/g, '');
      const sub = p.intro.texto.replace(/<[^>]+>/g, '').split(/(?<=\.)\s/)[0];
      avisar(tit, sub);
    });
    return;
  }
  iniciarPiso(PISOS[pisoAtual]);
  tocarBgm(PISOS[pisoAtual].bgm);
});

/* ---------- música de fundo (loop por piso) ---------- */
let bgmAudio = null, bgmSrc = null, bgmFade = null, bgmVolAtual = .35;
const BGM_VOL = .35, BGM_VOL_FALA = .08;
/* preferência do menu: só cala a trilha — vozes, ambientes e efeitos ficam */
let semMusica = false;
try{ semMusica = localStorage.getItem('hector.semMusica') === '1'; }catch(e){}
let bgmDesejada = {url:null, vol:null};   // o que tocaria, para religar quando a música voltar
function tocarBgm(url, vol){
  bgmDesejada = {url, vol};
  bgmVolAtual = vol != null ? vol : BGM_VOL;
  if(!url || semMusica){ pararBgm(); return; }
  if(bgmSrc === url && bgmAudio){
    try{ bgmAudio.volume = dialogo ? BGM_VOL_FALA : bgmVolAtual; bgmAudio.currentTime = 0; bgmAudio.play(); }catch(e){}
    return;
  }
  pararBgm();
  try{
    bgmAudio = new Audio(url);
    bgmAudio.loop = true;
    bgmAudio.volume = dialogo ? BGM_VOL_FALA : bgmVolAtual;
    bgmSrc = url;
    bgmAudio.play().catch(() => {});
  }catch(e){}
}
/* abaixa/levanta a música aos poucos (fala dos presos) */
function fundirBgm(alvo){
  clearInterval(bgmFade);
  bgmFade = setInterval(() => {
    if(!bgmAudio){ clearInterval(bgmFade); return; }
    const d = alvo - bgmAudio.volume;
    if(Math.abs(d) < .02){ bgmAudio.volume = alvo; clearInterval(bgmFade); }
    else bgmAudio.volume += d*.25;
  }, 50);
}
function pararBgm(){
  if(bgmAudio){ try{ bgmAudio.pause(); bgmAudio.currentTime = 0; }catch(e){} }
  bgmAudio = null; bgmSrc = null;
}

/* ---------- pausa e saída ----------
   A pausa é do jogador: congela o mundo, cala música, ambientes e voz, e
   devolve tudo no ponto em que estava. O ✕ pergunta antes de fechar. */
let pausaMenu = false, pausaModo = 'pausa', pausadoAntes = false, falaEmPausa = null, pausaVisivel = null;

function podePausar(){ return !!jog && etapa !== 'menu' && el('veu').classList.contains('oculto'); }
function silenciarAmbientes(){
  ambientes.forEach(a => { if(a.audio){ try{ a.audio.pause(); }catch(e){} } });
}
function pintarPausa(){
  const sair = pausaModo === 'sair';
  el('pausaTitulo').textContent = sair ? 'Fechar o jogo?' : 'Pausado';
  el('pausaTexto').textContent = sair
    ? 'Nada fica salvo: ao abrir de novo, Hector recomeça o piso.'
    : 'O castelo espera. Nada se move até você voltar.';
  el('pausaSeguir').textContent = sair ? (podePausar() ? 'Continuar jogando' : 'Voltar') : 'Continuar';
  el('pausaSair').textContent = sair ? 'Fechar mesmo' : 'Fechar o jogo';
  el('pausaAtalho').style.display = sair ? 'none' : '';
  /* o seletor de fase só existe na pausa comum, e sempre renasce fechado */
  el('pausaFases').style.display = sair ? 'none' : '';
  el('pausaFases').textContent = fasesLiberadas ? 'Trocar de fase' : 'Trocar de fase 🔒';
  el('pausaFases').classList.toggle('trancado', !fasesLiberadas);
  el('mSenhaLinha').classList.add('oculto');
  el('mFasesLista').classList.add('oculto');
  el('mSenha').value = '';
  el('mSenha').classList.remove('erro');
  el('mSenha').placeholder = 'SENHA';
}
function abrirPausa(modo){
  pausaModo = modo || 'pausa';
  pintarPausa();
  if(pausaMenu) return;                 // já aberto: só trocou de modo
  pausaMenu = true;
  pausadoAntes = pausado;               // diálogo/inventário abertos voltam como estavam
  pausado = true;
  for(const k in teclas) teclas[k] = false;
  entrada.x = entrada.y = 0;
  if(bgmAudio){ try{ bgmAudio.pause(); }catch(e){} }
  silenciarAmbientes();
  if(audioFala && !audioFala.paused){ falaEmPausa = audioFala; try{ audioFala.pause(); }catch(e){} }
  try{ if(window.speechSynthesis) speechSynthesis.pause(); }catch(e){}
  el('pausaVeu').classList.remove('oculto');
}
function retomarJogo(){
  if(!pausaMenu) return;
  pausaMenu = false;
  pausado = pausadoAntes;
  el('pausaVeu').classList.add('oculto');
  if(bgmAudio){ try{ bgmAudio.play().catch(() => {}); }catch(e){} }
  if(falaEmPausa){
    if(falaEmPausa === audioFala){ try{ audioFala.play().catch(() => {}); }catch(e){} }
    falaEmPausa = null;
  }
  try{ if(window.speechSynthesis) speechSynthesis.resume(); }catch(e){}
}
function alternarPausa(){
  if(pausaMenu){ retomarJogo(); return; }
  if(podePausar()) abrirPausa('pausa');
}
function sairDoJogo(){
  pararBgm(); pararAmbientes(); calarVoz();
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  pausado = true; pausaMenu = true;                  // o mundo para de vez
  el('pausaVeu').classList.add('oculto');
  if(!el('adeus')){
    const d = document.createElement('div');
    d.id = 'adeus';
    d.innerHTML = '<h1>O portão se fecha</h1>'
      + '<p>Até a próxima, bravo Hector.</p>';
    document.body.appendChild(d);
  }
  /* fechar a aba só é permitido quando foi um script que a abriu, ou quando o
     jogo roda instalado na tela de início. Numa aba comum o navegador recusa
     ("Scripts may close only the windows that were opened by them") e não há
     truque que valha — o open('','_self') de antigamente também é recusado.
     Então: tenta fechar e, se a página ainda estiver aqui, convida a fechar. */
  try{ window.close(); }catch(e){}
  setTimeout(() => {
    const p = el('adeus') && el('adeus').querySelector('p');
    if(p) p.textContent = 'Até a próxima, bravo Hector. Já pode fechar esta aba.';
  }, 300);
}
const botaoSistema = (id, fn) => {
  const b = el(id);
  b.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); fn(); }, {passive:false});
  b.addEventListener('mousedown', e => { e.stopPropagation(); fn(); });
};
botaoSistema('btnPausa', () => alternarPausa());
botaoSistema('btnFechar', () => abrirPausa('sair'));
botaoSistema('pausaSeguir', () => retomarJogo());
botaoSistema('pausaSair', () => { if(pausaModo === 'sair') sairDoJogo(); else abrirPausa('sair'); });

/* ---------- seletor de fase (na pausa) ----------
   Trancado por senha; o destranque vale só até fechar a página. */
const SENHA_FASES = 'Baleia302';
let fasesLiberadas = false;
function montarListaFases(){
  const lista = el('mFasesLista');
  lista.innerHTML = '';
  PISOS.forEach((p, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = 'Fase ' + (i+1) + ' — ' + NOMES_PISOS[i];
    if(i === pisoAtual) b.classList.add('on');
    b.addEventListener('click', () => { location.href = location.pathname + '?piso=' + (i+1); });
    lista.appendChild(b);
  });
}
botaoSistema('pausaFases', () => {
  if(fasesLiberadas){
    montarListaFases();
    el('mFasesLista').classList.toggle('oculto');
    return;
  }
  el('mSenhaLinha').classList.toggle('oculto');
  if(!el('mSenhaLinha').classList.contains('oculto'))
    setTimeout(() => el('mSenha').focus(), 0);
});
function conferirSenhaFases(){
  if(el('mSenha').value === SENHA_FASES){
    fasesLiberadas = true;
    el('mSenhaLinha').classList.add('oculto');
    el('pausaFases').textContent = 'Trocar de fase';
    el('pausaFases').classList.remove('trancado');
    montarListaFases();
    el('mFasesLista').classList.remove('oculto');
  } else {
    el('mSenha').value = '';
    el('mSenha').classList.add('erro');
    el('mSenha').placeholder = 'SENHA ERRADA';
    el('mSenha').focus();
  }
}
botaoSistema('mSenhaOk', conferirSenhaFases);
el('mSenha').addEventListener('keydown', e => { if(e.key === 'Enter') conferirSenhaFases(); });
el('mSenha').addEventListener('input', () => {
  el('mSenha').classList.remove('erro');
  el('mSenha').placeholder = 'SENHA';
});

let ultimo = performance.now(), falhou = false;
function quadro(t){
  const dt = Math.min(.05, (t-ultimo)/1000); ultimo = t;
  try{
    const p = podePausar();                          // o ❚❚ só existe com piso em jogo
    if(p !== pausaVisivel){ pausaVisivel = p; el('btnPausa').classList.toggle('oculto', !p); }
    atualizar(dt); desenhar(); }
  catch(err){ if(!falhou){ falhou = true; window.__erro('NO QUADRO: ' + err.message + '\n' + (err.stack||'')); } }
  requestAnimationFrame(quadro);
}
