/* --- labirinto determinístico: backtracker com semente fixa (o mapa é sempre o mesmo) --- */
function gerarLabirinto(cols, linhas, semente){
  let s = semente >>> 0;
  const rnd = () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s/4294967296; };
  const cel = Array.from({length: cols*linhas}, () => ({v:false, portas:[false,false,false,false]}));
  const dx = [0,1,0,-1], dy = [-1,0,1,0];               // N, L, S, O
  const pilha = [0]; cel[0].v = true;
  while(pilha.length){
    const i = pilha[pilha.length-1], cx = i%cols, cy = (i/cols)|0;
    const viz = [];
    for(let d=0; d<4; d++){
      const nx = cx+dx[d], ny = cy+dy[d];
      if(nx>=0 && ny>=0 && nx<cols && ny<linhas && !cel[ny*cols+nx].v) viz.push(d);
    }
    if(!viz.length){ pilha.pop(); continue; }
    const d = viz[(rnd()*viz.length)|0];
    const j = (cy+dy[d])*cols + (cx+dx[d]);
    cel[i].portas[d] = true; cel[j].portas[(d+2)%4] = true;
    cel[j].v = true; pilha.push(j);
  }
  /* braiding: abre paredes extras nos becos sem saída — o labirinto ganha voltas e atalhos */
  for(let i=0;i<cel.length;i++){
    const c = cel[i];
    if(c.portas.filter(Boolean).length !== 1) continue;
    if(rnd() < .2) continue;                       // sobram uns poucos becos, para os tesouros
    const cx = i%cols, cy = (i/cols)|0, ops = [];
    for(let d=0;d<4;d++){
      const nx = cx+dx[d], ny = cy+dy[d];
      if(!c.portas[d] && nx>=0 && ny>=0 && nx<cols && ny<linhas) ops.push(d);
    }
    if(!ops.length) continue;
    const d = ops[(rnd()*ops.length)|0];
    c.portas[d] = true;
    cel[(cy+dy[d])*cols + (cx+dx[d])].portas[(d+2)%4] = true;
  }
  return cel;
}

/* --- espinhos: armadilhas cíclicas nas pontes, corredores e catacumbas --- */
function alturaEspinho(e){
  const c = (tempo + e.fase) % 2.6;
  if(c < .12) return c/.12;               // subindo
  if(c < 1.0) return 1;                   // armado
  if(c < 1.18) return 1 - (c-1.0)/.18;    // recolhendo
  return 0;
}
function desenharEspinhos(ox, oy){
  espinhos.forEach(e => {
    const px = ox + e.x*tam, py = oy + e.y*tam;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.beginPath(); ctx.ellipse(px, py, tam*.36, tam*.22, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(90,82,104,.5)';
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.ellipse(px + (i-1.5)*tam*.17, py, tam*.05, tam*.035, 0, 0, TAU);
      ctx.fill();
    }
    const h = alturaEspinho(e);
    if(h <= 0) return;
    for(let i=0;i<4;i++){
      const sx = px + (i-1.5)*tam*.17, alt = tam*.5*h*(i%2 ? 1 : .85);
      ctx.fillStyle = '#cdc8d4';
      ctx.beginPath();
      ctx.moveTo(sx - tam*.055, py + tam*.02);
      ctx.lineTo(sx + tam*.055, py + tam*.02);
      ctx.lineTo(sx, py + tam*.02 - alt);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(24,20,32,.65)'; ctx.lineWidth = 1;
      ctx.stroke();
    }
  });
}

/* --- trapos perdidos: cura extra escondida nos cantos perigosos --- */
function desenharTrapos(ox, oy){
  trapos.forEach(tp => {
    if(tp.pego) return;
    const px = ox + tp.x*tam, py = oy + tp.y*tam;
    const fl = Math.sin(tempo*2.4 + tp.x*3)*tam*.05;
    const g = ctx.createRadialGradient(px, py, 0, px, py, Math.max(1, tam*.5));
    g.addColorStop(0, 'rgba(143,196,138,.30)'); g.addColorStop(1, 'rgba(143,196,138,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, tam*.5, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(px, py + tam*.14, tam*.18, tam*.07, 0, 0, TAU); ctx.fill();
    ctx.save(); ctx.translate(px, py - tam*.06 + fl); ctx.rotate(.5);
    ctx.fillStyle = '#d8cfb8';
    ctx.fillRect(-tam*.16, -tam*.09, tam*.32, tam*.18);
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.fillRect(-tam*.16, -tam*.09, tam*.32, tam*.04);
    ctx.fillRect(-tam*.02, -tam*.09, tam*.03, tam*.18);
    ctx.restore();
  });
}

/* --- esparadrapos da arena: cura de 25% nos cantos de cima da torre --- */
function desenharEsparadrapos(ox, oy){
  esparadrapos.forEach(ep => {
    if(ep.pego) return;
    const px = ox + ep.x*tam, py = oy + ep.y*tam;
    const pulso = .5 + Math.sin(tempo*3.1 + ep.x)*.5;
    const fl = Math.sin(tempo*2.6 + ep.x*2)*tam*.06;
    // halo verde pulsando: dá para ver do outro lado da areia
    const g = ctx.createRadialGradient(px, py, 0, px, py, Math.max(1, tam*(.6 + pulso*.12)));
    g.addColorStop(0, 'rgba(143,196,138,' + (.30 + pulso*.18) + ')');
    g.addColorStop(1, 'rgba(143,196,138,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, tam*(.6 + pulso*.12), 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(px, py + tam*.16, tam*.20, tam*.08, 0, 0, TAU); ctx.fill();

    ctx.save(); ctx.translate(px, py - tam*.06 + fl); ctx.rotate(-.35);
    const l = tam*.46, a = tam*.17;
    // fita bege com as pontas mais escuras
    ctx.fillStyle = '#e6ddc4'; ctx.fillRect(-l/2, -a/2, l, a);
    ctx.fillStyle = 'rgba(120,104,74,.35)';
    ctx.fillRect(-l/2, -a/2, l*.22, a); ctx.fillRect(l/2 - l*.22, -a/2, l*.22, a);
    // furinhos da fita
    ctx.fillStyle = 'rgba(90,78,58,.45)';
    for(let k=-1;k<=1;k++){
      ctx.beginPath(); ctx.arc(-l*.32, k*a*.28, tam*.014, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc( l*.32, k*a*.28, tam*.014, 0, TAU); ctx.fill();
    }
    // gaze branca no meio
    ctx.fillStyle = '#f6f2e6'; ctx.fillRect(-l*.17, -a*.62, l*.34, a*1.24);
    ctx.strokeStyle = 'rgba(90,78,58,.35)'; ctx.lineWidth = 1;
    ctx.strokeRect(-l*.17, -a*.62, l*.34, a*1.24);
    // cruz verde
    ctx.fillStyle = '#6fae68';
    ctx.fillRect(-l*.035, -a*.42, l*.07, a*.84);
    ctx.fillRect(-l*.115, -a*.13, l*.23, a*.26);
    ctx.restore();
  });
}

/* --- facão perdido nas catacumbas --- */
const imgFacao = new Image(); imgFacao.src = 'img/fase1/facao.png';
function desenharFacao(ox, oy){
  if(!facao || facao.pego) return;
  const px = ox + facao.x*tam, py = oy + facao.y*tam;
  const g = ctx.createRadialGradient(px, py, 0, px, py, Math.max(1, tam*.55));
  g.addColorStop(0, 'rgba(232,161,60,.30)'); g.addColorStop(1, 'rgba(232,161,60,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, tam*.55, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(px, py + tam*.12, tam*.28, tam*.08, 0, 0, TAU); ctx.fill();
  if(imgFacao.complete && imgFacao.naturalWidth > 0){
    const alt = tam*1.0, lar = imgFacao.naturalWidth*(alt/imgFacao.naturalHeight);
    const fl = Math.sin(tempo*2.1)*tam*.04;
    ctx.save(); ctx.translate(px, py + fl); ctx.rotate(2.2);
    ctx.drawImage(imgFacao, -lar/2, -alt/2, lar, alt);
    ctx.restore();
  }
}

/* --- arma empunhada (facão ou machado): desenho na mão e golpe manual --- */
const imgMachado = new Image(); imgMachado.src = 'img/fase1/machado.png';
const ARMAS = {
  // facão: cabo no topo da imagem, lâmina desce -> pivô perto do topo, gira ang - 90°
  'facao-catacumbas':  {img: () => imgFacao,   alt:.85, rot:-Math.PI/2, pivo:.18},
  // machado: cabeça no topo, cabo desce -> pivô perto da base do cabo, gira ang + 90°
  'machado-gladiador': {img: () => imgMachado, alt:1.25, rot:Math.PI/2, pivo:.82}
};
function desenharArmaNaMao(px, py, r){
  const cfgA = ARMAS[jog.arma];
  if(!cfgA) return;
  const im = cfgA.img();
  if(!(im.complete && im.naturalWidth > 0)) return;
  const p = jog.golpe > 0 ? jog.golpe/.2 : 0;              // 1 -> 0 durante o golpe
  const ang = jog.angulo + (p > 0 ? -.9 + (1-p)*1.9 : .62); // varre o arco; em repouso fica ao lado
  // o cabo fica exatamente na mão direita do sprite (fim do braço, na linha do quadril),
  // espelhando quando o jogador olha para a esquerda
  let mx, my;
  if(fatiasJog && imgJogador.naturalWidth > 0){
    const iw = imgJogador.naturalWidth, ih = imgJogador.naturalHeight;
    const esc = (tam*.9)/iw, f = fatiasJog;
    const virado = Math.cos(jog.angulo) < 0;
    const offX = (f.x0D + (iw - f.x0D)*.55 - iw/2)*esc;
    mx = px + (virado ? -offX : offX);
    my = py + r*.95 - (ih - f.corte)*esc + r*.1;
  } else {
    mx = px + Math.cos(ang)*r*.5; my = py + Math.sin(ang)*r*.5 + r*.22;
  }
  const alt = tam*cfgA.alt, lar = im.naturalWidth*(alt/im.naturalHeight);
  ctx.save();
  if(p > 0){
    // golpe: a rotação leva a parte "de ataque" da imagem para fora, na direção do arco
    ctx.translate(mx, my);
    ctx.rotate(ang + cfgA.rot);
    ctx.drawImage(im, -lar/2, -alt*cfgA.pivo, lar, alt);   // pivô na empunhadura, junto à mão
  } else {
    /* em repouso: empunhadura diagonal, como a referência do dono — a cabeça
       do machado sobe do lado do olhar e o cabo cruza o corpo até o quadril
       oposto; as duas mãos ficam fechadas no cabo o tempo todo */
    const virado = Math.cos(jog.angulo) < 0;
    const lado = virado ? -1 : 1;
    ctx.translate(px + lado*tam*.42, my + tam*.06);        // a arma inteira ao lado do olhar, fora do corpo
    if(virado) ctx.scale(-1, 1);                           // espelha tudo com o olhar
    ctx.rotate(.55);                                       // a diagonal atravessando o peito
    ctx.drawImage(im, -lar/2, -alt*cfgA.pivo, lar, alt);
    /* as duas mãos fechadas no cabo */
    const punho = (yy) => {
      ctx.fillStyle = '#c98f5e';
      ctx.beginPath(); ctx.ellipse(0, yy, r*.14, r*.11, .25, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(60,30,15,.65)'; ctx.lineWidth = 1;
      ctx.stroke();
    };
    punho(-alt*.04);                                       // a mão de baixo, na base do cabo
    punho(-alt*.45);                                       // a mão de cima, no meio do cabo
  }
  ctx.restore();
}
function golpeDeArma(){
  if(!vivo || pausado || etapa === 'preso' || jog.recarga > 0) return;
  const cortante = !!ARMAS[jog.arma];        // de mãos limpas ainda dá para bater, só que fraco
  jog.recarga = .36; jog.golpe = .2;
  if(cortante) sEspadaCorta(); else sGolpe();
  if(chefe && chefe.hp > 0){
    const d = Math.hypot(chefe.x-jog.x, chefe.y-jog.y) - chefe.raio;
    if(d < 1.2){ golpear(chefe); return; }   // golpear cuida de dano, fraquezas e sons
  }
  ratazanas.forEach(rz => {
    if(rz.hp <= 0) return;
    const dx = rz.x-jog.x, dy = rz.y-jog.y, d = Math.hypot(dx,dy);
    if(d > 1.3) return;
    jog.angulo = Math.atan2(dy, dx);
    const dano = Math.round((jog.dano + irand(5)) * (cortante ? 2 : 1));
    rz.hp -= dano; rz.flash = 1;
    rz.vx += dx/Math.max(.01,d)*6; rz.vy += dy/Math.max(.01,d)*6;
    if(cortante) sCorte(); else sEspadaAcerta();
    flutuar(rz.x, rz.y-.4, dano, cortante ? '#ffd88a' : '#f4e2b4');
    for(let k=0;k<8;k++) faisca(rz.x, rz.y, '#a34040', .12);
    if(rz.hp <= 0){ sRato(); for(let k=0;k<12;k++) faisca(rz.x, rz.y, '#6d5a60', .14); }
  });
}

/* --- ratazanas (compartilhadas entre pisos: calabouço, despensa, adega...) --- */
function atualizarRatazanas(dt, paradas){
  ratazanas.forEach(rz => {
    if(rz.hp <= 0) return;
    rz.fase += dt;
    rz.morde = Math.max(0, rz.morde - dt);
    rz.flash = Math.max(0, rz.flash - dt*4);
    rz.guincho = Math.max(0, rz.guincho - dt);
    const dx = rz.x-jog.x, dy = rz.y-jog.y, d = Math.hypot(dx,dy);
    if(!paradas && d < 5.5 && d > .001){
      const v = 2.7;   // persegue o jogador
      rz.vx += (-dx/d*v - rz.vx)*Math.min(1, dt*5);
      rz.vy += (-dy/d*v - rz.vy)*Math.min(1, dt*5);
      if(rz.guincho <= 0 && d < 4){ sRato(); rz.guincho = 1.2 + Math.random()*1.5; }
    } else {           // vagueia farejando
      const a = rz.ang + Math.sin(rz.fase*.9)*1.2;
      rz.vx += (Math.cos(a)*.5 - rz.vx)*Math.min(1, dt*2);
      rz.vy += (Math.sin(a)*.5 - rz.vy)*Math.min(1, dt*2);
    }
    mover(rz, rz.vx*dt, rz.vy*dt);
    if(Math.hypot(rz.vx, rz.vy) > .15) rz.ang = Math.atan2(rz.vy, rz.vx);
    if(d < rz.raio + jog.raio + .1 && rz.morde <= 0){
      rz.morde = .8;
      sRato();
      machucar(rz.dano || 6);
    }
  });
}
function desenharRatazanas(ox, oy){
  ratazanas.forEach(rz => {
    if(rz.hp <= 0) return;
    if(foraDaVista(ox + rz.x*tam, oy + rz.y*tam, tam*1.5)) return;
    if(rz.barata){ desenharBarata(rz, ox, oy); return; }
    const px = ox + rz.x*tam, py = oy + rz.y*tam, r = tam*.20;
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(px, py + r*.7, r*1.05, r*.4, 0, 0, TAU); ctx.fill();
    ctx.save(); ctx.translate(px, py); ctx.rotate(rz.ang);
    const ond = Math.sin(rz.fase*9)*r*.35;
    ctx.strokeStyle = '#8a7770'; ctx.lineWidth = Math.max(1, r*.16);
    ctx.beginPath(); ctx.moveTo(-r*.9, 0);
    ctx.quadraticCurveTo(-r*1.7, ond, -r*2.3, -ond);
    ctx.stroke();
    ctx.fillStyle = rz.flash > 0 ? '#c9b6a4' : '#4e4148';
    ctx.beginPath(); ctx.ellipse(0, 0, r*1.05, r*.62, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r*.95, 0, r*.5, r*.38, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#6d5a60';
    ctx.beginPath(); ctx.arc(r*.75, -r*.34, r*.18, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(r*.75, r*.34, r*.18, 0, TAU); ctx.fill();
    ctx.fillStyle = '#c8403a';
    ctx.beginPath(); ctx.arc(r*1.18, -r*.14, Math.max(1, r*.08), 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(r*1.18, r*.14, Math.max(1, r*.08), 0, TAU); ctx.fill();
    ctx.restore();
  });
}

/* --- corrente e portão: roteiro do piso --- */
function forcarCorrente(){
  ancora.forca += 9 + irand(6);
  jog.flash = .4;
  ancora.tensao = 1; ancora.puxada = .22;
  sFerro();
  if(ancora.rangeCd <= 0){ setTimeout(() => sRanger(ancora.forca/ancora.alvo), 35); ancora.rangeCd = .28; }
  for(let k=0;k<5;k++) faisca(ancora.x, ancora.y, '#e8d8b0', .14);
  for(let k=0;k<3;k++) faisca(jog.x, jog.y + .5, '#cfc7dc', .1);
  tremor = 3;
  if(ancora.forca >= ancora.alvo){
    etapa = 'livre';
    jog.lento = false; jog.dashOff = false;
    marcarTarefa('t-corrente');
    avisar('A corrente cede', 'agora, os outros presos');
    for(let k=0;k<26;k++) faisca(ancora.x, ancora.y, '#f0e2bc', .22);
    estilhacarElos(ancora.x, ancora.y, 7);
    tremor = 10;
    sQuebrarCorrente();
  }
}
function abrirPortao(){
  const sabidos = informantes.filter(p => p.feito).length;
  if(sabidos < informantes.length){
    const falta = informantes.length - sabidos;
    sPortaoTravado();
    tremor = 4;
    avisar('O portão não cede',
      falta === 1 ? 'falta ouvir 1 preso' : 'faltam ouvir ' + falta + ' presos');
    return;
  }
  portao.aberto = true;
  for(let x=9;x<=11;x++) mapa[idx(x,CAL.PORTAO.y)] = CHAO;
  desenharCache();
  sPortao(); tremor = 8;
  tocarBgm('audio/fase1/portao-gladiador.mp3', .16);   // mais baixa: as vozes da luta ficam na frente
  avisar('O portão sobe', 'a areia está do outro lado');
}
function fecharPortao(){
  portao.aberto = false;
  for(let x=9;x<=11;x++) mapa[idx(x,CAL.PORTAO.y)] = GRADE;
  desenharCache();
  sPortao(); tremor = 14;
  avisar('O portão desce', 'não há mais para onde voltar');
}

/* --- desenho da corrente, argola e barra de força --- */
function desenharCorrente(ox, oy){
  const ax = ox + ancora.x*tam, ay = oy + ancora.y*tam;
  const px = ox + jog.x*tam, py = oy + jog.y*tam + tam*.42;
  const dx = px-ax, dy = py-ay, dist = Math.max(1, Math.hypot(dx,dy));
  const folga = Math.max(0, 2.3*tam - dist);
  const perp = Math.atan2(dy,dx) + Math.PI/2;
  const barriga = folga*.5*(1 - ancora.tensao*.8) * (1 + Math.sin(tempo*1.4)*.06);
  const N = 7, pts = [];
  for(let i=0;i<=N;i++){
    const t = i/N, s = Math.sin(t*Math.PI)*barriga;
    pts.push([ax + dx*t + Math.cos(perp)*s, ay + dy*t + Math.sin(perp)*s]);
  }
  ctx.strokeStyle = 'rgba(0,0,0,.32)'; ctx.lineWidth = tam*.16; ctx.lineCap = 'round';
  ctx.beginPath();
  pts.forEach((p,i) => i ? ctx.lineTo(p[0], p[1] + tam*.09) : ctx.moveTo(p[0], p[1] + tam*.09));
  ctx.stroke();

  const esp = tam*.062, brilho = .45 + ancora.tensao*.5;
  for(let i=0;i<N;i++){
    const [x1,y1] = pts[i], [x2,y2] = pts[i+1];
    const seg = Math.hypot(x2-x1, y2-y1), ang = Math.atan2(y2-y1, x2-x1);
    const larg = (i%2 ? .17 : .34) * seg;
    elo((x1+x2)/2, (y1+y2)/2, ang, seg*.62, Math.max(esp*1.1, larg), esp, brilho);
  }
  const p = ancora.forca/ancora.alvo;
  if(p > .15){
    const [x1,y1] = pts[0], [x2,y2] = pts[1];
    const cx = (x1+x2)/2, cy = (y1+y2)/2;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, tam*.42));
    g.addColorStop(0, 'rgba(255,190,90,' + (p*.75 + ancora.puxada*.9) + ')');
    g.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, tam*.42, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(20,14,22,' + p + ')'; ctx.lineWidth = Math.max(1, tam*.025);
    ctx.beginPath();
    ctx.moveTo(cx - tam*.1, cy - tam*.06);
    ctx.lineTo(cx - tam*.01, cy + tam*.02*p);
    ctx.lineTo(cx + tam*.09*p, cy - tam*.05);
    ctx.stroke();
  }
}
function desenharAncora(ox, oy){
  const ax = ox + ancora.x*tam, ay = oy + ancora.y*tam;
  ctx.fillStyle = '#241f2e';
  ctx.beginPath(); ctx.ellipse(ax, ay + tam*.06, tam*.42, tam*.30, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3b3448';
  ctx.beginPath(); ctx.ellipse(ax, ay, tam*.40, tam*.28, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(210,196,232,.14)';
  ctx.beginPath(); ctx.ellipse(ax, ay - tam*.04, tam*.34, tam*.20, 0, Math.PI, TAU); ctx.fill();
  ctx.fillStyle = '#6d6579';
  [-1,1].forEach(k => { ctx.beginPath(); ctx.arc(ax + k*tam*.29, ay + tam*.12, tam*.045, 0, TAU); ctx.fill(); });
  const esp = tam*.075;
  ctx.lineCap = 'round';
  ctx.lineWidth = esp*2.1; ctx.strokeStyle = '#0f0c16';
  ctx.beginPath(); ctx.ellipse(ax, ay - tam*.10, tam*.20, tam*.26, 0, 0, TAU); ctx.stroke();
  ctx.lineWidth = esp*1.3; ctx.strokeStyle = '#5d5769';
  ctx.beginPath(); ctx.ellipse(ax, ay - tam*.10, tam*.20, tam*.26, 0, 0, TAU); ctx.stroke();
  ctx.lineWidth = esp*.55; ctx.strokeStyle = 'rgba(240,236,248,.75)';
  ctx.beginPath(); ctx.ellipse(ax, ay - tam*.12, tam*.19, tam*.25, 0, Math.PI*1.05, Math.PI*1.95); ctx.stroke();
  ctx.lineWidth = esp*.5; ctx.strokeStyle = 'rgba(232,161,60,.5)';
  ctx.beginPath(); ctx.ellipse(ax, ay - tam*.08, tam*.19, tam*.25, 0, Math.PI*.1, Math.PI*.75); ctx.stroke();
}
function desenharBarraForca(ox, oy){
  const px = ox + jog.x*tam, py = oy + jog.y*tam;
  const bw = tam*2.2, bh = tam*.16, p = ancora.forca/ancora.alvo;
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(px-bw/2, py-tam*1.45, bw, bh);
  ctx.fillStyle = p > .8 ? '#ffd07a' : '#e8a13c';
  ctx.fillRect(px-bw/2, py-tam*1.45, bw*p, bh);
  ctx.strokeStyle = '#7a7089'; ctx.lineWidth = 1;
  ctx.strokeRect(px-bw/2, py-tam*1.45, bw, bh);
}

/* --- o Gladiador: números e desenho --- */
const imgGladiador = new Image(); imgGladiador.src = 'img/fase1/gladiador.png';
function desenharGladiador(c, ox, oy){
  const px = ox + c.x*tam, py = oy + c.y*tam, r = c.raio*tam;
  const f = c.cfg;

  // linha telegrafada da investida
  if(c.estado === 'preparo' && intel.investida){
    const p = 1 - c.t/f.preparoT;
    ctx.strokeStyle = 'rgba(226,74,74,' + (.18 + p*.5) + ')';
    ctx.lineWidth = tam*.55;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + Math.cos(c.mira)*tam*9, py + Math.sin(c.mira)*tam*9);
    ctx.stroke();
  }

  // sombra
  ctx.fillStyle = 'rgba(0,0,0,.42)';
  ctx.beginPath(); ctx.ellipse(px, py + r*.92, r*1.0, r*.34, 0, 0, TAU); ctx.fill();

  const exausto = c.estado === 'exausto', zonzo = c.estado === 'zonzo';
  const golpe = c.golpeAnim > 0 ? c.golpeAnim/.22 : 0;   // 1 -> 0 durante o golpe de espada
  const flip = Math.cos(c.angulo) > 0;                   // a arte olha para a esquerda

  // de joelhos: ao levar golpe (flash), zonzo e quando fica ofegante
  let ajoelha = 0;
  if(c.flash > 0) ajoelha = Math.max(ajoelha, Math.min(1, c.flash*1.1));
  if(zonzo) ajoelha = Math.max(ajoelha, .85 + Math.sin(tempo*9)*.1);
  if(exausto) ajoelha = Math.max(ajoelha, .7);

  // inclinação do tronco: corre para atacar; passo pesado; arremetida no golpe
  let incl = 0;
  if(c.estado === 'investida') incl = .42;
  else if(c.estado === 'aproxima') incl = .2 + Math.sin(c.pisada*7)*.09;
  if(golpe) incl += Math.sin((1-golpe)*Math.PI)*.3;

  // o corpo avança na direção do golpe
  const lunge = golpe ? Math.sin((1-golpe)*Math.PI)*r*.5 : 0;
  // corrida: o corpo sobe e desce a cada passada, para não ficar igual ao parado
  const passo = c.estado === 'aproxima' ? Math.abs(Math.sin(c.pisada*7))*r*.11 : 0;
  const lx = Math.cos(c.angulo)*lunge, ly = Math.sin(c.angulo)*lunge*.4 - passo;

  const base = py + r*.95, alt = r*2.8;
  const iw = imgGladiador.naturalWidth, ih = imgGladiador.naturalHeight;

  if(imgGladiador.complete && iw > 0){
    const lar = alt*iw/ih;
    const resp = exausto ? Math.sin(tempo*8)*.05 : Math.sin(tempo*2.1)*.015;  // arqueja ofegante
    ctx.save();
    ctx.translate(px + lx, base + ly);
    if(flip) ctx.scale(-1, 1);
    ctx.rotate(-incl);                                   // inclina para onde olha
    ctx.translate(0, ajoelha*r*.34);                     // joelhos dobram: corpo desce...
    ctx.scale(1 + ajoelha*.06, (1 - ajoelha*.22)*(1 + resp));   // ...e comprime
    if(c.flash > .5) ctx.filter = 'brightness(2.1) saturate(.4)';
    ctx.drawImage(imgGladiador, -lar/2, -alt, lar, alt);
    ctx.filter = 'none';
    ctx.restore();
  } else {
    ctx.fillStyle = '#7c5a44';
    ctx.beginPath(); ctx.ellipse(px, py - r*.1, r*.72, r*.9, 0, 0, TAU); ctx.fill();
  }

  // golpe de espada: a lâmina risca um arco
  if(golpe){
    ctx.strokeStyle = 'rgba(255,238,196,' + (golpe*.85) + ')';
    ctx.lineWidth = Math.max(1, r*.22*golpe);
    ctx.beginPath();
    ctx.arc(px, py, r*1.7, c.angulo - 1.1 + (1-golpe)*1.6, c.angulo + .45 + (1-golpe)*1.6);
    ctx.stroke();
  }

  // corrente: gira sobre a cabeça no preparo e açoita o chão nas batidas
  const maoX = px + (flip ? 1 : -1)*r*.6, maoY = base - alt*.6;   // punho, na altura do ombro
  const topoY = base - alt*1.02;                                  // eixo do giro, acima do elmo
  const mira = c.mira != null ? c.mira : c.angulo;
  if(c.estado === 'preparo'){
    if(c.escudoBate > 0){
      // açoita: a corrente desce do punho até o ponto de impacto no chão
      const bx = px + Math.cos(mira)*r*1.7, by = py + Math.sin(mira)*r*1.7 + r*.6;
      const angC = Math.atan2(by-maoY, bx-maoX);
      for(let i=1;i<=7;i++)
        elo(maoX + (bx-maoX)*i/7, maoY + (by-maoY)*i/7, angC, r*.1, r*.062, r*.03, .3);
    } else {
      // roda sobre a cabeça, abrindo conforme carrega
      const t01 = 1 - c.t/f.preparoT, giro = tempo*17, len = r*(.8 + t01*.7);
      for(let i=1;i<=7;i++){
        const rr = len*i/7;
        elo(px + Math.cos(giro)*rr, topoY + Math.sin(giro)*rr*.4,
            giro + Math.PI/2, r*.1, r*.062, r*.03, .3);
      }
    }
  }

  // suor e aviso quando ofegante; estrelas quando zonzo
  const hy = base - alt*.85 + ajoelha*r*.5;
  if(exausto && Math.random() < .25)
    particulas.push({x:c.x + Math.cos(c.angulo)*.5, y:c.y - .55,
      vx:(Math.random()-.5)*.4, vy:-.7 - Math.random()*.4, vida:.7, cor:'rgba(220,214,228,.55)', tam:.09});
  if(exausto){
    ctx.fillStyle = 'rgba(255,240,200,' + (.45 + Math.sin(tempo*8)*.25) + ')';
    ctx.font = '600 ' + Math.round(tam*.3) + 'px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('ofegante', px, py - r*2.1);
  }
  if(zonzo){
    for(let i=0;i<3;i++){
      const a2 = tempo*4 + i*TAU/3;
      ctx.fillStyle = '#ffe08a';
      ctx.beginPath();
      ctx.arc(px + Math.cos(a2)*r*.55, hy + Math.sin(a2)*r*.18, Math.max(1.5, r*.08), 0, TAU);
      ctx.fill();
    }
  }
}

  aoIniciar(){

      {x:12.5, y:36.5, fase:0},   {x:13.5, y:38.5, fase:1.3},   // ponte alta

    /* ratazanas das catacumbas e o facão perdido (posições ajustadas ao chão livre) */

    ratazanas = [
      {x:12.5, y:37.5}, {x:16.5, y:42.5},     // pontes do fosso

     .map(p => ({...p, vx:0, vy:0, raio:.22, hp:18, ang:Math.random()*TAU,
                 fase:Math.random()*TAU, morde:0, flash:0, guincho:0}));
    facao = livre(41.5, 54.5) || livre(22.5, 53.5);
    if(facao) facao.pego = false;
    const jaTemFacao = inventario.some(i => i.id === 'facao-catacumbas');

    if(facao && jaTemFacao) facao.pego = true;     // já é seu: não reaparece no chão

  atualizar(dt){
    ancora.tensao = Math.max(0, ancora.tensao - dt*2.6);
    ancora.puxada = Math.max(0, ancora.puxada - dt);
    ancora.rangeCd = Math.max(0, (ancora.rangeCd||0) - dt);
    if(etapa === 'preso'){
      const dx = jog.x-ancora.x, dy = jog.y-ancora.y, d = Math.hypot(dx,dy), lim = 2.3;
      if(d > lim){
        jog.x = ancora.x + dx/d*lim; jog.y = ancora.y + dy/d*lim;
        jog.vx *= -.25; jog.vy *= -.25;
        ancora.tensao = Math.max(ancora.tensao, .7);
        if(ancora.rangeCd <= 0 && Math.hypot(entrada.x, entrada.y) > .3){
          sRanger(ancora.forca/ancora.alvo);
          ancora.rangeCd = .55 + Math.random()*.3;
          if(Math.random() < .4) setTimeout(sFerro, 120);
        }
      }
    }
    if(etapa === 'livre' && portao.aberto && jog.y < CAL.PORTAO.y - .9){
      fecharPortao();
      criarChefe();
      criarEsparadrapos();     // dois curativos nos cantos de cima da areia
      etapa = 'chefe';
    }
    espinhos.forEach(e => {
      const h = alturaEspinho(e);
      if(h >= 1 && !e.armado){
        e.armado = true;
        if(Math.hypot(e.x-jog.x, e.y-jog.y) < 8) sFerro();
      }
      if(h <= 0) e.armado = false;
      if(h > .6 && Math.hypot(e.x-jog.x, e.y-jog.y) < .55) machucar(9);
    });
    trapos.forEach(tp => {
      if(tp.pego || Math.hypot(tp.x-jog.x, tp.y-jog.y) > .6) return;
      tp.pego = true; jog.pocoes++;
      const cura = Math.round(jog.hpMax*.15);
      if(jog.hp < jog.hpMax){
        jog.hp = Math.min(jog.hpMax, jog.hp + cura);
        flutuar(tp.x, tp.y-.6, '+' + cura, '#8fc48a');
      }
      sTrapo();
      flutuar(tp.x, tp.y-.3, '+1 trapo', '#8fc48a');
      for(let k=0;k<10;k++) faisca(tp.x, tp.y, '#8fc48a', .09);
      atualizarHUD();
    });
    /* esparadrapos: só valem na luta, e só somem se houver vida para repor */
    if(etapa === 'chefe'){
      esparadrapos.forEach(ep => {
        if(ep.pego || jog.hp >= jog.hpMax) return;
        if(Math.hypot(ep.x-jog.x, ep.y-jog.y) > .65) return;
        ep.pego = true;
        const cura = Math.round(jog.hpMax*.25);
        jog.hp = Math.min(jog.hpMax, jog.hp + cura);
        sTrapo();
        flutuar(ep.x, ep.y-.5, '+' + cura, '#8fc48a');
        for(let k=0;k<16;k++) faisca(ep.x, ep.y, '#8fc48a', .11);
        atualizarHUD();
      });
    }
    atualizarRatazanas(dt, etapa === 'preso');
    if(facao && !facao.pego && Math.hypot(facao.x-jog.x, facao.y-jog.y) < .7){
      facao.pego = true;
      const item = {
        id:'facao-catacumbas', nome:'Facão das Catacumbas', img:'img/fase1/facao.png',
        desc:'Lâmina curva achada entre os ossos. Fica na sua mão a partir de agora — use o botão GOLPE (ou F) para atacar.'
      };
      adicionarAoInventario(item);
      jog.arma = 'facao-catacumbas';
      sEspadaAcerta();
      flutuar(facao.x, facao.y-.4, '+ facão', '#e8a13c');
      for(let k=0;k<14;k++) faisca(facao.x, facao.y, '#e8a13c', .14);
      abrirPopupInventario(item, 'Empunhar');
    }
    // o botão fica de pé mesmo sem arma: é o único jeito de atacar, já que não há
    // mais golpe automático (e as ratazanas aparecem antes do facão)
    const bg = el('btnGolpe');
    bg.classList.toggle('on', etapa !== 'preso');
    bg.classList.toggle('off', jog.recarga > 0);
    uiEstilo('cargaGolpe', 'transform', 'scaleY(' + Math.min(1, jog.recarga/.36).toFixed(2) + ')');
    if(!vistoCata && jog.y > 34.5){
      vistoCata = true;
      avisar('As catacumbas', 'a Ladra se esconde no fundo — siga a luz dourada');
    }
    if(jog.y > 43.1) marcarTarefa('t-ponte');
  },
  /* atalho de teste (?chefe=1): corrente quebrada, segredos ouvidos, portão aberto */
  irAoChefe(){

  desenharCenario(ox, oy){

    if(etapa === 'preso' || ancora.forca > 0) desenharAncora(ox, oy);
    if(etapa === 'preso'){ desenharCorrente(ox, oy); desenharBarraForca(ox, oy); }
  },
  desenharNoJogador(px, py, r, bal){
    // grilhão do tornozelo: fica para sempre, com dois elos rompidos balançando
    const ta = py + r*.92, tb = px + bal*.6;
    ctx.lineWidth = Math.max(2, r*.18); ctx.strokeStyle = '#100d18';
    ctx.beginPath(); ctx.ellipse(tb, ta, r*.30, r*.17, 0, 0, TAU); ctx.stroke();
    ctx.lineWidth = Math.max(1.2, r*.11); ctx.strokeStyle = '#6b6479';
    ctx.beginPath(); ctx.ellipse(tb, ta, r*.30, r*.17, 0, 0, TAU); ctx.stroke();
    ctx.lineWidth = Math.max(1, r*.05); ctx.strokeStyle = 'rgba(240,236,248,.7)';
    ctx.beginPath(); ctx.ellipse(tb, ta - r*.03, r*.28, r*.15, 0, Math.PI*1.1, Math.PI*1.9); ctx.stroke();
    if(etapa !== 'preso'){
      const sway = Math.sin(jog.passo*3.4)*.5 - Math.PI/2;
      for(let i=0;i<2;i++){
        const d = r*(.42 + i*.42), a = sway + Math.sin(jog.passo*3.4 + i)*.25;
        elo(tb + (i%2? r*.06 : -r*.06), ta + d, a + Math.PI/2,
            r*.22, i%2 ? r*.09 : r*.16, r*.055, .6);
      }
    }
    if(jog.arma) desenharArmaNaMao(px, py, r);
  }
};

/* ================================================================
   CONTEÚDO — PISO 2: AS COZINHAS E A ADEGA
   O Açougueiro manda no piso a cutelo. O machado do Gladiador
   arromba a porta da câmara de carnes. (fase2.prd)
   ================================================================ */

const COZ = {                      // geografia do piso (planta: cozinha ao norte, salão central, adega ao sul)
  LARG:46, ALT:54,
  PORTA:{x:30, y:9, alt:3},        // porta de tábuas da câmara de carnes (coluna x, de y a y+alt-1)
  ROSACEA:{x:23.5, y:36.5, raio:2.5}   // a grande cisterna octogonal do salão central
};
let labaredas = [], paes = [], caldos = [], porta2 = null, vistoAdega = false, vistoCisterna = false;

function construirCozinhas(){
  const t = new Uint8Array(COZ.LARG*COZ.ALT).fill(PAREDE);
  const bra = [], dec = [];
  const ix = (x,y) => y*COZ.LARG + x;
  const cavar = (x1,y1,x2,y2,tile) => {
    for(let y=y1;y<=y2;y++) for(let x=x1;x<=x2;x++) t[ix(x,y)] = (tile===undefined?CHAO:tile);
  };

  /* ---- cozinha grande (piso de madeira), fogões na parede norte ---- */
  cavar(3,6,28,17,CHAO2);
  /* as três estações de trabalho SUBDIVIDEM a cozinha: blocos sólidos que o
     jogador contorna e observa por cima do balcão, sem entrar */
  [[4,9],[12,17],[20,25]].forEach(([ex1,ex2]) => {
    for(let y=10; y<=14; y++) for(let x=ex1; x<=ex2; x++) t[ix(x,y)] = PAREDE;
  });
  /* ---- corredor da câmara de carnes; a porta em si nasce PAREDE (tábuas por cima) ---- */
  cavar(29,9,29,11);
  /* ---- câmara de carnes: a arena do Açougueiro ---- */
  cavar(31,4,43,16,CHAO2);

  /* ---- corredores em chamas: central (salão -> cozinha) e oeste (refeitório -> cozinha) ---- */
  cavar(22,18,23,29);
  cavar(6,18,7,30);

  /* ---- salão central com a grande cisterna octogonal e quatro pilares ---- */
  cavar(14,30,30,42);
  [[19,33],[27,33],[19,40],[27,40]].forEach(([px2,py2]) => { t[ix(px2,py2)] = PAREDE; });   // pilares
  /* a grande cisterna é sólida: se contorna, como na imagem de inspiração */
  for(let y=33; y<=40; y++) for(let x=20; x<=27; x++){
    if(Math.hypot(x + .5 - 23.5, y + .5 - 36.5) < 2.45) t[ix(x,y)] = PAREDE;
  }
  /* ---- refeitório dos servos, a oeste (duas portas para o salão) ---- */
  cavar(3,31,12,41);
  cavar(13,35,13,36);           // porta norte refeitório -> salão
  cavar(13,39,13,40);           // porta sul
  /* ---- despensa, a leste (duas portas para o salão) ---- */
  cavar(32,28,43,40);
  cavar(31,34,31,35);           // porta norte salão -> despensa
  cavar(31,38,31,39);           // porta sul

  /* ---- escada de chegada (vinda da arena) e corredor de serviço ---- */
  cavar(37,47,43,52,CHAO2);
  cavar(39,41,40,46);           // sobe da escada para a despensa

  /* ---- adega labiríntica de barris: celas 2x2 numa grade 10x3 ---- */
  const lab = gerarLabirinto(10, 3, 20260804);
  for(let ly=0; ly<3; ly++) for(let lx=0; lx<10; lx++){
    const c = lab[ly*10+lx], gx = 4+lx*3, gy = 45+ly*3;
    cavar(gx, gy, gx+1, gy+1);
    if(c.portas[1]) cavar(gx+2, gy, gx+2, gy+1);   // passagem para leste
    if(c.portas[2]) cavar(gx, gy+2, gx+1, gy+2);   // passagem para o sul
  }
  /* travessias da adega: porta de serviço (refeitório) e alçapão (despensa) */
  cavar(5,42,6,44);             // serviço: desce do refeitório
  cavar(32,41,33,44);           // alçapão: desce da despensa
  /* a falsa: grade da cisterna, trancada por fora */
  cavar(22,43,23,43);
  cavar(22,44,23,44,GRADE);
  cavar(22,45,23,46,FOSSO);     // a água escura lá embaixo

  /* ---- luzes ---- */
  [[5,6.4],[9,6.4],[13,6.4],[17,6.4],[21,6.4],[25,6.4],     // fogões da cozinha
   [4,16],[26,16],                                          // cantos da cozinha
   [22.5,20],[22.5,27],[6.5,21],[6.5,28],                   // corredores em chamas
   [16,31],[30,31],[16,41],[30,41],                         // salão (a grande cisterna tem luz própria)
   [4,32],[11,40],                                          // refeitório
   [33,29],[42,39],[37,34],                                 // despensa
   [33,5],[41,5],[37,15],[30,10],                           // câmara de carnes e porta
   [6.5,12],[14.5,12],[22.5,12],                            // as três estações de trabalho
   [39.5,42],[40,50],[38,48],                               // escada e corredor de serviço
   [5.5,43],[32.5,42],                                      // descidas da adega
   [7.5,46.5],[16.5,49.5],[25.5,46.5],[30.5,51.5],[10.5,51.5] // adega
  ].forEach(([x,y]) => bra.push({x, y, fase:Math.random()*TAU}));

  /* ---- decoração ---- */
  // cozinha: as mesas de preparo são pintadas no cache; aqui só a louça e o caos
  [[10.6,15.4],[18.5,15.7],[26.5,9.4],[24.5,9.5]].forEach(([x,y]) => dec.push({tipo:'tigela',x,y}));
  dec.push({tipo:'barril', x:4.5, y:16.4}); dec.push({tipo:'barril', x:5.3, y:16.8});
  dec.push({tipo:'poca', x:12, y:15}); dec.push({tipo:'teia', x:3.4, y:6.4, flip:false});

/* --- labaredas: as bocas de fogo dos fornos, no ritmo dos espinhos da fase 1 --- */
function alturaLabareda(e){
  const c = (tempo + e.fase) % 3.2;
  if(c < .3) return (c/.3)*.25;           // brasas acordando: aviso, sem dano
  if(c < 1.3) return 1;                   // labareda cheia
  if(c < 1.55) return 1 - (c-1.3)/.25;    // morrendo
  return 0;
}
function desenharLabaredas(ox, oy){
  labaredas.forEach(e => {
    const px = ox + e.x*tam, py = oy + e.y*tam;
    if(foraDaVista(px, py, tam*1.6)) return;
    // a boca de ferro no chão, sempre visível
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.beginPath(); ctx.ellipse(px, py, tam*.34, tam*.2, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(120,96,72,.7)'; ctx.lineWidth = Math.max(1, tam*.05);
    ctx.beginPath(); ctx.ellipse(px, py, tam*.3, tam*.17, 0, 0, TAU); ctx.stroke();
    const h = alturaLabareda(e);
    if(h <= 0) return;
    // brilho no chão
    const g = ctx.createRadialGradient(px, py, 0, px, py, Math.max(1, tam*1.1*h));
    g.addColorStop(0, 'rgba(255,150,50,' + (.35*h) + ')'); g.addColorStop(1, 'rgba(255,90,20,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, tam*1.1*h, 0, TAU); ctx.fill();
    // línguas de fogo dançando
    for(let i=0;i<4;i++){
      const fx = px + (i-1.5)*tam*.14 + Math.sin(tempo*13 + i*2 + e.fase)*tam*.03;
      const alt = tam*(.55 + Math.sin(tempo*11 + i*1.7 + e.fase*3)*.15)*h*(i%2 ? 1 : .8);
      const lar = tam*.09*(1 + h*.4);
      ctx.fillStyle = i%2 ? 'rgba(255,120,30,.85)' : 'rgba(255,190,60,.9)';
      ctx.beginPath();
      ctx.moveTo(fx - lar, py + tam*.02);
      ctx.quadraticCurveTo(fx - lar*.3, py - alt*.55, fx + Math.sin(tempo*17 + i)*tam*.04, py - alt);
      ctx.quadraticCurveTo(fx + lar*.3, py - alt*.5, fx + lar, py + tam*.02);
      ctx.closePath(); ctx.fill();
    }
    if(Math.random() < .3*h)
      particulas.push({x:e.x + (Math.random()-.5)*.3, y:e.y - .4,
        vx:(Math.random()-.5)*.3, vy:-1.2 - Math.random()*.8, vida:.5, cor:'rgba(255,170,60,.8)', tam:.07});
  });
}

/* --- portas internas entre os cômodos: abrem sozinhas quando o jogador chega,
   com as duas folhas girando nas dobradiças, e fecham quando ele se afasta --- */
let portasInternas = [];
function criarPortasInternas(){
  portasInternas = [
    {x:13, y:35, vert:true},    // refeitório <-> salão, norte
    {x:13, y:39, vert:true},    // refeitório <-> salão, sul
    {x:31, y:34, vert:true},    // salão <-> despensa, norte
    {x:31, y:38, vert:true},    // salão <-> despensa, sul
    {x:22, y:30, vert:false},   // salão -> corredor central
    {x:22, y:18, vert:false},   // corredor central -> cozinha
    {x:6,  y:18, vert:false},   // corredor oeste -> cozinha
    {x:6,  y:31, vert:false},   // corredor oeste -> refeitório
    {x:39, y:41, vert:false}    // despensa -> corredor de serviço
  ].map(p => ({...p, ab:0, rangeu:false}));
}
function atualizarPortasInternas(dt){
  portasInternas.forEach(p => {
    const cx = p.vert ? p.x + .5 : p.x + 1, cy = p.vert ? p.y + 1 : p.y;
    const perto = Math.hypot(cx - jog.x, cy - jog.y) < 2.0;
    const alvo = perto ? 1 : 0;
    const antes = p.ab;
    p.ab += (alvo - p.ab)*Math.min(1, dt*5);
    if(alvo === 1 && antes < .04 && p.ab >= .04 && !p.rangeu){
      p.rangeu = true;
      if(Math.hypot(cx - jog.x, cy - jog.y) < 9) sRanger(.35);   // o rangido da madeira
    }
    if(alvo === 0 && p.ab < .04) p.rangeu = false;
  });
}
/* a arte da porta (referência do usuário): tábuas com moldura de ferro cravejada
   de losangos em cima e embaixo, quatro painéis rebaixados e argola de metal */
function pintarPortaArte(g, x, y, w, h, comArgola){
  // corpo de tábuas
  g.fillStyle = '#7a5230'; g.fillRect(x, y, w, h);
  // molduras de ferro, em cima e embaixo
  const fh = h*.11;
  g.fillStyle = '#26221f';
  g.fillRect(x, y, w, fh); g.fillRect(x, y + h - fh, w, fh);
  g.fillStyle = 'rgba(255,245,230,.12)';
  g.fillRect(x, y, w, 1.4); g.fillRect(x, y + h - fh, w, 1.4);
  // losangos cravejados nas molduras
  g.fillStyle = '#4c4744';
  [.16, .5, .84].forEach(fx => {
    [y + fh*.5, y + h - fh*.5].forEach(fy => {
      const cx2 = x + w*fx, rl = fh*.34;
      g.beginPath();
      g.moveTo(cx2, fy - rl); g.lineTo(cx2 + rl, fy); g.lineTo(cx2, fy + rl); g.lineTo(cx2 - rl, fy);
      g.closePath(); g.fill();
    });
  });
  // travessas e montantes mais claros formando os 4 painéis
  const mi = y + fh, mf = y + h - fh, mh = mf - mi;
  g.fillStyle = '#8a5f36';
  g.fillRect(x, mi + mh*.44, w, mh*.12);                       // travessa do meio
  g.fillRect(x + w*.44, mi, w*.12, mh);                        // montante central
  g.fillRect(x, mi, w*.07, mh); g.fillRect(x + w*.93, mi, w*.07, mh);   // montantes laterais
  // painéis rebaixados, com sombra por dentro
  [[x + w*.07, mi],[x + w*.56, mi],[x + w*.07, mi + mh*.56],[x + w*.56, mi + mh*.56]].forEach(([px3, py3]) => {
    g.fillStyle = '#5e3f24';
    g.fillRect(px3, py3, w*.37, mh*.44);
    g.fillStyle = 'rgba(20,10,4,.45)';
    g.fillRect(px3, py3, w*.37, 2);
    g.fillRect(px3, py3, 2, mh*.44);
    g.fillStyle = 'rgba(255,220,170,.14)';
    g.fillRect(px3, py3 + mh*.44 - 1.6, w*.37, 1.6);
  });
  // veios da madeira
  g.strokeStyle = 'rgba(40,22,8,.3)'; g.lineWidth = 1;
  for(let k=1; k<4; k++){
    g.beginPath(); g.moveTo(x + w*.1, mi + mh*k/4 + 1); g.lineTo(x + w*.9, mi + mh*k/4); g.stroke();
  }
  // argola de metal com espelho
  if(comArgola){
    const ax2 = x + w*.72, ay2 = y + h*.52;
    g.fillStyle = '#26221f'; g.fillRect(ax2 - w*.07, ay2 - h*.045, w*.14, h*.05);
    g.strokeStyle = '#181513'; g.lineWidth = Math.max(1.5, w*.05);
    g.beginPath(); g.arc(ax2, ay2 + h*.05, w*.1, 0, TAU); g.stroke();
    g.strokeStyle = 'rgba(210,205,220,.35)'; g.lineWidth = Math.max(1, w*.02);
    g.beginPath(); g.arc(ax2, ay2 + h*.05, w*.1, Math.PI*.9, Math.PI*1.7); g.stroke();
  }
}
function desenharPortasInternas(ox, oy){
  portasInternas.forEach(p => {
    if(p.ab > .98) return;                       // escancarada: some da vista
    if(foraDaVista(ox + (p.x + .5)*tam, oy + (p.y + .5)*tam, tam*2.6)) return;
    if(!p.vert){
      /* porta de FRENTE, na arte da referência: UMA folha só ocupando o vão,
         com a dobradiça na ombreira esquerda — abre girando para dentro
         (a largura colapsa rumo à dobradiça, escurecendo) */
      const w = tam*2.0, h = tam*1.6;
      const yBase = oy + (p.y + .18)*tam;        // a soleira, um passo dentro do vão
      const esc = Math.max(.04, 1 - p.ab*1.05);
      // sombra da porta no chão, encolhendo junto
      ctx.fillStyle = 'rgba(0,0,0,' + (.3*(1 - p.ab)) + ')';
      ctx.beginPath();
      ctx.ellipse(ox + (p.x + 1*esc)*tam, yBase + tam*.05, tam*esc, tam*.14, 0, 0, TAU);
      ctx.fill();
      ctx.save();
      ctx.translate(ox + p.x*tam, yBase);
      ctx.scale(esc, 1);
      pintarPortaArte(ctx, 0, -h, w, h, true);
      ctx.fillStyle = 'rgba(0,0,0,' + (p.ab*.5) + ')'; ctx.fillRect(0, -h, w, h);
      ctx.restore();
      return;
    }
    /* portas nas paredes verticais: UMA folha de tábuas cravejadas, do tamanho
       do vão, girando na dobradiça de cima */
    const esp = tam*.19, folha = tam*2.0;
    const giro = p.ab*1.8;                       // 0 fechada -> ~103 graus aberta
    const desenharFolha = (hx, hy, angBase, dir) => {
      ctx.save();
      ctx.translate(ox + hx*tam, oy + hy*tam);
      ctx.rotate(angBase + dir*giro);
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.fillRect(0, esp*.25, folha, esp);
      // tábuas com as pontas de ferro da arte
      ctx.fillStyle = '#7a5230'; ctx.fillRect(0, -esp/2, folha, esp);
      ctx.fillStyle = '#26221f';
      ctx.fillRect(0, -esp/2, folha*.1, esp); ctx.fillRect(folha*.9, -esp/2, folha*.1, esp);
      ctx.fillStyle = 'rgba(30,18,8,.5)';
      ctx.fillRect(folha*.1, -esp/2 + esp*.46, folha*.8, 1.5);
      ctx.fillStyle = 'rgba(255,220,170,.16)';
      ctx.fillRect(folha*.1, -esp/2, folha*.8, 1.6);
      // losangos cravejados
      ctx.fillStyle = '#4c4744';
      [.3, .62].forEach(fx => {
        const cx2 = folha*fx, rl = esp*.22;
        ctx.beginPath();
        ctx.moveTo(cx2, -rl); ctx.lineTo(cx2 + rl, 0); ctx.lineTo(cx2, rl); ctx.lineTo(cx2 - rl, 0);
        ctx.closePath(); ctx.fill();
      });
      // dobradiça
      ctx.fillStyle = '#33302e';
      ctx.beginPath(); ctx.arc(0, 0, esp*.32, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(210,205,220,.25)';
      ctx.beginPath(); ctx.arc(0, 0, esp*.15, 0, TAU); ctx.fill();
      ctx.restore();
    };
    desenharFolha(p.x + .5, p.y, Math.PI/2, 1);   // uma folha só, do vão inteiro
  });
}

/* --- baratas grandes da cisterna: corpo alongado, antenas e seis patas remando --- */
/* --- as três estações de trabalho da cozinha: cômodos murados que o jogador
   vê por cima do balcão mas não alcança — cada uma com 5 ajudantes --- */
const ESTACOES = [
  {x1:4,  x2:9,  tema:'legumes'},   // bancada de legumes
  {x1:12, x2:17, tema:'paes'},      // a masseira dos pães
  {x1:20, x2:25, tema:'carnes'}     // o corte das carnes
];   // todas ocupam y10–14 dentro da cozinha; interior anda em y11–13.6
let ajudantes = [];
const imgsAjudantes = [1,2,3,4].map(i => {
  const im = new Image(); im.src = 'img/fase2/ajudantes/aj' + i + '.png'; return im;
});
function criarAjudantes(){
  ajudantes = [];
  ESTACOES.forEach(e => {
    for(let k=0; k<5; k++){
      ajudantes.push({
        est:e, img:(k + (e.x1|0)) % imgsAjudantes.length,
        x:e.x1 + 1.3 + Math.random()*(e.x2 - e.x1 - 1.6),
        y:11.4 + Math.random()*2.0,
        tx:0, ty:0, temAlvo:false, esperar:Math.random()*2,
        fase:Math.random()*TAU, flip:Math.random() < .5
      });
    }
  });
}
function atualizarAjudantes(dt){
  ajudantes.forEach(a => {
    a.fase += dt;
    if(a.esperar > 0){ a.esperar -= dt; return; }        // trabalhando na bancada
    if(!a.temAlvo){
      const e = a.est;
      a.tx = e.x1 + 1.3 + Math.random()*(e.x2 - e.x1 - 1.6);
      a.ty = Math.random() < .6 ? 13.1 + Math.random()*.4    // vai à bancada do sul
                                : 11.4 + Math.random()*1.9;  // circula pelo cômodo
      a.temAlvo = true;
    }
    const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx, dy);
    if(d < .1){
      a.temAlvo = false;
      a.esperar = 1 + Math.random()*2.5;                 // para e trabalha
    } else {
      a.x += dx/d*.55*dt; a.y += dy/d*.55*dt;
      if(Math.abs(dx) > .04) a.flip = dx < 0;
    }
  });
}
function desenharAjudantes(ox, oy){
  ajudantes.forEach(a => {
    const im = imgsAjudantes[a.img];
    if(!(im.complete && im.naturalWidth > 0)) return;
    const px = ox + a.x*tam, py = oy + a.y*tam;
    if(foraDaVista(px, py, tam*1.6)) return;
    const alt = tam*1.15;                                // bem menor que o Cozinheiro
    const lar = im.naturalWidth*(alt/im.naturalHeight);
    /* o mesmo loop de GIF dos informantes: balança, respira e quica */
    const q = Math.floor(a.fase*8)/8;
    const gira  = Math.sin(q*2.2)*.05;
    const sopro = 1 + Math.sin(q*3.4)*.025;
    const quica = (a.esperar > 0 ? Math.abs(Math.sin(q*4.5)) : Math.abs(Math.sin(q*2.2)))*tam*.045;
    ctx.fillStyle = 'rgba(0,0,0,.32)';
    ctx.beginPath(); ctx.ellipse(px, py + tam*.12, tam*.24, tam*.09, 0, 0, TAU); ctx.fill();
    ctx.save();
    ctx.translate(px, py + tam*.12 - quica);
    ctx.rotate(gira);
    ctx.scale((a.flip ? -1 : 1)*(2 - sopro), sopro);
    ctx.drawImage(im, -lar/2, -alt, lar, alt);
    ctx.restore();
  });
}

/* --- a água da cisterna respira: brilho frio pulsando e ondulações sobre o cache --- */
function desenharCisterna(ox, oy){
  const cx = ox + 23*tam, cy = oy + 46*tam;
  if(foraDaVista(cx, cy, tam*2.8)) return;
  // o brilho azulado que sobe da água — se vê de longe, como as piscinas da inspiração
  const pulso = .6 + Math.sin(tempo*1.6)*.4;
  const gL = ctx.createRadialGradient(cx, cy, 0, cx, cy, tam*2.4);
  gL.addColorStop(0, 'rgba(90,210,230,' + (.16 + pulso*.08) + ')');
  gL.addColorStop(1, 'rgba(90,210,230,0)');
  ctx.fillStyle = gL;
  ctx.beginPath(); ctx.arc(cx, cy, tam*2.4, 0, TAU); ctx.fill();
  for(let i=0; i<2; i++){
    const t2 = (tempo*.35 + i*.5) % 1;
    ctx.strokeStyle = 'rgba(160,225,240,' + (.24*(1 - t2)) + ')';
    ctx.lineWidth = Math.max(1, tam*.05);
    ctx.beginPath();
    ctx.ellipse(cx, cy, tam*(.15 + t2*.75), tam*(.08 + t2*.42), 0, 0, TAU);
    ctx.stroke();
  }
  // um fiapo de luz correndo na superfície
  const lx = Math.sin(tempo*.7)*tam*.5;
  ctx.strokeStyle = 'rgba(220,245,250,.18)';
  ctx.lineWidth = Math.max(1, tam*.04);
  ctx.beginPath();
  ctx.moveTo(cx - tam*.5 + lx, cy - tam*.3);
  ctx.quadraticCurveTo(cx + lx, cy - tam*.15, cx + tam*.45 + lx, cy - tam*.32);
  ctx.stroke();
}

function desenharBarata(rz, ox, oy){
  const px = ox + rz.x*tam, py = oy + rz.y*tam, r = tam*.30;
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(px, py + r*.6, r*1.25, r*.45, 0, 0, TAU); ctx.fill();
  ctx.save(); ctx.translate(px, py); ctx.rotate(rz.ang);
  const w = Math.sin(rz.fase*14);
  // patas: três de cada lado, remando desencontradas
  ctx.strokeStyle = '#241708'; ctx.lineWidth = Math.max(1, r*.13); ctx.lineCap = 'round';
  for(let i=0; i<3; i++){
    const bx2 = (i-1)*r*.6, sw = Math.sin(rz.fase*14 + i*2.1)*.5;
    [-1,1].forEach(s => {
      ctx.beginPath();
      ctx.moveTo(bx2, s*r*.35);
      ctx.lineTo(bx2 - r*.35 + s*sw*r*.25, s*r*.95);
      ctx.stroke();
    });
  }
  ctx.lineCap = 'butt';
  // corpo: élitros escuros com risco central e um brilho oleoso
  ctx.fillStyle = rz.flash > 0 ? '#c9b6a4' : '#38220f';
  ctx.beginPath(); ctx.ellipse(0, 0, r*1.25, r*.55, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = Math.max(1, r*.06);
  ctx.beginPath(); ctx.moveTo(-r*1.05, 0); ctx.lineTo(r*.9, 0); ctx.stroke();
  ctx.fillStyle = 'rgba(255,215,160,.16)';
  ctx.beginPath(); ctx.ellipse(-r*.2, -r*.2, r*.7, r*.13, 0, 0, TAU); ctx.fill();
  // cabeça e antenas varrendo o chão
  ctx.fillStyle = '#1e1005';
  ctx.beginPath(); ctx.arc(r*1.12, 0, r*.30, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#1e1005'; ctx.lineWidth = Math.max(1, r*.08);
  [-1,1].forEach(s => {
    ctx.beginPath();
    ctx.moveTo(r*1.3, s*r*.1);
    ctx.quadraticCurveTo(r*2.0, s*r*.5 + w*r*.15, r*2.4, s*r*.85 + w*r*.25);
    ctx.stroke();
  });
  ctx.restore();
}

/* --- pão nosso de cada dia: cura espalhada pela cozinha, despensa e adega --- */
const imgPao = new Image(); imgPao.src = 'img/fase2/pao.png';
const imgCaldo = new Image(); imgCaldo.src = 'img/fase2/caldo.png';
function desenharPaes(ox, oy){
  paes.forEach(pa => {
    if(pa.pego) return;
    const px = ox + pa.x*tam, py = oy + pa.y*tam;
    if(foraDaVista(px, py, tam*.9)) return;
    const fl = Math.sin(tempo*2.4 + pa.x*3)*tam*.05;
    const g = ctx.createRadialGradient(px, py, 0, px, py, Math.max(1, tam*.5));
    g.addColorStop(0, 'rgba(143,196,138,.30)'); g.addColorStop(1, 'rgba(143,196,138,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, tam*.5, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(px, py + tam*.14, tam*.2, tam*.07, 0, 0, TAU); ctx.fill();
    if(imgPao.complete && imgPao.naturalWidth > 0){
      const l = tam*.5, a = imgPao.naturalHeight*(l/imgPao.naturalWidth);
      ctx.drawImage(imgPao, px - l/2, py - a/2 - tam*.06 + fl, l, a);
    }
  });
}
/* --- caldo quente da câmara: 25% de vida, só durante a luta, reposto a cada tentativa --- */
function criarCaldos(){
  caldos = [
    {x:32.6, y:5.4, pego:false},   // canto noroeste da câmara
    {x:41.4, y:5.4, pego:false}    // canto nordeste
  ];
}
function desenharCaldos(ox, oy){
  caldos.forEach(cd => {
    if(cd.pego) return;
    const px = ox + cd.x*tam, py = oy + cd.y*tam;
    if(foraDaVista(px, py, tam)) return;
    const pulso = .5 + Math.sin(tempo*3.1 + cd.x)*.5;
    const g = ctx.createRadialGradient(px, py, 0, px, py, Math.max(1, tam*(.6 + pulso*.12)));
    g.addColorStop(0, 'rgba(143,196,138,' + (.30 + pulso*.18) + ')');
    g.addColorStop(1, 'rgba(143,196,138,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, tam*(.6 + pulso*.12), 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(px, py + tam*.15, tam*.22, tam*.08, 0, 0, TAU); ctx.fill();
    if(imgCaldo.complete && imgCaldo.naturalWidth > 0){
      const l = tam*.6, a = imgCaldo.naturalHeight*(l/imgCaldo.naturalWidth);
      ctx.drawImage(imgCaldo, px - l/2, py - a + tam*.15, l, a);
    }
    // vapor subindo da tigela
    if(Math.random() < .12)
      particulas.push({x:cd.x + (Math.random()-.5)*.2, y:cd.y - .35,
        vx:(Math.random()-.5)*.15, vy:-.5 - Math.random()*.3, vida:.8, cor:'rgba(230,230,235,.35)', tam:.08});
  });
}

/* os móveis e utensílios da folha de itens (img/fase2/itens/iRC.png):

function desenharPorta2(ox, oy){
  const P = COZ.PORTA;
  const x0 = ox + P.x*tam - tam*.3, y0 = oy + P.y*tam - tam*.15;
  const w = tam*1.6, h = tam*P.alt + tam*.3;
  if(foraDaVista(x0 + w/2, y0 + h/2, tam*3)) return;
  const pronta = imgPorta.complete && imgPorta.naturalWidth > 0;
  if(!porta2.aberta){
    if(pronta) ctx.drawImage(imgPorta, x0, y0, w, h);
    else for(let k=0;k<4;k++){
      ctx.fillStyle = 'rgb(' + Math.round(122*(.8+k*.05)) + ',' + Math.round(82*(.8+k*.05)) + ',48)';
      ctx.fillRect(x0 + tam*.3 + k*tam*.25, y0 + tam*.15, tam*.22, tam*P.alt);
    }
    return;
  }
  /* a porta se partindo ao meio: as duas bandas giram para fora e tombam */
  const q = porta2.quebra;
  if(q <= 0 || !pronta) return;
  const p = 1 - q;                                   // progresso da queda
  const iw = imgPorta.naturalWidth, ih = imgPorta.naturalHeight;
  const queda = p*p;                                 // acelera como um tombo de verdade
  ctx.save();
  ctx.globalAlpha = Math.min(1, q*2.2);
  // banda esquerda: dobradiça no canto inferior esquerdo
  ctx.save();
  ctx.translate(x0 + w*.06, y0 + h*.97);
  ctx.rotate(-queda*1.25 - p*.08);
  ctx.drawImage(imgPorta, 0, 0, iw/2, ih, -w*.06, -h*.97 + queda*tam*.5, w/2, h);
  ctx.restore();
  // banda direita: dobradiça no canto inferior direito
  ctx.save();
  ctx.translate(x0 + w*.94, y0 + h*.97);
  ctx.rotate(queda*1.35 + p*.08);
  ctx.drawImage(imgPorta, iw/2, 0, iw - iw/2, ih, -w*.44, -h*.97 + queda*tam*.55, w/2, h);
  ctx.restore();
  // o rasgo do machado: um clarão em zigue-zague onde a lâmina desceu
  if(q > .45){
    ctx.strokeStyle = 'rgba(255,236,190,' + ((q-.45)*1.6) + ')';
    ctx.lineWidth = Math.max(1.5, tam*.09*q);
    ctx.beginPath();
    ctx.moveTo(x0 + w*.52, y0 + h*.04);
    ctx.lineTo(x0 + w*.44, y0 + h*.32);
    ctx.lineTo(x0 + w*.56, y0 + h*.55);
    ctx.lineTo(x0 + w*.47, y0 + h*.82);
    ctx.stroke();
  }
  ctx.restore();
}
function arrombarPorta(){
  const sabidos = informantes.filter(p => p.feito).length;
  if(jog.arma !== 'machado-gladiador'){
    sPortaoTravado(); tremor = 4;
    avisar('A porta não cede', 'só o machado do Gladiador abre isso — olhe a bolsa');
    return;
  }
  if(sabidos < informantes.length){
    const falta = informantes.length - sabidos;
    sPortaoTravado(); tremor = 4;
    avisar('Ainda não', falta === 1 ? 'falta ouvir 1 servo' : 'faltam ouvir ' + falta + ' servos');
    return;
  }
  porta2.aberta = true;
  porta2.quebra = 1;                                    // a animação da porta se partindo
  const P = COZ.PORTA;
  for(let y=P.y; y<P.y+P.alt; y++) mapa[idx(P.x,y)] = CHAO;
  desenharCache();
  jog.golpe = .2; jog.angulo = 0;                       // a machadada que abre
  sEspadaCorta();
  setTimeout(sBaterParede, 130); tremor = 16;
  /* lascas de madeira voando do rasgo */
  for(let k=0;k<26;k++){
    const a = -Math.PI/2 + (Math.random()-.5)*2.4;
    particulas.push({x:P.x + .5 + (Math.random()-.5)*.5, y:P.y + .4 + Math.random()*2.2,
      vx:Math.cos(a)*(1.5+Math.random()*3.5), vy:Math.sin(a)*(1.5+Math.random()*2.5),
      vida:.6 + Math.random()*.5, cor: Math.random()<.5 ? '#8a5a2c' : '#c99a58', tam:.10});
  }
  for(let k=0;k<12;k++) faisca(P.x + .5, P.y + 1.5, '#b98a4a', .2);
  avisar('A porta se despedaça', 'a câmara de carnes espera');
}

/* --- o Açougueiro: números e desenho --- */
const imgButcher = new Image(); imgButcher.src = 'img/fase2/butcher.png';
function desenharAcougueiro(c, ox, oy){
  const px = ox + c.x*tam, py = oy + c.y*tam, r = c.raio*tam;
  const f = c.cfg;

  // linha telegrafada da investida (a Faxineira contou das três batidas)
  if(c.estado === 'preparo' && intel.mesa){
    const p = 1 - c.t/f.preparoT;
    ctx.strokeStyle = 'rgba(226,74,74,' + (.18 + p*.5) + ')';
    ctx.lineWidth = tam*.6;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + Math.cos(c.mira)*tam*9, py + Math.sin(c.mira)*tam*9);
    ctx.stroke();
  }

  // sombra
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.beginPath(); ctx.ellipse(px, py + r*.92, r*1.05, r*.36, 0, 0, TAU); ctx.fill();

  const exausto = c.estado === 'exausto', zonzo = c.estado === 'zonzo';
  const golpe = c.golpeAnim > 0 ? c.golpeAnim/.22 : 0;   // 1 -> 0 durante o talho
  const flip = Math.cos(c.angulo) > 0;                   // a arte olha para a esquerda

  // dobra os joelhos: ao levar golpe, zonzo e ofegante
  let ajoelha = 0;
  if(c.flash > 0) ajoelha = Math.max(ajoelha, Math.min(1, c.flash*1.1));
  if(zonzo) ajoelha = Math.max(ajoelha, .85 + Math.sin(tempo*9)*.1);
  if(exausto) ajoelha = Math.max(ajoelha, .65);

  // o andar: gingado pesado de um lado ao outro, tronco caindo à frente,
  // e o corpo afunda a cada pisada — cada passo se vê
  const andando = c.estado === 'aproxima';
  const gingado = andando ? Math.sin(c.pisada*5.5)*.085 : 0;
  // antes de cada talho, ele RECUA e ergue a faca: o windup denuncia o golpe
  const wind = c.estado === 'combo' && golpe === 0 ? Math.max(0, 1 - Math.max(0, c.t)/.32) : 0;

  let incl = 0;
  if(c.estado === 'investida') incl = .5;
  else if(andando) incl = .16 + Math.sin(c.pisada*5.5)*.07;
  incl += golpe ? Math.sin((1-golpe)*Math.PI)*.45 : -wind*.30;
  // no preparo, o tronco recua e ergue a faca antes de cada batida na mesa
  if(c.estado === 'preparo') incl -= .12 + (c.escudoBate > 0 ? -.3 : Math.sin(tempo*6)*.04);

  const lunge = golpe ? Math.sin((1-golpe)*Math.PI)*r*.55 : 0;
  const passo = andando ? Math.abs(Math.sin(c.pisada*5.5))*r*.13 : 0;
  const lx = Math.cos(c.angulo)*lunge, ly = Math.sin(c.angulo)*lunge*.4 - passo;

  // poeira levantando do pé que acabou de bater
  if(andando && Math.random() < .3){
    const lado = Math.sin(c.pisada*5.5) > 0 ? 1 : -1;
    particulas.push({x:c.x + lado*.4, y:c.y + .8,
      vx:(Math.random()-.5)*.7 - lado*.3, vy:-.25 - Math.random()*.3,
      vida:.4, cor:'rgba(170,140,105,.4)', tam:.09});
  }

  /* pernas grandes e visíveis: coxas blindadas com joelheira e botas, plantadas no chão.
     O corpo (sprite) sobe para dar lugar a elas — nada de flutuar. */
  const base = py + r*.95, alt = r*3.8;      // tronco; as pernas somam ~r*.9 abaixo
  const pernaAlt = r*(.92 - ajoelha*.35);
  const balanco = (andando || c.estado === 'investida') ? Math.sin(c.pisada*5.5)*.5 : 0;
  const hipY = base + ly - pernaAlt + ajoelha*r*.36;
  const perna = (lado, ang) => {
    ctx.save();
    ctx.translate(px + lx*.55 + lado*r*.34, hipY);
    ctx.rotate(ang);
    // coxa e canela num bloco pesado
    ctx.fillStyle = c.flash > .5 ? '#8d8698' : '#241f28';
    ctx.beginPath();
    ctx.moveTo(-r*.20, 0); ctx.lineTo(r*.20, 0);
    ctx.lineTo(r*.15, pernaAlt*.96); ctx.lineTo(-r*.15, pernaAlt*.96);
    ctx.closePath(); ctx.fill();
    // brilho de metal na lateral
    ctx.fillStyle = 'rgba(210,200,225,.10)';
    ctx.fillRect(-r*.20, pernaAlt*.08, r*.09, pernaAlt*.72);
    // joelheira
    ctx.fillStyle = '#38323f';
    ctx.beginPath(); ctx.ellipse(0, pernaAlt*.46, r*.17, r*.12, 0, 0, TAU); ctx.fill();
    // bota
    ctx.fillStyle = '#0f0c14';
    ctx.beginPath(); ctx.ellipse(Math.sin(ang)*r*.06, pernaAlt*.98, r*.27, r*.15, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(220,210,235,.14)';
    ctx.beginPath(); ctx.ellipse(0, pernaAlt*.90, r*.20, r*.06, 0, 0, TAU); ctx.fill();
    ctx.restore();
  };
  perna(-1, balanco);
  perna(1, -balanco);

  const iw = imgButcher.naturalWidth, ih = imgButcher.naturalHeight;
  if(imgButcher.complete && iw > 0){
    const lar = alt*iw/ih;
    const resp = exausto ? Math.sin(tempo*7)*.06 : Math.sin(tempo*1.8)*.015;  // arfa como um fole
    // a cada pisada o corpo comprime de leve: o peso chega no chão
    const soco = andando ? Math.abs(Math.cos(c.pisada*5.5))*.03 : 0;
    ctx.save();
    ctx.translate(px + lx, hipY + r*.14);          // o tronco senta sobre os quadris
    if(flip) ctx.scale(-1, 1);
    ctx.rotate(-incl + gingado);
    ctx.scale(1 + ajoelha*.07 + soco, (1 - ajoelha*.24 - soco)*(1 + resp));
    if(c.flash > .5) ctx.filter = 'brightness(2.1) saturate(.4)';
    ctx.drawImage(imgButcher, -lar/2, -alt, lar, alt);
    ctx.filter = 'none';
    ctx.restore();
  } else {
    ctx.fillStyle = '#4a3c34';
    ctx.beginPath(); ctx.ellipse(px, py - r*.1, r*.78, r*.95, 0, 0, TAU); ctx.fill();
  }

  // o brilho da lâmina erguida no windup: aviso de que o talho vem
  const topoC = hipY + r*.14 - alt;                  // topo do tronco na tela
  if(wind > .25){
    const ga = c.angulo + Math.PI*.82;
    ctx.strokeStyle = 'rgba(235,235,245,' + (wind*.75) + ')';
    ctx.lineWidth = Math.max(1.5, r*.11*wind);
    ctx.beginPath();
    ctx.moveTo(px + Math.cos(ga)*r*.5, topoC + alt*.28);
    ctx.lineTo(px + Math.cos(ga)*r*1.3, topoC + alt*.02);
    ctx.stroke();
  }

  // o talho: a lâmina larga risca um arco pesado, de cima para baixo
  if(golpe){
    ctx.strokeStyle = 'rgba(255,225,190,' + (golpe*.9) + ')';
    ctx.lineWidth = Math.max(1, r*.3*golpe);
    ctx.beginPath();
    ctx.arc(px, py, r*2.2, c.angulo - 1.2 + (1-golpe)*1.7, c.angulo + .4 + (1-golpe)*1.7);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + (golpe*.5) + ')';
    ctx.lineWidth = Math.max(1, r*.1*golpe);
    ctx.beginPath();
    ctx.arc(px, py, r*2.2, c.angulo - .9 + (1-golpe)*1.7, c.angulo + .1 + (1-golpe)*1.7);
    ctx.stroke();
  }

  // batida da faca na mesa: o impacto racha o chão à frente
  const mira = c.mira != null ? c.mira : c.angulo;
  if(c.escudoBate > 0){
    const p2 = c.escudoBate/.22;
    const bx = px + Math.cos(mira)*r*1.6, by = py + Math.sin(mira)*r*1.6 + r*.4;
    ctx.strokeStyle = 'rgba(240,210,150,' + (p2*.8) + ')';
    ctx.lineWidth = Math.max(1, r*.12*p2);
    ctx.beginPath(); ctx.arc(bx, by, r*(1.3 - p2*.9), 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + (p2*.9) + ')';
    ctx.lineWidth = Math.max(1, r*.16*p2);
    ctx.beginPath();
    ctx.moveTo(bx - Math.cos(mira+.5)*r*.8, by - Math.sin(mira+.5)*r*.8 - r*1.6*p2);
    ctx.lineTo(bx, by);
    ctx.stroke();
  }

  // suor e aviso quando ofegante; estrelas quando zonzo
  const hy = topoC + alt*.15 + ajoelha*r*.5;
  if(exausto && Math.random() < .25)
    particulas.push({x:c.x + Math.cos(c.angulo)*.5, y:c.y - .6,
      vx:(Math.random()-.5)*.4, vy:-.7 - Math.random()*.4, vida:.7, cor:'rgba(220,214,228,.55)', tam:.09});
  if(exausto){
    ctx.fillStyle = 'rgba(255,240,200,' + (.45 + Math.sin(tempo*8)*.25) + ')';
    ctx.font = '600 ' + Math.round(tam*.3) + 'px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('sem fôlego', px, topoC - tam*.25);
  }
  if(zonzo){
    for(let i=0;i<3;i++){
      const a2 = tempo*4 + i*TAU/3;
      ctx.fillStyle = '#ffe08a';
      ctx.beginPath();
      ctx.arc(px + Math.cos(a2)*r*.6, hy + Math.sin(a2)*r*.2, Math.max(1.5, r*.08), 0, TAU);
      ctx.fill();
    }
  }
}

/* --- pintura de realismo no cache: tábuas, fornos, mesas, prateleiras, sangue ---
   Roda uma vez por construção de mapa (gancho pintarCache), por baixo do decor. */
function pintarCozinhasCache(cmx, T){
  const rndDe = (x,y) => hash(x*3.7, y*9.1);
  const anda2 = v => v === CHAO || v === CHAO2 || v === PONTE;

  /* ---- paredes em perspectiva 3/4, como na referência: onde a parede olha
     para o sul (tem chão abaixo) desenha a FACE frontal de tijolos, de pé;
     o resto é o TOPO do muro, pedra escura e bruta ---- */
  const ehParede = (x,y) => x>=0 && y>=0 && x<COZ.LARG && y<COZ.ALT && mapa[y*COZ.LARG + x] === PAREDE;
  const ehChao2  = (x,y) => x>=0 && y>=0 && x<COZ.LARG && y<COZ.ALT && anda2(mapa[y*COZ.LARG + x]);
  const naBacia  = (x,y) => Math.hypot(x + .5 - 23.5, y + .5 - 36.5) < 2.45;   // a grande cisterna
  const naEstacao = (x,y) => y >= 10 && y <= 14 && ESTACOES.some(e => x >= e.x1 && x <= e.x2);
  for(let y=0; y<COZ.ALT; y++) for(let x=0; x<COZ.LARG; x++){
    if(!ehParede(x,y) || naBacia(x,y) || naEstacao(x,y)) continue;
    if(!(ehChao2(x,y+1) || ehChao2(x,y-1) || ehChao2(x+1,y) || ehChao2(x-1,y)
      || ehChao2(x+1,y+1) || ehChao2(x-1,y+1) || ehChao2(x+1,y-1) || ehChao2(x-1,y-1))) continue;
    const px2 = x*T, py2 = y*T, h = rndDe(x, y);

    if(ehChao2(x, y+1)){
      /* FACE frontal: três fiadas de tijolo à vista, mais claras no alto */
      cmx.fillStyle = '#6b5140';
      cmx.fillRect(px2, py2, T, T);
      cmx.fillStyle = 'rgba(255,225,185,.14)';                 // luz pegando o alto da face
      cmx.fillRect(px2, py2, T, T*.34);
      cmx.fillStyle = 'rgba(12,8,6,.22)';                      // sombra na base
      cmx.fillRect(px2, py2 + T*.66, T, T*.34);
      // fiadas com juntas desencontradas
      cmx.strokeStyle = 'rgba(18,10,8,.65)'; cmx.lineWidth = 1.8;
      for(let f=1; f<3; f++){
        cmx.beginPath(); cmx.moveTo(px2, py2 + f*T/3); cmx.lineTo(px2+T, py2 + f*T/3); cmx.stroke();
      }
      for(let f=0; f<3; f++){
        const off = ((x + f) % 2)*T/4;
        for(let j=0; j<3; j++){
          const jx = px2 + off + j*T/2;
          if(jx > px2 + 1 && jx < px2 + T - 1){
            cmx.beginPath(); cmx.moveTo(jx, py2 + f*T/3); cmx.lineTo(jx, py2 + (f+1)*T/3); cmx.stroke();
          }
        }
      }
      // tijolo trocado aqui e ali
      if(h > .55){
        cmx.fillStyle = h > .8 ? 'rgba(255,190,140,.16)' : 'rgba(10,6,4,.24)';
        cmx.fillRect(px2 + ((h*4)|0)%2 * T/2, py2 + (((h*7)|0)%3)*T/3 + 1, T/2, T/3 - 2);
      }
      // rodapé de cantaria clara encostando no chão
      cmx.fillStyle = '#9a8d80';
      cmx.fillRect(px2, py2 + T - T*.14, T, T*.14);
      cmx.strokeStyle = 'rgba(20,14,10,.55)'; cmx.lineWidth = 1.3;
      cmx.strokeRect(px2 + 1, py2 + T - T*.14, T*.5 - 1, T*.14);
      cmx.strokeRect(px2 + T*.5, py2 + T - T*.14, T*.5 - 1, T*.14);
      cmx.fillStyle = 'rgba(255,245,230,.25)';
      cmx.fillRect(px2, py2 + T - T*.14, T, 1.6);
    } else {
      /* TOPO do muro: pedra escura, bruta, com pedregulhos arredondados */
      cmx.fillStyle = '#2b241e';
      cmx.fillRect(px2, py2, T, T);
      cmx.strokeStyle = 'rgba(8,5,4,.6)'; cmx.lineWidth = 1.5;
      for(let k=0; k<3; k++){
        const bx = px2 + T*(.2 + rndDe(x*3+k, y)*.6), by = py2 + T*(.2 + rndDe(x, y*3+k)*.6);
        const br = T*(.14 + rndDe(x+k, y+k)*.12);
        cmx.fillStyle = 'rgba(70,58,48,' + (.25 + rndDe(x-k, y)*.3) + ')';
        cmx.beginPath(); cmx.ellipse(bx, by, br, br*.8, rndDe(x,y+k)*2, 0, TAU); cmx.fill();
        cmx.stroke();
      }
      // beirada de cantaria quando o topo encosta em chão pelos lados ou por cima
      cmx.fillStyle = '#7c7166';
      if(ehChao2(x, y-1)) cmx.fillRect(px2, py2, T, T*.12);
      if(ehChao2(x-1, y)) cmx.fillRect(px2, py2, T*.12, T);
      if(ehChao2(x+1, y)) cmx.fillRect(px2 + T - T*.12, py2, T*.12, T);
    }
  }

  /* sombra que a face da parede projeta no chão logo abaixo — dá o relevo */
  for(let y=0; y<COZ.ALT; y++) for(let x=0; x<COZ.LARG; x++){
    if(!ehChao2(x,y) || !ehParede(x, y-1) || naBacia(x, y-1)) continue;
    const g2 = cmx.createLinearGradient(0, y*T, 0, y*T + T*.5);
    g2.addColorStop(0, 'rgba(0,0,0,.38)'); g2.addColorStop(1, 'rgba(0,0,0,0)');
    cmx.fillStyle = g2;
    cmx.fillRect(x*T, y*T, T, T*.5);
  }

  /* ---- lajões de pedra nas salas (tudo que é CHAO): juntas grossas,
     lascas nos cantos e rachaduras — o chão da referência ---- */
  for(let y=0; y<COZ.ALT; y++) for(let x=0; x<COZ.LARG; x++){
    if(mapa[y*COZ.LARG + x] !== CHAO) continue;
    const px2 = x*T, py2 = y*T, h = rndDe(x+7, y+3);
    // manchas de tom (lajes que não são irmãs)
    if(h > .55){
      cmx.fillStyle = h > .8 ? 'rgba(240,235,225,.06)' : 'rgba(8,6,10,.10)';
      cmx.fillRect(px2+2, py2+2, T-4, T-4);
    }
    // lasca no canto
    if(h > .72){
      cmx.fillStyle = 'rgba(8,6,10,.35)';
      const c1 = [[px2,py2],[px2+T,py2],[px2,py2+T],[px2+T,py2+T]][(h*4)|0 % 4] || [px2,py2];
      cmx.beginPath();
      cmx.moveTo(c1[0], c1[1]);
      cmx.lineTo(c1[0] + (c1[0]===px2? T*.22 : -T*.22), c1[1]);
      cmx.lineTo(c1[0], c1[1] + (c1[1]===py2? T*.22 : -T*.22));
      cmx.closePath(); cmx.fill();
    }
    // rachadura atravessando a laje
    if(h > .9){
      cmx.strokeStyle = 'rgba(8,6,10,.45)'; cmx.lineWidth = 1.6;
      cmx.beginPath();
      cmx.moveTo(px2 + T*.15, py2 + T*(.2 + h*.3));

      cmx.lineTo(px2 + T*.62, py2 + T*.9);

  /* ---- ralos de cozinha no chão (as grades da referência) ---- */
  const pRalo = (x, y) => {

    cmx.strokeRect(px2 - l/2, py2 - l/2, l, l);
    cmx.strokeStyle = 'rgba(120,110,130,.6)'; cmx.lineWidth = 1.6;
    for(let k=1; k<4; k++){
      cmx.beginPath(); cmx.moveTo(px2 - l/2 + k*l/4, py2 - l/2 + 2); cmx.lineTo(px2 - l/2 + k*l/4, py2 + l/2 - 2); cmx.stroke();
      cmx.beginPath(); cmx.moveTo(px2 - l/2 + 2, py2 - l/2 + k*l/4); cmx.lineTo(px2 + l/2 - 2, py2 - l/2 + k*l/4); cmx.stroke();
    }
  };
  [[25.5,15.5],[16.5,40.5],[29.5,31.5],[36.5,14.5],[4.5,40.5]].forEach(([x,y]) => pRalo(x,y));

  /* ---- a cisterna em alto-relevo, como as piscinas da imagem de inspiração:
     borda de pedra lavrada com bisel, água funda em redemoinho e a grade de ferro ---- */
  [[21,44],[21,45],[21,46],[21,47],[24,44],[24,45],[24,46],[24,47],[22,47],[23,47]].forEach(([x,y]) => {
    const px2 = x*T, py2 = y*T;
    /* parapeito em ALTO-RELEVO: superfície clara em cima e face frontal
       sombreada embaixo, como um bloco de pedra com altura de verdade */
    const face = T*.34;
    // superfície de cima, iluminada
    cmx.fillStyle = '#a2978a'; cmx.fillRect(px2, py2, T, T - face);
    cmx.fillStyle = 'rgba(255,248,235,.3)'; cmx.fillRect(px2, py2, T, 3);
    cmx.strokeStyle = 'rgba(20,14,10,.55)'; cmx.lineWidth = 1.8;
    cmx.strokeRect(px2 + 1, py2 + 1, T - 2, T - face - 1);

    cmx.fillRect(px2 + T*.5 - 1, py2 + 1, 2, T - face - 2);   // junta entre os dois blocos
    // face frontal do bloco, caindo
    cmx.fillStyle = '#6b6156'; cmx.fillRect(px2, py2 + T - face, T, face);
    cmx.fillStyle = 'rgba(0,0,0,.35)'; cmx.fillRect(px2, py2 + T - face, T, 2.4);
    cmx.strokeStyle = 'rgba(15,10,8,.6)'; cmx.lineWidth = 1.4;
    cmx.strokeRect(px2 + 1, py2 + T - face, T*.5 - 1, face - 1);
    cmx.strokeRect(px2 + T*.5, py2 + T - face, T*.5 - 1, face - 1);
    cmx.fillStyle = 'rgba(0,0,0,.28)'; cmx.fillRect(px2, py2 + T - 2.6, T, 2.6);
    // bisel escuro na aresta que cai para a água
    cmx.fillStyle = 'rgba(12,22,28,.55)';
    if(x === 21) cmx.fillRect(px2 + T - T*.14, py2, T*.14, T - face);
    if(x === 24) cmx.fillRect(px2, py2, T*.14, T - face);
  });
  // a água: funda no meio, redemoinho e um brilho de superfície
  const wx = 22*T, wy = 45*T, ww = 2*T, wh = 2*T;
  const gA = cmx.createRadialGradient(wx + ww/2, wy + wh/2, 0, wx + ww/2, wy + wh/2, ww*.78);
  gA.addColorStop(0, '#3f97ac'); gA.addColorStop(.6, '#27687a'); gA.addColorStop(1, '#153a46');
  cmx.fillStyle = gA; cmx.fillRect(wx, wy, ww, wh);
  cmx.strokeStyle = 'rgba(175,235,248,.45)'; cmx.lineWidth = 2.2;

  cmx.strokeStyle = 'rgba(220,245,250,.35)'; cmx.lineWidth = 1.4;
  cmx.beginPath(); cmx.arc(wx + ww*.36, wy + wh*.32, ww*.07, 0, TAU); cmx.stroke();
  // sombras internas: as bordas pairam sobre a água por todos os lados (o alto-relevo)
  const gS = cmx.createLinearGradient(0, wy, 0, wy + T*.6);

  cmx.fillStyle = gS; cmx.fillRect(wx, wy, ww, T*.6);
  const gW = cmx.createLinearGradient(wx, 0, wx + T*.45, 0);

  const gE = cmx.createLinearGradient(wx + ww, 0, wx + ww - T*.45, 0);
  gE.addColorStop(0, 'rgba(0,0,0,.42)'); gE.addColorStop(1, 'rgba(0,0,0,0)');
  cmx.fillStyle = gE; cmx.fillRect(wx + ww - T*.45, wy, T*.45, wh);
  // e a linha de luz onde a água toca a borda sul, rasa
  cmx.fillStyle = 'rgba(190,240,250,.25)';
  cmx.fillRect(wx + 2, wy + wh - 2.6, ww - 4, 2.6);
  // a grade de ferro guardando a cisterna, de frente
  [[22,44],[23,44]].forEach(([x,y]) => {
    const px2 = x*T, py2 = y*T;
    cmx.fillStyle = '#0c1216'; cmx.fillRect(px2, py2, T, T);

    cmx.fillRect(px2, py2 + T*.16, T, T*.09);
    cmx.fillRect(px2, py2 + T*.72, T, T*.09);
    cmx.fillStyle = '#8e8378'; cmx.fillRect(px2, py2, T, T*.12);
    cmx.strokeStyle = 'rgba(20,14,10,.55)'; cmx.lineWidth = 1.3;
    cmx.strokeRect(px2 + 1, py2, T*.5 - 1, T*.12);
    cmx.strokeRect(px2 + T*.5, py2, T*.5 - 1, T*.12);
  });

  /* ---- pilares do salão em vista frontal, como na referência:
     base larga no chão, fuste subindo e capitel no alto ---- */
  [[19,33],[27,33],[19,40],[27,40]].forEach(([x,y]) => {
    const cx = (x+.5)*T, pe = (y+1)*T - T*.06;       // o pé do pilar, no tile dele
    const altP = T*1.7, larF = T*.52;

    cmx.fillStyle = 'rgb(122,106,84)';
    cmx.fillRect(x*T, y*T, T, T);

    cmx.beginPath(); cmx.ellipse(cx + T*.06, pe + T*.02, T*.46, T*.14, 0, 0, TAU); cmx.fill();

    cmx.fillStyle = '#6b6154';

    cmx.fillStyle = 'rgba(255,245,230,.18)';
    cmx.fillRect(cx - T*.42, pe - T*.22, T*.84, 2);
    // fuste com luz de um lado
    cmx.fillStyle = '#847767';
    cmx.fillRect(cx - larF/2, pe - altP, larF, altP - T*.22);
    cmx.fillStyle = 'rgba(255,245,230,.22)';
    cmx.fillRect(cx - larF/2, pe - altP, larF*.28, altP - T*.22);
    cmx.fillStyle = 'rgba(10,6,4,.28)';
    cmx.fillRect(cx + larF/2 - larF*.22, pe - altP, larF*.22, altP - T*.22);
    // frisos do fuste
    cmx.strokeStyle = 'rgba(18,12,8,.4)'; cmx.lineWidth = 1.4;
    for(let k=1; k<4; k++){
      cmx.beginPath();
      cmx.moveTo(cx - larF/2, pe - altP + k*(altP - T*.22)/4);
      cmx.lineTo(cx + larF/2, pe - altP + k*(altP - T*.22)/4);

    // capitel
    cmx.fillStyle = '#6b6154';
    cmx.fillRect(cx - T*.4, pe - altP - T*.16, T*.8, T*.18);
    cmx.fillStyle = 'rgba(255,245,230,.2)';
    cmx.fillRect(cx - T*.4, pe - altP - T*.16, T*.8, 2);
    cmx.strokeStyle = 'rgba(18,12,8,.55)'; cmx.lineWidth = 1.6;
    cmx.strokeRect(cx - T*.4, pe - altP - T*.16, T*.8, T*.18);
  });

  /* ---- a variedade de itens da referência, tema cozinha ---- */
  const pFrigideira = (x, y) => {
    const px2 = x*T, py2 = y*T;
    cmx.fillStyle = 'rgba(0,0,0,.3)';
    cmx.beginPath(); cmx.ellipse(px2, py2 + T*.06, T*.3, T*.14, 0, 0, TAU); cmx.fill();
    cmx.strokeStyle = '#4a3a20'; cmx.lineWidth = Math.max(2, T*.08);
    cmx.beginPath(); cmx.moveTo(px2 + T*.26, py2 - T*.04); cmx.lineTo(px2 + T*.62, py2 - T*.16); cmx.stroke();
    cmx.fillStyle = '#22202a';
    cmx.beginPath(); cmx.ellipse(px2, py2, T*.27, T*.18, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#100e16';
    cmx.beginPath(); cmx.ellipse(px2, py2, T*.19, T*.12, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = 'rgba(220,215,230,.3)';
    cmx.beginPath(); cmx.ellipse(px2 - T*.07, py2 - T*.06, T*.09, T*.04, .5, 0, TAU); cmx.fill();
  };
  const pJarra = (x, y, cor) => {
    const px2 = x*T, py2 = y*T;
    cmx.fillStyle = 'rgba(0,0,0,.32)';
    cmx.beginPath(); cmx.ellipse(px2, py2 + T*.2, T*.24, T*.09, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = cor;
    cmx.beginPath();
    cmx.moveTo(px2 - T*.09, py2 - T*.3);
    cmx.quadraticCurveTo(px2 - T*.3, py2 - T*.05, px2 - T*.17, py2 + T*.18);
    cmx.lineTo(px2 + T*.17, py2 + T*.18);
    cmx.quadraticCurveTo(px2 + T*.3, py2 - T*.05, px2 + T*.09, py2 - T*.3);
    cmx.closePath(); cmx.fill();
    cmx.fillStyle = 'rgba(10,6,4,.5)';
    cmx.beginPath(); cmx.ellipse(px2, py2 - T*.3, T*.1, T*.045, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = 'rgba(255,245,230,.25)';
    cmx.beginPath(); cmx.ellipse(px2 - T*.1, py2 - T*.08, T*.05, T*.14, .2, 0, TAU); cmx.fill();
  };
  const pQueijo = (x, y) => {
    const px2 = x*T, py2 = y*T;
    cmx.fillStyle = 'rgba(0,0,0,.28)';
    cmx.beginPath(); cmx.ellipse(px2, py2 + T*.09, T*.22, T*.08, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#d8a83c';
    cmx.beginPath(); cmx.ellipse(px2, py2, T*.21, T*.13, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#eec55e';
    cmx.beginPath(); cmx.ellipse(px2, py2 - T*.035, T*.21, T*.11, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#d8a83c';                        // a fatia tirada
    cmx.beginPath(); cmx.moveTo(px2, py2 - T*.03);
    cmx.lineTo(px2 + T*.21, py2 - T*.09); cmx.lineTo(px2 + T*.17, py2 + T*.02);
    cmx.closePath(); cmx.fill();
    cmx.fillStyle = 'rgba(120,80,20,.5)';
    [[-.08,-.05],[.02,-.08],[.06,.01]].forEach(([fx,fy]) => {
      cmx.beginPath(); cmx.arc(px2 + fx*T, py2 + fy*T, T*.02, 0, TAU); cmx.fill();
    });
  };
  const pGarrafas = (x, y, n) => {
    for(let k=0; k<n; k++){
      const px2 = (x + k*.28)*T, py2 = (y + (k%2)*.12)*T;
      cmx.fillStyle = 'rgba(0,0,0,.3)';
      cmx.beginPath(); cmx.ellipse(px2, py2 + T*.16, T*.1, T*.05, 0, 0, TAU); cmx.fill();
      cmx.fillStyle = k%2 ? '#274a28' : '#3a2436';
      cmx.fillRect(px2 - T*.07, py2 - T*.18, T*.14, T*.32);
      cmx.fillRect(px2 - T*.028, py2 - T*.32, T*.056, T*.16);
      cmx.fillStyle = 'rgba(255,245,230,.3)';
      cmx.fillRect(px2 - T*.05, py2 - T*.15, T*.03, T*.2);
      cmx.fillStyle = '#8a1f1f';
      cmx.fillRect(px2 - T*.028, py2 - T*.34, T*.056, T*.045);
    }
  };
  const pCesto = (x, y) => {
    const px2 = x*T, py2 = y*T;
    cmx.fillStyle = 'rgba(0,0,0,.3)';
    cmx.beginPath(); cmx.ellipse(px2, py2 + T*.16, T*.3, T*.1, 0, 0, TAU); cmx.fill();
    cmx.fillStyle = '#8a6a38';
    cmx.beginPath();

    cmx.quadraticCurveTo(px2, py2 + T*.28, px2 + T*.3, py2 - T*.08);
    cmx.lineTo(px2 + T*.26, py2 - T*.14); cmx.lineTo(px2 - T*.26, py2 - T*.14);
    cmx.closePath(); cmx.fill();
    cmx.strokeStyle = 'rgba(40,26,10,.6)'; cmx.lineWidth = 1.3;
    for(let k=-2; k<=2; k++){
      cmx.beginPath(); cmx.moveTo(px2 + k*T*.11, py2 - T*.12); cmx.lineTo(px2 + k*T*.13, py2 + T*.12); cmx.stroke();
    }
    // cebolas e uma abóbora dentro
    [[-.13,-.16,'#c9873a'],[.02,-.2,'#d8a03c'],[.15,-.15,'#b06a2a']].forEach(([fx,fy,c]) => {
      cmx.fillStyle = c;
      cmx.beginPath(); cmx.arc(px2 + fx*T, py2 + fy*T, T*.085, 0, TAU); cmx.fill();
    });
  };
  const pLinguicas = (x, y) => {
    const px2 = x*T, py2 = y*T;
    cmx.strokeStyle = '#4a3018'; cmx.lineWidth = 1.4;
    cmx.beginPath(); cmx.moveTo(px2 - T*.3, py2); cmx.lineTo(px2 + T*.3, py2); cmx.stroke();
    for(let k=-1; k<=1; k++){
      cmx.fillStyle = '#7c2a20';
      for(let e=0; e<3; e++){
        cmx.beginPath();
        cmx.ellipse(px2 + k*T*.22, py2 + T*.1 + e*T*.13, T*.05, T*.075, 0, 0, TAU);
        cmx.fill();
      }
      cmx.fillStyle = 'rgba(255,200,170,.25)';
      cmx.beginPath(); cmx.ellipse(px2 + k*T*.22 - T*.015, py2 + T*.12, T*.015, T*.1, 0, 0, TAU); cmx.fill();
    }
  };
  const pFaca = (x, y, ang) => {
    const px2 = x*T, py2 = y*T;
    cmx.save(); cmx.translate(px2, py2); cmx.rotate(ang);
    cmx.fillStyle = '#3a2a16';
    cmx.fillRect(-T*.26, -T*.03, T*.14, T*.06);
    cmx.fillStyle = '#b9b4c4';
    cmx.beginPath();
    cmx.moveTo(-T*.12, -T*.045); cmx.lineTo(T*.3, -T*.02);
    cmx.lineTo(T*.24, T*.045); cmx.lineTo(-T*.12, T*.045);
    cmx.closePath(); cmx.fill();
    cmx.fillStyle = 'rgba(255,255,255,.4)';

  };

  pFrigideira(10.8, 15.6); pFrigideira(26.8, 15.8);
  pJarra(3.6, 8.3, '#3a5a8c'); pJarra(35.5, 33.5, '#7a4a3a');
  pJarra(10.5, 32.5, '#3a5a8c'); pJarra(15.2, 31.5, '#7a4a3a');
  pJarra(30.2, 41.2, '#3a5a8c');
  pQueijo(38.5, 32.2); pQueijo(39.4, 32.6); pQueijo(7.6, 16.2);
  pGarrafas(7.3, 45.6, 3); pGarrafas(24.3, 46.2, 2); pGarrafas(30.3, 52.2, 3);
  pGarrafas(41.0, 33.4, 2);
  pCesto(4.6, 16.1); pCesto(8.5, 39.5); pCesto(34.5, 36.5);
  pLinguicas(7.2, 5.15); pLinguicas(19.2, 5.15); pLinguicas(23.2, 5.15);
  pFaca(10.4, 16.3, .4); pFaca(37, 12.4, -.3); pFaca(18.6, 15.9, 2.6);

  /* tábuas corridas nos pisos de madeira: cozinha, câmara e escada */
  const pranchas = (x1,y1,x2,y2) => {
    for(let y=y1; y<=y2; y++){
      for(let k=0; k<3; k++){
        const py = y*T + k*T/3;
        cmx.strokeStyle = 'rgba(38,24,12,.30)'; cmx.lineWidth = 1.6;
        cmx.beginPath(); cmx.moveTo(x1*T, py); cmx.lineTo((x2+1)*T, py); cmx.stroke();

        for(let x=x1; x<=x2; x++){
          const h2 = rndDe(x, y*3+k);

            const ex = x*T + T*(.2 + h2*.6);
            cmx.strokeStyle = 'rgba(38,24,12,.22)'; cmx.lineWidth = 1.4;
            cmx.beginPath(); cmx.moveTo(ex, py); cmx.lineTo(ex, py + T/3); cmx.stroke();
          }
          // veios e nós da madeira
          if(h2 > .82){
            cmx.strokeStyle = 'rgba(30,18,8,.16)'; cmx.lineWidth = 1;
            cmx.beginPath();
            cmx.ellipse(x*T + T*h2*.8, py + T/6, T*.06, T*.025, .3, 0, TAU);
            cmx.stroke();
          }
        }
      }
      // variação de tom entre pranchas: tiras horizontais quase transparentes
      for(let k=0; k<3; k++){
        const h3 = rndDe(y, k);
        cmx.fillStyle = h3 > .5 ? 'rgba(255,220,170,' + (h3-.5)*.10 + ')' : 'rgba(20,10,4,' + (.5-h3)*.12 + ')';
        cmx.fillRect(x1*T, y*T + k*T/3, (x2-x1+1)*T, T/3);

  pranchas(3,6,28,17);      // cozinha
  pranchas(31,4,43,16);     // câmara de carnes
  pranchas(37,47,43,52);    // escada de chegada

  /* fornos de tijolo na parede norte da cozinha, com a boca em brasa */
  [5,9,13,17,21,25].forEach(fx => {
    const cx = (fx + .5)*T, topo = 4.35*T, lar = T*1.9, alt2 = T*2.1;
    // corpo de tijolos
    cmx.fillStyle = '#4a3226';
    cmx.beginPath();
    cmx.moveTo(cx - lar/2, topo + alt2);
    cmx.lineTo(cx - lar/2, topo + alt2*.35);
    cmx.quadraticCurveTo(cx, topo - alt2*.12, cx + lar/2, topo + alt2*.35);
