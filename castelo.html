<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141019">
<title>O Castelo</title>
<style>
  :root{
    --brasa:#e8a13c; --osso:#ece5d6; --ferro:#8e8599;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --serifa: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%; overflow:hidden; background:#141019; color:var(--osso);
    font-family:var(--mono); overscroll-behavior:none; touch-action:none;}
  #app{position:fixed; inset:0;}
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block;}

  /* HUD */
  #hud{position:absolute; left:0; right:0; top:0; z-index:2; pointer-events:none;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 0; display:flex; align-items:center; gap:10px;
    font-size:11px; letter-spacing:.07em; text-transform:uppercase;}
  #vida{flex:1; max-width:200px; height:11px; background:#1d1729; border:1px solid #443659; position:relative; overflow:hidden;}
  #vidaFill{position:absolute; inset:0; transform-origin:left; background:linear-gradient(180deg,#e0596b,#8f2438);}
  #segredos{color:#9d94ad;}
  #segredos i{font-style:normal; color:#3f3550;}
  #segredos i.on{color:var(--brasa);}

  /* painel da missão */
  #missao{position:absolute; right:12px; top:calc(env(safe-area-inset-top) + 42px); z-index:2; pointer-events:none;
    background:#150f22cc; border:1px solid #3b2f4d; border-left:2px solid var(--brasa);
    padding:9px 12px 10px; max-width:212px; font-size:10px; letter-spacing:.04em; line-height:1.65;}
  #mTitulo{color:var(--brasa); text-transform:uppercase; letter-spacing:.18em; font-size:9px; margin-bottom:5px;}
  .tarefa{color:#b3a8c6; position:relative; padding-left:13px; transition:color .4s;}
  .tarefa::before{content:'○'; position:absolute; left:0; color:#6f6683;}
  .tarefa.feita{color:#69607d; text-decoration:line-through; text-decoration-color:#8fc48a99; text-decoration-thickness:1.5px;}
  .tarefa.feita::before{content:'●'; color:#8fc48a; text-decoration:none;}
  .tarefa .cont{color:#8d85a0;}
  .tarefa.feita .cont{color:#69607d;}

  /* barra do chefe */
  #chefeBarra{position:absolute; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top) + 44px);
    width:min(58%,360px); z-index:2; display:none;}
  #chefeBarra.on{display:block;}
  #chefeNome{font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:#d9b48a; text-align:center; margin-bottom:5px;}
  #chefeTrilho{height:13px; background:#1d1018; border:1px solid #6b3040; position:relative; overflow:hidden;}
  #chefeFill{position:absolute; inset:0; transform-origin:left; background:linear-gradient(180deg,#d84c3c,#7a1f22);}
  #chefeEstado{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:#ffe6c0; text-shadow:0 1px 2px #000;}

  /* aviso */
  #aviso{position:absolute; left:0; right:0; top:30%; z-index:2; text-align:center; pointer-events:none;
    font-family:var(--serifa); font-size:clamp(22px,7vw,34px); opacity:0; transition:opacity .35s; text-shadow:0 2px 20px #000;}
  #aviso.on{opacity:1;}
  #aviso small{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.24em;
    text-transform:uppercase; color:var(--brasa); margin-top:8px;}

  /* diálogo */
  #dialogo{position:absolute; left:0; right:0; bottom:0; z-index:5; padding:18px 20px calc(env(safe-area-inset-bottom) + 22px);
    background:linear-gradient(180deg, #0d0a12dd, #0d0a12f7); border-top:1px solid #3b2f4d; display:none;}
  #dialogo.on{display:flex; gap:14px; align-items:flex-start;}
  #dRetratoBox{flex:0 0 auto; width:82px; height:100px; border:1px solid #3b2f4d; background:#0a070f;
    border-radius:3px; overflow:hidden; display:none; box-shadow:0 2px 12px #000a;}
  #dRetratoBox.on{display:block;}
  #dRetrato{width:100%; height:100%; object-fit:cover; image-rendering:pixelated; display:block;}
  #dCorpo{flex:1 1 auto; min-width:0;}
  #dFala{font-family:var(--serifa); font-size:17px; line-height:1.55; color:#ece5d6; min-height:3.2em;}
  #dNome{font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--brasa); margin-bottom:8px;}
  #dSeguir{font-size:10px; letter-spacing:.18em; color:#6f6683; text-align:right; margin-top:10px;}
  #dPular{position:absolute; top:-16px; right:14px; transform:translateY(-100%);
    font:600 10px/1 ui-monospace, Menlo, monospace; letter-spacing:.18em;
    color:var(--brasa); background:rgba(12,8,18,.85); border:1px solid #3b2f4d;
    border-radius:6px; padding:8px 12px; cursor:pointer;}
  #dPular:active{background:#241a34;}

  /* ações */
  #acoes{position:absolute; right:16px; bottom:calc(env(safe-area-inset-bottom) + 22px); z-index:3;
    display:flex; flex-direction:column-reverse; gap:12px; align-items:center;}
  .circ{width:70px; height:70px; border-radius:50%; border:1px solid #4a3d63; background:#1b1529d9;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-size:9px; letter-spacing:.1em; color:#b3a8c6; position:relative; overflow:hidden;}
  .circ:active{background:#2f2547;}
  .circ .n{font-size:17px; color:var(--osso);}
  /* atalho de teclado impresso no rótulo do botão */
  .circ .k{font-family:var(--mono); font-style:normal; font-size:8px; letter-spacing:.06em;
    color:#8d84a3; border:1px solid #4a3d63; border-radius:2px; padding:0 3px; line-height:1.35; margin-top:2px;}
  #btnAcao .k{color:#b98a4e; border-color:#6a4c24;}
  #btnGolpe .k{color:#c08a76; border-color:#6d3b2f;}
  /* no toque não há teclado: o chip some e o botão volta ao layout original */
  @media (pointer:coarse){ .circ .k{display:none;} }
  .circ .carga{position:absolute; left:0; right:0; bottom:0; background:#e8a13c2e; transform-origin:bottom;}
  .circ.off{opacity:.35;}
  #btnAcao{width:86px; height:86px; border-color:var(--brasa); color:var(--brasa); background:#2a1d10d9; display:none;}
  #btnAcao.on{display:flex;}
  #btnPocao{width:58px; height:58px;}

  /* véu */
  #veu{position:absolute; inset:0; z-index:6; background:radial-gradient(circle at 50% 38%, #241a33 0%, #0a0710 76%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center;}
  #veu.oculto{display:none;}
  #veu h1{font-family:var(--serifa); font-weight:400; font-size:clamp(28px,8.5vw,44px); line-height:1.08;}
  #veu h1 em{display:block; font-style:italic; font-size:.48em; color:var(--brasa); letter-spacing:.08em; margin-top:8px;}
  #veu p{font-size:12px; color:#8b8299; line-height:1.85; max-width:25em; margin-top:16px;}
  #veu p b{color:#cbc2da; font-weight:400;}
  #comecar{margin-top:26px; background:transparent; border:1px solid var(--brasa); color:var(--brasa);
    font-family:var(--mono); font-size:13px; letter-spacing:.22em; padding:14px 32px; text-transform:uppercase;}
  #comecar:active{background:var(--brasa); color:#120d06;}
  #placar{font-size:12px; color:#8b8299; line-height:2; margin-top:14px;}
  #placar b{color:var(--osso); font-weight:400;}
  /* bolsa/inventário */
  #bolsa{margin-top:22px; display:none;}
  #bolsa.on{display:block;}
  #bolsa .rot{font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--brasa); margin-bottom:12px;}
  #bolsa .itens{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  #bolsa .item{width:64px; height:88px; background:#1a1424; border:1px solid #3b2f4d; border-radius:3px;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:6px 4px;
    position:relative; overflow:hidden;}
  #bolsa .item.novo{border-color:var(--brasa); box-shadow:0 0 14px #e8a13c66;
    animation:brilhaNovo 1.6s ease-in-out infinite alternate;}
  @keyframes brilhaNovo{ from{box-shadow:0 0 10px #e8a13c44;} to{box-shadow:0 0 20px #e8a13c99;} }
  #bolsa .item img{width:46px; height:60px; object-fit:contain; image-rendering:pixelated; margin-top:2px;}
  #bolsa .item .nm{font-family:var(--mono); font-size:8px; letter-spacing:.05em; color:#ccc2d8;
    text-align:center; margin-top:4px; line-height:1.15;}
  #bolsa .item .tag{position:absolute; top:2px; right:3px; font-family:var(--mono); font-size:7px;
    color:var(--brasa); letter-spacing:.1em;}
  #bolsa .vazio{color:#5a5266; font-size:11px; font-style:italic;}

  /* popup de item novo no inventário */
  #popupInv{position:absolute; inset:0; z-index:7; background:rgba(8,5,14,.8);
    display:flex; align-items:center; justify-content:center; padding:30px;}
  #popupInv.oculto{display:none;}
  #invCard{background:#150f22; border:1px solid var(--brasa); border-radius:4px;
    padding:22px 28px 24px; text-align:center; max-width:320px;
    box-shadow:0 0 44px #e8a13c44; animation:invEntra .25s ease-out;}
  @keyframes invEntra{ from{transform:scale(.85); opacity:0;} to{transform:scale(1); opacity:1;} }
  #invCard h2{font-family:var(--mono); font-weight:400; color:var(--brasa); letter-spacing:.28em;
    text-transform:uppercase; font-size:12px; margin-bottom:16px;}
  #invImg{width:160px; height:200px; object-fit:contain; image-rendering:pixelated;
    display:block; margin:0 auto 12px; background:transparent; filter:drop-shadow(0 0 14px #e8a13c66);}
  #invLista{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:16px;}
  #invLista .invTh{width:52px; height:66px; background:#1a1424; border:1px solid #3b2f4d;
    border-radius:3px; position:relative; display:flex; align-items:center; justify-content:center;}
  #invLista .invTh.sel{border-color:var(--brasa); box-shadow:0 0 10px #e8a13c55;}
  #invLista .invTh img{max-width:44px; max-height:58px; object-fit:contain; image-rendering:pixelated;}
  #invLista .invTh .tag{position:absolute; bottom:2px; left:0; right:0; font-family:var(--mono);
    font-size:6px; letter-spacing:.08em; color:var(--brasa); text-align:center;}
  #invBotoes{display:flex; gap:10px; justify-content:center;}
  #invAcao{background:var(--brasa); border:1px solid var(--brasa); color:#120d06;
    font-family:var(--mono); font-size:12px; letter-spacing:.2em; padding:11px 26px; text-transform:uppercase;}
  #invAcao:active{background:transparent; color:var(--brasa);}
  #invNome{font-family:var(--serifa); font-size:19px; color:var(--osso); margin-bottom:8px;}
  #invDesc{font-size:11px; color:#9d94ad; line-height:1.7; margin-bottom:18px;}
  #invFechar{background:transparent; border:1px solid var(--brasa); color:var(--brasa);
    font-family:var(--mono); font-size:12px; letter-spacing:.2em; padding:11px 26px; text-transform:uppercase;}
  #invFechar:active{background:var(--brasa); color:#120d06;}

  #btnGolpe{width:70px; height:70px; border-color:#8a4a3a; background:#241410d9; display:none;}
  #btnGolpe.on{display:flex;}
  #btnGolpe .n{color:#e8b48a;}
  #btnBolsa{width:58px; height:58px;}
</style>
</head>
<body>
<div id="app">
  <canvas id="tela"></canvas>

  <div id="hud">
    <div id="vida"><div id="vidaFill"></div></div>
    <span id="segredos">SEGREDOS </span>
  </div>

  <div id="missao"><div id="mTitulo"></div></div>

  <div id="chefeBarra">
    <div id="chefeNome"></div>
    <div id="chefeTrilho"><div id="chefeFill"></div><div id="chefeEstado"></div></div>
  </div>

  <div id="aviso"></div>

  <div id="acoes">
    <div class="circ" id="btnBolsa"><span class="n">☰</span><span>BOLSA</span><i class="k">I</i></div>
    <div class="circ" id="btnPocao"><span class="n" id="sPocoes">2</span><span>TRAPO</span><i class="k">Q</i></div>
    <div class="circ" id="btnDash"><span class="n">»</span><span>ROLAR</span><i class="k">ESPAÇO</i><div class="carga" id="cargaDash"></div></div>
    <div class="circ" id="btnGolpe"><span class="n">⚔</span><span>GOLPE</span><i class="k">F</i><div class="carga" id="cargaGolpe"></div></div>
    <div class="circ" id="btnAcao"><span class="n" id="acaoIcone">✥</span><span id="acaoRotulo">FORÇAR</span><i class="k">E</i></div>
  </div>

  <div id="dialogo">
    <div id="dRetratoBox"><img id="dRetrato" alt=""></div>
    <div id="dCorpo">
      <div id="dNome"></div>
      <div id="dFala"></div>
      <div id="dSeguir">tocar para continuar</div>
    </div>
    <button id="dPular" type="button">PULAR ⏭</button>
  </div>

  <div id="veu">
    <h1 id="vTitulo"></h1>
    <p id="vTexto"></p>
    <button id="comecar"></button>
    <div id="placar"></div>
    <div id="bolsa">
      <div class="rot">Bolsa</div>
      <div class="itens" id="bolsaItens"></div>
    </div>
  </div>

  <div id="popupInv" class="oculto">
    <div id="invCard">
      <h2>Inventário</h2>
      <img id="invImg" alt="">
      <div id="invNome"></div>
      <div id="invDesc"></div>
      <div id="invLista"></div>
      <div id="invBotoes">
        <button id="invAcao">Pegar</button>
        <button id="invFechar">Fechar</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ===================== DIAGNÓSTICO ===================== */
(function(){
  var caixa = null;
  window.__erro = function(txt){
    if(!caixa){
      caixa = document.createElement('div');
      caixa.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;max-height:45%;overflow:auto;'
        + 'background:#1a0d12;color:#ff9aa8;font:11px/1.5 ui-monospace,Menlo,monospace;padding:12px 14px;'
        + 'border-top:1px solid #6b2534;white-space:pre-wrap;';
      document.body.appendChild(caixa);
    }
    caixa.textContent += txt + '\n';
  };
  window.addEventListener('error', function(e){
    window.__erro('ERRO: ' + (e.message||'?') + (e.filename ? '\n  ' + e.filename + ':' + e.lineno : '')
      + (e.error && e.error.stack ? '\n' + e.error.stack : ''));
  });
})();

/* ================================================================
   MOTOR
   Não sabe o que é um calabouço, uma corrente ou um Gladiador.
   Um piso é um objeto com esta forma:

   {
     id, nome,
     paleta:   {fundo, chao:[r,g,b], chao2:[r,g,b], parede:[r,g,b], luzAmbiente}
     construir()          -> {larg, alt, tiles:Uint8Array, braseiros:[{x,y,fase}]}
     spawn:    {x,y}
     trapos:   quantos itens de cura o jogador começa tendo
     intro:    {titulo, texto, botao}
     missao:   {titulo, tarefas:[{id, label, contador?}], tarefaInformantes, tarefaChefe}
     informantes: [{nome, chave, cor, voz:{pitch,rate}, falas:[...], ganho, x, y}]
     chefe:    {cfg (números da máquina de estados), fraquezas, desenhar(c,ox,oy)}
     textos:   {vitoria(), derrota()} -> {titulo, texto, botao, placar}
     — ganchos opcionais —
     aoIniciar(), atualizar(dt), falarLiberado(), interacao(), agir(i),
     desenharCenario(ox,oy), desenharNoJogador(px,py,r,bal), aoVencer()
   }
   ================================================================ */

/* ---------- constantes e utilidades ---------- */
const TAU = Math.PI*2, VISAO = 14;
const PAREDE = 0, CHAO = 1, GRADE = 2, CHAO2 = 3,   // CHAO2: piso alternativo (areia, tapete...)
      FOSSO = 4, PONTE = 5;                         // FOSSO: abismo (sólido); PONTE: tábuas sobre o abismo
let LARG = 1, ALT = 1;

const el = id => document.getElementById(id);
const irand = n => Math.floor(Math.random()*n);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const idx = (x,y) => y*LARG + x;
const dentro = (x,y) => x>=0 && y>=0 && x<LARG && y<ALT;
const hash = (x,y) => { const n = Math.sin(x*127.1 + y*311.7)*43758.5453; return n - Math.floor(n); };

/* ---------- estado do motor ---------- */
let piso = null, mapa = null, braseiros = [], decor = [];
let inventario = []; /* itens ganhos de chefes, persistem entre pisos */
const imgsItens = {};
let jog = null, chefe = null, informantes = [];
let etapa = 'menu', vivo = false, pausado = false;
let intel = {}, dialogo = null, interacao = null;
let tempo = 0, tremor = 0, camX = 0, camY = 0;
let particulas = [], riscos = [], destrocos = [];

const tela = el('tela'), ctx = tela.getContext('2d');
const cacheMapa = document.createElement('canvas'), cmx = cacheMapa.getContext('2d');
const imgJogador = new Image(); imgJogador.src = 'img/jogador.png';
let fatiasJog = null;               // avatar fatiado: tronco + pernas animadas
function montarFatiasJog(){
  const iw = imgJogador.naturalWidth, ih = imgJogador.naturalHeight;
  const corte = Math.round(ih*.62);                    // altura do quadril na foto
  const cv = (sx,sy,sw,sh) => {
    const c = document.createElement('canvas'); c.width = sw; c.height = sh;
    c.getContext('2d').drawImage(imgJogador, sx, sy, sw, sh, 0, 0, sw, sh);
    return c;
  };
  const ombro = Math.round(ih*.33);                    // linha dos ombros na foto
  const larE = Math.round(iw*.41), x0D = Math.round(iw*.69);
  const tronco = cv(0, 0, iw, corte + 2);              // 2px de sobra cobre a emenda
  const tcx = tronco.getContext('2d');
  tcx.clearRect(0, ombro, larE, tronco.height - ombro);
  tcx.clearRect(x0D, ombro, iw - x0D, tronco.height - ombro);
  fatiasJog = {
    corte, ombro, x0D,
    tronco,
    bracoE: cv(0, ombro, larE, corte - ombro),
    bracoD: cv(x0D, ombro, iw - x0D, corte - ombro),
    pernaE: cv(0, corte, Math.ceil(iw/2), ih - corte),
    pernaD: cv(Math.floor(iw/2), corte, iw - Math.floor(iw/2), ih - corte)
  };
}
const luzCv = document.createElement('canvas'), lcx = luzCv.getContext('2d');

/* ---------- som (síntese realista via Web Audio) ---------- */
let ac = null, somOk = true;
let masterGain = null, reverbConv = null, reverbGain = null;
let bufRuido = null, bufBrown = null;

function iniAudio(){
  if(ac) return true;
  if(!somOk) return false;
  try{
    ac = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = ac.createGain(); masterGain.gain.value = 0.85;
    masterGain.connect(ac.destination);
    // reverb curto de câmara de pedra
    reverbConv = ac.createConvolver();
    reverbConv.buffer = criarImpulso(1.6, 2.6);
    reverbGain = ac.createGain(); reverbGain.gain.value = 0.22;
    reverbConv.connect(reverbGain); reverbGain.connect(masterGain);
    bufRuido = criarRuido(2, false);
    bufBrown = criarRuido(2, true);
    return true;
  }catch(e){ somOk = false; return false; }
}
function criarImpulso(dur, decai){
  const sr = ac.sampleRate, n = Math.floor(sr*dur);
  const b = ac.createBuffer(2, n, sr);
  for(let c=0;c<2;c++){ const d = b.getChannelData(c);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, decai); }
  return b;
}
function criarRuido(sec, brown){
  const sr = ac.sampleRate, n = Math.floor(sr*sec);
  const b = ac.createBuffer(1, n, sr), d = b.getChannelData(0);
  if(brown){ let u = 0; for(let i=0;i<n;i++){ u = (u + .02*(Math.random()*2-1))/1.02; d[i] = u*3.5; } }
  else for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
  return b;
}
function ruido(brown){
  const s = ac.createBufferSource();
  s.buffer = brown ? bufBrown : bufRuido; s.loop = true;
  s.playbackRate.value = 0.85 + Math.random()*0.3;
  return s;
}
function filtro(tipo, freq, q, ganho){
  const f = ac.createBiquadFilter();
  f.type = tipo; f.frequency.value = freq;
  if(q != null) f.Q.value = q;
  if(ganho != null) f.gain.value = ganho;
  return f;
}
function envelope(pico, ataque, decai, sustain, liberacao){
  const g = ac.createGain(), t = ac.currentTime;
  const p = Math.max(0.0001, pico);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(p, t + ataque);
  const s = Math.max(0.0001, p * (sustain != null ? sustain : 0.3));
  g.gain.exponentialRampToValueAtTime(s, t + ataque + decai);
  g.gain.exponentialRampToValueAtTime(0.0001, t + ataque + decai + liberacao);
  return g;
}
function saida(node, molhado){
  const w = molhado != null ? molhado : 0.35;
  const dry = ac.createGain(); dry.gain.value = 1 - w*0.4;
  const wet = ac.createGain(); wet.gain.value = w;
  node.connect(dry); dry.connect(masterGain);
  node.connect(wet); wet.connect(reverbConv);
}
function parar(no, dur){ try{ no.start(); no.stop(ac.currentTime + dur + 0.06); }catch(e){} }
function pararEm(no, t0, dur){ try{ no.start(t0); no.stop(t0 + dur + 0.06); }catch(e){} }

/* vocalização humana por formantes (base para grunhidos, gritos, tosse) */
function vocalizar(cfg){
  const t = ac.currentTime, dur = cfg.dur;
  const o = ac.createOscillator();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(cfg.f0, t);
  if(cfg.subida) o.frequency.exponentialRampToValueAtTime(cfg.f0 * cfg.subida, t + dur*0.15);
  o.frequency.exponentialRampToValueAtTime(cfg.f0 * (cfg.queda || 0.6), t + dur);
  const lfo = ac.createOscillator();
  lfo.frequency.value = cfg.vibrato || 5;
  const lfoG = ac.createGain(); lfoG.gain.value = cfg.f0 * 0.05;
  lfo.connect(lfoG); lfoG.connect(o.frequency);
  parar(lfo, dur);
  const mix = ac.createGain(); mix.gain.value = 1;
  (cfg.formantes || [[600,1],[1200,0.6],[2500,0.4]]).forEach(([f, amp]) => {
    const bp = filtro('bandpass', f, 12);
    const g = ac.createGain(); g.gain.value = amp;
    o.connect(bp); bp.connect(g); g.connect(mix);
  });
  const nz = ruido(), nzBp = filtro('bandpass', 1800, 1.4);
  const nzG = ac.createGain(); nzG.gain.value = (cfg.rugosidade || 0.4) * 0.11;
  nz.connect(nzBp); nzBp.connect(nzG); nzG.connect(mix);
  parar(nz, dur);
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(cfg.ganho, t + (cfg.ataque || 0.04));
  env.gain.setValueAtTime(cfg.ganho, t + dur*0.55);
  env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  mix.connect(env);
  saida(env, cfg.molhado != null ? cfg.molhado : 0.5);
  parar(o, dur);
}

  try{

    const a = sfxCache[url].cloneNode();
    a.volume = vol != null ? vol : 1;
    const p = a.play();
    if(p && p.catch) p.catch(() => { if(reserva) reserva(); });
  }catch(e){ if(reserva) reserva(); }
}

/* vitória: acorde suave com harmônico (sem beeps) */
function sVitoria(){
  if(!iniAudio()) return;
  [220, 330, 440, 660].forEach((f, i) => setTimeout(() => {
    const t = ac.currentTime;
    const o1 = ac.createOscillator(); o1.type = 'triangle'; o1.frequency.value = f;
    const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = f*2;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.08, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
    o1.connect(g); o2.connect(g); saida(g, 0.7);
    parar(o1, 1); parar(o2, 1);
  }, i*180));
}

/* tarefa: pequeno duplo-clique tonal, curto */
function sTarefa(){
  if(!iniAudio()) return;
  [660, 990].forEach((f, i) => setTimeout(() => {
    const t = ac.currentTime;
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);

}

/* voz: síntese de fala do aparelho, com escolha por gênero/perfil */
function escolherVoz(voz){
  if(!window.speechSynthesis) return null;
  const vs = speechSynthesis.getVoices();
  if(!vs || !vs.length) return null;
  const pt = vs.filter(v => v.lang && /^pt/i.test(v.lang));
  const pool = pt.length ? pt : vs;
  const rxFem = /luciana|helena|joana|paulina|maria|female|feminina|mulher|catarina|ines|in[eê]s/i;
  const rxMas = /felipe|daniel|jorge|thiago|male|masculino|homem|joaquim|ricardo|diogo|eddy/i;
  if(voz.genero === 'f'){
    const f = pool.find(v => rxFem.test(v.name)); if(f) return f;
    const nf = pool.find(v => !rxMas.test(v.name)); if(nf) return nf;
  }
  if(voz.genero === 'm'){
    const m = pool.find(v => rxMas.test(v.name)); if(m) return m;
    const nm = pool.find(v => !rxFem.test(v.name)); if(nm) return nm;
  }
  return pool[0];
}
let audioFala = null;
/* a música abaixa enquanto um preso fala, para a voz ficar na frente */
function abaixarBgm(falando){
  if(bgmAudio){ try{ fundirBgm(falando ? BGM_VOL_FALA : bgmVolAtual); }catch(e){} }
}
function falarVoz(texto, voz, url){
  try{
    calarVoz();
    if(url){
      audioFala = new Audio(url);
      audioFala.volume = 1;
      abaixarBgm(true);
      audioFala.addEventListener('ended', () => abaixarBgm(false), {once:true});
      const seguir = voz.tosse
        ? () => { sTosse(); setTimeout(() => audioFala && audioFala.play().catch(() => _falarSintese(texto, voz)), 620); }
        : () => audioFala.play().catch(() => _falarSintese(texto, voz));
      audioFala.addEventListener('error', () => _falarSintese(texto, voz), {once:true});
      seguir();
      return;
    }
    if(!somOk || !window.speechSynthesis) return;
    if(voz.tosse){ sTosse(); setTimeout(() => _falarSintese(texto, voz), 620); }
    else _falarSintese(texto, voz);
  }catch(e){}
}
function _falarSintese(texto, voz){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'pt-BR'; u.pitch = voz.pitch; u.rate = voz.rate; u.volume = 1;
    const v = escolherVoz(voz); if(v) u.voice = v;
    abaixarBgm(true);
    u.onend = () => abaixarBgm(false);
    speechSynthesis.speak(u);
  }catch(e){}
}
function calarVoz(){
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  if(audioFala){ try{ audioFala.pause(); audioFala.currentTime = 0; }catch(e){} audioFala = null; }
  abaixarBgm(false);
}

/* ---------- mapa e cache do cenário ---------- */
function definirMapa(m){
  LARG = m.larg; ALT = m.alt;
  mapa = m.tiles; braseiros = m.braseiros || []; decor = m.decor || [];
  desenharCache();
}
function desenharCache(){
  const T = 48, P = piso.paleta;
  cacheMapa.width = LARG*T; cacheMapa.height = ALT*T;
  cmx.fillStyle = P.fundo; cmx.fillRect(0,0,cacheMapa.width, cacheMapa.height);
  const rgb = (c,v) => 'rgb(' + Math.round(c[0]*v) + ',' + Math.round(c[1]*v) + ',' + Math.round(c[2]*v) + ')';

  for(let y=0;y<ALT;y++) for(let x=0;x<LARG;x++){
    const px = x*T, py = y*T, h = hash(x,y), t = mapa[idx(x,y)];
    if(t === CHAO){
      cmx.fillStyle = rgb(P.chao, .88 + h*.24);
      cmx.fillRect(px, py, T, T);
      cmx.strokeStyle = 'rgba(20,16,28,.55)'; cmx.lineWidth = 2;
      cmx.strokeRect(px+1, py+1, T-2, T-2);
      cmx.fillStyle = 'rgba(255,255,255,.06)'; cmx.fillRect(px+2, py+2, T-4, 3);
      if(h > .88){
        cmx.strokeStyle = 'rgba(0,0,0,.32)'; cmx.lineWidth = 2;
        cmx.beginPath(); cmx.moveTo(px+T*.25, py+T*.2); cmx.lineTo(px+T*.55, py+T*.62); cmx.lineTo(px+T*.4, py+T*.9); cmx.stroke();
      }
    } else if(t === CHAO2){
      cmx.fillStyle = rgb(P.chao2, .88 + h*.24);
      cmx.fillRect(px, py, T, T);
      cmx.fillStyle = 'rgba(0,0,0,' + (h*.22) + ')';
      cmx.beginPath(); cmx.arc(px+T*h, py+T*(1-h), T*.22, 0, TAU); cmx.fill();
    } else if(t === GRADE){
      cmx.fillStyle = '#1b1622'; cmx.fillRect(px, py, T, T);
      cmx.fillStyle = '#5d5568';
      for(let k=0;k<4;k++) cmx.fillRect(px + T*(.1 + k*.24), py, T*.09, T);
      cmx.fillRect(px, py + T*.12, T, T*.08);
      cmx.fillRect(px, py + T*.78, T, T*.08);
      cmx.fillStyle = 'rgba(255,255,255,.16)';
      for(let k=0;k<4;k++) cmx.fillRect(px + T*(.1 + k*.24), py, T*.03, T);
    } else if(t === PONTE){
      cmx.fillStyle = '#070510'; cmx.fillRect(px, py, T, T);          // abismo por baixo das frestas
      for(let k=0;k<4;k++){
        const v = .8 + hash(x*3+k, y*7)*.35;
        cmx.fillStyle = 'rgb(' + Math.round(122*v) + ',' + Math.round(82*v) + ',' + Math.round(48*v) + ')';
        cmx.fillRect(px+1, py + k*T*.25 + 1, T-2, T*.25 - 3);
        cmx.fillStyle = 'rgba(255,255,255,.05)';
        cmx.fillRect(px+1, py + k*T*.25 + 1, T-2, 2);
      }
      if(dentro(x-1,y) && mapa[idx(x-1,y)] === FOSSO){                // viga lateral quando pende sobre o vazio
        cmx.fillStyle = '#3a2a18'; cmx.fillRect(px, py, 4, T);
        cmx.fillStyle = 'rgba(216,180,120,.35)'; cmx.fillRect(px+1, py, 1.5, T);
      }
      if(dentro(x+1,y) && mapa[idx(x+1,y)] === FOSSO){
        cmx.fillStyle = '#3a2a18'; cmx.fillRect(px+T-4, py, 4, T);
        cmx.fillStyle = 'rgba(216,180,120,.35)'; cmx.fillRect(px+T-2.5, py, 1.5, T);
      }
    } else if(t === FOSSO){
      cmx.fillStyle = '#070510'; cmx.fillRect(px, py, T, T);
      if(h > .78){
        cmx.fillStyle = 'rgba(70,60,88,.16)';
        cmx.beginPath(); cmx.arc(px + T*h, py + T*(.3 + h*.5), T*.09, 0, TAU); cmx.fill();
      }
      if(dentro(x,y-1)){
        const v = mapa[idx(x,y-1)];
        if(v !== FOSSO && v !== PAREDE){                              // paredão do penhasco sob a beirada
          cmx.fillStyle = 'rgba(150,138,166,.45)'; cmx.fillRect(px, py, T, 3);
          cmx.fillStyle = 'rgba(52,44,66,.7)'; cmx.fillRect(px, py+3, T, T*.3);
          cmx.fillStyle = 'rgba(22,18,32,.7)'; cmx.fillRect(px, py + T*.3 + 3, T, T*.2);
        }
      }
    } else {
      cmx.fillStyle = rgb(P.parede, .92 + h*.18);
      cmx.fillRect(px, py, T, T);
      cmx.strokeStyle = 'rgba(18,14,24,.6)'; cmx.lineWidth = 2;
      cmx.strokeRect(px+1, py+1, T-2, T-2);
      cmx.fillStyle = 'rgba(0,0,0,.22)'; cmx.fillRect(px, py+T*.48, T, 2);
      if(dentro(x,y+1) && mapa[idx(x,y+1)] !== PAREDE){
        cmx.fillStyle = 'rgba(230,215,245,.16)'; cmx.fillRect(px, py+T*.78, T, T*.22);
      }
      if(dentro(x,y-1) && mapa[idx(x,y-1)] !== PAREDE){
        cmx.fillStyle = 'rgba(0,0,0,.3)'; cmx.fillRect(px, py, T, T*.18);
      }
    }
  }
  if(piso.pintarCache) piso.pintarCache(cmx, T);   // detalhe de piso por cima dos tiles, por baixo do decor
  decor.forEach(d => desenharDecorCache(d, T));
}

/* ---------- decor procedural (barris, palha, ossos, sangue, correntes...) ---------- */
function desenharDecorCache(d, T){
  const cx = d.x*T, cy = d.y*T, h = hash(d.x*13.7, d.y*7.3);
  switch(d.tipo){
    case 'palha': dPalha(cx, cy, T, h); break;
    case 'caveira': dCaveira(cx, cy, T, h); break;
    case 'tigela': dTigela(cx, cy, T); break;
    case 'barril': dBarril(cx, cy, T); break;
    case 'caixote': dCaixote(cx, cy, T, h); break;
    case 'poca': dPoca(cx, cy, T, h); break;
    case 'sangue': dSangue(cx, cy, T, h); break;
    case 'osso': dOsso(cx, cy, T, h); break;
    case 'rachadura': dRachadura(cx, cy, T, h); break;
    case 'corrente_parede': dCorrenteParede(cx, cy, T); break;
    case 'estandarte': dEstandarte(cx, cy, T, d.cor || '#a01818'); break;
    case 'teia': dTeia(cx, cy, T, d.flip); break;
    case 'bau': dBau(cx, cy, T); break;
  }
}
function dPalha(cx, cy, T, h){
  cmx.fillStyle = 'rgba(160,130,60,.55)';
  cmx.beginPath(); cmx.ellipse(cx, cy, T*.5, T*.32, 0, 0, TAU); cmx.fill();
  cmx.strokeStyle = 'rgba(215,180,90,.7)'; cmx.lineWidth = 1.4;
  for(let i=0;i<14;i++){
    const a = h*TAU + i*.9, r1 = T*(.05+h*.1), r2 = T*(.32+h*.08);
    cmx.beginPath();
    cmx.moveTo(cx + Math.cos(a)*r1, cy + Math.sin(a)*r1*.6);
    cmx.lineTo(cx + Math.cos(a)*r2, cy + Math.sin(a)*r2*.6);
    cmx.stroke();
  }
}
function dCaveira(cx, cy, T, h){
  const s = T*.28;
  cmx.fillStyle = '#000'; cmx.beginPath(); cmx.ellipse(cx+1, cy+s*.6+2, s*.9, s*.35, 0, 0, TAU); cmx.fill();
  cmx.fillStyle = '#dcd3bf';
  cmx.beginPath(); cmx.arc(cx, cy, s, 0, TAU); cmx.fill();
  cmx.beginPath(); cmx.ellipse(cx, cy+s*.55, s*.7, s*.35, 0, 0, TAU); cmx.fill();
  cmx.fillStyle = '#1a120e';
  cmx.beginPath(); cmx.ellipse(cx-s*.35, cy-s*.05, s*.22, s*.28, 0, 0, TAU); cmx.fill();
  cmx.beginPath(); cmx.ellipse(cx+s*.35, cy-s*.05, s*.22, s*.28, 0, 0, TAU); cmx.fill();
  cmx.fillRect(cx-s*.08, cy+s*.35, s*.16, s*.28);
  cmx.strokeStyle = '#5a4a38'; cmx.lineWidth = 1;
  for(let i=0;i<4;i++) cmx.strokeRect(cx-s*.5+i*s*.25, cy+s*.55, s*.22, s*.15);
}
function dTigela(cx, cy, T){
  cmx.fillStyle = '#000'; cmx.beginPath(); cmx.ellipse(cx+1, cy+T*.14, T*.2, T*.06, 0, 0, TAU); cmx.fill();
  cmx.fillStyle = '#3c3126';
  cmx.beginPath(); cmx.ellipse(cx, cy+T*.05, T*.19, T*.09, 0, 0, TAU); cmx.fill();
  cmx.fillStyle = '#5a4838';
  cmx.beginPath(); cmx.ellipse(cx, cy, T*.19, T*.08, 0, 0, TAU); cmx.fill();
  cmx.fillStyle = '#1a2b3a';
  cmx.beginPath(); cmx.ellipse(cx, cy-T*.005, T*.14, T*.05, 0, 0, TAU); cmx.fill();
  cmx.fillStyle = 'rgba(255,255,255,.28)';
  cmx.beginPath(); cmx.ellipse(cx-T*.05, cy-T*.02, T*.06, T*.02, 0, 0, TAU); cmx.fill();
}
function dBarril(cx, cy, T){
  const w = T*.62, hAlt = T*.72;
  cmx.fillStyle = '#000'; cmx.beginPath(); cmx.ellipse(cx+2, cy+hAlt*.42+2, w*.5, w*.16, 0, 0, TAU); cmx.fill();
  cmx.fillStyle = '#6b4a26'; cmx.fillRect(cx-w/2, cy-hAlt*.42, w, hAlt);
  cmx.fillStyle = '#8a5f30';
  for(let i=0;i<4;i++) cmx.fillRect(cx-w/2 + 1, cy-hAlt*.42 + hAlt*(.1+i*.24), w-2, hAlt*.06);
  cmx.fillStyle = '#3a2a18';
  cmx.fillRect(cx-w/2, cy-hAlt*.42, w, 2);
  cmx.fillRect(cx-w/2, cy+hAlt*.42-2, w, 2);
  cmx.fillStyle = '#5b3d20'; cmx.fillRect(cx-w/2, cy-hAlt*.42, 2, hAlt);
  cmx.fillStyle = '#a97a3a'; cmx.fillRect(cx+w/2-2, cy-hAlt*.42, 2, hAlt);
  cmx.strokeStyle = '#2b1e10'; cmx.lineWidth = 1.4;
  for(let i=0;i<3;i++){
    const yy = cy-hAlt*.42 + hAlt*(.2+i*.3);
    cmx.beginPath(); cmx.moveTo(cx-w/2, yy); cmx.lineTo(cx+w/2, yy); cmx.stroke();
  }
  cmx.fillStyle = '#4a341c';
  cmx.beginPath(); cmx.ellipse(cx, cy-hAlt*.42, w*.5, w*.15, 0, 0, TAU); cmx.fill();
  cmx.fillStyle = '#2a1c10';
  cmx.beginPath(); cmx.ellipse(cx, cy-hAlt*.44, w*.42, w*.12, 0, 0, TAU); cmx.fill();
}
function dCaixote(cx, cy, T, h){
  const w = T*.6, hAlt = T*.5;
  cmx.fillStyle = '#000'; cmx.fillRect(cx-w/2+2, cy+hAlt/2+1, w, 4);
  cmx.fillStyle = '#7a5230'; cmx.fillRect(cx-w/2, cy-hAlt/2, w, hAlt);
  cmx.fillStyle = '#5a3820';
  cmx.fillRect(cx-w/2, cy-hAlt/2, w, 3);
  cmx.fillRect(cx-w/2, cy+hAlt/2-3, w, 3);
  cmx.fillRect(cx-w/2, cy-hAlt/2, 3, hAlt);
  cmx.fillRect(cx+w/2-3, cy-hAlt/2, 3, hAlt);
  cmx.strokeStyle = '#3a2410'; cmx.lineWidth = 1;
  cmx.beginPath(); cmx.moveTo(cx-w/2+3, cy-hAlt/2+3); cmx.lineTo(cx+w/2-3, cy+hAlt/2-3); cmx.stroke();
  cmx.beginPath(); cmx.moveTo(cx+w/2-3, cy-hAlt/2+3); cmx.lineTo(cx-w/2+3, cy+hAlt/2-3); cmx.stroke();
  cmx.fillStyle = '#c9a55a';
  const ny = 3;
  for(let i=0;i<ny;i++) for(let j=0;j<ny;j++){
    const px = cx-w/2 + 4 + j*(w-8)/(ny-1) - 1, py = cy-hAlt/2 + 4 + i*(hAlt-8)/(ny-1) - 1;
    cmx.fillRect(px, py, 2, 2);
  }
}
function dPoca(cx, cy, T, h){
  const rx = T*(.42+h*.15), ry = T*(.18+h*.06);
  cmx.fillStyle = 'rgba(0,0,0,.5)'; cmx.beginPath(); cmx.ellipse(cx, cy, rx, ry, 0, 0, TAU); cmx.fill();
  cmx.fillStyle = 'rgba(30,55,80,.75)'; cmx.beginPath(); cmx.ellipse(cx, cy, rx*.94, ry*.9, 0, 0, TAU); cmx.fill();
  cmx.fillStyle = 'rgba(120,170,220,.35)'; cmx.beginPath(); cmx.ellipse(cx-rx*.3, cy-ry*.3, rx*.25, ry*.15, 0, 0, TAU); cmx.fill();
  cmx.strokeStyle = 'rgba(180,220,255,.28)'; cmx.lineWidth = 1;
  cmx.beginPath(); cmx.ellipse(cx, cy, rx*.75, ry*.7, 0, 0, TAU); cmx.stroke();
}
function dSangue(cx, cy, T, h){
  const base = 'rgba(85,10,10,';
  cmx.fillStyle = base + '.68)';
  cmx.beginPath(); cmx.ellipse(cx, cy, T*(.35+h*.1), T*(.22+h*.06), h*TAU, 0, TAU); cmx.fill();
  cmx.fillStyle = base + '.55)';
  for(let i=0;i<6;i++){
    const a = h*TAU + i*1.05, r = T*(.35+h*.12);
    cmx.beginPath(); cmx.arc(cx+Math.cos(a)*r, cy+Math.sin(a)*r*.7, T*(.06+h*.05), 0, TAU); cmx.fill();
  }
  cmx.fillStyle = base + '.85)';
  cmx.beginPath(); cmx.ellipse(cx, cy, T*.18, T*.11, 0, 0, TAU); cmx.fill();
}
function dOsso(cx, cy, T, h){
  const ang = h*TAU, L = T*.4;
  cmx.save();
  cmx.translate(cx, cy); cmx.rotate(ang);
  cmx.strokeStyle = 'rgba(0,0,0,.4)'; cmx.lineWidth = T*.14; cmx.lineCap = 'round';
  cmx.beginPath(); cmx.moveTo(-L/2+2, 2); cmx.lineTo(L/2+2, 2); cmx.stroke();
  cmx.strokeStyle = '#e5dcc4'; cmx.lineWidth = T*.11;
  cmx.beginPath(); cmx.moveTo(-L/2, 0); cmx.lineTo(L/2, 0); cmx.stroke();
  cmx.fillStyle = '#e5dcc4';
  cmx.beginPath(); cmx.arc(-L/2, -T*.05, T*.08, 0, TAU); cmx.arc(-L/2, T*.05, T*.08, 0, TAU); cmx.fill();
  cmx.beginPath(); cmx.arc(L/2, -T*.05, T*.08, 0, TAU); cmx.arc(L/2, T*.05, T*.08, 0, TAU); cmx.fill();
  cmx.restore();
}
function dRachadura(cx, cy, T, h){
  cmx.strokeStyle = 'rgba(0,0,0,.55)'; cmx.lineWidth = 1.4;
  cmx.beginPath();
  cmx.moveTo(cx-T*.35, cy-T*.2);
  cmx.lineTo(cx-T*.15, cy);
  cmx.lineTo(cx+T*.1, cy-T*.08);
  cmx.lineTo(cx+T*.35, cy+T*.22);
  cmx.stroke();
  cmx.beginPath();
  cmx.moveTo(cx-T*.15, cy);
  cmx.lineTo(cx-T*.02, cy+T*.24);
  cmx.stroke();
  cmx.beginPath();
  cmx.moveTo(cx+T*.1, cy-T*.08);
  cmx.lineTo(cx+T*.24, cy-T*.3);
  cmx.stroke();
}
function dCorrenteParede(cx, cy, T){
  cmx.fillStyle = '#000'; cmx.beginPath(); cmx.arc(cx+1, cy-T*.35+1, T*.06, 0, TAU); cmx.fill();
  cmx.fillStyle = '#524a5a'; cmx.beginPath(); cmx.arc(cx, cy-T*.36, T*.055, 0, TAU); cmx.fill();
  cmx.strokeStyle = '#000'; cmx.lineWidth = T*.05;
  cmx.beginPath(); cmx.moveTo(cx+1, cy-T*.3+1); cmx.lineTo(cx+1, cy+T*.35+1); cmx.stroke();
  const N = 6;
  for(let i=0;i<N;i++){
    const yy = cy-T*.3 + i*(T*.65/N);
    cmx.strokeStyle = i%2 ? '#8a8294' : '#5c5566';
    cmx.lineWidth = T*.04;
    cmx.beginPath(); cmx.ellipse(cx, yy, T*.06, T*.045, i%2 ? Math.PI/2 : 0, 0, TAU); cmx.stroke();
  }
  cmx.fillStyle = '#3a3040'; cmx.fillRect(cx-T*.05, cy+T*.32, T*.1, T*.08);
}
function dEstandarte(cx, cy, T, cor){
  cmx.fillStyle = '#000'; cmx.fillRect(cx-T*.14+1, cy-T*.4+1, T*.28, T*.7);
  cmx.fillStyle = cor; cmx.fillRect(cx-T*.14, cy-T*.4, T*.28, T*.7);
  cmx.fillStyle = 'rgba(0,0,0,.35)'; cmx.fillRect(cx-T*.14, cy-T*.4, T*.06, T*.7);
  cmx.fillStyle = 'rgba(255,255,255,.15)'; cmx.fillRect(cx+T*.08, cy-T*.4, T*.02, T*.7);
  cmx.fillStyle = cor;
  cmx.beginPath();
  cmx.moveTo(cx-T*.14, cy+T*.3); cmx.lineTo(cx, cy+T*.42); cmx.lineTo(cx+T*.14, cy+T*.3); cmx.closePath(); cmx.fill();
  cmx.fillStyle = '#d9b74a';
  cmx.beginPath(); cmx.arc(cx, cy-T*.1, T*.06, 0, TAU); cmx.fill();
  cmx.fillStyle = '#8a6f2a';
  cmx.fillRect(cx-T*.005, cy-T*.05, T*.01, T*.14);
  cmx.fillStyle = '#3a3040';
  cmx.fillRect(cx-T*.18, cy-T*.44, T*.36, T*.05);
}
function dTeia(cx, cy, T, flip){
  cmx.save();
  cmx.translate(cx, cy);
  if(flip) cmx.scale(-1, 1);
  cmx.strokeStyle = 'rgba(230,230,240,.45)'; cmx.lineWidth = 1;
  for(let i=0;i<6;i++){
    const a = -Math.PI/2 + i*(Math.PI/10);
    cmx.beginPath(); cmx.moveTo(0,0); cmx.lineTo(Math.cos(a)*T*.45, Math.sin(a)*T*.45); cmx.stroke();
  }
  for(let r=1;r<=3;r++){
    cmx.beginPath();
    for(let i=0;i<=6;i++){
      const a = -Math.PI/2 + i*(Math.PI/10), rr = T*.12*r;
      const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
      i ? cmx.lineTo(px,py) : cmx.moveTo(px,py);
    }
    cmx.stroke();
  }
  cmx.restore();
}
function dBau(cx, cy, T){
  const w = T*.7, hAlt = T*.5;
  cmx.fillStyle = '#000'; cmx.fillRect(cx-w/2+2, cy+hAlt/2+1, w, 4);
  cmx.fillStyle = '#6d4820'; cmx.fillRect(cx-w/2, cy-hAlt/2+hAlt*.35, w, hAlt*.65);
  cmx.fillStyle = '#8a5f30';
  cmx.beginPath();
  cmx.moveTo(cx-w/2, cy-hAlt/2+hAlt*.35);
  cmx.lineTo(cx-w/2, cy-hAlt/2+hAlt*.05);
  cmx.quadraticCurveTo(cx, cy-hAlt/2-hAlt*.18, cx+w/2, cy-hAlt/2+hAlt*.05);
  cmx.lineTo(cx+w/2, cy-hAlt/2+hAlt*.35);
  cmx.closePath(); cmx.fill();
  cmx.strokeStyle = '#3a2410'; cmx.lineWidth = 1.5;
  cmx.beginPath(); cmx.moveTo(cx-w/2, cy-hAlt/2+hAlt*.36); cmx.lineTo(cx+w/2, cy-hAlt/2+hAlt*.36); cmx.stroke();
  cmx.fillStyle = '#c9a558';
  cmx.fillRect(cx-w/2, cy-hAlt/2+hAlt*.05, w*.05, hAlt*.35);
  cmx.fillRect(cx+w/2-w*.05, cy-hAlt/2+hAlt*.05, w*.05, hAlt*.35);
  cmx.fillRect(cx-w/2, cy-hAlt/2+hAlt*.6, w*.05, hAlt*.4);
  cmx.fillRect(cx+w/2-w*.05, cy-hAlt/2+hAlt*.6, w*.05, hAlt*.4);
  cmx.fillStyle = '#d9b74a'; cmx.fillRect(cx-T*.05, cy+hAlt*.08, T*.1, T*.09);
  cmx.fillStyle = '#000'; cmx.fillRect(cx-T*.02, cy+hAlt*.11, T*.04, T*.05);
  cmx.fillStyle = 'rgba(0,0,0,.35)'; cmx.fillRect(cx-w/2, cy-hAlt/2+hAlt*.55, w, hAlt*.06);
}

/* ---------- colisão ---------- */
function solido(x,y){
  const cx = Math.floor(x), cy = Math.floor(y);
  if(!dentro(cx,cy)) return true;
  const t = mapa[idx(cx,cy)];
  return t === PAREDE || t === GRADE || t === FOSSO;
}
function livre(x, y, r){
  return !solido(x-r, y-r) && !solido(x+r, y-r) && !solido(x-r, y+r) && !solido(x+r, y+r);
}
function mover(e, dx, dy){
  const r = e.raio*.9;
  if(!livre(e.x, e.y, r)){
    for(const [ox,oy] of [[.12,0],[-.12,0],[0,.12],[0,-.12],[.3,0],[-.3,0],[0,.3],[0,-.3],[.6,0],[-.6,0],[0,.6],[0,-.6]]){
      if(livre(e.x+ox, e.y+oy, r)){ e.x += ox; e.y += oy; break; }
    }
  }
  const n = Math.max(1, Math.ceil((Math.abs(dx) + Math.abs(dy))/.2));
  const sx = dx/n, sy = dy/n;
  for(let i=0;i<n;i++){
    if(sx){
      if(livre(e.x+sx, e.y, r)) e.x += sx;
      else if(e === jog && livre(e.x+sx, e.y + .3, r)) e.y += Math.abs(sx)*.8;
      else if(e === jog && livre(e.x+sx, e.y - .3, r)) e.y -= Math.abs(sx)*.8;
      else { e.vx = 0; if(e.investindo) e.bateuParede = true; }
    }
    if(sy){
      if(livre(e.x, e.y+sy, r)) e.y += sy;
      else if(e === jog && livre(e.x + .3, e.y+sy, r)) e.x += Math.abs(sy)*.8;
      else if(e === jog && livre(e.x - .3, e.y+sy, r)) e.x -= Math.abs(sy)*.8;
      else { e.vy = 0; if(e.investindo) e.bateuParede = true; }
    }
  }
}

/* ---------- efeitos ---------- */
function faisca(x,y,cor,v){
  const a = Math.random()*TAU, s = (v||.08)*(.4+Math.random());
  particulas.push({x, y, vx:Math.cos(a)*s*60, vy:Math.sin(a)*s*60, vida:1, cor, tam:.05+Math.random()*.06});
}
/* sangue jorrando em cone na direção do golpe */
const CORES_SANGUE = ['#8f1621','#b32030','#6d101a','#a11c28'];
function jorrarSangue(x, y, ang, qtd){
  for(let k=0;k<qtd;k++){
    const a = ang + (Math.random()-.5)*1.15;
    const v = 2.2 + Math.random()*4.8;
    particulas.push({x, y:y-.15, vx:Math.cos(a)*v, vy:Math.sin(a)*v - Math.random()*1.4,
      vida:.55 + Math.random()*.55, cor:CORES_SANGUE[irand(CORES_SANGUE.length)],
      tam:.055 + Math.random()*.075});
  }
}
/* mancha permanente: carimba respingo direto no cache do cenário */
function mancharSangue(x, y){
  const T = 48;
  dSangue((x + (Math.random()-.5)*.7)*T, (y + (Math.random()-.5)*.7)*T,
          T*(.3 + Math.random()*.4), Math.random());
}
function flutuar(x,y,txt,cor){ riscos.push({x, y, txt:String(txt), cor, vida:1}); }
function avisar(t, sub){

/* um elo de corrente: metal em quatro camadas + reflexo dos braseiros */
function elo(cx, cy, ang, comp, larg, esp, brilho){
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
  ctx.lineCap = 'round';
  ctx.lineWidth = esp*2.1; ctx.strokeStyle = '#0f0c16';
  ctx.beginPath(); ctx.ellipse(0, 0, comp, larg, 0, 0, TAU); ctx.stroke();
  ctx.lineWidth = esp*1.35; ctx.strokeStyle = '#585267';
  ctx.beginPath(); ctx.ellipse(0, 0, comp, larg, 0, 0, TAU); ctx.stroke();
  ctx.lineWidth = esp*.8; ctx.strokeStyle = '#8d8799';
  ctx.beginPath(); ctx.ellipse(0, -esp*.18, comp*.99, larg*.99, 0, 0, TAU); ctx.stroke();
  ctx.lineWidth = esp*.42; ctx.strokeStyle = 'rgba(240,237,248,' + brilho + ')';
  ctx.beginPath(); ctx.ellipse(0, -esp*.26, comp*.94, larg*.94, 0, Math.PI*1.08, Math.PI*1.92); ctx.stroke();
  ctx.lineWidth = esp*.38; ctx.strokeStyle = 'rgba(232,161,60,.55)';
  ctx.beginPath(); ctx.ellipse(0, esp*.2, comp*.92, larg*.92, 0, Math.PI*.12, Math.PI*.72); ctx.stroke();
  ctx.restore();
}
function estilhacarElos(x, y, qtd){
  for(let k=0;k<qtd;k++){
    const a = Math.random()*TAU, v = 2.5 + Math.random()*4;
    destrocos.push({x:x + Math.cos(a)*.3, y:y + Math.sin(a)*.3,
      vx:Math.cos(a)*v, vy:Math.sin(a)*v, ang:Math.random()*TAU,
      vang:(Math.random()-.5)*14, vida:1.4, comp:.13 + Math.random()*.05});
  }
}
function atualizarParticulas(dt){
  particulas.forEach(p => { p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .93; p.vy *= .93; p.vida -= dt*1.7; });
  particulas = particulas.filter(p => p.vida > 0);
  destrocos.forEach(d => {
    d.x += d.vx*dt; d.y += d.vy*dt;
    d.vx *= .90; d.vy *= .90; d.ang += d.vang*dt; d.vang *= .95;
    d.vida -= dt*.55;
  });
  destrocos = destrocos.filter(d => d.vida > 0);
  riscos.forEach(r => { r.vida -= dt*1.15; r.y -= dt*.9; });
  riscos = riscos.filter(r => r.vida > 0);
  if(tremor > 0){ tremor -= dt*40; if(tremor < 0) tremor = 0; }
}

function abrirDialogo(p){

  el('dialogo').classList.add('on');

}
/* mesma legenda dos prisioneiros, mas para uma fala avulsa (a abertura do chefe):
   nada de intel/segredos no fim — só o callback, que é quem solta a luta */
function abrirFala(p, aoFim){
  dialogo = {inf:p, i:0, aoFim};
  pausado = true;
  fundirBgm(BGM_VOL_FALA);
  el('dialogo').classList.add('on');
  mostrarFala();
}
function mostrarFala(){
  const p = dialogo.inf;
  el('dNome').textContent = p.nome;
  el('dFala').textContent = p.falas[dialogo.i];
  el('dSeguir').textContent = dialogo.i < p.falas.length-1 ? 'tocar para continuar' : 'tocar para encerrar';
  const box = el('dRetratoBox'), img = el('dRetrato');
  if(p.retrato){ img.src = p.retrato; img.alt = p.nome; box.classList.add('on'); }
  else box.classList.remove('on');
  sFala();
  falarVoz(p.falas[dialogo.i], p.voz, p.voz.audios && p.voz.audios[dialogo.i]);
}
/* pular a conversa inteira: vale o mesmo que ouvir até o fim (segredo, contador, callback) —
   para quem já falou com o personagem algum dia e só quer seguir */
function pularDialogo(){
  if(!dialogo) return;
  dialogo.i = dialogo.inf.falas.length - 1;
  avancarDialogo();
}
function avancarDialogo(){
  if(!dialogo) return;
  dialogo.i++;
  if(dialogo.i < dialogo.inf.falas.length){ mostrarFala(); return; }
  const p = dialogo.inf, aoFim = dialogo.aoFim;
  if(aoFim){
    dialogo = null; pausado = false;
    fundirBgm(bgmVolAtual);
    calarVoz();
    el('dialogo').classList.remove('on');
    aoFim();
    return;
  }
  if(!p.feito){
    p.feito = true;
    intel[p.chave] = true;
    const n = informantes.filter(i => i.feito).length;
    const tid = piso.missao.tarefaInformantes;
    const cont = el(tid + '-cont');
    if(cont) cont.textContent = n + '/' + informantes.length;
    if(n === informantes.length) marcarTarefa(tid); else sTarefa();
    avisar('Você entendeu', p.ganho);
    atualizarHUD();
  }
  dialogo = null; pausado = false;
  fundirBgm(bgmVolAtual);
  calarVoz();
  el('dialogo').classList.remove('on');
}

/* ---------- chefe genérico (máquina de estados dirigida por cfg) ---------- */
/* vozes gravadas do chefe — cada clipe só recomeça depois de terminar */
const vozesChefe = {};
function vozChefe(nome){
  let a = vozesChefe[nome];
  if(!a){
    a = new Audio('audio/' + nome + '.mp3');
    a.volume = 1;
    vozesChefe[nome] = a;
  }
  if(!a.paused && !a.ended) return false;   // clipe ocupado: quem chamou pode usar a síntese
  try{ a.currentTime = 0; a.play().catch(() => {}); }catch(e){}
  return true;
}
function criarChefe(){
  const f = piso.chefe.cfg;
  chefe = {
    cfg:f, x:f.x, y:f.y, vx:0, vy:0, raio:f.raio, hp:f.hp, hpMax:f.hp,
    estado:'espera', t:f.esperaT, golpes:0, angulo:Math.PI, flash:0,
    investindo:false, bateuParede:false, pisada:0, escudoBate:0, bateu:0, golpeAnim:0, fase:0
  };
  el('chefeNome').textContent = f.nome;
  el('chefeBarra').classList.add('on');
  const entrar = () => { if(f.entrada) avisar(f.entrada[0], f.entrada[1]); };
  if(f.abertura){
    // ele fala primeiro, com legenda; a luta só corre quando o jogador fecha
    abrirFala({nome:f.nome, retrato:f.retrato, falas:f.abertura.falas, voz:f.abertura.voz}, entrar);
  } else {
    setTimeout(entrar, 900);
    if(f.sons && f.sons.entrada) vozChefe(f.sons.entrada);
  }
}
function dirLivre(c, ax, ay){
  const base = Math.atan2(ay, ax);
  for(const off of [0, .45, -.45, .95, -.95, 1.5, -1.5]){
    const a = base + off;
    const nx = c.x + Math.cos(a)*(c.raio + .5), ny = c.y + Math.sin(a)*(c.raio + .5);
    if(!solido(nx, ny)) return [Math.cos(a), Math.sin(a)];
  }
  return [ax, ay];
}
function bateEscudo(c){       // a telegrafia da investida: corrente no chão, faca na mesa...
  c.bateu++; c.escudoBate = .22;
  if(c.cfg.somBatida) tocarSfx(c.cfg.somBatida, 1, sEscudoBate);
  else sEscudoBate();
  sFerro();
  tremor = 8;
  const mira = c.mira != null ? c.mira : c.angulo;
  const bx = c.x + Math.cos(mira)*1.5, by = c.y + Math.sin(mira)*1.5 + .5;
  for(let k=0;k<10;k++) faisca(bx, by, '#cbb98e', .14);
}
function golpeChefe(dano, alcance){
  const dx = jog.x-chefe.x, dy = jog.y-chefe.y, d = Math.hypot(dx,dy);
  const ang = Math.atan2(dy,dx);
  const dif = Math.abs(((ang - chefe.angulo + Math.PI*3) % TAU) - Math.PI);
  chefe.golpeAnim = .22;
  const sons = chefe.cfg.sons;
  if(sons && sons.golpe) vozChefe(sons.golpe);
  sEspadaCorta();
  for(let k=0;k<6;k++) faisca(chefe.x + Math.cos(chefe.angulo)*1.4, chefe.y + Math.sin(chefe.angulo)*1.4, '#e0d0b0', .12);
  if(d < alcance && dif < 1.25){
    if(jog.golpe > 0) sClash();    // o jogador também estava golpeando: aço contra aço
    else sCorte();                 // o gemido vem do machucar (sDorJog)
    machucar(dano, ang); jog.vx += Math.cos(ang)*10; jog.vy += Math.sin(ang)*10;
  }
}
function atualizarChefe(dt){
  const c = chefe, f = c.cfg;
  c.flash = Math.max(0, c.flash - dt*3);
  c.escudoBate = Math.max(0, c.escudoBate - dt);
  c.golpeAnim = Math.max(0, c.golpeAnim - dt);
  c.fase += dt;
  c.t -= dt;
  const dx = jog.x-c.x, dy = jog.y-c.y, d = Math.max(.01, Math.hypot(dx,dy));

  // só reposiciona a mira quando não está comprometido com um golpe
  if(c.estado === 'espera' || c.estado === 'aproxima' || c.estado === 'preparo') c.angulo = Math.atan2(dy,dx);

  switch(c.estado){
    case 'espera':
      if(c.t <= 0){ c.estado = 'aproxima'; c.t = f.aproximaT; }
      break;

    case 'aproxima': {
      const [ax, ay] = dirLivre(c, dx/d, dy/d);
      c.vx += ax*f.velAproxima*9*dt; c.vy += ay*f.velAproxima*9*dt;
      c.vx -= c.vx*7*dt; c.vy -= c.vy*7*dt;
      mover(c, c.vx*dt, c.vy*dt);
      c.pisada += dt;
      if(c.pisada > (c.proxPasso||0)){ sPassoChefe(); tremor = Math.max(tremor, f.tremorPasso || 2); c.proxPasso = c.pisada + .38; }
      if(d < f.comboDist){ c.estado = 'combo'; c.golpes = 0; c.t = f.comboIntervalo + .03; }
      else if(c.t <= 0 && d > f.investidaDist){ c.estado = 'preparo'; c.t = f.preparoT; c.bateu = 0; c.mira = Math.atan2(dy,dx); }
      break;
    }

    case 'combo':
      c.vx *= .86; c.vy *= .86;
      mover(c, c.vx*dt, c.vy*dt);
      if(c.t <= 0){
        c.golpes++;
        const i = Math.min(c.golpes, f.comboGolpes) - 1;
        golpeChefe(f.comboDano[i], f.comboAlcance[i]);
        if(c.golpes >= f.comboGolpes){ c.estado = 'exausto'; c.t = f.exaustoT; }
        else c.t = f.comboIntervalo;
      }
      break;

    case 'exausto':
      c.vx *= .8; c.vy *= .8;
      if(c.t <= 0){ c.estado = 'aproxima'; c.t = f.aproximaT; }
      break;

    case 'preparo':
      c.vx *= .8; c.vy *= .8;
      if(c.bateu < f.batidasEm.length) c.mira = Math.atan2(dy,dx);   // depois da última batida, direção selada
      if(c.bateu < f.batidasEm.length && c.t <= f.batidasEm[c.bateu]) bateEscudo(c);
      if(c.t <= 0){
        c.estado = 'investida'; c.t = f.investidaT; c.investindo = true; c.bateuParede = false;
        c.vx = Math.cos(c.mira)*f.investidaVel; c.vy = Math.sin(c.mira)*f.investidaVel;
        sInvestida();
      }
      break;

    case 'investida': {
      mover(c, c.vx*dt, c.vy*dt);
      c.pisada += dt*2.5;
      if(c.pisada > (c.proxPasso||0)){ sPassoChefe(); tremor = Math.max(tremor, f.tremorPasso || 2); c.proxPasso = c.pisada + .34; }
      if(Math.random() < .6) faisca(c.x, c.y, '#c9a77a', .07);
      if(d < c.raio + jog.raio + .3){ machucar(f.investidaDano); jog.vx += (dx/d)*14; jog.vy += (dy/d)*14; }
      if(c.bateuParede){
        c.estado = 'zonzo'; c.t = f.zonzoT; c.investindo = false; c.vx = c.vy = 0;
        tremor = 16; sBaterParede();
        for(let k=0;k<18;k++) faisca(c.x, c.y, '#d8cdb8', .16);
      } else if(c.t <= 0){ c.estado = 'aproxima'; c.t = f.aproximaT; c.investindo = false; }
      break;
    }

    case 'zonzo':
      if(c.t <= 0){ c.estado = 'aproxima'; c.t = f.aproximaT; }
      break;
  }
  atualizarBarraChefe();
}
function atualizarBarraChefe(){
  el('chefeFill').style.transform = 'scaleX(' + Math.max(0, chefe.hp/chefe.hpMax) + ')';
  const fq = piso.chefe.fraquezas;
  let txt = '';
  if(chefe.estado === 'exausto' && intel[fq.porEstado.exausto.chave]) txt = 'sem fôlego';
  else if(chefe.estado === 'zonzo') txt = 'zonzo';
  else if(chefe.estado === 'combo' && intel[fq.porEstado.exausto.chave])
    txt = 'golpe ' + Math.min(chefe.cfg.comboGolpes, chefe.golpes+1) + ' de ' + chefe.cfg.comboGolpes;
  el('chefeEstado').textContent = txt;
}

/* ---------- combate do jogador ---------- */
function golpear(alvo){
  jog.golpe = .2; jog.recarga = .36;
  sGolpe();
  const dx = alvo.x-jog.x, dy = alvo.y-jog.y, d = Math.hypot(dx,dy);
  jog.angulo = Math.atan2(dy,dx);
  let dano = jog.dano + irand(5);

  const fq = piso.chefe.fraquezas;
  const porTras = Math.abs(((jog.angulo - alvo.angulo + Math.PI*3) % TAU) - Math.PI) < 1.1;
  if(porTras) dano *= intel[fq.costas.chave] ? fq.costas.com : fq.costas.sem;
  const fe = fq.porEstado[alvo.estado];
  if(fe) dano *= intel[fe.chave] ? fe.com : fe.sem;
  dano = Math.round(dano);

  alvo.hp -= dano; alvo.flash = 1;
  if(alvo.golpeAnim > 0){          // os dois golpearam ao mesmo tempo: aço contra aço
    sClash();
  } else {
    sCorte();
    jorrarSangue(alvo.x, alvo.y, jog.angulo, 14);            // o corte abre carne
    if(Math.random() < .6) mancharSangue(alvo.x, alvo.y + .5);
    const sons = alvo.cfg && alvo.cfg.sons;
    setTimeout(() => { if(!(sons && sons.levaGolpe && vozChefe(sons.levaGolpe))) sDorChefe(); }, 60);
  }
  flutuar(alvo.x, alvo.y-.5, dano, dano > jog.dano*1.8 ? '#ffd88a' : '#f4e2b4');
  faisca(alvo.x - dx/d*alvo.raio, alvo.y - dy/d*alvo.raio, '#f0c070', .12);
  tremor = 4;
  if(alvo.hp <= 0) venceu();
}
function machucar(dano, ang){
  if(jog.invul > 0 || !vivo) return;
  jog.hp -= dano; jog.invul = .45; jog.flash = 1; tremor = 11;
  sDorJog();
  jorrarSangue(jog.x, jog.y, ang != null ? ang : -Math.PI/2 + (Math.random()-.5)*.8, 10);
  if(Math.random() < .5) mancharSangue(jog.x, jog.y + .3);
  flutuar(jog.x, jog.y-.4, dano, '#ff8a96');
  atualizarHUD();
  if(jog.hp <= 0) morrer();
}
function venceu(){
  chefe.hp = 0; etapa = 'fim'; vivo = true;
  marcarTarefa(piso.missao.tarefaChefe);
  for(let k=0;k<40;k++) faisca(chefe.x, chefe.y, '#e8a13c', .2);
  sVitoria();
  el('chefeBarra').classList.remove('on');
  const premioNovo = piso.recompensa && adicionarAoInventario(piso.recompensa);
  if(piso.aoVencer) piso.aoVencer();
  pararBgm();
  setTimeout(() => mostrarVeu(piso.textos.vitoria()), 1500);
  if(premioNovo) setTimeout(() => abrirPopupInventario(piso.recompensa, 'Guardar'), 1600);
}
function morrer(){
  jog.hp = 0; vivo = false;
  for(let k=0;k<30;k++) faisca(jog.x, jog.y, '#c0455a', .16);
  sMorrer();
  pararBgm();
  setTimeout(() => mostrarVeu(piso.textos.derrota()), 1100);
}
function usarTrapo(){
  if(!vivo || pausado || jog.pocoes <= 0 || jog.hp >= jog.hpMax) return;
  jog.pocoes--;
  jog.hp = Math.min(jog.hpMax, jog.hp + 40);
  flutuar(jog.x, jog.y, '+40', '#8fc48a');
  for(let k=0;k<12;k++) faisca(jog.x, jog.y, '#8fc48a', .09);
  sTrapo();
  atualizarHUD();
}
function rolar(){
  if(!vivo || pausado || jog.dashOff || jog.dashCd > 0) return;
  const m = Math.hypot(entrada.x, entrada.y);
  const ax = m > .2 ? entrada.x/m : Math.cos(jog.angulo);
  const ay = m > .2 ? entrada.y/m : Math.sin(jog.angulo);
  jog.vx = ax*20; jog.vy = ay*20;
  jog.dash = .18; jog.dashCd = 1.0; jog.invul = Math.max(jog.invul, .30);
  sRolar();
}
function agir(){
  if(!interacao || pausado || !vivo) return;
  if(interacao.tipo === 'falar') abrirDialogo(interacao.alvo);
  else if(piso.agir) piso.agir(interacao);
}

/* ---------- entrada ---------- */
const entrada = {x:0, y:0};
let toqueId = null, jbx = 0, jby = 0, jvx = 0, jvy = 0, joyAtivo = false;
const teclas = {};
tela.addEventListener('touchstart', e => {
  if(dialogo){ avancarDialogo(); return; }
  for(const t of e.changedTouches){
    if(toqueId === null && t.clientX < window.innerWidth*.6){
      toqueId = t.identifier; jbx = jvx = t.clientX; jby = jvy = t.clientY; joyAtivo = true;
    }
  }
}, {passive:true});
tela.addEventListener('touchmove', e => {
  for(const t of e.changedTouches) if(t.identifier === toqueId){ jvx = t.clientX; jvy = t.clientY; }
}, {passive:true});
const soltar = e => {
  for(const t of e.changedTouches) if(t.identifier === toqueId){ toqueId = null; joyAtivo = false; entrada.x = entrada.y = 0; }
};
tela.addEventListener('touchend', soltar, {passive:true});
tela.addEventListener('touchcancel', soltar, {passive:true});
el('dialogo').addEventListener('touchstart', e => { e.preventDefault(); avancarDialogo(); }, {passive:false});
el('dialogo').addEventListener('mousedown', avancarDialogo);
el('dPular').addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); pularDialogo(); }, {passive:false});
el('dPular').addEventListener('mousedown', e => { e.stopPropagation(); pularDialogo(); });
tela.addEventListener('mousedown', () => { if(dialogo) avancarDialogo(); });

window.addEventListener('keydown', e => {
  teclas[e.key.toLowerCase()] = true;
  if(e.key === ' '){ e.preventDefault(); if(dialogo) avancarDialogo(); else rolar(); }
  if(e.key.toLowerCase() === 'e'){ if(dialogo) avancarDialogo(); else agir(); }
  if(e.key.toLowerCase() === 'q') usarTrapo();
  if(e.key.toLowerCase() === 'f' && piso.acaoGolpe) piso.acaoGolpe();
  if(e.key.toLowerCase() === 'i') abrirInventario();
});
window.addEventListener('keyup', e => { teclas[e.key.toLowerCase()] = false; });
function lerEntrada(){
  if(joyAtivo){
    const dx = jvx-jbx, dy = jvy-jby, d = Math.hypot(dx,dy), max = 52;
    if(d > 4){ const f = Math.min(1, d/max); entrada.x = dx/d*f; entrada.y = dy/d*f; }
    else entrada.x = entrada.y = 0;
  } else {
    let x=0, y=0;
    if(teclas['a']||teclas['arrowleft']) x--; if(teclas['d']||teclas['arrowright']) x++;
    if(teclas['w']||teclas['arrowup']) y--; if(teclas['s']||teclas['arrowdown']) y++;
    const m = Math.hypot(x,y);
    entrada.x = m ? x/m : 0; entrada.y = m ? y/m : 0;
  }
}

/* ---------- atualização ---------- */
function atualizar(dt){
  tempo += dt;
  atualizarParticulas(dt);
  if(!jog || etapa === 'menu' || pausado || !vivo) return;

  lerEntrada();
  const acel = jog.dash > 0 ? 0 : (jog.lento ? 46 : 76);
  const atrito = jog.dash > 0 ? 3.4 : 13;
  jog.vx += entrada.x*acel*dt; jog.vy += entrada.y*acel*dt;
  const vmax = jog.dash > 0 ? 24 : (jog.lento ? 3.0 : 6.4);
  const vel = Math.hypot(jog.vx, jog.vy);
  if(vel > vmax){ jog.vx = jog.vx/vel*vmax; jog.vy = jog.vy/vel*vmax; }
  jog.vx -= jog.vx*atrito*dt; jog.vy -= jog.vy*atrito*dt;
  mover(jog, jog.vx*dt, jog.vy*dt);

  if(vel > .6) jog.angulo = Math.atan2(jog.vy, jog.vx);
  jog.passo += vel*dt;
  if(jog.dash > 0){ jog.dash -= dt; if(Math.random() < .6) faisca(jog.x, jog.y, '#8b7ab5', .03); }
  jog.dashCd = Math.max(0, jog.dashCd - dt);
  jog.invul = Math.max(0, jog.invul - dt);
  jog.flash = Math.max(0, jog.flash - dt*3);
  jog.golpe = Math.max(0, jog.golpe - dt);
  jog.recarga = Math.max(0, jog.recarga - dt);

  const chefeAtivo = chefe && chefe.hp > 0;

  // sem ataque automático: quem golpeia é o botão GOLPE / tecla F (golpeDeArma)

  // corpo do chefe empurra, respeitando colisão
  if(chefeAtivo){
    const dx = jog.x-chefe.x, dy = jog.y-chefe.y, d = Math.hypot(dx,dy);
    const min = jog.raio + chefe.raio;
    if(d < min && d > .001){
      mover(jog, dx/d*(min-d), dy/d*(min-d));
      jog.vx *= .6; jog.vy *= .6;
    }
    atualizarChefe(dt);
  }

  if(piso.atualizar) piso.atualizar(dt);
  informantes.forEach(p => p.fase += dt);
  definirInteracao();

  camX += (jog.x - camX)*Math.min(1, dt*7);
  camY += (jog.y - camY)*Math.min(1, dt*7);

  el('cargaDash').style.transform = 'scaleY(' + jog.dashCd + ')';
  el('btnDash').classList.toggle('off', jog.dashCd > 0 || jog.dashOff);
  el('btnPocao').classList.toggle('off', jog.pocoes <= 0);
  el('vidaFill').style.transform = 'scaleX(' + Math.max(0, jog.hp/jog.hpMax) + ')';
}
function definirInteracao(){
  interacao = null;
  if(!piso.falarLiberado || piso.falarLiberado()){
    let melhor = null, md = 2.9;
    informantes.forEach(p => {
      const d = Math.hypot(p.x-jog.x, p.y-jog.y);
      if(d < md){ md = d; melhor = p; }
    });
    if(melhor) interacao = {tipo:'falar', alvo:melhor, rotulo: melhor.feito ? 'OUVIR' : 'FALAR', icone:'❝'};
  }
  if(!interacao && piso.interacao) interacao = piso.interacao();
  const b = el('btnAcao');
  if(interacao){
    b.classList.add('on');
    el('acaoRotulo').textContent = interacao.rotulo;
    el('acaoIcone').textContent = interacao.icone;
  } else b.classList.remove('on');
}

/* ---------- desenho ---------- */
let dpr = 1, tam = 40, W = 1, H = 1;
function redimensionar(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  tela.width = Math.max(1, Math.floor(W*dpr)); tela.height = Math.max(1, Math.floor(H*dpr));
  luzCv.width = Math.max(1, Math.floor(W*dpr/2)); luzCv.height = Math.max(1, Math.floor(H*dpr/2));
  tam = Math.min(W, H)/VISAO;
}
window.addEventListener('resize', redimensionar);

function desenhar(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#0c0912'; ctx.fillRect(0,0,W,H);
  if(!mapa || !jog) return;

  let ox = W/2 - camX*tam, oy = H/2 - camY*tam;
  if(tremor > 0){ ox += (Math.random()-.5)*tremor; oy += (Math.random()-.5)*tremor; }

  ctx.drawImage(cacheMapa, ox, oy, LARG*tam, ALT*tam);

  if(piso.desenharCenario) piso.desenharCenario(ox, oy);
  destrocos.forEach(d => {
    ctx.globalAlpha = Math.min(1, d.vida);
    elo(ox + d.x*tam, oy + d.y*tam, d.ang, d.comp*tam, d.comp*tam*.42, tam*.055, .8);
    ctx.globalAlpha = 1;
  });

  informantes.forEach(p => desenharInformante(p, ox, oy));
  if(chefe && chefe.hp > 0) piso.chefe.desenhar(chefe, ox, oy);
  if(vivo) desenharJogador(ox, oy);

  particulas.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.vida);
    ctx.fillStyle = p.cor;
    const s = p.tam*tam*p.vida;
    ctx.fillRect(ox + p.x*tam - s/2, oy + p.y*tam - s/2, s, s);
  });
  ctx.globalAlpha = 1;

  /* luz: ambiente do piso + poças quentes dos braseiros */
  lcx.setTransform(1,0,0,1,0,0);
  lcx.fillStyle = piso.paleta.luzAmbiente;
  lcx.fillRect(0,0,luzCv.width, luzCv.height);
  lcx.globalCompositeOperation = 'lighter';
  const k = dpr/2;
  braseiros.forEach(b => {
    const tr = .88 + Math.sin(tempo*7 + b.fase)*.07 + Math.sin(tempo*16 + b.fase)*.04;
    luzRadial((ox + b.x*tam)*k, (oy + b.y*tam)*k, tam*3.6*tr*k, 'rgba(226,146,58,.85)');
  });
  informantes.forEach(p => {   // facho dourado sobre quem ainda tem segredo para contar
    if(p.feito || (piso.falarLiberado && !piso.falarLiberado())) return;
    const tr = .75 + Math.sin(tempo*3 + p.fase)*.25;
    luzRadial((ox + p.x*tam)*k, (oy + p.y*tam)*k, tam*3.0*tr*k, 'rgba(240,190,90,.6)');
  });
  luzRadial((ox + jog.x*tam)*k, (oy + jog.y*tam)*k, tam*2.4*k, 'rgba(255,214,160,.45)');
  lcx.globalCompositeOperation = 'source-over';
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(luzCv, 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  ctx.globalCompositeOperation = 'lighter';
  braseiros.forEach(b => {
    const px = ox + b.x*tam, py = oy + b.y*tam;
    const f = .8 + Math.sin(tempo*9 + b.fase)*.2;
    const g = ctx.createRadialGradient(px, py, 0, px, py, Math.max(1, tam*.85*f));
    g.addColorStop(0, 'rgba(255,224,160,.7)');
    g.addColorStop(1, 'rgba(255,150,50,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, tam*.85*f, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,206,120,.9)';
    ctx.beginPath();
    ctx.ellipse(px, py - tam*.18*f, tam*.11*f, tam*.24*f, 0, 0, TAU); ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';

  ctx.textAlign = 'center';
  ctx.font = '600 ' + Math.round(tam*.36) + 'px ui-monospace, Menlo, monospace';
  riscos.forEach(r => {
    ctx.globalAlpha = Math.min(1, r.vida*1.5);
    ctx.fillStyle = '#000'; ctx.fillText(r.txt, ox + r.x*tam+1, oy + r.y*tam - tam*.5+1);
    ctx.fillStyle = r.cor;  ctx.fillText(r.txt, ox + r.x*tam, oy + r.y*tam - tam*.5);
  });
  ctx.globalAlpha = 1;

  const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*.5, W/2, H/2, Math.max(W,H)*.85);
  vg.addColorStop(0, 'rgba(6,4,10,0)'); vg.addColorStop(1, 'rgba(6,4,10,.6)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  if(joyAtivo){
    ctx.strokeStyle = 'rgba(232,161,60,.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(jbx, jby, 52, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(232,161,60,.4)';
    ctx.beginPath(); ctx.arc(jbx + entrada.x*52, jby + entrada.y*52, 20, 0, TAU); ctx.fill();
  }
}
function luzRadial(x,y,r,cor){
  if(!(r > 0)) return;
  const g = lcx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, cor);
  g.addColorStop(.5, cor.replace(/[\d.]+\)$/, '.3)'));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  lcx.fillStyle = g; lcx.beginPath(); lcx.arc(x,y,r,0,TAU); lcx.fill();
}
const imgsRetrato = {};
function imgRetrato(url){
  if(!imgsRetrato[url]){ const im = new Image(); im.src = url; imgsRetrato[url] = im; }
  return imgsRetrato[url];
}
function desenharInformante(p, ox, oy){
  const px = ox + p.x*tam, py = oy + p.y*tam, r = tam*.26;
  const resp = Math.sin(p.fase*1.6)*tam*.03;
  /* loop de GIF: o tempo anda em quadros discretos (8 por segundo), repetindo o ciclo */
  const q = Math.floor(p.fase*8)/8;
  const gira  = Math.sin(q*2.2)*.05;               // balança de um lado ao outro
  const sopro = 1 + Math.sin(q*3.4)*.022;          // respiração (estica/encolhe)
  const quica = Math.abs(Math.sin(q*2.2))*tam*.05; // quique no ritmo do balanço
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath();
  ctx.ellipse(px, py + r*1.2, r*(.9 + quica/tam*.8), r*.3, 0, 0, TAU); ctx.fill();
  const foto = p.retrato && imgRetrato(p.retrato);
  let topo = py - r*2.0;
  if(foto && foto.complete && foto.naturalWidth > 0){
    /* mesma altura em tela do sprite do jogador (largura tam*.9), vezes a escala do personagem */
    const alt = (imgJogador.naturalWidth > 0
      ? imgJogador.naturalHeight*(tam*.9/imgJogador.naturalWidth) : tam*2.2) * (p.escala || 1);
    const lar = foto.naturalWidth*(alt/foto.naturalHeight);
    const base = py + r*1.2 - quica;
    ctx.save();
    ctx.translate(px, base);         // gira e respira apoiado nos pés
    ctx.rotate(gira);
    ctx.scale(2 - sopro, sopro);
    ctx.drawImage(foto, -lar/2, -alt, lar, alt);
    ctx.restore();
    topo = base - alt*sopro - tam*.18;
  }else{
    ctx.fillStyle = p.cor;
    ctx.beginPath();
    ctx.moveTo(px, py - r*.9 + resp);
    ctx.quadraticCurveTo(px + r*1.1, py + r*.4, px + r*.7, py + r*1.0);
    ctx.lineTo(px - r*.7, py + r*1.0);
    ctx.quadraticCurveTo(px - r*1.1, py + r*.4, px, py - r*.9 + resp);
    ctx.fill();
    ctx.beginPath(); ctx.arc(px, py - r*.75 + resp, r*.45, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(20,14,26,.85)';
    ctx.beginPath(); ctx.arc(px - r*.16, py - r*.8 + resp, Math.max(1, r*.09), 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(px + r*.16, py - r*.8 + resp, Math.max(1, r*.09), 0, TAU); ctx.fill();
  }
  if(!p.feito && (!piso.falarLiberado || piso.falarLiberado())){
    const bob = Math.sin(q*3)*tam*.08;
    const hy = topo + bob - tam*.18;
    const hg = ctx.createRadialGradient(px, hy, 0, px, hy, Math.max(1, tam*.6));
    hg.addColorStop(0, 'rgba(232,161,60,.5)'); hg.addColorStop(1, 'rgba(232,161,60,0)');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(px, hy, tam*.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8a13c';
    ctx.font = '600 ' + Math.round(tam*.5) + 'px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('!', px, topo + bob);
  }
}
function desenharJogador(ox, oy){
  const px = ox + jog.x*tam, py = oy + jog.y*tam, r = tam*.30;
  const piscando = jog.invul > 0 && Math.floor(jog.invul*22)%2 === 0;
  ctx.globalAlpha = piscando ? .45 : 1;
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.ellipse(px, py + r*.95, r*.85, r*.3, 0, 0, TAU); ctx.fill();

  if(jog.golpe > 0){
    const p = jog.golpe/.2;
    ctx.strokeStyle = 'rgba(255,238,196,' + (p*.85) + ')';
    ctx.lineWidth = tam*.13*p;
    ctx.beginPath();
    ctx.arc(px, py, tam*.8, jog.angulo - 1.0 + (1-p)*1.5, jog.angulo + .5 + (1-p)*1.5);
    ctx.stroke();
  }
  const mov = Math.min(1, Math.hypot(jog.vx, jog.vy)/5.5);
  const bal = Math.sin(jog.passo*3.2)*tam*.04*mov;
  if(imgJogador.complete && imgJogador.naturalWidth > 0){
    if(!fatiasJog) montarFatiasJog();
    const f = fatiasJog;
    const iw = imgJogador.naturalWidth, ih = imgJogador.naturalHeight;
    const sW = tam*.9, esc = sW/iw;
    const base = py + r*.95 + bal;                       // pés no chão + quique do passo
    const quadY = base - (ih - f.corte)*esc;             // linha do quadril na tela
    ctx.save();
    const virado = Math.cos(jog.angulo) < 0;
    if(virado){ ctx.translate(px, 0); ctx.scale(-1, 1); ctx.translate(-px, 0); }
    if(jog.flash > .5) ctx.filter = 'brightness(2.4) saturate(0)';
    // pernas: balançam em fases opostas ao caminhar
    const abre = Math.sin(jog.passo*3.2)*.55*mov;
    const perna = (c, x0, a) => {
      const pw = c.width*esc, ph = c.height*esc;
      ctx.save();
      ctx.translate(x0 + pw/2, quadY);
      ctx.rotate(a);
      ctx.drawImage(c, -pw/2, -ph*.08, pw, ph*1.08);
      ctx.restore();
    };
    perna(f.pernaE, px - sW/2, abre);
    perna(f.pernaD, px - sW/2 + f.pernaE.width*esc, -abre);
    // braços: fases opostas às pernas do mesmo lado; o da frente sobe no golpe
    const ombroY = base - (ih - f.ombro)*esc;
    const braco = (c, x0, pivX, a) => {
      const bw = c.width*esc, bh = c.height*esc;
      ctx.save();
      ctx.translate(px - sW/2 + pivX*esc, ombroY);
      ctx.rotate(a);
      ctx.drawImage(c, (x0 - pivX)*esc, -bh*.06, bw, bh*1.06);
      ctx.restore();
    };
    const golpeBr = jog.golpe > 0 ? (jog.golpe/.2)*.9 : 0;
    braco(f.bracoE, 0, f.bracoE.width*.7, -abre*.8);
    braco(f.bracoD, f.x0D, f.x0D + f.bracoD.width*.3, abre*.8 + golpeBr);
    // tronco: respira parado, inclina ao andar, no dash e no golpe
    const respira = (1-mov)*Math.sin(tempo*2.2)*.02;
    const incl = mov*.09 + (jog.dash > 0 ? .30 : 0)
               + (jog.golpe > 0 ? (jog.golpe/.2)*.22 : 0);
    ctx.save();
    ctx.translate(px, quadY);
    ctx.rotate(incl);
    ctx.scale(1, 1 + respira);
    ctx.drawImage(f.tronco, -sW/2, -(f.corte + 2)*esc, sW, (f.corte + 2)*esc);
    ctx.restore();
    ctx.filter = 'none';
    ctx.restore();
  } else {
    ctx.fillStyle = jog.flash > .5 ? '#fff' : '#6c5a48';
    ctx.beginPath();
    ctx.moveTo(px, py - r*1.0);
    ctx.quadraticCurveTo(px + r*1.2, py + r*.4, px + r*.8 + bal, py + r*1.0);
    ctx.lineTo(px - r*.8 + bal, py + r*1.0);
    ctx.quadraticCurveTo(px - r*1.2, py + r*.4, px, py - r*1.0);
    ctx.fill();
    ctx.fillStyle = jog.flash > .5 ? '#fff' : '#caa98a';
    ctx.beginPath(); ctx.arc(px, py - r*.6, r*.46, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2a2028';
    const ex = Math.cos(jog.angulo)*r*.16, ey = Math.sin(jog.angulo)*r*.16;
    ctx.beginPath(); ctx.arc(px + ex - r*.14, py - r*.62 + ey, Math.max(1, r*.08), 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(px + ex + r*.14, py - r*.62 + ey, Math.max(1, r*.08), 0, TAU); ctx.fill();
  }
  if(piso.desenharNoJogador) piso.desenharNoJogador(px, py, r, bal);
  ctx.globalAlpha = 1;
}

/* ---------- música de fundo (loop por piso) ---------- */
let bgmAudio = null, bgmSrc = null, bgmFade = null, bgmVolAtual = .35;
const BGM_VOL = .35, BGM_VOL_FALA = .08;
function tocarBgm(url, vol){
  bgmVolAtual = vol != null ? vol : BGM_VOL;
  if(!url){ pararBgm(); return; }
  if(bgmSrc === url && bgmAudio){
    try{ bgmAudio.volume = dialogo ? BGM_VOL_FALA : bgmVolAtual; bgmAudio.currentTime = 0; bgmAudio.play(); }catch(e){}
    return;
  }
  pararBgm();
  try{
    bgmAudio = new Audio(url);
    bgmAudio.loop = true;
    bgmAudio.volume = dialogo ? BGM_VOL_FALA : bgmVolAtual;
    bgmSrc = url;
    bgmAudio.play().catch(() => {});
  }catch(e){}
}
/* abaixa/levanta a música aos poucos (fala dos presos) */
function fundirBgm(alvo){
  clearInterval(bgmFade);
  bgmFade = setInterval(() => {
    if(!bgmAudio){ clearInterval(bgmFade); return; }
    const d = alvo - bgmAudio.volume;
    if(Math.abs(d) < .02){ bgmAudio.volume = alvo; clearInterval(bgmFade); }
    else bgmAudio.volume += d*.25;
  }, 50);
}
function pararBgm(){
  if(bgmAudio){ try{ bgmAudio.pause(); bgmAudio.currentTime = 0; }catch(e){} }
  bgmAudio = null; bgmSrc = null;
}

  };

  for(let y=1;y<=15;y++) for(let x=3;x<=17;x++){
    const d = Math.hypot(x+.5-CAL.TORRE.x-.5, y+.5-CAL.TORRE.y);
    if(d < CAL.TORRE.raio) t[ix(x,y)] = CHAO2;

  cavar(19,44,20,44);           // entrada oeste, na beirada sul do fosso

  dec.push({tipo:'sangue', x:38.5, y:43.6});

  return {larg:CAL.LARG, alt:CAL.ALT, tiles:t, braseiros:bra, decor:dec};

/* --- labirinto determinístico: backtracker com semente fixa (o mapa é sempre o mesmo) --- */
function gerarLabirinto(cols, linhas, semente){
  let s = semente >>> 0;
  const rnd = () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s/4294967296; };
  const cel = Array.from({length: cols*linhas}, () => ({v:false, portas:[false,false,false,false]}));
  const dx = [0,1,0,-1], dy = [-1,0,1,0];               // N, L, S, O
  const pilha = [0]; cel[0].v = true;
  while(pilha.length){
    const i = pilha[pilha.length-1], cx = i%cols, cy = (i/cols)|0;
    const viz = [];
    for(let d=0; d<4; d++){
      const nx = cx+dx[d], ny = cy+dy[d];
      if(nx>=0 && ny>=0 && nx<cols && ny<linhas && !cel[ny*cols+nx].v) viz.push(d);
    }
    if(!viz.length){ pilha.pop(); continue; }
    const d = viz[(rnd()*viz.length)|0];
    const j = (cy+dy[d])*cols + (cx+dx[d]);
    cel[i].portas[d] = true; cel[j].portas[(d+2)%4] = true;
    cel[j].v = true; pilha.push(j);
  }
  /* braiding: abre paredes extras nos becos sem saída — o labirinto ganha voltas e atalhos */
  for(let i=0;i<cel.length;i++){
    const c = cel[i];
    if(c.portas.filter(Boolean).length !== 1) continue;
    if(rnd() < .2) continue;                       // sobram uns poucos becos, para os tesouros
    const cx = i%cols, cy = (i/cols)|0, ops = [];
    for(let d=0;d<4;d++){
      const nx = cx+dx[d], ny = cy+dy[d];
      if(!c.portas[d] && nx>=0 && ny>=0 && nx<cols && ny<linhas) ops.push(d);
    }
    if(!ops.length) continue;
    const d = ops[(rnd()*ops.length)|0];
    c.portas[d] = true;
    cel[(cy+dy[d])*cols + (cx+dx[d])].portas[(d+2)%4] = true;
  }
  return cel;
}

/* --- espinhos: armadilhas cíclicas nas pontes, corredores e catacumbas --- */
function alturaEspinho(e){
  const c = (tempo + e.fase) % 2.6;
  if(c < .12) return c/.12;               // subindo
  if(c < 1.0) return 1;                   // armado
  if(c < 1.18) return 1 - (c-1.0)/.18;    // recolhendo
  return 0;
}
function desenharEspinhos(ox, oy){
  espinhos.forEach(e => {
    const px = ox + e.x*tam, py = oy + e.y*tam;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.beginPath(); ctx.ellipse(px, py, tam*.36, tam*.22, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(90,82,104,.5)';
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.ellipse(px + (i-1.5)*tam*.17, py, tam*.05, tam*.035, 0, 0, TAU);
      ctx.fill();
    }
    const h = alturaEspinho(e);
    if(h <= 0) return;
    for(let i=0;i<4;i++){
      const sx = px + (i-1.5)*tam*.17, alt = tam*.5*h*(i%2 ? 1 : .85);
      ctx.fillStyle = '#cdc8d4';
      ctx.beginPath();
      ctx.moveTo(sx - tam*.055, py + tam*.02);
      ctx.lineTo(sx + tam*.055, py + tam*.02);
      ctx.lineTo(sx, py + tam*.02 - alt);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(24,20,32,.65)'; ctx.lineWidth = 1;
      ctx.stroke();
    }
  });
}

/* --- esparadrapos da arena: cura de 25% nos cantos de cima da torre --- */
function desenharEsparadrapos(ox, oy){
  esparadrapos.forEach(ep => {
    if(ep.pego) return;
    const px = ox + ep.x*tam, py = oy + ep.y*tam;
    const pulso = .5 + Math.sin(tempo*3.1 + ep.x)*.5;
    const fl = Math.sin(tempo*2.6 + ep.x*2)*tam*.06;
    // halo verde pulsando: dá para ver do outro lado da areia
    const g = ctx.createRadialGradient(px, py, 0, px, py, Math.max(1, tam*(.6 + pulso*.12)));
    g.addColorStop(0, 'rgba(143,196,138,' + (.30 + pulso*.18) + ')');
    g.addColorStop(1, 'rgba(143,196,138,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, tam*(.6 + pulso*.12), 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(px, py + tam*.16, tam*.20, tam*.08, 0, 0, TAU); ctx.fill();

    ctx.save(); ctx.translate(px, py - tam*.06 + fl); ctx.rotate(-.35);
    const l = tam*.46, a = tam*.17;
    // fita bege com as pontas mais escuras
    ctx.fillStyle = '#e6ddc4'; ctx.fillRect(-l/2, -a/2, l, a);
    ctx.fillStyle = 'rgba(120,104,74,.35)';
    ctx.fillRect(-l/2, -a/2, l*.22, a); ctx.fillRect(l/2 - l*.22, -a/2, l*.22, a);
    // furinhos da fita
    ctx.fillStyle = 'rgba(90,78,58,.45)';
    for(let k=-1;k<=1;k++){
      ctx.beginPath(); ctx.arc(-l*.32, k*a*.28, tam*.014, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc( l*.32, k*a*.28, tam*.014, 0, TAU); ctx.fill();
    }
    // gaze branca no meio
    ctx.fillStyle = '#f6f2e6'; ctx.fillRect(-l*.17, -a*.62, l*.34, a*1.24);
    ctx.strokeStyle = 'rgba(90,78,58,.35)'; ctx.lineWidth = 1;
    ctx.strokeRect(-l*.17, -a*.62, l*.34, a*1.24);
    // cruz verde
    ctx.fillStyle = '#6fae68';
    ctx.fillRect(-l*.035, -a*.42, l*.07, a*.84);
    ctx.fillRect(-l*.115, -a*.13, l*.23, a*.26);
    ctx.restore();
  });
}
